<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="J16-title J16-desc"><title id="J16-title">中线为什么也是高？先全等，再判角</title><desc id="J16-desc">图中AB=AC，BD=CD，AD为公共边。△ABD与△ACD由SSS全等，再由邻补角推出两个角都是90°。图形只是关系示意，不能用“看起来垂直”代替证明。</desc><defs><clipPath id="J16-clip"><rect x="72" y="55" width="485" height="325"/></clipPath></defs><style>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}</style><rect width="720" height="450" rx="12" fill="#fffefa"/><text x="28" y="32" class="title">中线为什么也是高？先全等，再判角</text><polygon points="320,70 120,320 520,320" class="shape"/><line x1="320" y1="70" x2="320" y2="320" class="dash"/><line x1="211" y1="189" x2="228" y2="203" class="line"/><line x1="412" y1="189" x2="429" y2="203" class="line"/><line x1="215" y1="311" x2="215" y2="329" class="line"/><line x1="225" y1="311" x2="225" y2="329" class="line"/><line x1="415" y1="311" x2="415" y2="329" class="line"/><line x1="425" y1="311" x2="425" y2="329" class="line"/><text x="310" y="60" class="label">A</text><text x="94" y="345" class="label">B</text><text x="527" y="345" class="label">C</text><text x="309" y="348" class="label">D</text><text x="52" y="396" class="label">相同刻痕表示已知相等；虚线AD是两三角形的公共边。</text></svg>