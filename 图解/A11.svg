<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="A11-title A11-desc"><title id="A11-title">投影：把向量拆成平行分量与垂直残差</title><desc id="A11-desc">示例u=(2,1)，v=(1,0)。投影系数t=(u·v)/||v||²=2，投影tv=(2,0)，残差u−tv=(0,1)与v正交。非负残差范数是正文柯西证明的关键；一般定理不依赖二维图形。</desc><defs><clipPath id="A11-clip"><rect x="72" y="55" width="485" height="325"/></clipPath></defs><style>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}</style><rect width="720" height="450" rx="12" fill="#fffefa"/><text x="28" y="32" class="title">投影：把向量拆成平行分量与垂直残差</text><line x1="110" y1="335" x2="540" y2="335" class="axis"/><line x1="110" y1="335" x2="110" y2="85" class="axis"/><line x1="110" y1="335" x2="410" y2="185" class="line"/><line x1="110" y1="335" x2="410" y2="335" class="highlight"/><line x1="410" y1="335" x2="410" y2="185" class="dash"/><circle cx="410" cy="185" r="5" fill="#245c4d"/><circle cx="410" cy="335" r="5" fill="#245c4d"/><line x1="390" y1="335" x2="390" y2="315" class="axis"/><line x1="390" y1="315" x2="410" y2="315" class="axis"/><text x="87" y="363" class="label">O</text><text x="410" y="165" class="label">u=(2,1)</text><text x="325" y="371" class="label">tv=(2,0)</text><text x="430" y="258" class="label">u−tv=(0,1)</text><text x="178" y="319" class="label">v=(1,0)</text><circle cx="260" cy="335" r="5" fill="#245c4d"/><text x="67" y="419" class="label">v≠0才可以除以||v||²；v=0的情况要单独处理。</text></svg>