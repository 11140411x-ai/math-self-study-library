<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="H33-title H33-desc"><title id="H33-title">全概率：先沿路径相乘，再把互斥路径相加</title><desc id="H33-desc">产品来源甲、乙互斥且穷尽。P(甲)=0.6，P(次品|甲)=0.02；P(乙)=0.4，P(次品|乙)=0.05。甲且次品概率0.012，乙且次品概率0.020，总次品概率0.032。其余分支为正品，不能把0.02与0.05直接相加。</desc><defs><clipPath id="H33-clip"><rect x="72" y="55" width="485" height="325"/></clipPath></defs><style>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}</style><rect width="720" height="450" rx="12" fill="#fffefa"/><text x="28" y="32" class="title">全概率：先沿路径相乘，再把互斥路径相加</text><line x1="80" y1="230" x2="250" y2="135" class="line"/><line x1="80" y1="230" x2="250" y2="325" class="line"/><line x1="290" y1="135" x2="490" y2="85" class="line"/><line x1="290" y1="135" x2="490" y2="180" class="line"/><line x1="290" y1="325" x2="490" y2="275" class="line"/><line x1="290" y1="325" x2="490" y2="370" class="line"/><text x="32" y="236" class="label">产品</text><text x="258" y="141" class="label">甲</text><text x="258" y="331" class="label">乙</text><text x="150" y="157" class="label">0.6</text><text x="150" y="319" class="label">0.4</text><text x="367" y="95" class="label">0.02</text><text x="367" y="178" class="label">0.98</text><text x="367" y="284" class="label">0.05</text><text x="367" y="374" class="label">0.95</text><text x="500" y="90" class="label">次品：0.012</text><text x="500" y="185" class="label">正品：0.588</text><text x="500" y="280" class="label">次品：0.020</text><text x="500" y="375" class="label">正品：0.380</text><text x="54" y="425" class="label">P(次品)=0.012+0.020=0.032；四个末端概率之和为1。</text></svg>