<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="H13-title H13-desc"><title id="H13-title">点积为0：先确认向量非零</title><desc id="H13-desc">两个向量起点同在O；a=(2,1)，b=(1,−2)。坐标轴等比例，a·b=2×1+1×(−2)=0且两向量非零，因此夹角90°；长度都是√5。</desc><defs><clipPath id="H13-clip"><rect x="72" y="55" width="485" height="325"/></clipPath></defs><style>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}</style><rect width="720" height="450" rx="12" fill="#fffefa"/><text x="28" y="32" class="title">点积为0：先确认向量非零</text><line x1="80" y1="210" x2="600" y2="210" class="axis"/><line x1="280" y1="65" x2="280" y2="375" class="axis"/><line x1="280" y1="210" x2="420" y2="140" class="line"/><line x1="280" y1="210" x2="350" y2="350" class="line"/><circle cx="420" cy="140" r="5" fill="#245c4d"/><circle cx="350" cy="350" r="5" fill="#245c4d"/><text x="255" y="235" class="label">O</text><text x="434" y="134" class="label">a=(2,1)</text><text x="364" y="364" class="label">b=(1,−2)</text><text x="603" y="216" class="label">x</text><text x="259" y="62" class="label">y</text><line x1="298" y1="201" x2="307" y2="219" class="line"/><line x1="307" y1="219" x2="289" y2="228" class="line"/><text x="67" y="412" class="label">点积是实数；零向量没有确定的几何夹角。</text></svg>