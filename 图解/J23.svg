<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="J23-title J23-desc"><title id="J23-title">勾股定理的面积证明</title><desc id="J23-desc">示意选a=2、b=3，外正方形边长a+b。四个角放全等直角三角形，中间四边形的边长都是c、角都是90°。外面积=(四个三角形面积)+c²，得到(a+b)²=2ab+c²。</desc><defs><clipPath id="J23-clip"><rect x="72" y="55" width="485" height="325"/></clipPath></defs><style>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}</style><rect width="720" height="450" rx="12" fill="#fffefa"/><text x="28" y="32" class="title">勾股定理的面积证明</text><polygon points="50,80 350,80 350,380 50,380" class="shape"/><polygon points="170,80 350,200 230,380 50,260" class="shape"/><text x="101" y="68" class="label">a</text><text x="255" y="68" class="label">b</text><text x="368" y="145" class="label">a</text><text x="368" y="290" class="label">b</text><text x="198" y="230" class="label">c²</text><text x="262" y="132" class="label">c</text><text x="50" y="416" class="label">四个三角形：总面积 4×ab/2</text><text x="420" y="150" class="label">外面积：(a+b)²</text><text x="420" y="203" class="label">分块合计：2ab+c²</text><text x="420" y="256" class="label">相减：a²+b²=c²</text><text x="420" y="322" class="small">图示帮助理解；</text><text x="420" y="350" class="small">角度与面积理由见正文。</text></svg>