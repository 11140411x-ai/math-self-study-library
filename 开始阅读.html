92.33333333333337,208.19546666666676 494.3541666666667,201.26343333333344 496.37499999999994,194.10000000000008 498.3958333333333,186.70256666666674 500.4166666666667,179.0685333333334 502.4375,171.19530000000006 504.4583333333333,163.08026666666672 506.4791666666667,154.72083333333336 508.50000000000006,146.11440000000005 510.5208333333333,137.25836666666672 512.5416666666666,128.15013333333337 514.5625,118.78709999999995 516.5833333333334,109.16666666666663\" class=\"curve\" clip-path=\"url(#H28-clip)\"/>\u003ccircle cx=\"112.41666666666666\" cy=\"325.8333333333333\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"213.45833333333334\" cy=\"109.16666666666663\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"415.5416666666667\" cy=\"325.8333333333333\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"516.5833333333334\" cy=\"109.16666666666663\" r=\"5\" fill=\"#245c4d\"/>\u003ctext x=\"80.41666666666666\" y=\"352.8333333333333\" class=\"label\">(−2,−2)\u003c/text>\u003ctext x=\"158.45833333333334\" y=\"97.16666666666663\" class=\"label\">(−1,2)\u003c/text>\u003ctext x=\"393.5416666666667\" y=\"352.8333333333333\" class=\"label\">(1,−2)\u003c/text>\u003ctext x=\"508.58333333333337\" y=\"97.16666666666663\" class=\"label\">(2,2)\u003c/text>\u003ctext x=\"112\" y=\"420\" class=\"label\">导数符号：   ＋             −              ＋\u003c/text>\u003c/svg>"}],"selfStudy":{"moduleId":"H28","entryCheck":{"question":"f(x)=x²在[−1,2]上，求f′(x)，并列出寻找最大、最小值时需要检查的输入。","answer":"f′(x)=2x；需要检查−1、0、2。最小值0，最大值4。","explanation":"导数为零给内部候选0，但闭区间的两个端点−1、2同样不能遗漏。将三点代入得到1、0、4，比较后才得到全区间最值。若只检查0，会直接漏掉最大值。"},"intuition":"把函数图像想成一条起伏的路径，导数描述行进处的坡度，函数值描述高度。坡度为零只意味着局部很平，可能是山顶、谷底，也可能是继续上升时短暂变平。这个图像帮助区别导数与函数值；严谨判断仍必须依据整个邻域的符号或比较关系。","reasoning":[{"step":"为什么首先检查函数在哪些点有意义？","detail":"求导和最值都依赖原定义域。分母为零、对数真数非正等点不能纳入候选。区间是否包含端点也会改变最大最小值是否存在。原例题是多项式，给定闭区间[−2,2]内处处有定义且连续，因此不存在断点，端点可以代入。"},{"step":"连续性为什么能保证有最值，却不能直接告诉我们在哪里？","detail":"闭区间上的连续实函数一定能达到最大值和最小值。这只保证答案存在，没有定位能力。函数在开区间或无界区间上即使连续，也可能只有能接近但取不到的界。原例题符合存在定理后，仍需要导数定位内部候选、再与端点比较。"},{"step":"导数为零到底是什么条件？","detail":"在区间内点，若函数可导并取得局部极值，则导数必须为零；这是必要条件而非充分条件。反例f(x)=x³在0处导数为零，但0左右仍持续上升，没有极大或极小。不可导点也可能有极值，例如|x|在0，所以一般题还要单独检查不可导点。"},{"step":"为什么要把定义域按导数零点分段？","detail":"导数符号决定函数在对应区间增加还是减少。若导数可连续变化，它的正负变化往往发生在零点或无定义点附近。把这些点排序后，在每个区间判断符号，可以确定由增转减的极大值点、由减转增的极小值点，也能识别导数为零却不变号的普通点。"},{"step":"怎样从局部极值过渡到全区间最值？","detail":"局部极值只和附近的函数值比较，全区间最值要和所有允许输入比较。对连续且仅有有限个导数零点或不可导点的常见题，列出这些内点以及所有包含的端点，计算其函数值后统一比较。用单调区间说明每一段不会另藏更高或更低值，才使候选比较完整。"},{"step":"为什么必须列出所有取到最值的位置？","detail":"不同输入可能对应相同的最大或最小函数值。求值和求取值点是两个相关但不同的任务，比较表中出现并列时要全部保留。原例题恰好让一个内点与一个端点共享最大值，另外两个点共享最小值，是检验是否真正检查端点的好例子。"}],"workedWalkthrough":[{"step":"固定原例题与输出目标","detail":"原卡例题为f(x)=x³−3x在[−2,2]上求最大、最小值。本题要报告两个数值，并列出所有达到它们的x。多项式连续，因此闭区间最值存在。"},{"step":"正确求导并分解","detail":"逐项求导：(x³)′=3x²，(−3x)′=−3，所以f′(x)=3x²−3=3(x−1)(x+1)。令导数等于0得到x=−1或x=1；两点都位于(−2,2)，均为合法内部候选。"},{"step":"在三个区间逐项判号","detail":"在(−2,−1)，x−1和x+1均负，因此f′>0；在(−1,1)，两因子一负一正，因此f′\u003c0；在(1,2)，两因子均正，因此f′>0。于是函数先增、再减、再增，不能把三段合并成一个单调区间。"},{"step":"用变号识别局部极值","detail":"经过x=−1时，导数从正变负，函数从上升变下降，因此−1是局部极大值点。经过x=1时，导数从负变正，函数由下降变上升，因此1是局部极小值点。到这一步只确定局部情形，还未比较区间端点。"},{"step":"把端点和内部候选一起代回原函数","detail":"计算时应代入f而非f′：f(−2)=−8+6=−2；f(−1)=−1+3=2；f(1)=1−3=−2；f(2)=8−6=2。这样有四个候选输出−2、2、−2、2。由于每个分段上函数单调，其余点不会超过相邻边界给出的范围。"},{"step":"保留并列位置，形成完整答案","detail":"最大值为2，取到位置是x=−1和x=2；最小值为−2，取到位置是x=−2和x=1。内点±1给出局部极值，端点±2在全区间比较中也取得相同最值。若只报导数零点，就会漏掉一半的取到位置。"},{"step":"作不依赖绘图的复核","detail":"由符号表可读出：f在[−2,−1]从−2升到2，在[−1,1]从2降到−2，在[1,2]再从−2升到2。三段覆盖整个给定区间，全部输出都在[−2,2]，并且两端输出值实际出现。这个核对把计算表与全区间结论连接起来。"}],"wrongApproach":{"claim":"解出f′(x)=0得x=±1，所以最大值2只在x=−1取得，最小值−2只在x=1取得。","whyWrong":"导数为零只筛选可导内点的极值候选，不会自动列出闭区间端点。原题中f(2)=2、f(−2)=−2，恰好与内点的最大、最小值相同。这个错误得到的两个最值数值碰巧正确，但把取到位置写得不完整，方法在其他函数上还会连最值数值也求错。","correction":"候选表固定包含左端点、右端点、内部导数零点、内部不可导点，并删除不在定义域内的点。本题检查−2、−1、1、2后，将所有并列最大或最小的位置一并报告。"},"exitCheck":{"question":"g(x)=x³在[−1,1]上求最大、最小值。g′(0)=0是否说明0为极值点？","answer":"最大值1在x=1取得，最小值−1在x=−1取得；0不是局部极值点。","explanation":"g′(x)=3x²，在0两侧均为正，未发生由增到减或由减到增的变化。函数在整个区间严格递增，故全区间最值在两端。也可直接看0附近左边x³\u003c0、右边x³>0，0既不高于两侧也不低于两侧。"},"remediation":[{"difficulty":"不清楚导数计算规则，误把函数值和导数值混用","moduleId":"H27","action":"在纸上分两列记录f(x)与f′(x)，先对x³−3x逐项求导，再分别计算f(1)和f′(1)，说清二者表示高度与斜率。"},{"difficulty":"因式分解后不会写符号表","moduleId":"H03","action":"把−1、1标到数轴，逐段分别记录x−1、x+1的符号，最后才相乘。检查x=−3/2、0、3/2三个代表点。"},{"difficulty":"混淆局部极值、全区间最值和取不到的界","moduleId":"H28","action":"分别研究x²在R、[1,2]、(1,2)上的最小值，明确回答输入范围、候选点、是否达到三个问题，再回到原例题。"}],"auditNotes":[{"severity":"澄清","finding":"原例题的数值与取到位置正确，但解答跳过导数符号表，难以让自学者理解为何这四个候选已穷尽。","resolution":"展开三个区间上的因子符号、单调性与覆盖论证，并把导数定位和代原函数比较明确区分。"},{"severity":"澄清","finding":"可导内点极值的必要条件容易被读成导数零点必为极值，也容易遮蔽端点。","resolution":"添加x³的反例型退出检查，以及端点与内部候选统一列表的固定操作。"}]}},{"id":"H29","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"函数与导数","title":"含参导数、恒成立与不等式证明","prerequisites":["H28","H04"],"goals":["能够解释并使用参数分类的来源","能够解释并使用恒成立与分离参数","能够解释并使用构造差函数"],"concepts":[{"name":"参数分类的来源","explanation":"参数会改变导数零点个数、位置与符号。分类应围绕这些会改变结论的临界值，特别是最高次系数为0、零点重合或跨过区间端点。没有数学依据地列很多参数区间会增加漏解风险。"},{"name":"恒成立与分离参数","explanation":"若对所有x∈D有a≤g(x)，可转为a≤inf g；若最小值存在则用min。分离参数时除以含x的量，必须先判断其正负。存在性条件则对应某处达到，不等号严格性与极值是否取得有关。"},{"name":"构造差函数","explanation":"证明f(x)≥g(x)可研究F=f−g的最小值，求导找单调和取等点。例如ln x≤x−1（x>0）由F=x−1−ln x的导数1−1/x在1左右变号得到；结论反映曲线与切线的相对位置。"}],"methods":["先确定量词，再把恒成立转最值；分类只围绕真正改变符号或可行性的临界点。"],"pitfalls":["把‘存在x’与‘对所有x’误换会得到相反范围。"],"example":{"question":"【原创】求实数a，使x²−2x+a≥0对全部x≥0成立。","solution":["配方(x−1)²+a−1，区间包含x=1。","该式最小值a−1，要求其非负。","a≥1。"],"answer":"a≥1。"},"practice":[{"question":"【原创】证明eˣ≥1+x（x∈R）。","answer":"对所有实数成立，等号x=0。","solution":"F=eˣ−1−x，F′=eˣ−1在0左负右正，最小值F(0)=0。","level":"基础"},{"question":"【原创】对全部x>0有a≤x+1/x，a范围？","answer":"a≤2。","solution":"均值不等式给最小值2并在x=1取到，所以必要且充分。","level":"进阶"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H30","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"计数原理、排列与组合","prerequisites":["H01"],"goals":["能够解释并使用分类与分步","能够解释并使用排列与组合","能够解释并使用限制条件"],"concepts":[{"name":"分类与分步","explanation":"完成任务可以选择若干互斥方案时，将各方案数相加；需依次完成多个步骤且每步可选数已明确时相乘。若后续选法数随前步不同，应按情况分别乘再加，不能盲乘一个统一数字。"},{"name":"排列与组合","explanation":"从n个不同对象中取r个排顺序，A(n,r)=n!/(n−r)!；只取不排序，C(n,r)=n!/[r!(n−r)!]，0≤r≤n为整数且0!=1。除以r!的原因是同一选中集合在排列中被重复计数r!次。"},{"name":"限制条件","explanation":"相邻对象可捆绑，再考虑内部顺序；不相邻可排其他对象后插空；至少一个可用总数减没有。要辨对象是否不同、是否允许重复、位置是否有标号；这决定模型而非套公式本身。"}],"methods":["用一句话定义什么算一种不同结果，再判断加法、乘法、排列或组合。"],"pitfalls":["相同对象换位置未必产生新结果，不能无条件按全排列。"],"example":{"question":"【原创】从5人选队长和副队长各1人，与只选2名代表，方法数各是多少？","solution":["有不同职务时顺序重要，5×4=20。","无职务时每对被排列计数2次，20/2=10。","队长副队长20种，2名代表10种。"],"answer":"队长副队长20种，2名代表10种。"},"practice":[{"question":"【原创】6本不同书排成一排有多少方法？","answer":"720。","solution":"6!=720。","level":"基础"},{"question":"【原创】5人中甲乙必须相邻排队，方法数？","answer":"48。","solution":"甲乙捆为一个单位，共4个单位排4!，内部2种，合48。","level":"进阶"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H31","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"二项式定理与系数提取","prerequisites":["H30","J19"],"goals":["理解并应用二项式定理","理解并应用项、系数与符号","理解并应用赋值与组合恒等式"],"concepts":[{"name":"二项式定理","explanation":"非负整数n时，(a+b)ⁿ=Σₖ₌₀ⁿ C(n,k)aⁿ⁻ᵏbᵏ。从n个(a+b)因子中选k个b，其余选a，选法数C(n,k)即系数来源。该有限和公式不直接适用于任意实数n；广义二项式需无穷级数及收敛条件。"},{"name":"项、系数与符号","explanation":"第k+1项Tₖ₊₁=C(n,k)aⁿ⁻ᵏbᵏ，k从0到n。二项式系数C(n,k)不同于展开后的实际系数，若b含负号或常数，须连同bᵏ计算。含x和1/x时，合并指数后根据目标次数解k。"},{"name":"赋值与组合恒等式","explanation":"令a=b=1得到ΣC(n,k)=2ⁿ；a=1,b=−1得到n≥1时偶数k项和等于奇数k项和。组合恒等式既可用代数比较系数，也可从两种计数方式证明，明确计数对象能避免纯公式记忆。"}],"methods":["先写通项且保留符号，再解指数条件，最后检查k是否为允许整数。"],"pitfalls":["第k项与指数k相差1，常数项不意味着二项式系数为0。"],"example":{"question":"【原创】(2x−1)⁴中x²的系数是多少？","solution":["通项C(4,k)(2x)⁴⁻ᵏ(−1)ᵏ，x指数4−k。","令4−k=2得k=2，系数C(4,2)·2²·1。","系数24。"],"answer":"系数24。"},"practice":[{"question":"【原创】(1+x)⁵所有系数之和？","answer":"32。","solution":"令x=1得2⁵。","level":"基础"},{"question":"【原创】(x+1/x)⁶常数项？","answer":"20。","solution":"通项x^(6−2k)，指数0得k=3，常数C(6,3)=20。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H32","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"必修","domain":"统计与概率","title":"事件运算、互斥与独立","prerequisites":["J43","H30"],"goals":["理解并应用概率公理与事件运算","理解并应用互斥与独立","理解并应用多次试验"],"concepts":[{"name":"概率公理与事件运算","explanation":"事件视为样本空间的子集。P(Ω)=1，概率非负，互不重叠事件的并可相加。一般P(A∪B)=P(A)+P(B)−P(A∩B)，对立事件Aᶜ与A互斥且并为Ω，故P(Aᶜ)=1−P(A)。"},{"name":"互斥与独立","explanation":"互斥表示A∩B=∅，不能同时发生；独立表示P(A∩B)=P(A)P(B)，一个事件的信息不改变另一个概率。两个概率都正的互斥事件不独立。抛不同硬币可能独立，掷一次骰子的‘1点’和‘2点’互斥。"},{"name":"多次试验","explanation":"多事件独立比两两独立更强。计算全部发生或都不发生的概率，需相应的联合独立假设；至少一次发生常用1减一次都不发生。不放回抽样通常相关，不能直接将边际概率相乘。"}],"methods":["先用集合语言说清同时、至少、恰好、都不，再核查独立是否由题设保证。"],"pitfalls":["看到事件不同就当作独立，是错误的。"],"example":{"question":"【原创】A、B独立，P(A)=0.3、P(B)=0.4，求至少一个发生概率。","solution":["P(A∩B)=0.3×0.4=0.12。","P(A∪B)=0.3+0.4−0.12。","概率0.58，也等于1−0.7×0.6。"],"answer":"概率0.58，也等于1−0.7×0.6。"},"practice":[{"question":"【原创】P(A)=0.2，求P(Aᶜ)。","answer":"0.8。","solution":"对立事件概率和1。","level":"基础"},{"question":"【原创】A与B互斥且概率各1/3，是否独立？","answer":"不独立。","solution":"交概率0而概率积1/9不为0。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H33","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"条件概率、乘法公式与全概率","prerequisites":["H32"],"goals":["理解并应用条件概率","理解并应用乘法公式","理解并应用全概率"],"concepts":[{"name":"条件概率","explanation":"当P(B)>0，P(A|B)=P(A∩B)/P(B)。它把已知B发生后的样本范围缩到B；条件写在竖线后面。P(A|B)通常不等于P(B|A)，求反向概率需要结合基准比例。"},{"name":"乘法公式","explanation":"由定义得P(A∩B)=P(B)P(A|B)。此式不要求独立；独立时条件概率等于原概率，才简化为P(A)P(B)。多步树图按路径相乘、互斥路径相加，适合不放回抽样。"},{"name":"全概率","explanation":"B₁,…,Bₙ互斥且并为全部可能，P(Bᵢ)>0时，P(A)=ΣP(Bᵢ)P(A|Bᵢ)。它先分来源或情形，再加权汇总；遗漏一种来源或让分类重叠都会错误。贝叶斯反向更新在高阶部分详细推导。"}],"methods":["把条件画成树，每条分支写的是在之前条件下的概率，再汇总路径。"],"pitfalls":["无放回时第二次的分母和有利数均可能变化。"],"example":{"question":"【原创】甲机产量占60%、次品率2%，乙机占40%、次品率5%。随机产品为次品概率？","solution":["按来源划分B甲、B乙，互斥且穷尽。","P(次品)=0.6×0.02+0.4×0.05。","概率0.032，即3.2%。"],"answer":"概率0.032，即3.2%。"},"practice":[{"question":"【原创】P(B)=0.4、P(A∩B)=0.1，求P(A|B)。","answer":"0.25。","solution":"按定义0.1/0.4。","level":"基础"},{"question":"【原创】袋中3红2蓝，不放回取2球，两球都红概率？","answer":"3/10。","solution":"第一红3/5，在已红条件下第二红2/4，乘积6/20。","level":"进阶"},{"question":"【原创·分层】独立掷两枚公平六面骰子，已知点数和为8，求第一枚骰子的点数至少为4的条件概率。","answer":"3/5。","solution":"用有序数对记录第一、第二枚点数。原来的36个结果等可能。条件点数和为8后，只剩(2,6)、(3,5)、(4,4)、(5,3)、(6,2)五个等可能结果。第一枚至少4对应后三个结果，因此条件概率为3/5。也可用定义：联合事件概率3/36，条件事件概率5/36，二者相除仍为3/5。","level":"基础巩固"},{"question":"【原创·分层】袋中4个红球、2个蓝球，球除颜色外相同，随机不放回抽出2个。已知抽出的球中至少有1个红球，求两球都红的概率。","answer":"3/7。","solution":"设A为两球都红，B为至少一个红球。A⊆B，所以P(A∩B)=P(A)。等可能无序抽法共有C(6,2)=15种；两红有C(4,2)=6种，故P(A)=6/15。B的对立事件是两蓝，只有C(2,2)=1种，所以P(B)=14/15。条件概率P(A|B)=(6/15)/(14/15)=6/14=3/7。原无条件概率2/5并非题目所求，已知信息改变了比较范围。","level":"条件变式"},{"question":"【原创·分层】甲盒有2红1蓝，乙盒有1红3蓝；以1/3的概率选甲盒、2/3的概率选乙盒。从选中的盒中随机不放回抽出2球，已知这2球颜色不同，再从同一盒剩余球中随机抽1球。求第3球为红色的条件概率。","answer":"2/5。","solution":"记D为前两球颜色不同。甲盒条件下P(D|甲)=(2/3)(1/2)+(1/3)(2/2)=2/3；乙盒条件下P(D|乙)=(1/4)(3/3)+(3/4)(1/3)=1/2。全概率给P(D)=(1/3)(2/3)+(2/3)(1/2)=5/9。条件概率定义给P(甲|D)=P(甲∩D)/P(D)=[(1/3)(2/3)]/(5/9)=2/5。若来自甲且前两球异色，剩余唯一一球必红；若来自乙，已抽走唯一红球，剩余全蓝。因此第3球为红的条件概率就是2/5。不能继续用选盒前的1/3，因为观察到异色已更新了盒子来源的相对可能性。","level":"综合应用"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"illustrations":[{"moduleId":"H33","title":"全概率：先沿路径相乘，再把互斥路径相加","caption":"产品来源甲、乙互斥且穷尽。P(甲)=0.6，P(次品|甲)=0.02；P(乙)=0.4，P(次品|乙)=0.05。甲且次品概率0.012，乙且次品概率0.020，总次品概率0.032。其余分支为正品，不能把0.02与0.05直接相加。","file":"图解/H33.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"H33-title H33-desc\">\u003ctitle id=\"H33-title\">全概率：先沿路径相乘，再把互斥路径相加\u003c/title>\u003cdesc id=\"H33-desc\">产品来源甲、乙互斥且穷尽。P(甲)=0.6，P(次品|甲)=0.02；P(乙)=0.4，P(次品|乙)=0.05。甲且次品概率0.012，乙且次品概率0.020，总次品概率0.032。其余分支为正品，不能把0.02与0.05直接相加。\u003c/desc>\u003cdefs>\u003cclipPath id=\"H33-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">全概率：先沿路径相乘，再把互斥路径相加\u003c/text>\u003cline x1=\"80\" y1=\"230\" x2=\"250\" y2=\"135\" class=\"line\"/>\u003cline x1=\"80\" y1=\"230\" x2=\"250\" y2=\"325\" class=\"line\"/>\u003cline x1=\"290\" y1=\"135\" x2=\"490\" y2=\"85\" class=\"line\"/>\u003cline x1=\"290\" y1=\"135\" x2=\"490\" y2=\"180\" class=\"line\"/>\u003cline x1=\"290\" y1=\"325\" x2=\"490\" y2=\"275\" class=\"line\"/>\u003cline x1=\"290\" y1=\"325\" x2=\"490\" y2=\"370\" class=\"line\"/>\u003ctext x=\"32\" y=\"236\" class=\"label\">产品\u003c/text>\u003ctext x=\"258\" y=\"141\" class=\"label\">甲\u003c/text>\u003ctext x=\"258\" y=\"331\" class=\"label\">乙\u003c/text>\u003ctext x=\"150\" y=\"157\" class=\"label\">0.6\u003c/text>\u003ctext x=\"150\" y=\"319\" class=\"label\">0.4\u003c/text>\u003ctext x=\"367\" y=\"95\" class=\"label\">0.02\u003c/text>\u003ctext x=\"367\" y=\"178\" class=\"label\">0.98\u003c/text>\u003ctext x=\"367\" y=\"284\" class=\"label\">0.05\u003c/text>\u003ctext x=\"367\" y=\"374\" class=\"label\">0.95\u003c/text>\u003ctext x=\"500\" y=\"90\" class=\"label\">次品：0.012\u003c/text>\u003ctext x=\"500\" y=\"185\" class=\"label\">正品：0.588\u003c/text>\u003ctext x=\"500\" y=\"280\" class=\"label\">次品：0.020\u003c/text>\u003ctext x=\"500\" y=\"375\" class=\"label\">正品：0.380\u003c/text>\u003ctext x=\"54\" y=\"425\" class=\"label\">P(次品)=0.012+0.020=0.032；四个末端概率之和为1。\u003c/text>\u003c/svg>"}],"selfStudy":{"moduleId":"H33","entryCheck":{"question":"A表示产品来自甲机，D表示产品为次品。已知P(A)=0.6、P(D|A)=0.02。总体中既来自甲机又是次品的概率是多少？0.02是哪一范围内的比例？","answer":"P(A∩D)=0.012。0.02是仅在甲机产品内部计算的次品比例。","explanation":"由条件概率定义P(D|A)=P(A∩D)/P(A)，同乘P(A)=0.6得到联合概率0.6×0.02。竖线后的A说明分母所属范围；它与全部产品范围不同，不能把条件比例直接当总体比例。"},"intuition":"可以想象按模型从一万件产品中做期望计数：约六千件来自甲、四千件来自乙，再在各自来源中计算次品。这是帮助理解权重的模型示意或期望数量，并不保证一批真实的一万件产品恰好有这些数目。严谨计算依靠事件划分和条件概率公式，不依靠想象样本恰好吻合。","reasoning":[{"step":"为什么首先要说清随机抽取什么？","detail":"原题随机抽的是整个产品总体中的一件产品，并按题目给定的来源比例得到来自甲的概率0.6、来自乙的概率0.4。若改成先以相同概率选机器再在该机器选产品，来源权重会变成0.5与0.5，问题已改变。样本空间与抽取方式决定权重，不能自行替换。"},{"step":"怎样用事件区分三种概率？","detail":"设A为来自甲机，B为来自乙机，D为次品。P(D|A)是在甲来源内部观察到次品的比例；P(A∩D)是全体产品中甲来源次品的比例；P(A|D)是在已知次品后观察到甲来源的比例。三个量的分母不同，通常不能交换或混用。"},{"step":"乘法公式为什么不需要独立？","detail":"只要P(A)>0，条件概率定义为P(D|A)=P(A∩D)/P(A)。两边同乘P(A)，立即得到P(A∩D)=P(A)P(D|A)。这是定义的代数变形，对独立与非独立事件都适用。只有进一步知道独立，才能把P(D|A)替换成P(D)。"},{"step":"为什么可以按机器来源分开计算？","detail":"题目假设每件产品都恰好来自甲或乙中的一个，所以A∩B为空，A∪B为整个样本空间。任意次品必属于甲次品或乙次品，故D=(D∩A)∪(D∩B)，且两部分互斥。这一步同时保证没有遗漏来源，也没有重复计数。"},{"step":"全概率公式怎样从以上两步得到？","detail":"先用互斥事件概率可相加，P(D)=P(D∩A)+P(D∩B)；再分别套乘法公式，得到P(D)=P(A)P(D|A)+P(B)P(D|B)。所谓全概率，就是把各来源内的条件概率乘以来源权重，再汇总全部来源。"},{"step":"怎样检查结果数量级是否合理？","detail":"本题权重非负且和为1，所以总体次品率必须位于2%和5%之间；甲权重较大，总体值应更接近2%。若结果超出这一区间，或写成3.2而非0.032，通常意味着权重、乘法或百分数换算出了错。合理范围是复核手段，不能替代完整推导。"}],"workedWalkthrough":[{"step":"保留原例题的所有数据","detail":"原卡例题是：甲机产量占60%、次品率2%，乙机产量占40%、次品率5%，求随机产品为次品的概率。把百分数换为小数，P(A)=0.6，P(B)=0.4，P(D|A)=0.02，P(D|B)=0.05。"},{"step":"把甲来源次品折算到总体范围","detail":"先沿甲来源这一条路径：P(A∩D)=P(A)P(D|A)=0.6×0.02=0.012。它表示全体产品中有1.2%的概率同时满足来自甲和次品两个条件。这里不能直接写2%，因为2%只以甲的产品作为分母。"},{"step":"单独计算乙来源路径","detail":"同理，P(B∩D)=P(B)P(D|B)=0.4×0.05=0.020，即全体产品中乙来源次品的概率为2.0%。两条路径的权重不同，不能先对机器内部的2%与5%做普通平均。"},{"step":"用互斥性说明为什么可以相加","detail":"一件产品不会同时来自甲和乙，所以A∩D与B∩D互斥；题目也没有第三种来源。因此P(D)=0.012+0.020=0.032。这不是任何两个事件概率都能直接相加，而是来源划分保证了加法的条件。"},{"step":"换回百分数并作范围检查","detail":"0.032乘100%等于3.2%。它位于2%和5%之间，到2%的距离为1.2个百分点，到5%的距离为1.8个百分点，确实更接近占比60%的甲机次品率。原题答案为3.2%，不是0.032%或3.2。"},{"step":"用期望计数图景复核且保留随机性","detail":"按模型用一万件作为便于计算的期望规模，甲约占6000件、其中次品期望120件；乙约占4000件、其中次品期望200件。合计次品期望320件，比例320/10000=0.032。该图景解释加权过程，但一批实际样本仍会有随机波动，不能把320说成必然的实际次品件数。"}],"wrongApproach":{"claim":"两台机器的次品率是2%和5%，总体次品率应为(2%+5%)/2=3.5%。","whyWrong":"普通平均相当于为两个来源各赋50%的权重，但题目规定随机产品来自甲、乙的概率是60%和40%。较大的甲来源不能和较小的乙来源按同样贡献计算。只有两来源在抽样机制中的权重相等，普通平均才与加权平均一致。","correction":"先核对随机试验是从所有产品中抽一件，再按来源权重计算0.6×2%+0.4×5%=3.2%。如果题目真的改为等概率先选机器，且再从所选机器随机抽产品，才应重新采用各1/2的来源权重。"},"exitCheck":{"question":"沿用原例题，已经知道抽到的产品为次品，求它来自乙机的条件概率。为什么不能直接回答5%或40%？","answer":"P(B|D)=0.020/0.032=5/8=62.5%。","explanation":"已知为次品后，分母缩为所有次品的概率0.032；其中来自乙的联合概率为0.4×0.05=0.020，因此条件概率为62.5%。5%是乙机内部的次品率P(D|B)，40%是看到次品信息之前的来源概率P(B)，都不是所问的P(B|D)。乙的次品率较高，所以观察到次品后，乙来源的相对可能性由40%升为62.5%，方向也合理。"},"remediation":[{"difficulty":"混淆条件概率和联合概率的分母","moduleId":"H33","action":"对每个概率用一句话写出只在谁的范围内统计。把P(D|A)、P(A∩D)、P(A|D)分别翻译，再使用定义计算。"},{"difficulty":"不明白事件为何可以相加","moduleId":"H32","action":"用两个互不重叠的来源区域表示A、B，将次品部分分别标入，检查两部分既不交叠也穷尽D，再写概率加法。"},{"difficulty":"把模型概率当成一次样本中必然出现的比例","moduleId":"H32","action":"回顾一次随机结果与概率规律的区别。把一万件计数始终标记为期望或模型示意，重新表述总体概率与实际样本频率。"}],"auditNotes":[{"severity":"澄清","finding":"原卡全概率公式和3.2%的计算正确，但三个概率P(D|A)、P(A∩D)、P(A|D)的不同分母容易在自学中被压缩成一个乘法口诀。","resolution":"从条件概率定义推导乘法，再从互斥且穷尽的事件划分推导全概率，并增加反向条件概率的退出检查。"},{"severity":"澄清","finding":"使用假想人数辅助解释概率时，可能让学习者误以为每批真实样本的频数都精确等于比例乘样本量。","resolution":"在直观图景及例题复核中都明确区分模型期望计数与真实随机观测值。"}]}},{"id":"H34","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"离散随机变量、期望与方差","prerequisites":["H33","J28"],"goals":["理解并应用随机变量与分布列","理解并应用数学期望","理解并应用方差与标准差"],"concepts":[{"name":"随机变量与分布列","explanation":"随机变量将每个试验结果对应为一个实数。离散变量用可能值xᵢ与概率pᵢ描述，须pᵢ≥0且Σpᵢ=1。一个随机变量的同一数值可来自多个基本结果，应先合并对应概率。"},{"name":"数学期望","explanation":"E(X)=Σxᵢpᵢ，是长期平均意义的加权中心，不保证单次能取得该值。E(aX+b)=aE(X)+b；期望相加具有线性性，不要求独立（各期望存在时）。收益题要明确毛收入还是扣成本后的净收益。"},{"name":"方差与标准差","explanation":"Var(X)=E[(X−E X)²]=E(X²)−(E X)²，反映波动；Var(aX+b)=a²Var(X)。一般Var(X+Y)不能直接相加；独立且二阶矩有限是可相加的充分条件，更一般地，协方差为0也足够。不独立时应核查协方差。"}],"methods":["先列全取值与概率，再算一阶二阶矩，最后检查方差非负与单位。"],"pitfalls":["E(X²)不是(E X)²，差正是方差。"],"example":{"question":"【原创】X以概率1/2取0、以1/3取3、以1/6取6，求期望和方差。","solution":["概率和1。E X=0+1+1=2。","E X²=9/3+36/6=9。","Var X=9−4=5，期望2。"],"answer":"Var X=9−4=5，期望2。"},"practice":[{"question":"【原创】E X=4，Var X=9，Y=2X−1，求E Y、Var Y。","answer":"7和36。","solution":"期望2×4−1=7；方差4×9=36。","level":"基础"},{"question":"【原创】某游戏每次付3元，奖品价值以概率1/4为8元、其余0，期望净收益？","answer":"−1元。","solution":"期望奖品价值8/4=2，扣固定成本3得−1。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H35","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"二项分布与超几何分布","prerequisites":["H34","H31"],"goals":["理解并应用二项分布条件","理解并应用二项均值方差","理解并应用超几何分布"],"concepts":[{"name":"二项分布条件","explanation":"n次独立重复试验，每次成功概率同为p，成功总次数X~B(n,p)。P(X=k)=C(n,k)pᵏ(1−p)ⁿ⁻ᵏ，k=0,…,n。组合数来自成功位置的选择；独立、相同概率、固定次数是模型条件。"},{"name":"二项均值方差","explanation":"将X写成n个取0/1的指标变量之和，各期望p、方差p(1−p)。利用期望线性和独立方差相加，E X=np、Var X=np(1−p)。这也解释为什么只知道平均成功率不一定足以套二项模型。"},{"name":"超几何分布","explanation":"从N个对象（M个目标）中不放回等可能取n个，目标个数X服从超几何分布，P(X=k)=C(M,k)C(N−M,n−k)/C(N,n)。k上下界须满足两类抽取数合法；E X=nM/N，抽取相互依赖。"}],"methods":["先问抽样是否放回或独立，再问次数与概率是否固定，选模型后核验k范围。"],"pitfalls":["从小总体不放回抽样不能不加说明地当二项。"],"example":{"question":"【原创】独立抛公平硬币4次，恰有3次正面概率及正面次数期望？","solution":["X~B(4,1/2)，P(X=3)=C(4,3)(1/2)⁴。","4/16=1/4，期望np=4×1/2。","概率1/4，期望2。"],"answer":"概率1/4，期望2。"},"practice":[{"question":"【原创】B(10,0.2)的方差？","answer":"1.6。","solution":"np(1−p)=10×0.2×0.8。","level":"基础"},{"question":"【原创】10件中4件目标，随机不放回取3件，恰有2件目标的概率？","answer":"3/10。","solution":"C(4,2)C(6,1)/C(10,3)=36/120。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H36","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"正态分布与标准化","prerequisites":["H34","H06"],"goals":["理解并应用正态模型","理解并应用标准化","理解并应用经验区间与尾部"],"concepts":[{"name":"正态模型","explanation":"X~N(μ,σ²)（σ>0）为以μ对称的钟形连续分布，均值μ、方差σ²。概率对应密度曲线下的面积，不是曲线高度；连续变量在单个点的概率为0。正态是模型假设，现实数据近似钟形不等于严格正态。"},{"name":"标准化","explanation":"令Z=(X−μ)/σ，则Z~N(0,1)。任何区间概率转成标准正态累计分布Φ的差：P(a≤X≤b)=Φ((b−μ)/σ)−Φ((a−μ)/σ)。题目需给概率表、软件或常用近似值才能数值计算。"},{"name":"经验区间与尾部","explanation":"正态模型下约68.27%、95.45%、99.73%落在均值±1、2、3个标准差范围。超过3σ仍有非零概率；正态变量可取全部实数，若建模本应非负的量，需说明近似是否合适。"}],"methods":["分清方差与标准差，按统一σ标准化，借给定表或已标近似常数求概率。"],"pitfalls":["68-95-99.7近似只适用于正态模型，不是所有数据必然遵守。"],"example":{"question":"【原创】X~N(100,15²)，将85≤X≤115标准化并给近似概率。","solution":["下界(85−100)/15=−1，上界为1。","因此概率=P(−1≤Z≤1)。","约0.6827，即68.27%。"],"answer":"约0.6827，即68.27%。"},"practice":[{"question":"【原创】N(50,4)的标准差是多少？","answer":"2。","solution":"第二个参数是方差4，不是标准差。","level":"基础"},{"question":"【原创】正态变量恰好等于均值的概率是多少？","answer":"0。","solution":"连续分布单点没有面积，尽管均值处密度最大。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H37","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"必修","domain":"统计与概率","title":"抽样、估计与样本偏差","prerequisites":["J29","H34"],"goals":["理解并应用总体与抽样","理解并应用用样本估计总体","理解并应用方差分母的口径"],"concepts":[{"name":"总体与抽样","explanation":"总体是目标对象全体，样本是实际观察部分。固定样本量n的简单随机不放回抽样，要求总体中每个含n个不同个体的子集被选中的概率相同，因此每个个体入样概率为n/N（N为总体大小）。仅个体入样概率相同还不充分：从1、2、3、4中只等可能抽取{1,2}或{3,4}，人人入样概率1/2，但其他二人组合永远抽不到，不是简单随机抽样。分层抽样先按有关属性划层再抽样，汇总均值时应用总体层权重。便利样本容易偏，样本量大也不能自动消除选择偏差。"},{"name":"用样本估计总体","explanation":"样本均值、比例、分布图可估计总体相应特征。估计存在随机误差，应说明样本来源、抽样方法、样本量和时间。若问卷只有愿意回复者，非回复偏差可能改变结论，不能直接概括全体。"},{"name":"方差分母的口径","explanation":"描述一组已给数据常用1/n的平方偏差均值；推断总体方差的无偏样本方差常用1/(n−1)，n>1。二者服务不同目的，符号s²可能被不同书使用，必须跟随题目定义而非只看符号。"}],"methods":["明确研究对象与抽样单位，报告估计值时附上样本设计和适用人群。"],"pitfalls":["大样本并不能修复一开始就选错人群的问题。"],"example":{"question":"【原创】总体分甲乙两层占30%、70%，两层样本均值分别60、80，按比例估计总体均值。","solution":["总体层权重为0.3与0.7。","加权估计0.3×60+0.7×80。","总体均值估计74。"],"answer":"总体均值估计74。"},"practice":[{"question":"【原创】只在跑步俱乐部问体能水平，能代表全市居民吗？","answer":"通常不能。","solution":"抽样范围有系统选择偏差，运动参与者与全体居民可能不同。","level":"基础"},{"question":"【原创】数据1、2、3的描述方差与无偏样本方差分别是多少？","answer":"2/3和1。","solution":"均值2，平方偏差和2，分别除以3和3−1。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H38","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"相关系数、最小二乘与回归","prerequisites":["H37","H28"],"goals":["理解并应用相关与因果","理解并应用最小二乘直线","理解并应用残差与预测"],"concepts":[{"name":"相关与因果","explanation":"成对数据(xᵢ,yᵢ)可用散点图观察线性趋势，相关系数r衡量线性关系方向与强弱，−1≤r≤1，变量样本方差均正才有定义。r接近0不排除强非线性关系；相关也不证明因果，可能存在共同因素。"},{"name":"最小二乘直线","explanation":"拟合ŷ=a+bx，使残差平方和Σ(yᵢ−a−bxᵢ)²最小。当Σ(xᵢ−x̄)²>0时，b=Σ(xᵢ−x̄)(yᵢ−ȳ)/Σ(xᵢ−x̄)²，a=ȳ−bx̄。对a、b求极值可推导，基础版把公式理解为中心化变化的比。"},{"name":"残差与预测","explanation":"残差eᵢ=yᵢ−ŷᵢ是实际值减预测值，带截距最小二乘直线过(x̄,ȳ)。回归可插值预测，但远离数据范围外推风险增加；残差呈弯曲或扇形分布提示线性、等波动假设可能不适合。"}],"methods":["先画散点看模型是否合理，再算中心化的乘积和，最后检查残差与预测范围。"],"pitfalls":["把回归预测值当作必然值，忽略了随机波动。"],"example":{"question":"【原创】数据(1,2)、(2,3)、(3,5)，求最小二乘直线。","solution":["x̄=2，ȳ=10/3，分母1+0+1=2。","分子(−1)(−4/3)+0+(1)(5/3)=3，故b=3/2。","a=10/3−3=1/3，ŷ=1/3+(3/2)x。"],"answer":"a=10/3−3=1/3，ŷ=1/3+(3/2)x。"},"practice":[{"question":"【原创】回归直线ŷ=2+3x，x=4实际y=15，残差？","answer":"1。","solution":"预测14，实际15减预测14为1。","level":"基础"},{"question":"【原创】r=0是否意味着x、y独立？","answer":"一般不意味着。","solution":"例如对称取值的X与Y=X²可无线性相关，但Y完全由X确定。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H39","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"统计与概率","title":"列联表与独立性检验","prerequisites":["H38","H33"],"goals":["理解并应用列联表与原假设","理解并应用检验统计量","理解并应用结论措辞"],"concepts":[{"name":"列联表与原假设","explanation":"2×2列联表把两个二分类变量组合成四格，记观测数a,b,c,d，总数n。原假设H₀认为两变量独立；在H₀下某格期望数=所在行总数×所在列总数/n。统计检验比较观测与独立模型差别，样本来自合适设计才有解释价值。"},{"name":"检验统计量","explanation":"Pearson统计量χ²=Σ(O−E)²/E；2×2表也可写n(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]，各边际须正。常用近似要求样本足够且期望频数不太小；稀疏数据不能无条件用同一近似阈值。"},{"name":"结论措辞","explanation":"在预先选定显著性水平α下，统计量超过相应阈值就拒绝独立假设。未拒绝不等于证明独立；拒绝不等于发现因果。α是若H₀成立时程序误拒概率的控制水平，不是‘H₀为真概率’。"}],"methods":["先写H₀和α，算期望数检查近似条件，再算统计量并按给定阈值解释。"],"pitfalls":["不能把显著性水平说成‘本结论有95%概率正确’。"],"example":{"question":"【原创】2×2表第一行为30、20，第二行为20、30，按题给临界值3.841判断是否在5%水平拒绝独立。","solution":["行列总数均50，总数100，每格期望25。","χ²=4×(5²/25)=4；各期望数足够大。","4>3.841，按该近似检验拒绝独立假设；有统计关联证据，不据此认定因果。"],"answer":"4>3.841，按该近似检验拒绝独立假设；有统计关联证据，不据此认定因果。"},"practice":[{"question":"【原创】未拒绝独立假设能说已证明独立吗？","answer":"不能。","solution":"可能样本不足或效应较小，只能说当前证据不足以拒绝。","level":"基础"},{"question":"【原创】总数200，某行50、某列80，该格独立模型期望数？","answer":"20。","solution":"E=50×80/200=20。","level":"进阶"},{"question":"【原创·分层】一份可近似视为独立随机观测的2×2列联表，两行依次为(24,16)和(36,24)。以两变量独立为原假设，求四格期望频数与Pearson χ²。给定5%水平临界值3.841，说明结论。","answer":"期望数依次为24、16、36、24，χ²=0；不拒绝独立假设，但不能声称已证明独立。","solution":"行总数为40、60，列总数为60、40，总数100。在独立假设下，四格期望数分别为40×60/100=24、40×40/100=16、60×60/100=36、60×40/100=24，均不小于5。每个观测数恰等于期望数，所以χ²=Σ(O−E)²/E=0。0\u003c3.841，没有足够证据在5%水平拒绝独立假设。样本与独立模型一致不等于逻辑证明总体独立，抽样波动与样本量仍影响检验能力。","level":"基础巩固"},{"question":"【原创·分层】2×2表两行依次为(2,0)和(0,2)。本题约定只有四格期望频数均不小于5时才使用Pearson χ²的近似临界值3.841。计算χ²，并判断能否因χ²>3.841就在5%水平宣布拒绝独立假设。","answer":"四格期望均为1，χ²=4；按题设不能据此使用3.841阈值作拒绝结论。","solution":"行、列总数均为2，总数4，因此每格独立模型期望E=2×2/4=1。四格偏差依次为1、−1、−1、1，所以χ²=4×1²/1=4，算术上确实大于3.841。但所有期望数只有1，违反本题使用近似阈值的条件；统计量能算出来不表示其近似参考分布适用。应采用与抽样设计相符的精确方法，或取得更充分的数据后按适当方法检验；当前不能机械宣布5%水平显著，也不能反过来声称两变量已被证明独立。","level":"条件变式"},{"question":"【原创·分层】某样本含100名学生，可近似视为独立随机观测。自愿参加学习小组的学生中40人达标、10人未达标；未参加者中30人达标、20人未达标。预先选择5%显著性水平，给定临界值3.841。计算χ²并解释能否断言参加小组导致达标率提高。若另一份真正独立收集的200人样本四格人数恰均为原表两倍，χ²和两组达标率之差各如何变化？","answer":"原表χ²=100/21≈4.762，在5%水平拒绝独立假设，有关联证据但不能据此断言因果。加倍样本χ²=200/21≈9.524；两组达标率仍为80%与60%，差仍为20个百分点。","solution":"原表行总数50、50，列总数70、30，总数100，四格期望为35、15、35、15，均不少于5。χ²=2×(25/35+25/15)=100/21≈4.762>3.841，因此在预设水平拒绝独立假设。由于是否参加由学生自选而非随机分配，原有基础、动机等变量可能同时影响参加和达标，关联本身不能确立因果。若另一个真实样本的观测数、总数与期望数都加倍，每格(O−E)²/E变为原来的2倍，故χ²加倍为200/21；两组比例40/50与30/50在人数同比加倍后不变，差仍20个百分点。这说明样本量会影响统计证据强度，不能把更大的χ²直接解释为更大的比例差；简单复制原始数据也不算新的独立样本。","level":"综合应用"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H40","stage":"高中","grade":"高中统计与综合（建议高二至高三）","courseType":"选择性必修","domain":"综合与实践","title":"高中综合建模与证明方法","prerequisites":["H29","H39","H24","H26"],"goals":["理解并应用跨主题解决问题","理解并应用必要、充分与反证","理解并应用模型验证与学习闭环"],"concepts":[{"name":"跨主题解决问题","explanation":"同一问题可联系函数与方程、几何与向量、数列与导数、概率与计数。先辨目标是证明存在、求参数、求最值还是预测，再选择合适工具；每次切换表示法，都检查变量意义和范围仍一致。"},{"name":"必要、充分与反证","explanation":"求参数常先从结论推出必要范围，再代回证明范围内确实可行。反证法假设结论不成立并推到已知条件或逻辑矛盾；构造反例则用于否定错误全称命题。数学归纳法用于自然数指标结论，详细基础在高阶A01。"},{"name":"模型验证与学习闭环","explanation":"输出应包括假设、推导、答案、误差或适用范围。考试训练要先核验原卷与年份地区，原创练习不能标成真题。学习时先完成当前模块自测，再做跨模块题，错因归类后回到具体前置知识。"}],"methods":["把结论拆成可检验小目标，选择公式时先核对条件，最后以另一视角验算。"],"pitfalls":["跨主题方法更强不代表可以跳过原题的定义域和几何限制。"],"example":{"question":"【原创】矩形长宽为正且周长40，求最大面积，分别用配方和基本不等式说明。","solution":["设宽x，长20−x，0\u003cx\u003c20。面积S=x(20−x)=100−(x−10)²≤100，x=10取等。","也可由x+(20−x)=20固定，正数乘积≤(20/2)²=100。","正方形边长10时面积最大100，两种方法取等条件一致。"],"answer":"正方形边长10时面积最大100，两种方法取等条件一致。"},"practice":[{"question":"【原创】某不等式对所有正整数n成立，可以只验证前10项吗？","answer":"不可以。","solution":"有限验证仅给例证；需一般证明或数学归纳法等。","level":"基础"},{"question":"【原创】求参数时推得a≥2后，能直接宣布所有a≥2都可行吗？","answer":"不能总是如此。","solution":"推导若只保证必要性，仍需验证a≥2时原条件全部成立，排除变形增解。","level":"进阶"}],"mastery":["能说明随机模型或定理的假设","独立完成概率与统计计算并检验结果范围"],"sources":[{"title":"人教A选择性必修第三册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"A01","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"证明基础","title":"数学归纳法：从递推走向证明","prerequisites":["H02","H25"],"goals":["说清基础定义与定理前提","复述推导并核查反例","独立完成例题后的两道自测"],"concepts":[{"name":"自然数命题","explanation":"命题P(n)可以随整数n变化。“试了很多项都对”仅是证据，不是对无限多个n的证明。归纳法针对从某个整数n₀起连续的全部整数。"},{"name":"归纳假设与强归纳","explanation":"普通归纳是假设P(k)成立推出P(k+1)；强归纳可同时使用P(n₀),…,P(k)。两种形式建立在自然数的良序性质上：非空自然数集合有最小元。"},{"name":"适用边界","explanation":"参数范围、起点和递推步都要覆盖。偶数步推偶数步不能证明奇数；证明存在一种分解时，可以归纳分解规模，但须确保子问题规模下降。"}],"theorem":{"name":"数学归纳原理","assumptions":["P(n₀)成立。","每个整数k≥n₀都有P(k)⇒P(k+1)。"],"statement":"对所有整数n≥n₀，P(n)成立。","proofLevel":"完整证明（以自然数良序性质为基础）","proof":["反设存在失败的整数，取其中最小的m。","起点已成立，故m>n₀；最小性保证P(m−1)成立。","归纳步推出P(m)成立，矛盾。因此失败集合为空。"]},"derivation":["猜想1+3+…+(2n−1)=n²。n=1时两边都是1。","假设前k个奇数和为k²；第k+1项是2k+1。","新和=k²+2k+1=(k+1)²，因此对n≥1成立。"],"methods":["先核对前置知识和成立条件，再应用结论；回到原定义检查边界。"],"pitfalls":["不能把待证的P(k+1)当成归纳假设。"],"example":{"question":"【原创】证明1+2+…+n=n(n+1)/2。","solution":["n=1成立。","若前k项和为k(k+1)/2，加k+1得(k+1)(k+2)/2。","归纳成立，n为正整数。"],"answer":"n(n+1)/2，n≥1。"},"practice":[{"question":"【原创】证明2ⁿ≥n+1（整数n≥0）。","answer":"成立。","solution":"n=0取等；由2ᵏ≥k+1得2ᵏ⁺¹≥2k+2≥k+2（k≥0）。","level":"基础"},{"question":"【原创】仅验证n=1和P(k)⇒P(k+2)能否证明所有n≥1？","answer":"不能。","solution":"只连通奇数链；还需n=2起点或其他连接偶数的方法。","level":"进阶"}],"mastery":["不看正文写出定理条件与结论","给出一种条件缺失时的反例或限制","完成自测并解释关键步骤"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/mit6_042js15_textbook.pdf","locator":"MIT课程教材：归纳法与良序原理；本库证明和训练独立编排。"}]},{"id":"A02","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"分析基础","title":"数列极限、上确界与单调有界","prerequisites":["H25","H03","A01"],"goals":["说清基础定义与定理前提","复述推导并核查反例","独立完成例题后的两道自测"],"concepts":[{"name":"ε—N定义","explanation":"aₙ→L指对每个ε>0，存在整数N，使所有n≥N都有|aₙ−L|\u003cε。先给任意精度，再找统一阈值；N可依赖ε，但不能依赖随后挑选的n。"},{"name":"有界与上确界","explanation":"上界M满足全部aₙ≤M；最小上界叫上确界sup。实数完备性保证每个非空且有上界的实数集合都有上确界。这是基础性质，本库不从有理数构造实数重新证明它。"},{"name":"必要条件与反例","explanation":"收敛数列必有界：充分靠后的项落在L±1中，其绝对值不超过|L|+1；有限个前项的绝对值再与|L|+1一起取最大值，即得到控制全部项绝对值的界。但(−1)ⁿ有界不收敛；单调但无界的n也不收敛于有限实数。"}],"theorem":{"name":"单调有界收敛定理","assumptions":["aₙ单调不减。","存在实数M，使每项aₙ≤M。"],"statement":"aₙ收敛，极限为L=sup{aₙ}。单调不增且有下界的情形相应成立。","proofLevel":"完整证明（使用实数完备性）","proof":["完备性给出L。任取ε>0，L−ε不是上界，故存在N使a_N>L−ε。","对n≥N，单调性给L−ε\u003ca_N≤aₙ≤L。","故|aₙ−L|\u003cε，正是收敛定义。"]},"derivation":["令a₁=1，aₙ₊₁=√(2+aₙ)。归纳可证1≤aₙ\u003c2。","函数√(2+x)递增且a₂>a₁，归纳得aₙ₊₁≥aₙ。","由单调有界先得到aₙ→L且1≤L≤2，移去首项不影响趋近性质，因此aₙ₊₁也趋L。不必提前借用A04：根式差有理化给|√(2+aₙ)−√(2+L)|=|aₙ−L|/[√(2+aₙ)+√(2+L)]≤|aₙ−L|/(2√3)→0。所以递推式两边极限给L=√(2+L)。平方得(L−2)(L+1)=0，结合L≥1排除−1，得到L=2。不能先解固定点方程就宣称收敛。"],"methods":["先核对前置知识和成立条件，再应用结论；回到原定义检查边界。"],"pitfalls":["递推式的固定点只是极限候选值，必须先证明收敛。"],"example":{"question":"【原创】用定义证明3/n→0。","solution":["给定ε>0。","取整数N>3/ε。","n≥N时|3/n|≤3/N\u003cε。"],"answer":"极限为0。"},"practice":[{"question":"【原创】数列1−2/n是否收敛？","answer":"收敛到1。","solution":"误差2/n；选N>2/ε即可，且数列递增有上界1。","level":"基础"},{"question":"【原创】aₙ=(−1)ⁿ为何不能使用单调有界定理？","answer":"不单调且不收敛。","solution":"奇数子列恒−1，偶数子列恒1，不能具有相同极限。","level":"进阶"}],"mastery":["不看正文写出定理条件与结论","给出一种条件缺失时的反例或限制","完成自测并解释关键步骤"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-2/pages/5-1-sequences","locator":"极限、单调与有界；本库另给上确界证明和原创递推例。"}]},{"id":"A03","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"分析基础","title":"函数极限：ε—δ、运算法则与夹逼","prerequisites":["H05","A02"],"goals":["说清基础定义与定理前提","复述推导并核查反例","独立完成例题后的两道自测"],"concepts":[{"name":"去心邻域","explanation":"lim(x→a)f(x)=L表示：∀ε>0，∃δ>0，当0\u003c|x−a|\u003cδ且x在定义域内时，有|f(x)−L|\u003cε；a须为定义域聚点。去掉x=a，所以f(a)可以不存在或不同于L。"},{"name":"左右极限与运算","explanation":"实轴内点的双侧极限存在当且仅当左右极限存在且相等。有限极限的和、积可逐项取极限；商还要求分母极限不为0。0/0不是数值结论，需变形或其他定理。"},{"name":"夹逼与局部有界","explanation":"若近a时g≤f≤h且g、h都趋L，则f趋L；由两侧误差限制直接推出。极限有限的函数在充分小的去心邻域内有界，是乘积极限证明的重要前置。"}],"theorem":{"name":"有限极限的加法法则","assumptions":["f(x)→A、g(x)→B，x→a。","在同一适当去心邻域中定义。"],"statement":"f(x)+g(x)→A+B。","proofLevel":"完整ε—δ证明","proof":["给定ε>0，分别用精度ε/2找到δ₁、δ₂。","取δ=min(δ₁,δ₂)。","在该去心邻域中，|(f+g)−(A+B)|≤|f−A|+|g−B|\u003cε。"]},"derivation":["求lim(x→3)(x²−9)/(x−3)。原式在x=3没有定义。","x≠3时因式分解约为x+3，故极限是6。","严格核对：|x+3−6|=|x−3|，取δ=ε即可；约分只在去心邻域用，不改变极限。"],"methods":["先核对前置知识和成立条件，再应用结论；回到原定义检查边界。"],"pitfalls":["极限的0/0形式不能约成0，也不代表极限不存在。"],"example":{"question":"【原创】用定义证明lim(x→2)(5x−2)=8。","solution":["误差|(5x−2)−8|=5|x−2|。","给ε>0，取δ=ε/5。","0\u003c|x−2|\u003cδ时误差\u003cε。"],"answer":"极限为8。"},"practice":[{"question":"【原创】求lim(x→0)x²sin(1/x)。","answer":"0。","solution":"sin有界，−x²≤x²sin(1/x)≤x²，两端都趋0。","level":"基础"},{"question":"【原创】lim(x→0)1/x存在有限实数值吗？","answer":"不存在。","solution":"右侧无界为正，左侧无界为负，不存在共同有限极限。","level":"进阶"}],"mastery":["不看正文写出定理条件与结论","给出一种条件缺失时的反例或限制","完成自测并解释关键步骤"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-1/pages/2-5-the-precise-definition-of-a-limit","locator":"严格极限定义；法则证明与例题为原创组织。"}]},{"id":"A04","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"分析基础","title":"连续性、介值与闭区间最值","prerequisites":["A03","H09"],"goals":["说清基础定义与定理前提","复述推导并核查反例","独立完成例题后的两道自测"],"concepts":[{"name":"点连续与区间连续","explanation":"f在a连续指f(a)有定义且lim(x→a)f(x)=f(a)。区间端点取区间内的单侧极限。跳跃、无界、缺点均须具体分析，不能只凭一张不精确的图。"},{"name":"介值与存在性","explanation":"在闭区间[a,b]连续，f会取到介于f(a)、f(b)之间的每个数。异号端值因而给出零点；这只保证至少一个，不保证唯一，唯一性可另由严格单调等证明。"},{"name":"最值与完备性","explanation":"闭有界区间上的连续函数一定有最大值和最小值。证明依赖实数完备性／紧致性；本卡以该定理为已声明的基础结果，不把它伪装成显然结论。开区间函数f(x)=x（0\u003cx\u003c1）没有最大、最小值。"}],"theorem":{"name":"介值定理的零点形式","assumptions":["a\u003cb，f在[a,b]连续。","f(a)\u003c0\u003cf(b)。"],"statement":"存在c∈(a,b)，使f(c)=0。","proofLevel":"完整证明（使用实数上确界性质）","proof":["令S={x∈[a,b]:f(x)≤0}，它非空有上界，取c=sup S。","由端点连续性，a附近存在负值且b附近为正，故a\u003cc\u003cb。","若f(c)\u003c0，连续性使c右边近处仍负，出现S中大于c的点，矛盾。","若f(c)>0，连续性使c附近皆正；但上确界性质保证S中有任意靠近c的左侧点，矛盾。因此f(c)=0。"]},"derivation":["方程x³+x−4=0在[1,2]端值分别−2、6，故有根。","若x₂>x₁，则f(x₂)−f(x₁)=(x₂−x₁)(x₂²+x₁x₂+x₁²+1)>0，故严格递增，根唯一。","二分n次后区间长1/2ⁿ，取中点的绝对误差至多1/2ⁿ⁺¹。"],"methods":["先核对前置知识和成立条件，再应用结论；回到原定义检查边界。"],"pitfalls":["最值定理的闭、有界、连续条件不能随意删除。"],"example":{"question":"【原创】g(x)=1/x能否因g(−1)\u003c0\u003cg(1)判定[−1,1]有零点？","solution":["0处未定义，因此不满足区间连续条件。","任意定义域中的x都有1/x≠0。","异号只是必要检查的一部分，不能跳过连续性。"],"answer":"不能；本例没有零点。"},"practice":[{"question":"【原创】连续函数在[2,5]上端值为1和9，是否一定取到4？","answer":"一定。","solution":"4介于两个端值之间，由介值定理。","level":"基础"},{"question":"【原创】f(x)=x²在R上有最大值吗？","answer":"没有；最小值为0。","solution":"定义域不有界，闭区间最值定理不能直接用于整个R；函数向上无界。","level":"进阶"}],"mastery":["不看正文写出定理条件与结论","给出一种条件缺失时的反例或限制","完成自测并解释关键步骤"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-1/pages/2-4-continuity","locator":"连续与介值；最值定理另见同书4.3，证明范围已明确。"}]},{"id":"A05","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"微积分","title":"可微与线性近似：求导法则为什么成立","prerequisites":["A03","H27"],"goals":["说清基础定义与定理前提","复述推导并核查反例","独立完成例题后的两道自测"],"concepts":[{"name":"可微的误差表示","explanation":"f在a可微等价于f(a+h)=f(a)+f′(a)h+r(h)，其中r(h)/h→0。记r(h)=o(h)，不是误差恒等于0，而是相对h消失得更快。"},{"name":"可微必连续","explanation":"增量f(a+h)−f(a)=h[f′(a)+r(h)/h]→0，因此连续。反向不成立，例如|x|在0的左右导数不同。"},{"name":"链式法则的前提","explanation":"f在a可微，g在f(a)可微，则(g∘f)′(a)=g′(f(a))f′(a)。把外层的局部线性变化应用于内层增量，余项可控；不要求内层导数非零。"}],"theorem":{"name":"乘积求导法则","assumptions":["f、g在a都可微。"],"statement":"(fg)′(a)=f′(a)g(a)+f(a)g′(a)。","proofLevel":"完整证明","proof":["增减一项，把f(a+h)g(a+h)−f(a)g(a)拆成[f(a+h)−f(a)]g(a+h)+f(a)[g(a+h)−g(a)]。","除以h并令h→0；可微保证g(a+h)→g(a)。","两部分分别趋f′(a)g(a)和f(a)g′(a)，得到结论。"]},"derivation":["为严谨说明链式法则，写g(b+k)−g(b)=g′(b)k+η(k)k，η(k)→0并补定义η(0)=0。","令b=f(a)、k=f(a+h)−f(a)。可微给k/h→f′(a)，且k→0。","复合增量除h为[g′(b)+η(k)]k/h，极限得到链式公式，也覆盖k=0的情况。"],"methods":["先核对前置知识和成立条件，再应用结论；回到原定义检查边界。"],"pitfalls":["微分近似需要误差控制；不能把≈改为=。"],"example":{"question":"【原创】用线性近似估计√4.04，并说明是否为精确值。","solution":["f(x)=√x，取a=4，f(4)=2、f′(4)=1/4。","h=0.04，线性估计2+(1/4)×0.04=2.01。","这是近似，真正值略小于2.01；可用下一步的泰勒余项量化误差。"],"answer":"约2.01，不是恒等值。"},"practice":[{"question":"【原创】求d/dx [x²eˣ]。","answer":"eˣ(x²+2x)。","solution":"乘积法则给2xeˣ+x²eˣ。","level":"基础"},{"question":"【原创】求d/dx sin(x²)，并解释2x的来源。","answer":"2x cos(x²)。","solution":"外层sin导数cos，内层x²导数2x，应用链式法则。","level":"进阶"}],"mastery":["不看正文写出定理条件与结论","给出一种条件缺失时的反例或限制","完成自测并解释关键步骤"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-1/pages/3-6-the-chain-rule","locator":"链式法则核查；本卡增量证明与数值例原创。"}]},{"id":"A06","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"微积分","title":"罗尔与拉格朗日中值定理","prerequisites":["A04","A05","H28"],"goals":["说清基础定义与定理前提","复述推导并核查反例","独立完成例题后的两道自测"],"concepts":[{"name":"费马引理","explanation":"若可微函数在内点c取得局部极值，则f′(c)=0。以极大值为例，右侧差商≤0、左侧差商≥0，导数若存在只能为0；端点与不可微点不适用。"},{"name":"罗尔定理","explanation":"f在[a,b]连续、(a,b)可微，且f(a)=f(b)，则某c∈(a,b)满足f′(c)=0。由闭区间最值定理：非常值时至少一个不同于端值的极值在内部，再用费马引理；常值时处处导数0。"},{"name":"导数控制全局变化","explanation":"中值定理把区间平均变化率等同于某内点导数。若区间上|f′|≤M，就有|f(y)−f(x)|≤M|y−x|；导数恒零则该区间上常值，不能跨定义域断点直接使用。"}],"theorem":{"name":"拉格朗日中值定理","assumptions":["a\u003cb，f在[a,b]连续。","f在(a,b)处处可微。"],"statement":"存在c∈(a,b)，使f(b)−f(a)=f′(c)(b−a)。","proofLevel":"完整证明（罗尔及闭区间最值定理为前置）","proof":["设m=[f(b)−f(a)]/(b−a)，令F(x)=f(x)−f(a)−m(x−a)。","F连续、内部可微，且F(a)=F(b)=0。","罗尔定理给F′(c)=0；于是f′(c)=m，乘b−a得到结论。"]},"derivation":["对x>−1且x≠0，把ln(1+t)用于端点0、x间的区间，得到ln(1+x)=x/(1+c)，c在0和x之间。","更统一的比较：令h(x)=x−ln(1+x)，有h′(x)=x/(1+x)。","h在(−1,0)递减、(0,∞)递增，最小值h(0)=0，因此ln(1+x)≤x，等号仅x=0。"],"methods":["先核对前置知识和成立条件，再应用结论；回到原定义检查边界。"],"pitfalls":["定理说存在，不是c必为区间中点，也不保证唯一。"],"example":{"question":"【原创】f(x)=x²在[1,4]的中值定理点c是多少？","solution":["平均变化率=(16−1)/(4−1)=5。","f′(c)=2c=5得c=5/2。","c在(1,4)中且各条件成立。"],"answer":"c=5/2。"},"practice":[{"question":"【原创】证明|sin u−sin v|≤|u−v|。","answer":"对所有实数u,v成立。","solution":"u=v显然；否则中值定理给差值cos c×(u−v)，由|cos c|≤1。","level":"基础"},{"question":"【原创】f(x)=|x−2|在[1,3]满足罗尔定理吗？","answer":"不满足可微条件。","solution":"端值相同且连续，但2处不可微，其他内点导数±1，无导数为0的点。","level":"进阶"},{"question":"【原创·分层】f(t)=t²−2t，在[0,3]应用拉格朗日中值定理，求所有符合条件的c，并代回等式验证。","answer":"c=3/2，且f(3)−f(0)=3=f′(3/2)·3。","solution":"多项式在[0,3]连续、在(0,3)可微。端值f(0)=0、f(3)=3，平均变化率为1。由f′(t)=2t−2，解2c−2=1得c=3/2，确在开区间内。f′(3/2)=1，乘区间长度3得3，与端值差一致；因导数严格递增，只此一解。","level":"基础巩固"},{"question":"【原创·分层】在[0,1]定义f(t)=t（0≤t\u003c1），f(1)=2。它在(0,1)处处可微，能否使用中值定理？是否存在满足定理等式的c？","answer":"不能使用；没有满足等式的c。缺少在右端点1的连续性。","solution":"左极限lim(t→1−)f(t)=1，但f(1)=2，所以在闭区间上不连续。端值给平均斜率(2−0)/(1−0)=2；而每个c∈(0,1)都有f′(c)=1，不可能等于2。本例说明端点连续不能只由内部可微替代。","level":"条件变式"},{"question":"【原创·分层】证明对每个x>0都有x/(1+x)\u003cln(1+x)\u003cx；并说明x=0时应如何改写。","answer":"x>0时两边严格成立；x=0时三者均为0。","solution":"固定x>0，对f(t)=ln(1+t)在[0,x]应用中值定理：它在该闭区间连续、内部可微，导数为1/(1+t)，所以ln(1+x)=x/(1+c)，其中0\u003cc\u003cx。于是1/(1+x)\u003c1/(1+c)\u003c1；乘正数x后得到所求严格不等式。x=0时不使用长度为0的中值定理，直接代值得三者同为0。","level":"综合应用"}],"mastery":["不看正文写出定理条件与结论","给出一种条件缺失时的反例或限制","完成自测并解释关键步骤"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-1/pages/4-4-the-mean-value-theorem","locator":"定理条件核查；推导、不等式和训练为本库原创重组。"}],"illustrations":[{"moduleId":"A06","title":"中值定理：某条切线平行于割线","caption":"原例f(x)=x²在[1,4]连续、在(1,4)可导。割线斜率(16−1)/(4−1)=5；f′(2.5)=5，因此内部点ξ=2.5处切线平行于割线。图示不能证明对所有函数的存在性；一般证明在正文。","file":"图解/A06.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"A06-title A06-desc\">\u003ctitle id=\"A06-title\">中值定理：某条切线平行于割线\u003c/title>\u003cdesc id=\"A06-desc\">原例f(x)=x²在[1,4]连续、在(1,4)可导。割线斜率(16−1)/(4−1)=5；f′(2.5)=5，因此内部点ξ=2.5处切线平行于割线。图示不能证明对所有函数的存在性；一般证明在正文。\u003c/desc>\u003cdefs>\u003cclipPath id=\"A06-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">中值定理：某条切线平行于割线\u003c/text>\u003cline x1=\"72\" y1=\"362.89473684210526\" x2=\"557\" y2=\"362.89473684210526\" class=\"axis\"/>\u003cline x1=\"72\" y1=\"55\" x2=\"72\" y2=\"380\" class=\"axis\"/>\u003ctext x=\"566\" y=\"366.89473684210526\" class=\"label\">x\u003c/text>\u003ctext x=\"54\" y=\"51\" class=\"label\">y\u003c/text>\u003cpolyline points=\"93.08695652173913,362.2105263157895 95.19565217391305,362.06684210526316 97.30434782608697,361.9094736842105 99.41304347826087,361.73842105263157 101.52173913043478,361.55368421052634 103.6304347826087,361.35526315789474 105.73913043478261,361.1431578947368 107.84782608695653,360.91736842105263 109.95652173913044,360.6778947368421 112.06521739130434,360.4247368421053 114.17391304347827,360.1578947368421 116.28260869565219,359.8773684210526 118.3913043478261,35
