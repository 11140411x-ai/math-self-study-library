500000006,317.4903125 396.34375000000006,316.51125 397.859375,315.5078125 399.375,314.48 400.890625,313.4278125 402.40625,312.35125 403.92187500000006,311.2503125 405.43750000000006,310.125 406.953125,308.97531250000003 408.46875000000006,307.80125000000004 409.984375,306.6028125 411.5,305.38000000000005 413.015625,304.1328125 414.53125,302.86125 416.04687500000006,301.5653125 417.5625,300.245 419.07812500000006,298.90031250000004 420.59375000000006,297.53125 422.109375,296.1378125 423.625,294.72 425.140625,293.2778125 426.65625000000006,291.81125 428.171875,290.3203125 429.6875,288.805 431.20312500000006,287.2653125 432.71875000000006,285.70124999999996 434.23437500000006,284.1128125 435.75,282.5\" class=\"curve\" clip-path=\"url(#J33-clip)\"/>\u003cline x1=\"334.70833333333337\" y1=\"363.75\" x2=\"334.70833333333337\" y2=\"92.91666666666669\" class=\"dash\"/>\u003ccircle cx=\"132.625\" cy=\"120\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"334.70833333333337\" cy=\"336.6666666666667\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"435.75\" cy=\"282.5\" r=\"5\" fill=\"#245c4d\"/>\u003ctext x=\"144.625\" y=\"112\" class=\"label\">(0,1)\u003c/text>\u003ctext x=\"296.70833333333337\" y=\"366.6666666666667\" class=\"label\">(2,−3)\u003c/text>\u003ctext x=\"448.75\" y=\"282.5\" class=\"label\">(3,−2)\u003c/text>\u003ctext x=\"100\" y=\"420\" class=\"label\">先查定义范围 → 顶点是否允许 → 比较候选值\u003c/text>\u003c/svg>"}]},{"id":"J34","stage":"初中","grade":"八至九年级建议","domain":"函数","title":"函数综合：交点、面积与参数范围","prerequisites":["J33","J32"],"goals":["能解释与应用联立与消元","能解释与应用坐标面积","能解释与应用动点与最值"],"concepts":[{"name":"联立与消元","explanation":"直线与抛物线交点通过联立得到，把直线式代入二次函数，解横坐标，再逐个代回求纵坐标。判别式为0代表相切的代数特征，但应确认联立后仍是二次式以及讨论的曲线确实是相应类型。"},{"name":"坐标面积","explanation":"水平或竖直底边可直接用另一点到该直线的垂距作高；任意底边可以分割成便于计算的三角形，或在高中使用行列式形式。面积为非负，涉及点的位置改变时，必须分段或使用绝对值。"},{"name":"动点与最值","explanation":"把动点坐标用一个变量表示，列面积、距离或费用函数，再在允许区间求最大最小。点在线段上、点不重合、交点存在等限制都要先写，若端点不允许，某个上界可能无法真正达到。"}],"methods":["画简图标区间；用最少变量表示动点；消元后检查所有几何条件，再求函数最值。"],"pitfalls":["方程解出的交点必须带成对坐标，不能任意配横纵坐标。","面积表达式的符号与动点所在区域有关。"],"example":{"question":"【原创】抛物线y=−x²+4x交x轴于O(0,0)、B(4,0)，点P在抛物线上且横坐标满足0\u003cx\u003c4，求非退化△OBP面积最大值。","solution":["交点横坐标0、4，所以OB=4；0\u003cx\u003c4时y=x(4−x)>0，三角形高=y。","面积S=4y/2=−2x²+8x=−2(x−2)²+8。","最大面积8，在P(2,4)取得。"],"answer":"最大面积8，在P(2,4)取得。"},"practice":[{"question":"【原创】y=x²与y=2x有几个交点？","answer":"两个：(0,0)、(2,4)。","solution":"x²=2x→x(x−2)=0，再逐个代入。","level":"基础"},{"question":"【原创】直线y=m与y=(x−1)²相交于两个不同点时m范围？","answer":"m>0。","solution":"横线高于顶点才有两个交点；m=0仅一个，m\u003c0没有。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J35","stage":"初中","grade":"八至九年级建议","domain":"函数","title":"反比例函数：双曲线与面积关系","prerequisites":["J26","J33","J21"],"goals":["能解释与应用形式与定义域","能解释与应用单调性与比较","能解释与应用几何面积与实际量"],"concepts":[{"name":"形式与定义域","explanation":"反比例函数y=k/x中k≠0，x≠0，恒有xy=k。它的图象是双曲线两支；k>0在第一、三象限，k\u003c0在第二、四象限，关于原点对称。x轴和y轴不与图象相交。"},{"name":"单调性与比较","explanation":"k>0时每个分支上分别随x增大而减小，k\u003c0时分别增大。不能把两个分支合起来说整体递减，因为定义域在0处断开；例如k>0时负x函数值为负，正x函数值为正。"},{"name":"几何面积与实际量","explanation":"图象上一点P(x,y)向两轴作垂线构成矩形，其面积|xy|=|k|，相关直角三角形面积|k|/2。路程固定时速度和时间可成反比例，但实际常只用第一象限，并受速度范围约束。"}],"methods":["利用一个非轴上点求k=xy；比较函数值先辨所在分支；面积计算取绝对值。"],"pitfalls":["双曲线靠近坐标轴并不意味着经过原点。","k相等才是同一反比例函数，点坐标的和没有固定意义。"],"example":{"question":"【原创】反比例函数过P(−2,3)，求解析式及P与两轴围成矩形的面积。","solution":["k=−2×3=−6，所以y=−6/x，x≠0。","矩形边长为|−2|和|3|，面积6。","解析式y=−6/x；面积6。"],"answer":"解析式y=−6/x；面积6。"},"practice":[{"question":"【原创】y=12/x，x=3时y多少？","answer":"4。","solution":"代入12/3=4。","level":"基础"},{"question":"【原创】y=4/x与y=x交于哪些点？","answer":"(2,2)、(−2,−2)。","solution":"x≠0，联立得x²=4，取±2后代回。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J36","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"旋转与中心对称","prerequisites":["J11","J17"],"goals":["解释并应用旋转的三要素","解释并应用中心对称","解释并应用坐标中的直角旋转"],"concepts":[{"name":"旋转的三要素","explanation":"旋转由中心、角度和方向确定。每个点与对应点到中心等距，两条半径的夹角为指定旋转角。旋转保持线段长度、角度、平行和垂直关系，所以原图与旋转图全等；旋转中心可以在图形内、外或边上。"},{"name":"中心对称","explanation":"绕某点旋转180°后重合的两图形关于该点中心对称。对应点连线的中点都是对称中心；关于原点，(x,y)变成(−x,−y)。中心对称不等于轴对称，普通平行四边形是中心对称图形但不一定有对称轴。"},{"name":"坐标中的直角旋转","explanation":"绕原点逆时针90°，(x,y)变为(−y,x)；顺时针90°变为(y,−x)。可先验证(1,0)的去向，再扩展到一般点。绕其他中心先平移到原点计算，再平移回去，保持方向约定一致。"}],"methods":["先标旋转中心和方向，再找对应点，证明中常连接旋转中心构造等腰或全等三角形。"],"pitfalls":["旋转后的点距中心保持不变，但横坐标通常不保持。"],"example":{"question":"【原创】P(2,−1)绕原点逆时针90°得到Q，求Q及PQ。","solution":["套(−y,x)得Q(1,2)。","两点坐标差为−1、3，距离√(1+9)。","Q(1,2)，PQ=√10。"],"answer":"Q(1,2)，PQ=√10。"},"practice":[{"question":"【原创】(3,−5)关于原点的对称点？","answer":"(−3,5)。","solution":"两个坐标都变号，原点为中点。","level":"基础"},{"question":"【原创】P(4,1)绕C(1,1)旋转180°，求对应点。","answer":"(−2,1)。","solution":"中心是中点，Q=2C−P=(2−4,2−1)。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J37","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"比例线段与相似三角形","prerequisites":["J16","J25"],"goals":["解释并应用比例与相似","解释并应用相似判定与平行截线","解释并应用长度与面积的倍率"],"concepts":[{"name":"比例与相似","explanation":"相似图形形状相同，大小可不同。相似三角形对应角相等、对应边成比例，相似比k指前一个三角形的边长除以后一个的对应边长，必须保持顺序。比例式交叉相乘时，分母需不为0；几何边长比通常为正。"},{"name":"相似判定与平行截线","explanation":"AA（两角分别相等）、SAS比例（两边成比例且夹角相等）、SSS比例可判相似。平行于三角形一边的直线截另外两边或其延长线，可形成相似三角形；延长线情况要确认对应和角的位置，避免混写线段。"},{"name":"长度与面积的倍率","explanation":"相似比k时，对应高、中线、周长比为k，面积比k²。理由是面积由底与高相乘，两者各变k倍。若面积比为9:16，线性比例为3:4；不能把面积比直接用于边长。"}],"methods":["写出有序相似关系，找对应边，再统一成同方向的比。"],"pitfalls":["一边相等加一个角相等不足以判相似。"],"example":{"question":"【原创】△ABC中D在AB、E在AC上且DE∥BC，AD:AB=2:3，BC=12，△ABC面积27，求DE和△ADE面积。","solution":["由平行得到两组对应角相等，△ADE∽△ABC。","相似比2/3，DE=12×2/3=8；面积比4/9。","DE=8，△ADE面积27×4/9=12。"],"answer":"DE=8，△ADE面积27×4/9=12。"},"practice":[{"question":"【原创】相似三角形边长比3:5，周长和面积比各是多少？","answer":"周长3:5；面积9:25。","solution":"线性量同比例，面积按比例平方变化。","level":"基础"},{"question":"【原创】两个直角三角形一锐角都为35°，是否相似？","answer":"相似。","solution":"直角对应相等，又有一组锐角相等，满足AA。","level":"进阶"},{"question":"【原创·分层】非退化三角形ABC与DEF满足AB=6、BC=8、CA=10，DE=9、EF=12、FD=15。证明它们相似，写出△ABC与△DEF的对应边长比（前者比后者）。若△DEF的面积为54，求△ABC的面积。","answer":"△ABC∽△DEF，相似比为2/3；△ABC面积24。","solution":"比较对应边可得AB/DE=6/9=2/3，BC/EF=8/12=2/3，CA/FD=10/15=2/3，满足三边对应成比例的相似判定。因此△ABC∽△DEF，A↔D、B↔E、C↔F。从前者到后者的边长比是2/3，面积比为(2/3)²=4/9，所以△ABC面积=54×4/9=24。不能把边长比2/3直接当作面积比。","level":"基础巩固"},{"question":"【原创·分层】在非退化三角形ABC中，D严格在线段AB内部，E严格在线段AC内部。已知AD=3、DB=2、AE=6、EC=4、BC=12，题目未给DE∥BC。证明DE∥BC，并求DE。","answer":"由两边成比例且夹角相等可得△ADE∽△ABC，继而DE∥BC；DE=36/5=7.2。","solution":"由点的位置得AB=3+2=5、AC=6+4=10，所以AD/AB=3/5，AE/AC=6/10=3/5。三边5、10、12满足三角形不等式，题设非退化条件相容。又因AD与AB同向、AE与AC同向，∠DAE=∠BAC。两边成比例且夹角相等，判定△ADE∽△ABC。于是∠ADE=∠ABC，AD与AB在同一直线上，可用同位角相等判定DE∥BC；并有DE/BC=3/5，得DE=12×3/5=36/5=7.2。这里平行是推导结果，不能提前当作相似的已知依据。","level":"条件变式"},{"question":"【原创·分层】凸梯形ABCD按顺序标记顶点，AB∥CD，AB=6、CD=10，两条对角线AC与BD相交于内部点O。已知△AOB面积为18，求△COD、△BOC、△AOD的面积以及梯形总面积。","answer":"△COD面积50，△BOC与△AOD面积各30，梯形总面积128。","solution":"由AB∥CD以及对顶角相等，△AOB∽△COD，对应为A↔C、O↔O、B↔D，所以AO/CO=BO/DO=AB/CD=3/5，且S(AOB)/S(COD)=9/25。故S(COD)=18×25/9=50。△AOB与△COB的底AO、CO都在AC上，来自B的高相同，所以面积比为AO:CO=3:5，得到S(BOC)=18×5/3=30。同理，△AOB与△AOD以BO、DO为底，来自A的高相同，面积比3:5，得S(AOD)=30。O在凸梯形内部，四个三角形不重叠地拼成梯形，总面积18+50+30+30=128。","level":"综合应用"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J38","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"位似与相似应用","prerequisites":["J37","J36"],"goals":["解释并应用位似的定义","解释并应用坐标放缩","解释并应用测高与比例应用"],"concepts":[{"name":"位似的定义","explanation":"位似是一种有共同中心的相似变换，比例系数k必须非零。以O为中心，对P≠O，像点P′与O、P共线且OP′=|k|·OP；k>0时两点在O的同侧，k\u003c0时在异侧，O本身保持不动。用高中向量记号可简写为向量OP′=k·OP，但这里不要求先学向量。对应线段平行或共线，几何相似比为|k|，面积比为k²。若k=0，整个图形塌缩成一点，不属于这里的位似。"},{"name":"坐标放缩","explanation":"以原点为中心，P(x,y)变为(kx,ky)。以C(a,b)为中心，P′=(a+k(x−a),b+k(y−b))，来自先移中心再缩放。只把坐标乘k适用于中心为原点的情形。"},{"name":"测高与比例应用","explanation":"同一时刻、同一平面地面上的物体与影子可用太阳平行光形成相似三角形；测高需保证物体竖直、地面模型合理。比例尺缩小的是长度；地图上面积与实际面积按比例尺平方换算。"}],"methods":["先检查形成相似的物理假设，再列同类量的比例，并统一单位。"],"pitfalls":["平行光测影公式不能忽略斜坡的影响。"],"example":{"question":"【原创】竖直标杆高1.5米，影长2米；同一时刻一棵树影长8米，求树高。","solution":["太阳光近似平行，地面水平且两者竖直，两个直角三角形相似。","树高h满足h/8=1.5/2。","h=6米。"],"answer":"h=6米。"},"practice":[{"question":"【原创】P(2,−3)以原点位似，k=−2，求P′。","answer":"(−4,6)。","solution":"两个坐标都乘−2，点位于中心另一侧。","level":"基础"},{"question":"【原创】图形按长度比例1:100缩小，实际面积30平方米，图上面积多少平方厘米？","answer":"30平方厘米。","solution":"面积缩为1/10000；30平方米=300000平方厘米，除10000得30。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J39","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"圆：弦、弧、圆心角与圆周角","prerequisites":["J16","J18"],"goals":["解释并应用圆与垂径定理","解释并应用弦弧角的联系","解释并应用圆周角与直径"],"concepts":[{"name":"圆与垂径定理","explanation":"平面内到定点距离等于正数r的点构成圆，定点为圆心。垂直于弦的直径平分该弦及其所对两弧；逆向判定时，平分非直径弦的直径垂直该弦。弦长、半径、弦心距组成直角三角形，可用勾股计算。"},{"name":"弦弧角的联系","explanation":"在同圆或等圆中，等圆心角对应等弧、等弦，反向联系也成立。比较必须是在同圆或等圆中，半径不同的两个圆，同角对应弦长不一定相等。劣弧与优弧指的范围不同，作图时要明确。"},{"name":"圆周角与直径","explanation":"同弧所对圆周角等于圆心角的一半，同弧所对圆周角相等。直径所对圆周角为90°；反过来，90°圆周角所对弦是直径。同弦两侧的圆周角一般互补而不是相等，需区分所对的是哪段弧。"}],"methods":["连接圆心和弦端点，作弦心距或补直径，把圆问题转为三角形。"],"pitfalls":["圆周角顶点必须在圆上，圆内任意角不满足同样公式。"],"example":{"question":"【原创】半径5的圆中，一条弦长8，求圆心到弦的距离。","solution":["圆心向弦作垂线，垂足平分弦，半弦4。","由勾股，弦心距d满足d²+4²=5²。","d=3。"],"answer":"d=3。"},"practice":[{"question":"【原创】一段弧的圆心角80°，同弧圆周角？","answer":"40°。","solution":"圆周角为所对圆心角的一半。","level":"基础"},{"question":"【原创】AB是直径，C在圆上且不为端点，AC=6、BC=8，求半径。","answer":"5。","solution":"∠ACB=90°，AB=√(36+64)=10，半径5。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J40","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"直线与圆的位置关系及切线","prerequisites":["J39","J23"],"goals":["解释并应用三种位置关系","解释并应用切线判定与性质","解释并应用切线长与外点"],"concepts":[{"name":"三种位置关系","explanation":"设圆心到直线距离d、半径r>0，d\u003cr相交（两个交点），d=r相切（一个交点），d>r相离（无交点）。直线到圆的判断依赖垂距，不能拿圆心到直线上任意一点的距离直接比较。"},{"name":"切线判定与性质","explanation":"圆的切线垂直于过切点的半径。反过来，经过圆上一点并垂直于该点半径的直线是切线。证明中缺一条件都不够：与半径垂直但不经过它的圆上端点，可能相交或相离。"},{"name":"切线长与外点","explanation":"由同一圆外一点引圆的两条切线，两切线段长相等；圆心与外点的连线平分两切线夹角。可连接两切点半径，用两个直角三角形的HL全等证明；切线段长t满足t²=OP²−r²，要求P在圆外。"}],"methods":["遇切线先连半径作直角，判定时核实切点在圆上。"],"pitfalls":["切线长是外点到切点的线段长度，不是整条无限直线的长度。"],"example":{"question":"【原创】圆半径3，外点P到圆心O距离5，PA为切线段，求PA。","solution":["切点A处OA⊥PA，△OAP为直角三角形。","PA²=OP²−OA²=25−9=16。","PA=4。"],"answer":"PA=4。"},"practice":[{"question":"【原创】圆半径4，圆心到直线距离6，什么位置？","answer":"相离。","solution":"d=6>r=4。","level":"基础"},{"question":"【原创】一条直线垂直于半径OA所在直线就一定是切线吗？","answer":"不一定。","solution":"还须经过圆上的端点A；例如过圆心且垂直OA的直线与圆有两个交点。","level":"进阶"},{"question":"【原创·分层】平面直角坐标系中，圆的圆心为O(0,0)，半径为5，直线l的方程为y=−3。判断直线与圆的位置关系；若相交，求两交点间的弦长。","answer":"直线与圆相交；交点为(−4,−3)、(4,−3)，弦长8。","solution":"圆心到水平直线y=−3的垂直距离为3，小于半径5，故有两个交点。设垂足为H(0,−3)，连接任一交点P与O，则△OHP为直角三角形，HP²=5²−3²=16，HP=4。垂径平分弦，两交点在H两侧各距4，故坐标分别为(−4,−3)、(4,−3)，弦长为8。","level":"基础巩固"},{"question":"【原创·分层】圆心O(0,0)、半径5的圆上有点A(0,5)。直线l写成y=mx+5，其中m为实数。确定l是圆在A点处切线时的m，并判断其余m值对应的直线与圆的位置关系。","answer":"m=0时相切；m≠0时与圆相交于两个不同的点。","solution":"所有这类直线都经过A。半径OA是竖直线段，切线必须在A处与它垂直，因此切线必须为水平直线y=5，即m=0。若m≠0，l经过圆上点A但不是切线，不能与圆相离，所以是割线，有两个不同交点。也可代入圆方程验算：x²+(mx+5)²=25，整理为x[(1+m²)x+10m]=0；当m≠0时，x=0与x=−10m/(1+m²)是两个不同实数。","level":"条件变式"},{"question":"【原创·分层】非退化直角三角形ABC中，∠A=90°，AB=6 cm、AC=8 cm。它的内切圆分别与边AB、AC、BC相切于D、E、F，圆心为O。求AD、BF、CF及内切圆半径。","answer":"AD=2 cm，BF=4 cm，CF=6 cm，内切圆半径2 cm。","solution":"先由勾股定理得BC=√(6²+8²)=10 cm。同一外点引圆的两条切线段相等，所以AD=AE、BD=BF、CE=CF。设AD=AE=x，则BF=6−x，CF=8−x。由BF+CF=BC得14−2x=10，x=2，进而BF=4、CF=6。切线性质给出OD⊥AB、OE⊥AC。由于AB⊥AC，四边形ADOE为矩形，且相邻边OD、OE都是半径，因而为正方形；所以半径r=OD=AE=2 cm。这里最后一步用到了A处直角，普通三角形中AD不一定等于半径。","level":"综合应用"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J41","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"弧长、扇形面积与圆锥展开","prerequisites":["J39","J24"],"goals":["解释并应用圆周与弧长","解释并应用扇形面积","解释并应用圆锥展开"],"concepts":[{"name":"圆周与弧长","explanation":"半径r的圆周长2πr。圆心角n°所对弧长l=nπr/180，其推理是取整圆周的n/360。角度必须使用度数版本；高中换成弧度θ后为l=rθ，不能把60°中的数字60直接当弧度代入。"},{"name":"扇形面积","explanation":"圆面积πr²，同样按圆心角比例得扇形面积S=nπr²/360=(1/2)lr。这里l是弧长、r是半径；扇形边界总长为弧长加两半径，面积和边界长度不能混用。"},{"name":"圆锥展开","explanation":"直圆锥侧面展开为半径等于母线长L的扇形，其弧长等于底圆周长2πr，因此侧面积πrL；加底面积得总面积πrL+πr²。直圆锥母线、底半径、高构成直角三角形，L²=r²+h²。"}],"methods":["先辨扇形半径与圆锥底半径；利用底圆周长等于展开弧长连接模型。"],"pitfalls":["圆锥的高不是展开扇形的半径，母线才是。"],"example":{"question":"【原创】半径6的圆中取60°扇形，求弧长、面积和边界总长。","solution":["弧长60×π×6/180=2π。","面积60×π×36/360=6π。","弧长2π，面积6π，边界总长12+2π。"],"answer":"弧长2π，面积6π，边界总长12+2π。"},"practice":[{"question":"【原创】直圆锥底半径3、母线5，侧面积？","answer":"15π。","solution":"S侧=πrL=15π。","level":"基础"},{"question":"【原创】上一圆锥展开扇形圆心角多少度？","answer":"216°。","solution":"展开半径5，弧长6π；nπ·5/180=6π得n=216。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J42","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"锐角三角函数与解直角三角形","prerequisites":["J37","J23"],"goals":["解释并应用三角比定义","解释并应用特殊值与关系","解释并应用仰角、坡度与应用"],"concepts":[{"name":"三角比定义","explanation":"直角三角形中，对锐角A，sin A=对边/斜边，cos A=邻边/斜边，tan A=对边/邻边。相似三角形保证这些比只由角决定，和图形大小无关。边的对、邻必须相对于选定的锐角，斜边始终是直角对边。"},{"name":"特殊值与关系","explanation":"30°、45°、60°的sin分别为1/2、√2/2、√3/2，cos顺序相反，tan为√3/3、1、√3。由勾股除以斜边平方得到sin²A+cos²A=1，tan A=sin A/cos A；锐角时所有比均正。"},{"name":"仰角、坡度与应用","explanation":"仰角通常从水平线向上量，俯角从水平线向下量。坡度=竖直高度/水平距离=tan坡角，非高度/坡面长度。解实际题先作水平竖直辅助线，必要时加上仪器高度，再按给定精度取近似值。"}],"methods":["画清角的起始水平线，再用已知与待求所在边选择sin、cos或tan。"],"pitfalls":["tan A的分母是邻边而不是斜边。"],"example":{"question":"【原创】楼体竖直，观察者脚下与楼脚在同一水平地面上，观察者距楼脚的水平距离为20米。眼睛距脚下地面1.6米，从眼睛测得楼顶仰角30°，求楼高。忽略测量误差，将观察者视为竖直站立。","solution":["楼顶高于眼睛的高度h满足tan30°=h/20。","h=20√3/3，楼高应加1.6。","楼高1.6+20√3/3米，约13.15米。"],"answer":"楼高1.6+20√3/3米，约13.15米。"},"practice":[{"question":"【原创】直角三角形相对A的对边3、邻边4，求sin A、tan A。","answer":"sin A=3/5，tan A=3/4。","solution":"斜边由勾股为5，再用定义。","level":"基础"},{"question":"【原创】坡角45°、水平距离10米，坡面长度多少？","answer":"10√2米。","solution":"高度10，坡面为斜边√(100+100)=10√2。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J43","stage":"初中","grade":"九年级建议","domain":"统计与概率","title":"随机事件、列举法与频率估计","prerequisites":["J14","J01"],"goals":["解释并应用事件与概率","解释并应用古典概型与列举","解释并应用频率及放回影响"],"concepts":[{"name":"事件与概率","explanation":"随机试验在相同条件下可重复、可能结果明确，而每次具体结果不确定。事件是一组可能结果；必然事件概率1，不可能事件0，任何事件概率在0与1之间。概率很小并不等于不可能，单次发生也不推翻小概率模型。"},{"name":"古典概型与列举","explanation":"若有限个基本结果等可能，P(A)=有利结果数/全部结果数。树状图适合分步，列表适合两步。必须让基本结果等可能：抛两枚硬币的正反组合需区分正反与反正，不能把正正、正反、反反当作三个等可能结果。"},{"name":"频率及放回影响","explanation":"重复试验中的频率=发生次数/试验次数，可在大量试验中估计概率，但频率不会每次都向概率单调靠近。抽取是否放回改变后续样本空间与概率；不放回时第二次的可用总数和颜色数都可能变化。"}],"methods":["先描述实验和等可能的基本结果，再数有利事件；放回条件每一步明确。"],"pitfalls":["连续出现多次正面，不会使下一次公平独立抛硬币的反面概率超过1/2。"],"example":{"question":"【原创】袋中有2红1蓝共3个同质球，不放回抽2个，求同色概率。","solution":["给两个红球编号R₁、R₂以保证列举等可能。","有序结果共3×2=6，同色仅R₁R₂、R₂R₁两种。","概率2/6=1/3。"],"answer":"概率2/6=1/3。"},"practice":[{"question":"【原创】掷公平六面骰一次，点数大于4的概率？","answer":"1/3。","solution":"有利点数5、6共2个，全部6个等可能。","level":"基础"},{"question":"【原创】前题袋子放回抽两次，同色概率多少？","answer":"5/9。","solution":"两红概率(2/3)²=4/9，两蓝(1/3)²=1/9，相加5/9。","level":"进阶"},{"question":"【原创·分层】袋中有6个除编号外完全相同的球，分别编号1、2、3、4、5、6。每次各球被抽中的机会相等，连续抽取两个且不放回。求两球编号之和为7的概率，并明确采用有序还是无序结果计数。","answer":"概率为1/5。","solution":"采用有序结果，把先抽与后抽区分。共有6×5=30个等可能的有序数对。有利结果为(1,6)、(2,5)、(3,4)、(4,3)、(5,2)、(6,1)，共6个，故概率为6/30=1/5。也可用无序数对计数，总数15、有利数3，得到同一概率；不能用有序分子配无序分母。","level":"基础巩固"},{"question":"【原创·分层】抛一枚公平硬币：第一次若为正面H就立即停止；第一次若为反面T，则独立地再抛一次并停止。记录全部抛掷结果时只有H、TH、TT三种记录。它们是否等可能？求最终记录中至少出现一次正面的概率。","answer":"三种记录不等可能：P(H)=1/2，P(TH)=1/4，P(TT)=1/4；至少一次正面的概率为3/4。","solution":"记录H只需要第一次正面，概率为1/2。记录TH需要先反后正，概率为(1/2)×(1/2)=1/4；记录TT同理为1/4。三种记录的总概率是1，但它们所需分步条件不同，不能当作三个等可能基本结果。含正面的记录为H和TH，两种互不同时发生，故总概率1/2+1/4=3/4；也可用1−P(TT)=3/4。","level":"条件变式"},{"question":"【原创·分层】甲盒有2红1蓝共3球，乙盒有1红3蓝共4球；同一盒中的球除颜色外完全相同。先抛公平硬币，正面选甲盒、反面选乙盒，再从选中的盒里等可能抽1球，抽到红球算成功。求原来的成功概率。现在可以在开始试验前只向其中一个盒子加1个红球，硬币和取球规则保持不变，应加到哪个盒子才能使成功概率更大？分别计算两个方案的成功概率。","answer":"原成功概率11/24；加到甲盒后为1/2，加到乙盒后为8/15；应加到乙盒。","solution":"用两层树状图分别追踪“选盒”和“取色”。原来成功有两条互斥路径：选甲后取红，概率(1/2)×(2/3)=1/3；选乙后取红，概率(1/2)×(1/4)=1/8。相加得11/24。若加到甲，甲变为3红1蓝，成功概率为(1/2)×(3/4)+(1/2)×(1/4)=1/2。若加到乙，乙变为2红3蓝，成功概率为(1/2)×(2/3)+(1/2)×(2/5)=1/3+1/5=8/15。因为8/15>1/2，应加到乙。不能把两盒的球合并后直接按总红球比例计算，因为规则是等概率选盒，而不是从两盒全部球中等概率抽球。","level":"综合应用"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J44","stage":"初中","grade":"九年级建议","domain":"图形与几何","title":"投影、三视图与展开图","prerequisites":["J08","J25"],"goals":["解释并应用投影与方向","解释并应用三视图关系","解释并应用展开与折叠"],"concepts":[{"name":"投影与方向","explanation":"光线平行的投影是平行投影，来自一点的光线形成中心投影。相同物体从不同方向看投影可不同；判图时先找观察方向与遮挡，不能默认空间中等长线段投影仍等长。正投影的光线与投影面垂直。"},{"name":"三视图关系","explanation":"主视图、左视图、俯视图分别反映高与长、高与宽、长与宽。对应原则是主俯长对正、主左高平齐、左俯宽相等。遮挡线按题目制图约定表示；一张视图通常不足以唯一确定立体。"},{"name":"展开与折叠","explanation":"展开图保持面的真实形状及相邻边关系，折叠时判断哪些边重合、哪些面相对。长方体相对面不共边；表面最短路可在特定展开方式中变直线，但须确认路径经过的面和边界是允许的。"}],"methods":["先约定长宽高的方向，分别读取三个视图，再核对共享尺寸。"],"pitfalls":["二维画面中线条交叉不一定代表空间线段真正相交。"],"example":{"question":"【原创】长方体长4、宽3、高2，主视图与俯视图分别是什么尺寸？表面积多少？","solution":["按长在左右、宽在前后、高在竖直的约定，主视图4×2，俯视图4×3。","三对面的面积分别8、12、6。","主视图4×2，俯视图4×3；表面积2(8+12+6)=52。"],"answer":"主视图4×2，俯视图4×3；表面积2(8+12+6)=52。"},"practice":[{"question":"【原创】正方体的三个标准正视图是什么图形？","answer":"边长相同的正方形。","solution":"三个互相垂直方向各看到一张正方形面。","level":"基础"},{"question":"【原创】主视图和俯视图相同，是否保证两个物体完全相同？","answer":"不保证。","solution":"仍可能有不同的隐藏空腔或遮挡部分，有限投影信息不总能唯一重建立体。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J45","stage":"初中","grade":"九年级建议","domain":"综合与实践","title":"初中综合实践与完整解题表达","prerequisites":["J34","J38","J43"],"goals":["解释并应用数学建模的闭环","解释并应用数学思想的连接","解释并应用自学与错因管理"],"concepts":[{"name":"数学建模的闭环","explanation":"从实际问题选变量、提出必要假设、建立式子或图形，再求解、检验和解释。只解出一个数字还不够，要看它是否满足单位、取值范围、精度和现实限制。模型把复杂情境简化，因此结论应附上其适用假设。"},{"name":"数学思想的连接","explanation":"数形结合把数量关系放到图象观察，再用代数证明；分类讨论用于绝对值、参数退化、动点跨界；转化思想把陌生问题变为方程、全等、相似或函数。分类要互不遗漏，证明不能只靠画出的一个特殊图。"},{"name":"自学与错因管理","explanation":"完成题目后区分概念条件错误、计算错误、模型错误、遗漏情况与表达错误。复习应重做不看答案的变式，再讲出关键理由。一次看懂解析不足以判定掌握；知识库中的进度记录只是自我评估。"}],"methods":["按已知—目标—关系—推理—检验—结论六步书写。"],"pitfalls":["未指定地区前，不把某地区真题样本的分值比例当作全国规则。"],"example":{"question":"【原创】用长20米的围栏围一个长方形花圃，一边靠墙且不用围，怎样围使面积最大？","solution":["设垂直墙边长x，平行墙的围栏长20−2x，要求0\u003cx\u003c10。","S=x(20−2x)=−2(x−5)²+50，最大在x=5。","两条垂直墙边各5米，平行墙边10米，最大面积50平方米；假设墙长至少10米且角为直角。"],"answer":"两条垂直墙边各5米，平行墙边10米，最大面积50平方米；假设墙长至少10米且角为直角。"},"practice":[{"question":"【原创】一辆车匀速60 km/h，行驶t小时，路程表达式及单位？","answer":"s=60t，t≥0，s单位km。","solution":"匀速假设下路程=速度×时间，时间用小时与速度单位一致。","level":"基础"},{"question":"【原创】只试x=1、2、3发现不等式成立，能证明所有实数x成立吗？","answer":"不能。","solution":"有限实例仅支持猜想，需恒等变形、分类或其他适用的一般证明；反例可以推翻全称命题。","level":"进阶"}],"mastery":["能画出符合条件的图并注明已知、待求","闭卷完成练习并说明定理条件"],"sources":[{"title":"人教版九年级教材（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H01","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"预备知识","title":"集合、区间与交并补","prerequisites":["J13"],"goals":["理解并应用元素与集合","理解并应用交并补运算","理解并应用区间与参数"],"concepts":[{"name":"元素与集合","explanation":"集合的元素须确定、互不重复，排列次序不改变集合。a∈A讨论元素属于集合，A⊆B讨论集合包含关系；空集∅没有元素，而{0}有一个元素0。常用N={0,1,2,…}，正整数可写N*，使用前明确约定。"},{"name":"交并补运算","explanation":"A∩B同时属于两集合，A∪B至少属于一个；补集CᵤA由全集U中不属于A的元素组成，没有指定全集就不能唯一确定补集。代数不等式用交表示同时成立，用并表示至少一个条件成立。"},{"name":"区间与参数","explanation":"区间端点有等号用方括号，没有等号用圆括号，无穷端总用圆括号。比较含参数集合先检查是否可能为空集；空集是任意集合子集，忽略它会漏解参数范围。集合的元素也可为点、向量或函数，不限实数。"}],"methods":["先确定全集和元素类型，画数轴检查端点，再做逻辑运算。"],"pitfalls":["{1}∈{1,2}不成立；{1}⊆{1,2}成立。"],"example":{"question":"【原创】A={x∈R|−1\u003cx≤3}，B={x∈R|x≥2}，求交集与并集。","solution":["A写为(−1,3]，B写为[2,+∞)。","同时满足得到[2,3]；至少满足一个得到(−1,+∞)。","A∩B=[2,3]，A∪B=(−1,+∞)。"],"answer":"A∩B=[2,3]，A∪B=(−1,+∞)。"},"practice":[{"question":"【原创】{1,2}有几个子集？","answer":"4个。","solution":"∅、{1}、{2}、{1,2}。","level":"基础"},{"question":"【原创】A=(a,1)，A⊆∅时a范围？","answer":"a≥1。","solution":"只有A为空才可能为∅的子集，a≥1时不存在a\u003cx\u003c1。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H02","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"预备知识","title":"命题、量词与充分必要条件","prerequisites":["H01"],"goals":["理解并应用命题与逻辑方向","理解并应用全称与存在及否定","理解并应用证明与反例"],"concepts":[{"name":"命题与逻辑方向","explanation":"能判断真假的陈述句为命题。p⇒q表示只要p成立就能推出q，称p为q的充分条件、q为p的必要条件。若双向均成立则充要；判断时画出条件的集合包含关系，或尝试为某个方向找反例。"},{"name":"全称与存在及否定","explanation":"∀表示每一个，∃表示至少一个。全称命题的否定换成存在并否定性质；存在命题的否定换成全称并否定性质。例如否定“所有x都有f(x)>0”是“存在x使f(x)≤0”，范围必须与原命题相同。"},{"name":"证明与反例","explanation":"证明充分性是从条件到结论，证明必要性反向进行。一个反例能推翻全称命题，但若要证明存在，只需给出一个合格例子。逆命题并不自动成立；使用等价符号⇔要保证每一步双向可逆。"}],"methods":["对每个方向分别推理或给出反例，保留变量范围与量词。"],"pitfalls":["把‘不大于’误写成‘小于’会丢掉等号。"],"example":{"question":"【原创】判断x>2是x²>4的什么条件（x∈R）？","solution":["x>2一定推出x²>4，所以充分。","x=−3满足x²>4却不满足x>2，所以不是必要。","充分不必要条件。"],"answer":"充分不必要条件。"},"practice":[{"question":"【原创】否定“存在实数x，使x²\u003c0”。","answer":"对所有实数x，都有x²≥0。","solution":"将∃换∀，将\u003c0否定为≥0。","level":"基础"},{"question":"【原创】p:ab=0，q:a=0，p是q的充分条件吗？","answer":"不是；q是p的充分条件。","solution":"取a=1,b=0，p真q假；但a=0总推出ab=0。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H03","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"预备知识","title":"二次不等式与分式不等式","prerequisites":["J33","H01"],"goals":["理解并应用符号与根","理解并应用分式的符号","理解并应用参数与边界"],"concepts":[{"name":"符号与根","explanation":"对于a(x−r₁)(x−r₂)，r₁\u003cr₂，a>0时两根外正、两根间负；a\u003c0符号反转。若无实根，二次式符号与a一致。重根时表达式在根处为0，其余与a同号，因此不能不看判别式就套两根法。"},{"name":"分式的符号","explanation":"A(x)/B(x)>0等价于A与B同号，且B≠0；可使用符号表，把零点和无定义点排序，逐区间判断。只有确认乘数符号，才可以在不等式两边直接乘它。弱不等号可含分子零点，但永远不能含分母零点。"},{"name":"参数与边界","explanation":"含参数时需讨论最高次系数退化、根的存在性、根与端点的位置。关于所有x成立的条件与存在某个x成立不同；前者可转最小值非负，后者可能只需某处取值合适。"}],"methods":["整理为一边0，记录分母限制与关键点，再用符号表或图象。"],"pitfalls":["不能直接把含x且正负不明的分母乘到另一边而保持不等号。"],"example":{"question":"【原创】解(x−1)/(x+2)≥0。","solution":["关键点−2（分母0）、1（分子0），分三段检验符号。","(−∞,−2)正，(−2,1)负，(1,+∞)正；1可取，−2不可取。","解集(−∞,−2)∪[1,+∞)。"],"answer":"解集(−∞,−2)∪[1,+∞)。"},"practice":[{"question":"【原创】解x²−5x+6\u003c0。","answer":"2\u003cx\u003c3。","solution":"(x−2)(x−3)\u003c0，开口向上，两根之间负。","level":"基础"},{"question":"【原创】x²+2x+c≥0对所有实数x成立，c范围？","answer":"c≥1。","solution":"配方(x+1)²+c−1，最小值c−1须≥0。","level":"进阶"},{"question":"【原创·分层】解不等式 (x+1)(x−2)/(x−3)≤0，并说明三个关键点能否取到。","answer":"(−∞,−1]∪[2,3)。−1、2可取，3不可取。","solution":"先排除分母为零的x=3。分子零点是−1和2，三个点把数轴分成四段。在(−∞,−1)、(−1,2)、(2,3)、(3,+∞)上，分子与分母符号分别为(+,-)、(-,-)、(+,-)、(+,+)，分式符号依次为负、正、负、正。因此选第一和第三段。由于原式允许等号，分子零点−1、2纳入；分母零点3无论是否有等号均排除。","level":"基础巩固"},{"question":"【原创·分层】求所有实数m，使 mx²−2x+1≥0 对每个实数x都成立。需检查m=0的情形。","answer":"m≥1。","solution":"若m\u003c0，二次项开口向下，当|x|足够大时表达式为负，不能恒成立。若m=0，变为−2x+1≥0，取x=1便失败。若m>0，配方为m(x−1/m)²+1−1/m，最小值在x=1/m取得，为1−1/m。恒非负等价于1−1/m≥0，因为m>0可同乘m，得到m≥1。合并各类即可，m=1时表达式为(x−1)²，边界可取。","level":"条件变式"},{"question":"【原创·分层】求实数a的范围，使 x²−2ax+a+2≥0 对所有x∈[0,2]成立。说明为什么不能直接要求判别式不大于零。","answer":"a∈[−2,2]。判别式条件针对全部实数，不可直接替代限定区间条件。","solution":"设f(x)=(x−a)²+2+a−a²，抛物线顶点横坐标为a。①a≤0时，区间[0,2]位于顶点右侧，最小值f(0)=a+2，故−2≤a≤0。②0\u003ca\u003c2时，顶点在区间内，最小值2+a−a²=(2−a)(a+1)>0，全部满足。③a≥2时，区间位于顶点左侧，最小值f(2)=6−3a，故只能a=2。合并为[−2,2]。例如a=−2时全实数判别式大于零，但在[0,2]上f(x)=x²+4x≥0，说明不应添加全实数的限制。","level":"综合应用"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H04","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"预备知识","title":"基本不等式与等号条件","prerequisites":["H03"],"goals":["理解并应用平方非负推出均值不等式","理解并应用定和求积与定积求和","理解并应用配凑与实际优化"],"concepts":[{"name":"平方非负推出均值不等式","explanation":"非负a、b满足(√a−√b)²≥0，因此a+b≥2√(ab)，等号当且仅当a=b。常写正数x、y的算术平均≥几何平均：(x+y)/2≥√(xy)。正性是保证平方根和取等分析有效的前提。"},{"name":"定和求积与定积求和","explanation":"正数和S固定时，积xy≤S²/4，x=y=S/2取等；正数积P固定时，和x+y≥2√P，x=y=√P取等。条件变化后等号可能无法达到，所以算出的界还必须检查在允许范围中是否可取。"},{"name":"配凑与实际优化","explanation":"像x+c/x在x>0、c>0时，两个正项积为c，可直接得最小值2√c。复杂式子需先辨哪一部分的和或积固定；不能看到相加就无条件套均值不等式。可用配方或导数交叉验证。"}],"methods":["一正、二定、三取等逐项检查，再把等号解代入原范围。"],"pitfalls":["不等式给出下界不一定给出可达到的最小值。"],"example":{"question":"【原创】x>0时求x+9/x的最小值。","solution":["两项正，积为9，因此x+9/x≥2√9=6。","等号要求x=9/x，即x²=9，又x>0。","最小值6，在x=3取得。"],"answer":"最小值6，在x=3取得。"},"practice":[{"question":"【原创】a,b>0且a+b=10，ab最大值？","answer":"25。","solution":"ab≤((a+b)/2)²=25，a=b=5取等。","level":"基础"},{"question":"【原创】x≥4时，x+9/x能否取到6？","answer":"不能；最小值25/4。","solution":"取等x=3不允许。与x=4的值比较：x+9/x−25/4=(x−4)(4x−9)/(4x)≥0。","level":"进阶"},{"question":"【原创·分层】x>0时，求3x+12/x的最小值，并写出取等条件。","answer":"最小值12，在x=2时取得。","solution":"两项3x与12/x都为正，乘积恒为36，因此3x+12/x≥2√36=12。等号要求3x=12/x，即3x²=12。结合x>0得x=2，这个值在定义域内。代回原式得6+6=12，所以12确实能达到，是最小值而不只是一个下界。","level":"基础巩固"},{"question":"【原创·分层】a,b>0，a+b=6，并且a≥4。求ab的最大值。判断基本不等式给出的9是否能够取得。","answer":"最大值8，在a=4、b=2时取得；9不能取得。","solution":"基本不等式给ab≤9，但等号须a=b=3，不满足a≥4，所以不能把9写成最大值。由b=6−a及b>0得4≤a\u003c6。于是ab=a(6−a)=9−(a−3)²。由于a−3≥1，平方至少为1，故ab≤8。a=4、b=2满足全部原条件并达到8，因此最大值为8。","level":"条件变式"},{"question":"【原创·分层】用围栏围成面积48平方米的矩形菜地，其中一边沿一条足够长的直河岸，不需围栏。设垂直河岸的边长为x米，受地形限制0\u003cx≤4。求所需围栏的最短长度，并说明为何直接取基本不等式的等号会失败。","answer":"最短20米，x=4米、沿河岸边长12米。无约束取等点x=2√6>4，不可采用。","solution":"设沿河岸边长y>0，由xy=48得y=48/x。围栏覆盖两条宽和一条长，总长L=2x+48/x。基本不等式给L≥2√96=8√6，等号要求2x=48/x，即x=2√6，但这超出地形限制。为了在允许区间找精确最小值，比较L与x=4时的20：L−20=(2x²−20x+48)/x=2(x−4)(x−6)/x。0\u003cx≤4时，分母为正、两个因子均非正，所以差≥0；在允许区间等号仅x=4成立。此时y=12，故最短为20米。","level":"综合应用"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"selfStudy":{"moduleId":"H04","entryCheck":{"question":"设t为实数，(t−3)²能否为负？它的最小值是多少，何时取得？若只允许t>3，0还能取得吗？","answer":"平方不能为负；在R上最小值为0，t=3时取得。若t>3，则0不能取得。","explanation":"本节最重要的前置知识是平方非负，以及方程t−3=0给出的等号条件。先比较允许范围与取等点，才知道一个界能不能成为真正的最小值。会算平方却忽略定义域，是后续最值题最常见的障碍。"},"intuition":"对两个乘积固定的正数，一项变小会迫使另一项变大；两项相等时看起来最均衡。例如乘积为9，(1,9)、(2,4.5)、(3,3)的和依次为10、6.5、6。这些数值只帮助提出猜想，并不能证明所有正数情形，更不能代替检查题目允许哪些数。","reasoning":[{"step":"为什么要先要求非负？","detail":"要从(√a−√b)²≥0推导，需要√a、√b是实数，因此a,b≥0。展开平方得a+b−2√(ab)≥0，移项才得到a+b≥2√(ab)。若随意取负数，推导中的实平方根可能无定义，结论也未必成立。对于原例题x+9/x，条件x>0恰好保证两项都正且分母非零。"},{"step":"为什么平方等于零给出唯一取等条件？","detail":"实数的平方等于零，当且仅当这个实数本身等于零。因此(√a−√b)²=0等价于√a=√b，再由两边非负得到a=b。这里得到了两个方向：a=b一定能使等号成立；等号成立也一定要求a=b。取等条件不是额外猜测，而是从证明原样追踪出来的。"},{"step":"为什么乘积固定才能得到一个固定下界？","detail":"若ab=P且P是确定的正数，不等式变为a+b≥2√P，右侧不随选择变化，所以它是所有允许和的共同下界。如果ab仍依赖x，右侧也在变，虽然不等式正确，却不能直接把它的某个值当作整个表达式的最小值。原例题中x·(9/x)=9，正好消去变量。"},{"step":"证明最小值为什么需要两件事？","detail":"说m是函数在D上的最小值，必须同时证明：对每个x∈D都有f(x)≥m；至少存在一个x₀∈D使f(x₀)=m。第一句只说明没有值低于m，第二句才说明这个值实际出现。若只有第一句成立，m可能只是很松的下界，也可能是可以无限接近但取不到的边界。"},{"step":"为什么求完取等点还要代回原范围？","detail":"不等式证明常在一个大范围内成立，但题目可能再限制x≥4、x为正整数或x位于开区间。方程a=b求出的候选点可能被这些条件排除。应先列出候选点，再逐项检查正性、分母、区间与实际意义；只有全部通过，才能把下界升级为最小值。"},{"step":"若等号点不允许，下一步怎样做？","detail":"可以比较表达式与某个允许端点的值，把差因式分解判断正负，也可以配方或在已学习导数后研究单调性。若区间开放，还要判断是否根本没有最小值。直接说基本不等式失效也不准确：不等式往往仍有效，只是它给出的下界未必在新范围达到。"}],"workedWalkthrough":[{"step":"读懂原例题的任务和范围","detail":"原卡完整例题是：x>0时，求x+9/x的最小值。要找的是所有正实数输入中最小的输出，还要找达到这个输出的x。这里没有整数限制，也没有额外的区间端点限制。"},{"step":"选出基本不等式中的两个量","detail":"令a=x、b=9/x。由x>0，得到a>0、b>0；同时ab=x·9/x=9。此处明确验证了正性和乘积固定，才可以把a+b≥2√(ab)变成x+9/x≥2√9=6。"},{"step":"从证明中追踪等号","detail":"等号要求a=b，所以x=9/x。因为x>0可同乘x，得到x²=9，代数候选为x=3或x=−3。原范围排除−3，只剩x=3。不要在写出下界6后直接结束，取等检查仍未完成。"},{"step":"确认候选点真实可取","detail":"x=3满足x>0，分母也不为0。代入原式得3+9/3=6，确实与共同下界相等。现在既证明所有输出≥6，又展示合法输入3能得到6，因此最小值结论完整。"},{"step":"用另一条恒等式独立核对","detail":"直接计算x+9/x−6=(x²−6x+9)/x=(x−3)²/x。x>0使分母为正，分子平方非负，所以差≥0；差为0当且仅当x=3。这条分解与基本不等式给出完全相同的数值和取等条件，也解释了答案为何可靠。"},{"step":"形成完整答句与迁移规则","detail":"完整答案为：最小值6，当且仅当x=3时取得。迁移到x+c/x时，先检查x>0、c>0，再得下界2√c及候选x=√c；如果题目另限范围，仍须重新检查该点能否进入，不能照搬最小值结论。"}],"wrongApproach":{"claim":"既然x+9/x≥6，那么把条件改成x>3后，最小值仍是6。","whyWrong":"证明≥6只给出共同下界。等号要求x=3，但新范围x>3排除了这个点，所以6不是该范围内任何一次输出。更进一步，该范围也不存在一个略大于6的最小输出：对任意x>3，取y=(x+3)/2，便有3\u003cy\u003cx，而且f(x)−f(y)=(x−y)(1−9/(xy))>0，因此总能找到更小的合法输出。","correction":"在x>3时，函数没有最小值，6是能任意接近但不能取得的下界。可写x=3+ε，其中ε>0，此时f(x)−6=ε²/(3+ε)，令ε足够小即可使差任意小。原题x>0包含3，所以原题才有最小值6。"},"exitCheck":{"question":"不计算导数，判断x∈[1,2]时x+9/x的最小值是不是6；若不是，求正确最小值。","answer":"不是6；最小值13/2，在x=2时取得。","explanation":"等号点3不在[1,2]。比较与x=2的值：x+9/x−13/2=(2x²−13x+18)/(2x)=(x−2)(2x−9)/(2x)。在[1,2]上分母正，两因子均非正，所以差≥0，且仅x=2取等。这样同时证明了下界与可达性。"},"remediation":[{"difficulty":"不会由平方非负推导基本不等式","moduleId":"H03","action":"先练习展开(√a−√b)²并移项，逐步标明a,b≥0；再用a=1,b=9核验左右两边。"},{"difficulty":"把下界和最小值混为一谈","moduleId":"H04","action":"为每个最值结论固定写两行：所有允许值不低于m；给出一个允许输入使输出等于m。缺少第二行时暂停宣布最小值。"},{"difficulty":"求出取等点却忘记原题限制","moduleId":"H01","action":"把取等点组成的集合与定义域求交。对x>0、x>3、1≤x≤2三个范围各做一次，体会同一不等式在不同范围有不同最值结论。"}],"auditNotes":[{"severity":"澄清","finding":"原卡公式和例题答案正确，但一正、二定、三取等的口令可能让初学者知道步骤却不理解为何必须检查。","resolution":"补全平方非负的推导，并把最小值明确拆为共同下界与存在取等输入两个命题。"},{"severity":"澄清","finding":"原例题只在x>0下演示可取等情形，尚不足以检验学习者是否真正理解范围变化。","resolution":"以错误方法剖析开区间x>3，再用退出题[1,2]要求重新找允许最小值，完整展开差值因式分解。"}]}},{"id":"H05","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"函数","title":"高中函数：定义域、值域与基本性质","prerequisites":["J26","H01"],"goals":["理解并应用定义域、对应与值域","理解并应用单调性与奇偶性","理解并应用值域与分段函数"],"concepts":[{"name":"定义域、对应与值域","explanation":"函数由定义域及对应规则确定，值域是实际输出的集合。相同解析式若定义域不同，就可能是不同函数。求复合f(g(x))的定义域必须同时满足g有定义且g(x)落在f的定义域中；外层限制作用在g(x)而非直接作用在x。"},{"name":"单调性与奇偶性","explanation":"单调递增要求区间内任意x₁\u003cx₂有f(x₁)\u003cf(x₂)，递减反向。偶函数f(−x)=f(x)，奇函数f(−x)=−f(x)，首先定义域需关于原点对称。单调性是区间性质，奇偶性关系的是整个定义域。"},{"name":"值域与分段函数","explanation":"求值域可用图象、配方、单调性或换元，但换元后范围必须跟随。分段函数按输入所属区间选公式，端点归属不能重复或遗漏；复合求值有时需要先算内层输出，再重新判断外层分段。"}],"methods":["任何函数题先写范围，后谈性质；变形前后核查是否改变允许输入。"],"pitfalls":["f(x)=x²在[0,1]上不能直接称偶函数，定义域不对称。"],"example":{"question":"【原创】f(x)=√(x−1)，g(x)=3−x，求f(g(x))及定义域。","solution":["f(g(x))=√((3−x)−1)=√(2−x)。","要求g(x)≥1，即x≤2；g自身对所有实数定义。","f(g(x))=√(2−x)，定义域(−∞,2]。"],"answer":"f(g(x))=√(2−x)，定义域(−∞,2]。"},"practice":[{"question":"【原创】f(x)=x³+x的奇偶性？","answer":"奇函数。","solution":"定义域R对称，f(−x)=−x³−x=−f(x)。","level":"基础"},{"question":"【原创】y=(x−2)²，0≤x≤1，值域？","answer":"[1,4]。","solution":"区间在对称轴左侧，随x增大递减，端点输出4和1。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H06","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"函数","title":"指数、指数函数与增长模型","prerequisites":["J19","H05"],"goals":["理解并应用有理指数到实数指数","理解并应用指数函数的性质","理解并应用增长与衰减"],"concepts":[{"name":"有理指数到实数指数","explanation":"a>0时定义a^(m/n)=n次根号(aᵐ)，与整数指数法则保持一致，再扩展到实数指数。正底数保证这种扩展无歧义。负数底数可以有某些有理指数值，但不能直接把正底的全套实指数性质套用。"},{"name":"指数函数的性质","explanation":"y=aˣ要求a>0且a≠1，定义域R、值域(0,+∞)，过(0,1)。a>1递增，0\u003ca\u003c1递减。底数和指数都变时不能只看一项比较，应选中间值或取对数转化。"},{"name":"增长与衰减","explanation":"每周期乘相同因子a形成N(t)=N₀aᵗ（t的单位与周期一致），半衰期T对应N(t)=N₀·2^(−t/T)。离散周期模型直接适用整数t，连续延拓需要假设相同规律在非整数时间成立。"}],"methods":["先核对底数条件，统一底数或利用单调性，并将时间单位写进指数。"],"pitfalls":["指数不等式在底数小于1时化比较指数，需要反转方向。"],"example":{"question":"【原创】某数量每两小时翻倍，初始80，写模型并求6小时后数值。","solution":["两小时为一周期，t小时有t/2个周期，N(t)=80·2^(t/2)。","t=6时3个周期。","N(6)=80×8=640。"],"answer":"N(6)=80×8=640。"},"practice":[{"question":"【原创】解2^(x+1)=16。","answer":"x=3。","solution":"16=2⁴，由同底单调一一对应，x+1=4。","level":"基础"},{"question":"【原创】比较(1/3)^−2与(1/3)^−1。","answer":"前者9>后者3。","solution":"底数0\u003ca\u003c1时函数递减，−2\u003c−1所以函数值前者更大。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H07","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"函数","title":"对数、运算法则与对数函数","prerequisites":["H06"],"goals":["理解并应用对数是指数的逆问题","理解并应用运算及换底","理解并应用图象与方程"],"concepts":[{"name":"对数是指数的逆问题","explanation":"a>0、a≠1、N>0时，aˣ=N的唯一解记logₐN。于是a^(logₐN)=N、logₐ(aˣ)=x。底为10常记lg，底为e记ln；真数必须正，logₐ0与实数范围logₐ(负数)无定义。"},{"name":"运算及换底","explanation":"在M,N>0时，logₐ(MN)=logₐM+logₐN，商转为差；M>0时logₐ(Mᵏ)=klogₐM。换底logₐN=ln N/ln a。一般没有log(M+N)=log M+log N；涉及x²时可用log(x²)=2log|x|（x≠0）。"},{"name":"图象与方程","explanation":"y=logₐx定义域(0,+∞)、值域R、过(1,0)，a>1增、0\u003ca\u003c1减。解方程先写所有真数>0条件，使用法则合并后求候选值并筛选，不能让变形把无定义输入纳入。"}],"methods":["真数范围写在第一步；等式用乘除法则，不等式再检查底数的单调方向。"],"pitfalls":["logₐ(x²)=2logₐx只在x>0成立；x\u003c0右式无意义。"],"example":{"question":"【原创】解log₂(x−1)+log₂(x+1)=3。","solution":["真数条件x>1。","合并得log₂(x²−1)=3，故x²−1=8，x=±3。","根据x>1，唯一解x=3。"],"answer":"根据x>1，唯一解x=3。"},"practice":[{"question":"【原创】求log₃81−log₃3。","answer":"3。","solution":"4−1=3，也可合并log₃27。","level":"基础"},{"question":"【原创】解log_(1/2)x>2。","answer":"0\u003cx\u003c1/4。","solution":"底数小于1，递减，x\u003c(1/2)²，同时x>0。","level":"进阶"},{"question":"【原创·分层】求函数 f(x)=log₂(x²−5x+6) 的定义域，并判断x=2、x=3是否可以代入。","answer":"定义域(−∞,2)∪(3,+∞)；2、3均不可代入。","solution":"底数2已经满足正且不等于1。实对数的真数必须严格大于零，故(x−2)(x−3)>0。开口向上的二次式在两根外为正，所以x\u003c2或x>3。两个根使真数等于0，而log₂0无定义，因此即使多项式本身在2和3有值，对数函数也不能在这两点取值。","level":"基础巩固"},{"question":"【原创·分层】已知a>0且a≠1，解关于x的不等式 logₐ(2x−1)>logₐ(5−x)，结果按a的范围分类。","answer":"a>1时x∈(2,5)；0\u003ca\u003c1时x∈(1/2,2)。","solution":"两个对数同时有意义要求2x−1>0且5−x>0，先得到1/2\u003cx\u003c5。若a>1，对数递增，不等式等价于2x−1>5−x，即x>2，与定义域相交为(2,5)。若0\u003ca\u003c1，对数递减，比较真数时反向，得到2x−1\u003c5−x，即x\u003c2，与定义域相交为(1/2,2)。x=2使两侧相等，不属于原严格不等式。","level":"条件变式"},{"question":"【原创·分层】设f(x)=log₂x+log₂(8−x)。求f的最大值及取到时的x，再求满足f(x)≥3的全部x。","answer":"最大值4，在x=4取得；f(x)≥3的解为[4−2√2,4+2√2]。","solution":"定义域要求0\u003cx\u003c8。在这个范围可合并为f(x)=log₂[x(8−x)]，而x(8−x)=16−(x−4)²≤16，等号x=4合法。因为log₂递增，f最大值为log₂16=4。再解f≥3：在定义域内等价于x(8−x)≥8，即(x−4)²≤8，所以4−2√2≤x≤4+2√2。这两个端点均在(0,8)，无需进一步删点；代入使真数乘积为8、函数值为3。","level":"综合应用"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H08","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"函数","title":"幂函数、图象变换与复合","prerequisites":["H05","H07"],"goals":["理解并应用幂函数及定义域","理解并应用平移、伸缩与翻折","理解并应用复合单调与逆关系"],"concepts":[{"name":"幂函数及定义域","explanation":"幂函数形如y=xᵅ，指数α固定。先研究1、2、3、1/2、−1等基本模型，定义域取决于指数；√x只允许非负，1/x排除0。一般实指数幂常先限定x>0，高阶讨论需另声明拓展。"},{"name":"平移、伸缩与翻折","explanation":"y=f(x−h)+k将图象右移h、上移k；y=f(ax)（a≠0）的横坐标缩为原来的1/a，a\u003c0还含左右翻转。y=|f(x)|把x轴下方部分翻到上方，y=f(|x|)用右半图复制到左侧。"},{"name":"复合单调与逆关系","explanation":"若内层单调且其值域落在外层的某个单调区间，复合函数可依两次增减判断；同向增、反向减只是相应条件下的口诀。严格单调函数在其值域上有反函数，其图象关于y=x对称，反函数存在要求一一对应。"}],"methods":["在变换中追踪一个点的新坐标，复合单调先检查内层值域落在哪里。"],"pitfalls":["不能在无区间限制下直接宣称‘复合两次减一定增’。"],"example":{"question":"【原创】由y=x²得到y=2(x−3)²−1，描述变换并求顶点。","solution":["先把基本图象右移3，得(x−3)²。","纵向扩大2倍，再下移1，得到所求式。","顶点(3,−1)，开口向上。"],"answer":"顶点(3,−1)，开口向上。"},"practice":[{"question":"【原创】y=x⁻¹的定义域和值域？","answer":"都为R去掉0。","solution":"分母不得0，函数值也永远不为0，任意非零y有x=1/y。","level":"基础"},{"question":"【原创】f(x)=x²在R上有反函数吗？限制到[0,+∞)呢？","answer":"R上无；限制后反函数√x。","solution":"R上2与−2输出同为4，非一一对应；非负半轴严格递增且值域非负。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H09","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"函数","title":"零点、二分法与函数模型","prerequisites":["H03","H05"],"goals":["理解并应用零点与连续性","理解并应用二分法","理解并应用模型的选择"],"concepts":[{"name":"零点与连续性","explanation":"f的零点是满足f(x)=0的自变量数值，不是平面点。若f在[a,b]连续且f(a)f(b)\u003c0，则(a,b)至少一个零点；连续性不可缺，异号只保证存在不保证唯一。严格单调加异号才可保证区间唯一零点。"},{"name":"二分法","explanation":"在连续异号区间求中点m，若f(m)=0结束；否则保留异号的半区间。n次二分后区间宽度变成原宽度/2ⁿ，若用中点估计，绝对误差最多剩余宽度的一半。算法不适合直接寻找不变号的偶重零点。"},{"name":"模型的选择","explanation":"线性模型描述固定增量，指数模型描述固定倍增，幂模型描述尺度比例，分段模型描述机制变化。应用时据变量关系和数据选择，并检验残差及范围；拟合得好不表示可无界外推。"}],"methods":["先证明连续与异号，若要唯一性再证明单调；数值结果附上误差区间。"],"pitfalls":["零点是x值；(x,0)是对应的图象交点。"],"example":{"question":"【原创】用连续性和单调性证明x³+x−1=0在(0,1)有且仅有一个实根，并二分一次。","solution":["f(0)=−1、f(1)=1且多项式连续，因此区间有根。","x³与x都严格递增，和仍严格递增，所以在R上至多一个根。","f(0.5)=−0.375\u003c0，新区间为(0.5,1)，唯一根位于其中。"],"answer":"f(0.5)=−0.375\u003c0，新区间为(0.5,1)，唯一根位于其中。"},"practice":[{"question":"【原创】f(x)=1/x在−1、1函数值异号，能据此说中间有零点吗？","answer":"不能。","solution":"f在0处无定义，不满足闭区间连续，也确实无零点。","level":"基础"},{"question":"【原创】初始区间长1，二分10次后的长度？","answer":"1/1024。","solution":"每次减半，长度1/2¹⁰。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H10","stage":"高中","grade":"必修起步（建议高一）","courseType":"必修","domain":"函数","title":"任意角、弧度制与单位圆","prerequisites":["J42","H05"],"goals":["理解并应用任意角与弧度","理解并应用单位圆定义","理解并应用同角关系与象限"],"concepts":[{"name":"任意角与弧度","explanation":"按旋转方向，逆时针通常为正、顺时针为负，可超过一周。与角θ终边相同的角为θ+2kπ（k∈Z）。弧度θ=有向弧长/r，180°=π弧度；在弧度制下弧长r|θ|，扇形面积(1/2)r²|θ|（取对应非负扇形角大小）。"},{"name":"单位圆定义","explanation":"单位圆上终边点P(x,y)定义cosθ=x、sinθ=y，cosθ≠0时tanθ=y/x。它把锐角直角三角形的比推广至任意角；sin、cos总在[−1,1]，tan在π/2+kπ无定义。"},{"name":"同角关系与象限","explanation":"单位圆方程给sin²θ+cos²θ=1；tanθ=sinθ/cosθ需cosθ≠0。知道一个函数值求其他值常产生正负分支，必须用象限、角范围筛选，而不能开平方后默认正号。"}],"methods":["先统一角度单位，再依单位圆判断符号和定义域。"],"pitfalls":["sin²θ表示(sinθ)²，不是sin(θ²)。"],"example":{"question":"【原创】θ在第二象限且sinθ=3/5，求cosθ、tanθ。","solution":["cos²θ=1−9/25=16/25。","第二象限横坐标负，所以cosθ=−4/5。","tanθ=(3/5)/(−4/5)=−3/4。"],"answer":"tanθ=(3/5)/(−4/5)=−3/4。"},"practice":[{"question":"【原创】把150°化为弧度。","answer":"5π/6。","solution":"150×π/180=5π/6。","level":"基础"},{"question":"【原创】半径2、圆心角π/3弧度的扇形面积？","answer":"2π/3。","solution":"S=(1/2)r²θ=(1/2)×4×π/3。","level":"进阶"}],"mastery":["能说明定义、适用范围及反例","独立完成自测并核查取值范围"],"sources":[{"title":"人教A版必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H11","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"函数","title":"诱导公式与三角恒等变换","prerequisites":["H10"],"goals":["说明并应用诱导公式","说明并应用和差角与倍角","说明并应用降幂与辅助角"],"concepts":[{"name":"诱导公式","explanation":"单位圆旋转和对称给sin(−x)=−sin x、cos(−x)=cos x；sin(π−x)=sin x、cos(π−x)=−cos x。把任意角化至熟悉范围，先决定用sin还是cos，再按终边象限定符号，比死记口令更可靠。"},{"name":"和差角与倍角","explanation":"sin(a±b)=sin a cos b±cos a sin b；cos(a±b)=cos a cos b∓sin a sin b。令a=b得到sin2a=2sin a cos a、cos2a=cos²a−sin²a=1−2sin²a。正切和角公式分母1−tan a tan b须非零，且涉及的正切有定义。"},{"name":"降幂与辅助角","explanation":"sin²x=(1−cos2x)/2，cos²x=(1+cos2x)/2。a sin x+b cos x可写R sin(x+φ)，R=√(a²+b²)>0，选cosφ=a/R、sinφ=b/R；振幅R对任意x的范围是[−R,R]，限定x时需另查能否取端值。"}],"methods":["统一角、函数名或次数，每步使用可逆恒等式并保留分母限制。"],"pitfalls":["sin(a+b)通常不等于sin a+sin b。"],"example":{"question":"【原创】求sin75°的精确值。","solution":["75°=45°+30°，应用和角公式。","sin75°=(√2/2)(√3/2)+(√2/2)(1/2)。","结果为(√6+√2)/4。"],"answer":"结果为(√6+√2)/4。"},"practice":[{"question":"【原创】化简1−2sin²x。","answer":"cos2x。","solution":"由二倍角公式直接得到。","level":"基础"},{"question":"【原创】求3sin x+4cos x在R上的最大值。","answer":"5。","solution":"写成5sin(x+φ)，取cosφ=3/5、sinφ=4/5，存在相位使sin为1。","level":"进阶"},{"question":"【原创·分层】θ在第二象限且sinθ=3/5，求sin2θ和cos2θ的精确值。","answer":"sin2θ=−24/25，cos2θ=7/25。","solution":"先由sin²θ+cos²θ=1得cos²θ=16/25。第二象限余弦为负，所以cosθ=−4/5，而不能取正根。于是sin2θ=2sinθcosθ=2×(3/5)×(−4/5)=−24/25；cos2θ=1−2sin²θ=1−18/25=7/25。两结果还满足平方和1，可用于交叉核对。","level":"基础巩固"},{"question":"【原创·分层】化简 tan x/(1+tan²x)，写出原式定义域；能否因为化简后有意义，就把原式在x=π/2处定义为0？","answer":"原式=sin x cos x=(1/2)sin2x，适用x≠π/2+kπ，k∈Z。原式在π/2仍无定义。","solution":"原式中的tan x存在须cos x≠0，因此排除π/2+kπ。该范围内1+tan²x=1/cos²x>0，所以原式=(sin x/cos x)÷(1/cos²x)=sin x cos x=(1/2)sin2x。化简是在原定义域上建立相等关系，并不自动更改定义域。虽然新表达式在π/2值为0，但给原函数补上这个点属于另定义一个延拓函数，不是恒等变形本身的结果。","level":"条件变式"},{"question":"【原创·分层】在0≤x≤π/2上，求sin x+cos x的值域，并求sin x+cos x≥√6/2的解集。","answer":"值域[1,√2]；解集[π/12,5π/12]。","solution":"由和角公式，sin x+cos x=√2 sin(x+π/4)。令t=x+π/4，则t∈[π/4,3π/4]。正弦在这段中于π/2取最大1，两端均为√2/2，所以原式值域为[1,√2]。不等式化为sin t≥√3/2。在给定t区间内，这等价于π/3≤t≤2π/3。减去π/4得到π/12≤x≤5π/12。两端使等号成立，且都在原区间内。","level":"综合应用"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H12","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"函数","title":"三角函数图象、周期与参数","prerequisites":["H10","H11"],"goals":["说明并应用基本图象","说明并应用正弦型参数","说明并应用解三角方程"],"concepts":[{"name":"基本图象","explanation":"sin、cos最小正周期2π，正弦为奇函数、余弦为偶函数；tan最小正周期π，在每个(−π/2+kπ,π/2+kπ)严格递增，k为整数，不能跨间断点拼成整体单调区间。本库讨论完整周期图象：T>0为周期时，定义域D对±T平移保持不变，即x∈D时x±T也在D中，并且对每个x∈D都有f(x+T)=f(x)。不能仅挑两边恰好有定义的点比较；例如把sin x限制到[0,1]，不能因此仍称该限制函数的周期为2π。最小正周期需确实存在；实数上的常函数任意T>0都是周期，没有最小正周期。"},{"name":"正弦型参数","explanation":"y=A sin(ωx+φ)+b在A≠0、ω≠0时振幅|A|、最小正周期2π/|ω|，中线y=b，值域[b−|A|,b+|A|]。相位移动量是−φ/ω，不是−φ；A或ω为0会退化为常函数。"},{"name":"解三角方程","explanation":"sin x=sinα的通解是x=α+2kπ或x=π−α+2kπ；cos x=cosα为x=±α+2kπ。求区间解时把通解与区间相交，检查端点和是否重复。使用图象可帮助确认解的数量。"}],"methods":["把ωx+φ整体当角变量，先解其范围，再换回x。"],"pitfalls":["把相位φ直接作为水平位移会漏除ω。"],"example":{"question":"【原创】求y=2sin(2x−π/3)+1的振幅、周期和一个最大值点。","solution":["振幅2，周期2π/2=π，中线1，最大值3。","令2x−π/3=π/2+2kπ得x=5π/12+kπ。","例如x=5π/12时取最大值3。"],"answer":"例如x=5π/12时取最大值3。"},"practice":[{"question":"【原创】sin x=1/2，0≤x\u003c2π的解？","answer":"π/6、5π/6。","solution":"单位圆第一、二象限有两个满足点。","level":"基础"},{"question":"【原创】y=sin(3x+π)向右平移多少变成sin3x？","answer":"π/3。","solution":"将x换x−h，3(x−h)+π=3x要求h=π/3。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H13","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"几何与代数","title":"平面向量与数量积","prerequisites":["J11","J23","H10"],"goals":["说明并应用向量运算与坐标","说明并应用数量积","说明并应用基底与几何表示"],"concepts":[{"name":"向量运算与坐标","explanation":"向量同时有大小和方向，自由向量可平移。AB=B−A，向量相加按首尾相接或平行四边形法则；坐标逐分量相加。a=λb且b≠0时二者共线，零向量的方向不定，涉及夹角前要排除零向量。"},{"name":"数量积","explanation":"非零向量a·b=|a||b|cosθ，坐标为aₓbₓ+aᵧbᵧ，结果是数。它衡量沿另一方向的投影。非零向量垂直当且仅当点积0；|a|²=a·a，因此距离、夹角可转成代数。"},{"name":"基底与几何表示","explanation":"平面两个不共线向量可唯一表示任意向量。中点坐标为两端坐标平均；线段比例点可按加权和表示，权重和1保证仿射位置。坐标方法适合垂直、距离问题，但建立坐标轴时不能把并不垂直的两边当正交轴。"}],"methods":["写清向量的起点终点；距离用模，角用点积，共线用比例或行列式。"],"pitfalls":["a·b不是向量，不能继续按同一种点积定义写(a·b)·c。"],"example":{"question":"【原创】a=(2,1)，b=(1,−2)，求a·b、两模和夹角。","solution":["a·b=2−2=0，两向量均非零。","|a|=|b|=√5，点积0判垂直。","点积0，模均√5，夹角90°。"],"answer":"点积0，模均√5，夹角90°。"},"practice":[{"question":"【原创】A(1,2)、B(4,6)，求AB。","answer":"(3,4)，模5。","solution":"坐标相减，再用勾股求模。","level":"基础"},{"question":"【原创】a=(1,2)，b=(t,6)，何时共线？","answer":"t=3。","solution":"行列式1×6−2t=0，得t=3；此时b=3a。","level":"进阶"},{"question":"【原创·分层】向量u=(3,−1)，v=(1,2)。求u·v及两向量夹角的余弦值，并判断该夹角是锐角、直角还是钝角。","answer":"u·v=1，cosθ=1/√50=√2/10，夹角为锐角。","solution":"按正交坐标数量积公式，u·v=3×1+(−1)×2=1。两向量模分别为√10、√5，都非零，故夹角公式可用。cosθ=(u·v)/(|u||v|)=1/(√10√5)=1/√50。向量夹角θ取[0,π]，此处余弦严格介于0和1，因此0\u003cθ\u003cπ/2，为锐角。","level":"基础巩固"},{"question":"【原创·分层】a=(t,1)，b=(1,t)，t∈R。分别求a、b垂直和共线时t的值，说明两种情况是否重合。","answer":"垂直时t=0；共线时t=±1；两种情况不重合。","solution":"两向量都有一个固定非零分量，所以对任何t都不是零向量，垂直判据无需额外排除。a·b=t+t=2t，因此垂直等价于t=0。共线可用二维行列式为零：t·t−1·1=t²−1=0，得t=±1。t=1时两向量相同，t=−1时两向量相反；它们的夹角分别为0或π，都不是π/2，所以没有重合参数。","level":"条件变式"},{"question":"【原创·分层】A=(0,0)，B=(6,0)，C=(0,4)。P在线段BC上且BP:PC=1:2。Q在线段AB上，要求向量AP与CQ垂直。求P、Q的坐标及PQ的长度。","answer":"P=(4,4/3)，Q=(4/3,0)，PQ=4√5/3。","solution":"BP占BC的1/3，所以P=B+(C−B)/3=(6,0)+(−6,4)/3=(4,4/3)。设Q=(q,0)，线段约束为0≤q≤6。AP=(4,4/3)，CQ=(q,−4)，两者均非零，垂直条件是数量积4q−16/3=0，得q=4/3，确在[0,6]内。于是PQ的横、纵坐标差分别为8/3、4/3，长度√[(8/3)²+(4/3)²]=√80/3=4√5/3。","level":"综合应用"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"illustrations":[{"moduleId":"H13","title":"点积为0：先确认向量非零","caption":"两个向量起点同在O；a=(2,1)，b=(1,−2)。坐标轴等比例，a·b=2×1+1×(−2)=0且两向量非零，因此夹角90°；长度都是√5。","file":"图解/H13.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"H13-title H13-desc\">\u003ctitle id=\"H13-title\">点积为0：先确认向量非零\u003c/title>\u003cdesc id=\"H13-desc\">两个向量起点同在O；a=(2,1)，b=(1,−2)。坐标轴等比例，a·b=2×1+1×(−2)=0且两向量非零，因此夹角90°；长度都是√5。\u003c/desc>\u003cdefs>\u003cclipPath id=\"H13-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">点积为0：先确认向量非零\u003c/text>\u003cline x1=\"80\" y1=\"210\" x2=\"600\" y2=\"210\" class=\"axis\"/>\u003cline x1=\"280\" y1=\"65\" x2=\"280\" y2=\"375\" class=\"axis\"/>\u003cline x1=\"280\" y1=\"210\" x2=\"420\" y2=\"140\" class=\"line\"/>\u003cline x1=\"280\" y1=\"210\" x2=\"350\" y2=\"350\" class=\"line\"/>\u003ccircle cx=\"420\" cy=\"140\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"350\" cy=\"350\" r=\"5\" fill=\"#245c4d\"/>\u003ctext x=\"255\" y=\"235\" class=\"label\">O\u003c/text>\u003ctext x=\"434\" y=\"134\" class=\"label\">a=(2,1)\u003c/text>\u003ctext x=\"364\" y=\"364\" class=\"label\">b=(1,−2)\u003c/text>\u003ctext x=\"603\" y=\"216\" class=\"label\">x\u003c/text>\u003ctext x=\"259\" y=\"62\" class=\"label\">y\u003c/text>\u003cline x1=\"298\" y1=\"201\" x2=\"307\" y2=\"219\" class=\"line\"/>\u003cline x1=\"307\" y1=\"219\" x2=\"289\" y2=\"228\" class=\"line\"/>\u003ctext x=\"67\" y=\"412\" class=\"label\">点积是实数；零向量没有确定的几何夹角。\u003c/text>\u003c/svg>"}],"selfStudy":{"moduleId":"H13","entryCheck":{"question":"A(1,2)、B(4,6)，从A走到B，横向和纵向分别改变多少？向量BA与AB是否相同？","answer":"改变(3,4)；BA=(−3,−4)，与AB相反。","explanation":"终点减起点：AB=(4−1,6−2)。向量包含方向，交换起终点后每个分量都变号，但模仍是5。"},"intuition":"数量积把两支箭头变成一个数：同向程度越强越正，相反程度越强越负，垂直时为0。它不是把两支箭头拼成第三支箭头；点积的结果类型是数。投影图只是几何解释，坐标计算与角度定义需要明确连接。","reasoning":[{"step":"约定坐标系，不偷换基底","detail":"下面坐标公式采用互相垂直、单位长度相同的正交坐标轴。用单位基向量i=(1,0)、j=(0,1)，任何平面向量都写为a=aₓi+aᵧj。如果换成斜坐标轴，直接相乘相加不再是这个公式。"},{"step":"先定义非零向量夹角，再处理零向量","detail":"把非零向量起点平移到一起，夹角θ取0到π，定义a·b=|a||b|cosθ。零向量没有确定方向，所以不能谈它的夹角；为保持运算一致，约定0·b=0。约定点积为0不等于定义了零向量的夹角。"},{"step":"坐标式从什么运算性质得到","detail":"采用数量积对向量加法和数乘的分配、线性性质，并用i·i=j·j=1、i·j=j·i=0，展开(aₓi+aᵧj)·(bₓi+bᵧj)，交叉两项为0，剩aₓbₓ+aᵧbᵧ。本段依赖已说明的分配性质，不把公式展开冒充这些性质的独立证明。高阶A11给出实内积的公理化视角。"},{"step":"为什么点积为0可以判垂直","detail":"若两个向量均非零，|a||b|>0，因此a·b=0等价于cosθ=0。θ在[0,π]内，所以θ=π/2，即90°。若任一个为零，不能做这一步除法，也不能据此报告一个夹角。"},{"step":"不用陌生名词判断共线","detail":"例如a=(1,2)、b=(t,6)，设b=λa，得到t=λ、6=2λ，故λ=3且t=3。这个推理只用比例，不必先学行列式。一般平面坐标判据aₓbᵧ−aᵧbₓ=0要结合零向量约定理解。"}],"workedWalkthrough":[{"step":"读题并确定三个不同目标","detail":"原例题a=(2,1)、b=(1,−2)要求点积、两个模和夹角。它们分别是一个实数、两个非负长度和一个角，答案类型不要混在一起。"},{"step":"按坐标定义计算点积","detail":"横向分量相乘为2×1=2，纵向分量相乘为1×(−2)=−2，两者相加a·b=0。不要误算为(2,−2)，那只是两个乘积，不是点积。"},{"step":"用平方和求模","detail":"|a|=√(2²+1²)=√5；|b|=√(1²+(−2)²)=√5。括号必须保留，因为(−2)²=4而−2²=−4；两模都大于0。"},{"step":"检查夹角公式的分母","detail":"现在已确认非零，可除以|a||b|=5。cosθ=(a·b)/(|a||b|)=0/5=0，在[0,π]内θ=π/2，即90°。"},{"step":"用几何再核对一次","detail":"把a=(2,1)顺时针旋转90°会得到(1,−2)，恰是b，且长度保持√5。几何核对与代数答案一致，但解题时仍应写清非零条件与点积判据。"}],"wrongApproach":{"claim":"任何两个向量，只要点积为0，夹角就是90°。","whyWrong":"取a=(0,0)、b=(1,2)，点积仍为0，但零向量没有确定方向，夹角未定义，cosθ公式分母也为0。","correction":"先核查两个向量均非零，再用点积0判垂直。关于零向量的正交约定与平面几何的夹角概念应区分。"},"exitCheck":{"question":"非零向量a=(1,2)、b=(t,−1)何时垂直？在该参数下求两模，并说明为什么不能只凭图形判断。","answer":"t=2；两模均为√5。","explanation":"a·b=t−2，令其为0得t=2。a显然非零，b的纵分量为−1也永远非零，故判据适用。|a|=|b|=√5。示意图可能有比例误差，垂直结论由定义和计算保证。"},"remediation":[{"difficulty":"把点坐标与位移混淆","moduleId":"J11","action":"在坐标图中画A到B和B到A，分别记录两个方向的坐标变化。"},{"difficulty":"模的平方和公式不会用","moduleId":"J23","action":"先用勾股定理求位移(3,4)的长度，再换成含负分量的例子。"},{"difficulty":"cosθ=0不能确定角","moduleId":"H10","action":"在单位圆上查θ∈[0,π]中横坐标为0的位置。"}],"auditNotes":[{"severity":"澄清","finding":"原卡共线方法提及行列式却没有先讲它，模公式隐含勾股定理。","resolution":"先用倍数λ说明共线判断，补足零向量与正交坐标约定，前置补J23。"}]}},{"id":"H14","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"几何与代数","title":"正弦定理、余弦定理与解三角形","prerequisites":["H13","J42"],"goals":["说明并应用正弦定理","说明并应用余弦定理","说明并应用面积与现实方位"],"concepts":[{"name":"正弦定理","explanation":"任意非退化三角形中a/sin A=b/sin B=c/sin C=2R，a、b、c各对A、B、C。可从面积的两种表达或外接圆圆周角关系推出。已知两角一边通常易解；已知两边一对角（SSA）可能无解、一解或两解。"},{"name":"余弦定理","explanation":"a²=b²+c²−2bc cos A，由向量点积展开|b向量−c向量|²得到。A=90°时退化为勾股。已知三边求角，或两边及夹角求第三边，通常优先用此式；计算反余弦前结果须在[−1,1]。"},{"name":"面积与现实方位","explanation":"S=(1/2)bc sin A，也可由底乘高解释。方位角和航向问题先画方向箭头，将题目角转成三角形内角；三角形角和π和边长三角不等式都可用于检验是否合理。"}],"methods":["根据已知条件选择定理，SSA要检查另一补角可能，最终核验三角形条件。"],"pitfalls":["边a必须与角A相对，不能只按图上文字顺序代入。"],"example":{"question":"【原创】三角形b=3、c=5、A=60°，求a和面积。","solution":["a²=9+25−2×3×5×1/2=19。","S=(1/2)×3×5×√3/2。","a=√19，面积15√3/4。"],"answer":"a=√19，面积15√3/4。"},"practice":[{"question":"【原创】A=30°、a=4，外接圆半径R？","answer":"4。","solution":"2R=a/sin A=8，R=4。","level":"基础"},{"question":"【原创】已知sin B=1/2，B为三角形内角，一定B=30°吗？","answer":"不一定，也可能150°。","solution":"正弦在0至π有两个可能角，再用其余角边条件筛选。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H15","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"几何与代数","title":"复数的四则运算与几何意义","prerequisites":["J24","H13"],"goals":["说明并应用复数及相等","说明并应用共轭、模与除法","说明并应用复平面与方程"],"concepts":[{"name":"复数及相等","explanation":"定义i²=−1，复数z=a+bi，a、b为实数。实部a、虚部b（虚部不是bi）；两个复数相等当且仅当实部、虚部分别相等。实数嵌在复数中，b=0即实数，b≠0为虚数。"},{"name":"共轭、模与除法","explanation":"共轭z̄=a−bi，模|z|=√(a²+b²)，z z̄=|z|²。除以非零复数可同乘其共轭，将分母化为正实数a²+b²。复数没有与实数同样兼容四则运算的通常大小顺序，不用z>0表达一般复数。"},{"name":"复平面与方程","explanation":"a+bi对应平面点(a,b)，加法对应向量相加，模是到原点距离。x²+1=0在复数中根为±i；解一般二次方程仍可用配方，负判别式给一对共轭根（实系数时）。"}],"methods":["先化i的幂，除法有理化分母，最后整理成a+bi。"],"pitfalls":["|a+bi|一般不等于|a|+|b|。"],"example":{"question":"【原创】计算(1+2i)/(1−i)。","solution":["分子分母同乘1+i，分母(1−i)(1+i)=2。","分子1+3i+2i²=−1+3i。","结果−1/2+(3/2)i。"],"answer":"结果−1/2+(3/2)i。"},"practice":[{"question":"【原创】求z=3−4i的共轭与模。","answer":"3+4i；5。","solution":"共轭改变虚部符号，模√(9+16)=5。","level":"基础"},{"question":"【原创】解x²−2x+5=0（复数范围）。","answer":"1±2i。","solution":"配方(x−1)²=−4，故x−1=±2i。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H16","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"几何与代数","title":"空间几何体、表面积与体积","prerequisites":["J44","J41"],"goals":["说明并应用几何体与截面","说明并应用体积公式","说明并应用比例与组合"],"concepts":[{"name":"几何体与截面","explanation":"棱柱、棱锥、棱台由多边形面围成，圆柱、圆锥、球等有曲面。空间点线面关系不能仅依平面示意图的视觉；截面是平面与几何体相交形成的图形，需判断截平面穿过哪些棱或曲面。"},{"name":"体积公式","explanation":"棱柱和圆柱V=Sh，棱锥和圆锥V=Sh/3，h为底面到顶点或两底面的垂直距离。台体V=h(S₁+S₂+√(S₁S₂))/3用于由平行截面形成的相应棱台或圆台。球V=4πr³/3、表面积4πr²。"},{"name":"比例与组合","explanation":"相似空间体线性比k、面积比k²、体积比k³。组合体体积可分割相加或扣除空洞，表面积需排除贴合后内部面。公式量纲给快速检验：体积必须是长度的三次方。"}],"methods":["标底面与真正的高，分割时检查是否重复计算内部面。"],"pitfalls":["斜棱长度通常不等于锥体高。"],"example":{"question":"【原创】圆锥底半径3、高4，求体积与总表面积。","solution":["母线L=√(9+16)=5。","体积(1/3)π×9×4=12π；侧面积π×3×5=15π。","体积12π，总面积15π+9π=24π。"],"answer":"体积12π，总面积15π+9π=24π。"},"practice":[{"question":"【原创】球半径扩大2倍，面积和体积各变几倍？","answer":"4倍、8倍。","solution":"分别按半径平方、立方变化。","level":"基础"},{"question":"【原创】底面积12、高5的棱锥体积？","answer":"20。","solution":"V=12×5/3=20，高是垂距。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H17","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"几何与代数","title":"空间平行：判定与性质","prerequisites":["H16","J09"],"goals":["说明并应用线线与异面","说明并应用线面平行","说明并应用面面平行"],"concepts":[{"name":"线线与异面","explanation":"空间两直线可相交、平行或异面；异面是不在同一平面内，既不相交也不平行。图上不交并不能判平行。研究异面角可平移一条直线使之与另一条相交，并取不大于90°的夹角作为直线夹角。"},{"name":"线面平行","explanation":"直线l不在平面α内，若l平行于α内一条直线m，则l∥α。外置条件不可缺，否则l可能就在平面中。若l∥α且含l的平面β与α交于m，通常可由相应性质得l∥m，要核实交线存在。"},{"name":"面面平行","explanation":"一个平面内两条相交直线分别平行另一平面，可判两平面平行。只给一条或两条互相平行的线不够，因为两个平面仍可能沿平行方向的交线相交。证明常利用中位线、平行四边形和截面关系。"}],"methods":["每个判定写明所属平面、相交或外置条件，以平面几何等量为起点。"],"pitfalls":["线面平行判定里的‘直线在面外’不能省。"],"example":{"question":"【原创】棱锥P-ABC中M、N分别为PA、PB中点，证明MN∥平面ABC。","solution":["在△PAB中MN是中位线，所以MN∥AB。","AB在平面ABC内，MN不在该平面内。","由线面平行判定，MN∥平面ABC。"],"answer":"由线面平行判定，MN∥平面ABC。"},"practice":[{"question":"【原创】两直线都平行同一直线，是否平行？","answer":"是（若两线不同）。","solution":"空间平行关系具有该传递性质，重合情形另算。","level":"基础"},{"question":"【原创】两平面各含一条互相平行的直线，能判平面平行吗？","answer":"不能。","solution":"例如相交的两个平面都可以各取平行于交线的直线。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H18","stage":"高中","grade":"必修（建议高一）","courseType":"必修","domain":"几何与代数","title":"空间垂直、距离与二面角","prerequisites":["H17","H13"],"goals":["说明并应用线面垂直","说明并应用面面垂直与二面角","说明并应用三垂线思想与投影"],"concepts":[{"name":"线面垂直","explanation":"一条直线若垂直于平面内两条相交直线，则垂直该平面；也就垂直平面内所有方向。两条验证线必须相交，若平行则只检验了一个方向。过点作面垂线的长度是点到平面的距离。"},{"name":"面面垂直与二面角","explanation":"两平面的夹角由沿交线分别在两面内作垂直交线的射线形成，其夹角为二面角的平面角。一个平面包含另一平面的一条垂线，可判两平面垂直；两平面垂直并不说明任意跨面两线均垂直。"},{"name":"三垂线思想与投影","explanation":"斜线在平面上的正投影把空间角度转成面内关系。斜线与面夹角为该线与其投影的锐角；垂直于面时投影退化为点，规定角为90°；平行于面或在面内时取0°。求距离常换底用同一体积，或建立正交坐标系。"}],"methods":["先证垂直关系，再量角或距离；必要时利用向量把几何前提表达成代数。"],"pitfalls":["二面角不可直接拿空间图上两个可见斜边夹角代替。"],"example":{"question":"【原创】直角三棱锥O-ABC中OA、OB、OC两两垂直且都长2，求O到平面ABC距离。","solution":["以△OAB为底，底面积为2，OC垂直该底面且高2，故棱锥体积V=2×2/3=4/3。","勾股定理给AB=BC=CA=2√2，△ABC为等边三角形，其面积为(1/2)×8×sin60°=2√3。","改以△ABC为底，设O到面距离d，则V=(1/3)×2√3×d。由体积不变得d=2/√3。"],"answer":"d=2/√3。"},"practice":[{"question":"【原创】直线垂直平面内两条平行线，能判垂直平面吗？","answer":"不能。","solution":"两平行线只提供同一方向，判定需要两条相交直线。","level":"基础"},{"question":"【原创】单位正方体体对角线与底面夹角的正弦？","answer":"1/√3。","solution":"体对角线长√3，垂直底面的分量高1，sinθ=1/√3。","level":"进阶"},{"question":"【原创·分层】长方体ABCD−A₁B₁C₁D₁中，AB=3、AD=4、AA₁=12。求AC₁与底面ABCD所成角的正弦值，指出所用的正投影线段。","answer":"正投影为AC，所成角为∠C₁AC，其正弦为12/13。","solution":"长方体的侧棱CC₁垂直底面，因此C₁的正投影为C，A本来在底面内，斜线段AC₁的正投影为AC。底面直角三角形ABC给AC=√(3²+4²)=5。三角形ACC₁在C处为直角，AC₁=√(5²+12²)=13。线面角是斜线与其正投影的夹角，所以sin∠C₁AC=CC₁/AC₁=12/13。","level":"基础巩固"},{"question":"【原创·分层】平面α与β垂直，交线为l。点A∈α且A不在l上，H是A到l的垂足。证明AH⊥β，并说明A到β的距离是什么。","answer":"AH⊥β；A到β的距离等于线段AH的长度。","solution":"由于A、l都在α内，垂足H∈l，直线AH位于α内且AH⊥l。在β内过H作直线m⊥l；AH与m分别在两个平面内且都垂直交线，它们所成角为二面角的平面角。已知α⊥β，因此AH⊥m。现在l、m是β内两条相交于H的直线，AH同时垂直这两条线，由线面垂直判定得AH⊥β。又H∈β，所以AH正是A到β的垂线段，距离为|AH|。","level":"条件变式"},{"question":"【原创·分层】四棱锥P−ABCD的底面ABCD为边长2的正方形，PA⊥平面ABCD且PA=2。求以BC为棱、分别含P和A的两个半平面形成的二面角的大小，并求A到平面PBC的距离。","answer":"二面角为45°；A到平面PBC的距离为√2。","solution":"因为BC⊥AB且BC⊥PA，而AB、PA在平面PAB内相交于A，所以BC⊥平面PAB，从而BC⊥PB。于是BA与BP分别位于所指定的两个半平面内并均垂直BC，∠PBA是该二面角的平面角。△PAB在A处直角且PA=AB=2，因此∠PBA=45°、PB=2√2。在△PAB内作AH⊥PB，H∈PB。由BC⊥平面PAB也有BC⊥AH；AH同时垂直PBC内相交的PB和BC，所以AH⊥平面PBC。△PAB面积为2，又等于PB·AH/2，故AH=4/(2√2)=√2。","level":"综合应用"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H19","stage":"高中","grade":"选择性必修（建议高二）","courseType":"选择性必修","domain":"几何与代数","title":"空间向量与点线面计算","prerequisites":["H18","H13"],"goals":["说明并应用正交坐标与点积","说明并应用法向量与平面方程","说明并应用夹角公式与方向"],"concepts":[{"name":"正交坐标与点积","explanation":"在互相垂直、单位一致的三轴下，a·b=a₁b₁+a₂b₂+a₃b₃，|a|²为三分量平方和。向量与平面平行时，和法向量点积为0。若轴不正交，不能直接使用此坐标点积公式。"},{"name":"法向量与平面方程","explanation":"平面内两条不共线方向向量u、v确定法向量n，需n·u=n·v=0且n≠0。过P₀的平面写n·(X−P₀)=0，即Ax+By+Cz+D=0。点Q到面的距离为|Aqₓ+Bqᵧ+Cq_z+D|/√(A²+B²+C²)。"},{"name":"夹角公式与方向","explanation":"取非零方向向量a、b及非零法向量n。两直线取较小夹角θ∈[0,π/2]时，cosθ=|a·b|/(|a||b|)；平行情形按夹角0处理，垂直时为π/2，不能统称锐角。线面角θ∈[0,π/2]满足sinθ=|a·n|/(|a||n|)。两平面的较小夹角同样可用其非零法向量点积的绝对值计算；若题目指定某个二面角，其值可能为钝角，须由几何朝向确定用θ还是π−θ。"}],"methods":["取最方便的正交坐标系；求法向量时写两个点积方程；角度结果再用图检验锐钝。"],"pitfalls":["法向量可乘任意非零常数，不必唯一；零向量不能作法向量。"],"example":{"question":"【原创】平面2x−y+2z−6=0，求Q(1,0,0)到面距离。","solution":["法向量n=(2,−1,2)，模为3。","点代方程左端为2−6=−4，取绝对值4。","距离4/3。"],"answer":"距离4/3。"},"practice":[{"question":"【原创】方向向量(1,1,0)与(1,−1,0)夹角？","answer":"90°。","solution":"点积0，两者非零。","level":"基础"},{"question":"【原创】直线方向(1,1,1)，平面法向(0,0,1)，线面角正弦？","answer":"1/√3。","solution":"代sinθ=|1|/(√3×1)。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A选择性必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H20","stage":"高中","grade":"选择性必修（建议高二）","courseType":"选择性必修","domain":"几何与代数","title":"直线方程、位置关系与距离","prerequisites":["H13","H01"],"goals":["说明并应用方程形式","说明并应用平行与垂直","说明并应用距离与交点"],"concepts":[{"name":"方程形式","explanation":"非竖直直线斜率k=(y₂−y₁)/(x₂−x₁)，点斜式y−y₀=k(x−x₀)。一般式Ax+By+C=0要求A、B不同时0，覆盖竖直线；x=x₀没有有限斜率，不能为套斜率公式而将它排除。"},{"name":"平行与垂直","explanation":"两直线斜率都存在时平行需k₁=k₂（且不重合），垂直需k₁k₂=−1；有竖直线要单独判断。一般式下法向量为(A,B)，点积或比例关系可统一处理，仍需区分平行与重合。"},{"name":"距离与交点","explanation":"点(x₀,y₀)到直线距离d=|Ax₀+By₀+C|/√(A²+B²)。它来自向法向量方向的投影。平行直线距离可在统一A、B系数后用|C₁−C₂|/√(A²+B²)，系数未统一不可直接代。"}],"methods":["先看是否竖直；选适合的方程，位置关系尽量用向量或一般式覆盖特殊情形。"],"pitfalls":["k₁k₂=−1的判定前提是两斜率都存在。"],"example":{"question":"【原创】求过P(1,2)且垂直于2x−y+3=0的直线。","solution":["原直线y=2x+3斜率2，新斜率−1/2。","点斜式y−2=−(x−1)/2。","整理得x+2y−5=0。"],"answer":"整理得x+2y−5=0。"},"practice":[{"question":"【原创】点(0,0)到3x+4y−10=0距离？","answer":"2。","solution":"|−10|/√25=2。","level":"基础"},{"question":"【原创】过(2,1)、(2,5)的直线方程？","answer":"x=2。","solution":"两点横坐标相同，直线竖直，斜率不存在。","level":"进阶"}],"mastery":["能够补全公式成立的条件","独立完成自测并核查图形或代数范围"],"sources":[{"title":"人教A选择性必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H21","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"几何与代数","title":"圆的方程与直线圆综合","prerequisites":["H20","J40"],"goals":["能够解释并使用圆的标准与一般式","能够解释并使用直线与圆","能够解释并使用轨迹与限制"],"concepts":[{"name":"圆的标准与一般式","explanation":"圆心(a,b)、半径r>0的圆为(x−a)²+(y−b)²=r²。一般式x²+y²+Dx+Ey+F=0配方后半径平方(D²+E²)/4−F须>0，等于0仅一个点，小于0没有实点，不能都称圆。"},{"name":"直线与圆","explanation":"利用圆心到直线距离与r比较判断相交、相切或相离；也可联立消元用判别式。相交弦长为2√(r²−d²)，由垂径定理得。切线点已知时可用半径垂直切线，避免繁琐联立。"},{"name":"轨迹与限制","explanation":"设动点(x,y)，把等距、定距条件翻译成方程后，还须检验每个方程点是否都能由原条件产生。消分母、平方可能引入额外点，轨迹方程须附上必须排除的点或区间。"}],"methods":["优先考虑几何距离，需要坐标时再联立，并核查退化情况。"],"pitfalls":["平方得到的轨迹可能扩大原集合，必须回代条件。"],"example":{"question":"【原创】圆(x−1)²+(y+2)²=25与直线y=1相交，求弦长。","solution":["圆心(1,−2)、半径5，圆心到y=1距离3。","半弦长√(25−9)=4。","弦长8。"],"answer":"弦长8。"},"practice":[{"question":"【原创】x²+y²−4x+6y+13=0是圆吗？","answer":"不是，只有点(2,−3)。","solution":"配方(x−2)²+(y+3)²=0，半径0。","level":"基础"},{"question":"【原创】x²+y²=25在P(3,4)处的切线？","answer":"3x+4y=25。","solution":"法向量取OP=(3,4)，3(x−3)+4(y−4)=0。","level":"进阶"},{"question":"【原创·分层】把x²+y²+2x−6y+1=0化成圆的标准方程，求圆心、半径及直线y=3截得的弦长。","answer":"(x+1)²+(y−3)²=9；圆心(−1,3)，半径3，弦长6。","solution":"配方时x²+2x=(x+1)²−1，y²−6y=(y−3)²−9，代回得(x+1)²+(y−3)²=9。半径平方为正，确实表示圆。直线y=3经过圆心，所截弦为直径，长2r=6；也可代入得x=−4或2，两点横坐标差6。","level":"基础巩固"},{"question":"【原创·分层】求过P=(0,3)且与圆x²+y²=4相切的全部直线。写出竖直直线的检查过程。","answer":"y=(√5/2)x+3及y=−(√5/2)x+3。竖直线x=0不是切线。","solution":"过P的竖直直线为x=0，它经过圆心并与圆交于(0,±2)，所以是割线而非切线。其余直线可写y=kx+3，即kx−y+3=0。圆心到直线距离为3/√(k²+1)，相切条件是该距离等于半径2，得到9=4(k²+1)，故k²=5/4、k=±√5/2。两个斜率均产生距离恰为2的直线，因此候选全部有效。","level":"条件变式"},{"question":"【原创·分层】圆的圆心为C=(0,2)，半径为1。动点P=(t,0)在x轴上，PT是从P作出的任一切线段，T为切点。求PT的最小值，并求使PT≤2的全部P。","answer":"最小值√3，在P=(0,0)取得；满足PT≤2的点为P=(t,0)，−1≤t≤1。","solution":"对任意实数t，PC=√(t²+4)≥2>1，因此P始终在圆外，两条实切线都存在。半径CT与切线PT垂直，故由直角三角形PCT得PT²=PC²−CT²=t²+4−1=t²+3。因t²≥0，PT≥√3，t=0时取得。条件PT≤2中两边非负，可平方等价变为t²+3≤4，即t²≤1，得−1≤t≤1。每个这样的P都在圆外，未因平方引入无效点。","level":"综合应用"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H22","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"几何与代数","title":"椭圆：定义、方程与几何量","prerequisites":["H21","H14"],"goals":["能够解释并使用焦点定义","能够解释并使用标准方程及参数","能够解释并使用范围与焦点三角形"],"concepts":[{"name":"焦点定义","explanation":"平面内到两定点F₁、F₂的距离和为2a且2a>|F₁F₂|的点形成椭圆。记焦距2c，需a>c>0；焦点重合c=0时变为圆。条件若等于焦距，轨迹退化为线段而非通常椭圆。"},{"name":"标准方程及参数","explanation":"焦点在x轴时x²/a²+y²/b²=1，a>b>0，c²=a²−b²；长半轴a、短半轴b，焦点(±c,0)，离心率e=c/a∈(0,1)。分母较大者对应长轴，若长轴在y方向交换角色。"},{"name":"范围与焦点三角形","explanation":"椭圆上x∈[−a,a]，y∈[−b,b]。焦点三角形中PF₁+PF₂=2a可和余弦定理、面积公式联用。使用焦半径公式时须先说明方向，不如从定义求和、再求差往往更稳妥。"}],"methods":["先确定长轴方向再读a、b、c；定义中的2a不能误作a。"],"pitfalls":["离心率越大通常越扁，但半轴大小与总体尺寸是两回事。"],"example":{"question":"【原创】椭圆x²/25+y²/9=1，求焦点、离心率及长轴长。","solution":["a=5，b=3，c=√(25−9)=4。","焦点(−4,0)、(4,0)，e=4/5。","长轴长2a=10，焦点与离心率如上。"],"answer":"长轴长2a=10，焦点与离心率如上。"},"practice":[{"question":"【原创】椭圆点到一焦点距离3，长半轴5，到另一焦点距离？","answer":"7。","solution":"两距离和2a=10，另一距离10−3。","level":"基础"},{"question":"【原创】y²/16+x²/7=1的焦点在哪？","answer":"(0,±3)。","solution":"较大分母16在y项，a²=16,b²=7,c²=9。","level":"进阶"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H23","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"几何与代数","title":"双曲线与抛物线","prerequisites":["H22"],"goals":["能够解释并使用双曲线定义与标准式","能够解释并使用抛物线定义与参数","能够解释并使用不同曲线的几何约束"],"concepts":[{"name":"双曲线定义与标准式","explanation":"到两焦点距离之差的绝对值等于2a且0\u003c2a\u003c2c的点形成双曲线。x²/a²−y²/b²=1中c²=a²+b²，焦点在x轴，e=c/a>1，渐近线y=±(b/a)x。正项所在轴决定实轴，a不一定大于b。"},{"name":"抛物线定义与参数","explanation":"到焦点与准线等距的点形成抛物线，焦点不能在准线上。标准式y²=2px（p>0）开口向右，焦点(p/2,0)、准线x=−p/2；x²=2py开口向上。焦点到准线的距离是p，不是p/2。"},{"name":"不同曲线的几何约束","explanation":"双曲线两个分支的距离差带符号，去绝对值要分支判断；抛物线上点到焦点距离等于到准线垂距，例如y²=2px时为x+p/2。求轨迹中仍要排除平方引入的错误区域。"}],"methods":["看平方项的符号和方向，统一参数定义，再用焦点性质简化。"],"pitfalls":["椭圆用c²=a²−b²，双曲线用c²=a²+b²，不可互换。"],"example":{"question":"【原创】抛物线y²=8x，求焦点、准线，以及P(2,4)到焦点距离。","solution":["2p=8得p=4，焦点(2,0)，准线x=−2。","P到准线距离2−(−2)=4，也可直接计算到(2,0)的距离。","焦点(2,0)，准线x=−2，PF=4。"],"answer":"焦点(2,0)，准线x=−2，PF=4。"},"practice":[{"question":"【原创】双曲线x²/9−y²/16=1的离心率？","answer":"5/3。","solution":"a=3,b=4,c=5，e=c/a。","level":"基础"},{"question":"【原创】双曲线y²/4−x²/9=1的渐近线？","answer":"y=±(2/3)x。","solution":"将右端改0，y²/4=x²/9，再取正负根。","level":"进阶"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H24","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"几何与代数","title":"圆锥曲线联立、弦长与参数","prerequisites":["H23","J32"],"goals":["能够解释并使用联立与韦达","能够解释并使用弦长表达","能够解释并使用参数结论的验证"],"concepts":[{"name":"联立与韦达","explanation":"直线代入二次曲线得到Ax²+Bx+C=0，A≠0且Δ>0时有两个不同横坐标根。根和−B/A、根积C/A可直接用于中点、弦长、面积，不必显式写复杂根式。竖直直线可直接设x=t，避免漏掉。"},{"name":"弦长表达","explanation":"若直线y=kx+m与曲线交于P、Q，弦长|PQ|=√(1+k²)|x₁−x₂|；|x₁−x₂|=√[(x₁+x₂)²−4x₁x₂]。这是两点距离公式和平方恒等式的组合，不是所有曲线都自动有两个实交点。"},{"name":"参数结论的验证","explanation":"参数定值、定点、最值问题常先用中点或垂直条件得到参数关系，再代回。计算中除去的量可能为0，必须单独讨论；由必要条件得到候选参数后，需验证其能产生真实图形。"}],"methods":["先列交点存在条件与特殊直线，再使用根和根积减少运算。"],"pitfalls":["联立后的最高次系数若为0，就不能继续直接套二次韦达。"],"example":{"question":"【原创】直线y=x与椭圆x²/4+y²=1交于P、Q，求弦长。","solution":["代入得(5/4)x²=1，x=±2/√5，横坐标差4/√5。","斜率k=1，距离乘√2。","弦长4√(2/5)，即4√10/5。"],"answer":"弦长4√(2/5)，即4√10/5。"},"practice":[{"question":"【原创】两点在y=2x+1上，横坐标差3，距离多少？","answer":"3√5。","solution":"纵坐标差6，距离√(9+36)。","level":"基础"},{"question":"【原创】求圆x²+y²=9中直线x=1截得的弦长。","answer":"4√2。","solution":"y=±√8=±2√2，竖直弦长度4√2；不需要斜率。","level":"进阶"},{"question":"【原创·分层】直线x=1与椭圆x²/9+y²/4=1交于P、Q。求交点坐标和弦长PQ。","answer":"P、Q为(1,4√2/3)、(1,−4√2/3)，弦长8√2/3。","solution":"直线竖直，不设不存在的斜率。直接把x=1代入椭圆：1/9+y²/4=1，故y²=32/9、y=±4√2/3。两点横坐标相同，距离等于纵坐标差的绝对值，即8√2/3。两个不同实数纵坐标同时确认了直线确实截得非退化弦。","level":"基础巩固"},{"question":"【原创·分层】直线y=x+b与抛物线y²=4x相交。求有两个不同交点的b的范围，并把对应弦长写成b的函数。另说明临界情形。","answer":"b\u003c1时有两个不同交点，弦长4√[2(1−b)]；b=1时相切，b>1时无实交点。","solution":"由直线得x=y−b，代入抛物线得到y²−4y+4b=0。这里二次项系数恒为1，不存在降次。判别式Δ=16−16b，故两不同实根要求b\u003c1。两纵坐标根之差的绝对值为√Δ=4√(1−b)。由于交点在斜率1的直线上，横坐标差等于纵坐标差，弦长是该差的√2倍，即4√[2(1−b)]。b=1时重根y=2、x=1，切线为y=x+1；b>1时判别式负，无实交点。","level":"条件变式"},{"question":"【原创·分层】椭圆x²/4+y²=1的一条弦以M=(1,0)为中点。求这条弦所在的直线方程和弦长，说明为什么仅设y=k(x−1)会漏解。","answer":"直线x=1，弦长√3。所有非竖直直线均不满足中点要求。","solution":"先检查竖直线x=1：椭圆给y=±√3/2，两交点的中点确为(1,0)，弦长√3。再证明没有其他直线：若非竖直直线过M，则可写y=k(x−1)。代入并乘4得(1+4k²)x²−8k²x+4k²−4=0。若有两个交点且中点横坐标为1，韦达定理要求x₁+x₂=2，即8k²/(1+4k²)=2；这推出8k²=2+8k²，矛盾。因此只可能是先前的竖直弦。斜截式不包含x=1，若只用该形式就会误判无解。","level":"综合应用"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第一册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H25","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"数列","title":"数列、递推、等差与等比","prerequisites":["H06","H04"],"goals":["能够解释并使用数列与递推","能够解释并使用等差数列","能够解释并使用等比数列"],"concepts":[{"name":"数列与递推","explanation":"数列是定义在正整数或其有限初段上的函数，通项aₙ直接依赖n，递推式通过前项定义后项并需初值。数列求和符号Sₙ=Σₖ₌₁ⁿaₖ；a₁=S₁，而n≥2时aₙ=Sₙ−Sₙ₋₁，不能把n=1套进未定义的S₀。"},{"name":"等差数列","explanation":"若aₙ₊₁−aₙ=d恒定，则aₙ=a₁+(n−1)d；Sₙ=n(a₁+aₙ)/2，由首尾配对得到。等差中项2b=a+c，等距下标项和相同。项数n必须为正整数，解方程算出的非整数下标没有意义。"},{"name":"等比数列","explanation":"通常各项非零且aₙ₊₁/aₙ=q恒定，aₙ=a₁q^(n−1)。q≠1时Sₙ=a₁(1−qⁿ)/(1−q)，q=1时Sₙ=na₁。q\u003c0时项交替变号，不能因|q|>1就称数列整体递增。"}],"methods":["先判断数列类型与下标范围，求和式涉及q−1时保留q=1分支。"],"pitfalls":["把aₙ与Sₙ混用，会把单项大小错当累计和。"],"example":{"question":"【原创】等差数列a₁=3、d=2，求a₁₀、S₁₀。","solution":["通项a₁₀=3+9×2=21。","S₁₀=10(3+21)/2。","a₁₀=21，S₁₀=120。"],"answer":"a₁₀=21，S₁₀=120。"},"practice":[{"question":"【原创】等比数列首项2、公比3，前4项和？","answer":"80。","solution":"2+6+18+54=80，或2(3⁴−1)/(3−1)。","level":"基础"},{"question":"【原创】Sₙ=n²+2n，求通项。","answer":"aₙ=2n+1。","solution":"n≥2做差得2n+1；n=1时S₁=3亦符合，统一成立。","level":"进阶"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H26","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"数列","title":"数列求和与递推转化","prerequisites":["H25"],"goals":["能够解释并使用裂项相消","能够解释并使用错位相减","能够解释并使用构造等比与累加累乘"],"concepts":[{"name":"裂项相消","explanation":"将一项拆成相邻差，如1/[n(n+1)]=1/n−1/(n+1)，求和时中间项抵消。核心是先找到可验证的恒等分解，再写首尾几项看边界，而不是只记得‘最后剩两项’。分母和下标范围需合法。"},{"name":"错位相减","explanation":"当aₙ为多项式因子乘等比因子时，设S=Σnqⁿ，乘q后错位相减，把次数降下来。q=1必须另用普通整数和。相减时下标首末端最易漏项，建议对齐写出。"},{"name":"构造等比与累加累乘","explanation":"递推aₙ₊₁=qaₙ+b可找固定点L=b/(1−q)，q≠1时aₙ₊₁−L=q(aₙ−L)，于是平移后等比。差分递推适合累加，比值递推可累乘但不得除以0。每一步转化都要携带初值。"}],"methods":["看相邻差、相邻比或乘一个常数后是否简化，并用n=1、2验证结果。"],"pitfalls":["错位相减公式若分母含q−1，q=1时不能代入。"],"example":{"question":"【原创】求Σₖ₌₁ⁿ 1/[k(k+1)]。","solution":["每项1/[k(k+1)]=1/k−1/(k+1)。","相加：(1−1/2)+(1/2−1/3)+…+(1/n−1/(n+1))。","和为1−1/(n+1)=n/(n+1)。"],"answer":"和为1−1/(n+1)=n/(n+1)。"},"practice":[{"question":"【原创】a₁=1，aₙ₊₁=2aₙ+3，求aₙ。","answer":"aₙ=4·2^(n−1)−3。","solution":"固定点−3，令bₙ=aₙ+3，则b₁=4，bₙ₊₁=2bₙ。","level":"基础"},{"question":"【原创】求1+2+…+n。","answer":"n(n+1)/2。","solution":"首尾配对每对和n+1，将正反两个求和式相加得2S=n(n+1)。","level":"进阶"},{"question":"【原创·分层】n为正整数，求Sₙ=Σₖ₌₁ⁿ 1/[(2k−1)(2k+1)]，写出裂项后的首尾。","answer":"Sₙ=n/(2n+1)。","solution":"验证裂项：1/(2k−1)−1/(2k+1)=2/[(2k−1)(2k+1)]，所以原项是该差的1/2。求和得Sₙ=(1/2)[(1−1/3)+(1/3−1/5)+…+(1/(2n−1)−1/(2n+1))]。中间项抵消，剩(1/2)(1−1/(2n+1))=n/(2n+1)。n=1时原式1/3与公式一致。","level":"基础巩固"},{"question":"【原创·分层】a₁=2，aₙ₊₁=q aₙ+1，其中q>0为常数、n为正整数。分别求q=1与q≠1时的通项。","answer":"q=1时aₙ=n+1；q≠1时aₙ=L+(2−L)q^(n−1)，其中L=1/(1−q)。","solution":"q=1时递推成为aₙ₊₁−aₙ=1，为首项2、公差1的等差数列，所以aₙ=2+n−1=n+1。q≠1时寻找L使L=qL+1，解得L=1/(1−q)。两边减L得到aₙ₊₁−L=q(aₙ−L)。令bₙ=aₙ−L，则b₁=2−L，递推相乘给bₙ=(2−L)q^(n−1)，从而得到通项。即使b₁=0，等式递推仍成立，此时bₙ恒为0，无需称其为各项非零的等比数列。最后代n=1得到2，检查初值正确。","level":"条件变式"},{"question":"【原创·分层】设Sₙ=Σₖ₌₁ⁿ k/2ᵏ，n为正整数。用错位相减求Sₙ，再求使Sₙ>1.9的最小n。","answer":"Sₙ=2−(n+2)/2ⁿ；最小n为7。","solution":"写Sₙ=1/2+2/2²+…+n/2ⁿ，再写Sₙ/2=1/2²+2/2³+…+n/2ⁿ⁺¹。两式按相同分母对齐相减，得Sₙ/2=1/2+1/2²+…+1/2ⁿ−n/2ⁿ⁺¹。前面的等比和为1−1/2ⁿ，因此Sₙ/2=1−(n+2)/2ⁿ⁺¹，即Sₙ=2−(n+2)/2ⁿ。因Sₙ₊₁−Sₙ=(n+1)/2ⁿ⁺¹>0，Sₙ严格递增。算S₆=2−8/64=1.875\u003c1.9，S₇=2−9/128=1.9296875>1.9，所以最小n为7；单凭找到n=7还不足以证明它最小，单调性补齐了这一点。","level":"综合应用"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H27","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"函数与导数","title":"导数定义、求导法则与切线","prerequisites":["H05","H11","H07"],"goals":["能够解释并使用导数的定义","能够解释并使用基本导数与条件","能够解释并使用运算法则与切线"],"concepts":[{"name":"导数的定义","explanation":"f在x₀的导数是差商[f(x₀+h)−f(x₀)]/h当h→0的有限极限。h≠0，极限若存在说明瞬时变化率确定；几何上为非竖直切线斜率。可导必连续，连续未必可导，如|x|在0有尖角。极限严格基础见A02起。"},{"name":"基本导数与条件","explanation":"(xⁿ)′=nxⁿ⁻¹，(eˣ)′=eˣ，(ln x)′=1/x（x>0），(sin x)′=cos x，(cos x)′=−sin x（三角自变量为弧度）。一般幂xᵅ在x>0可用幂规则，其他允许区间需按具体幂讨论。"},{"name":"运算法则与切线","explanation":"(uv)′=u′v+uv′，(u/v)′=(u′v−uv′)/v²（v≠0），复合函数[f(g(x))]′=f′(g(x))g′(x)。在切点x₀，切线y=f(x₀)+f′(x₀)(x−x₀)；过某点的切线不一定切于该点。"}],"methods":["先写定义域，再判运算结构与复合层次；切线计算切点值和斜率两项。"],"pitfalls":["(uv)′不是u′v′；(f(g))′不能漏内层导数。"],"example":{"question":"【原创】求f(x)=x²ln x在x=1处的切线。","solution":["定义域x>0，乘积法则得f′=2xln x+x。","f(1)=0，f′(1)=1。","切线y=x−1。"],"answer":"切线y=x−1。"},"practice":[{"question":"【原创】求(3x+1)⁴的导数。","answer":"12(3x+1)³。","solution":"外层四次幂求导，再乘内层导数3。","level":"基础"},{"question":"【原创】y=x³在x=0处导数0，能说该点是极值吗？","answer":"不能。","solution":"f′=3x²，0两侧均非负，函数持续递增；导数0只是可能的极值候选。","level":"进阶"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"H28","stage":"高中","grade":"选择性必修（建议高二至高三）","courseType":"选择性必修","domain":"函数与导数","title":"导数与单调、极值、最值","prerequisites":["H27","H03"],"goals":["能够解释并使用导数符号与单调","能够解释并使用极值与候选点","能够解释并使用闭区间最值"],"concepts":[{"name":"导数符号与单调","explanation":"在一个区间内可导且f′>0则严格递增，f′\u003c0则严格递减；f′≥0给不减，若要严格递增还需排除非退化区间上恒为0等情况。单调性依据中值定理，不能把离散样本的导数符号代替整个区间。"},{"name":"极值与候选点","explanation":"内点若可导且取得局部极值则f′=0，这是必要非充分条件。符号从+变−得极大，从−变+得极小；导数不存在点也可能有极值，如|x|的0。端点在闭区间最值中也必须检查。"},{"name":"闭区间最值","explanation":"函数在[a,b]连续时有最大最小值；可用端点、区间内导数0及不可导点的函数值比较。若区间开放或无界，需分析边界极限，上下界可能不取到；将下确界误当最小值是常见错误。"}],"methods":["列定义域断点与导数零点，画符号表，再比较所有允许候选值。"],"pitfalls":["f′(a)=0不能直接推出极值。"],"example":{"question":"【原创】f(x)=x³−3x在[−2,2]上求最大最小值。","solution":["f′=3(x−1)(x+1)，候选内点−1、1。","f(−2)=−2，f(−1)=2，f(1)=−2，f(2)=2。","最大值2（x=−1或2），最小值−2（x=−2或1）。"],"answer":"最大值2（x=−1或2），最小值−2（x=−2或1）。"},"practice":[{"question":"【原创】f(x)=x²在(0,1)有最小值吗？","answer":"没有，下确界为0。","solution":"x可任意接近0但不等于0，因此最小输出0无法取到。","level":"基础"},{"question":"【原创】f′在x=a左正右负，a为内点且f连续，什么极值？","answer":"局部极大。","solution":"左侧增向a，右侧从a递减，附近值不超过f(a)。","level":"进阶"},{"question":"【原创·分层】求f(x)=x+4/x在闭区间[1,5]上的最大值和最小值。","answer":"最小值4，在x=2取得；最大值29/5，在x=5取得。","solution":"函数在[1,5]连续、内部可导。f′(x)=1−4/x²=(x−2)(x+2)/x²，在(1,2)为负、(2,5)为正，所以x=2是极小值候选。还必须比较端点：f(1)=5、f(2)=4、f(5)=29/5。三者比较得到最小4、最大29/5。仅解f′=0只能找内点候选，不能漏掉给出最大值的右端点。","level":"基础巩固"},{"question":"【原创·分层】求实数a的范围，使f(x)=x³−3ax在R上严格递增。特别讨论导数在某点等于0的情况。","answer":"a≤0。a=0时导数在0为0，但函数仍严格递增。","solution":"f′(x)=3(x²−a)。若a\u003c0，所有x处导数均正，因此严格递增。若a=0，f=x³；任取x₁\u003cx₂，有f(x₂)−f(x₁)=(x₂−x₁)(x₂²+x₁x₂+x₁²)。第二因子=(x₂+x₁/2)²+3x₁²/4，除两数同为0外为正；x₁\u003cx₂排除了两数同为0，因此差严格为正。若a>0，则在(−√a,√a)上导数为负，存在递减区间，不可能在R严格递增。综上a≤0，不能把处处f′>0误当严格递增的必要条件。","level":"条件变式"},{"question":"【原创·分层】从边长12厘米的正方形纸板四角各剪去边长x厘米的小正方形，将四边折起做无盖盒子，不计纸厚。求体积最大时x及最大体积，并解释求导得到x=6为什么不能当作有效盒子。","answer":"x=2厘米，最大体积128立方厘米；x=6导致底边为0，超出有效定义域。","solution":"盒高为x，底边为12−2x，必须两者都正，故0\u003cx\u003c6。体积V=x(12−2x)²=144x−48x²+4x³。求导V′=144−96x+12x²=12(x−2)(x−6)。在(0,2)两因子都负，导数正；在(2,6)一正一负，导数负。因此体积先增后减，在允许内点x=2取全局最大值，V(2)=2×8²=128。x=6虽使导数表达式为0，却不在定义域且底边为0；当x趋近0或6时体积趋近0，也与最大值判断一致。","level":"综合应用"}],"mastery":["能完整写出公式成立条件并给出不满足条件的例子","独立完成变式题并检验"],"sources":[{"title":"人教A选择性必修第二册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"illustrations":[{"moduleId":"H28","title":"极值与闭区间最值：别漏端点","caption":"f(x)=x³−3x，范围[−2,2]。导数在(−2,−1)、(1,2)为正，在(−1,1)为负。两个驻点与两个端点的函数值都要比较；本例最大值、最小值各在两处取得。","file":"图解/H28.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"H28-title H28-desc\">\u003ctitle id=\"H28-title\">极值与闭区间最值：别漏端点\u003c/title>\u003cdesc id=\"H28-desc\">f(x)=x³−3x，范围[−2,2]。导数在(−2,−1)、(1,2)为正，在(−1,1)为负。两个驻点与两个端点的函数值都要比较；本例最大值、最小值各在两处取得。\u003c/desc>\u003cdefs>\u003cclipPath id=\"H28-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">极值与闭区间最值：别漏端点\u003c/text>\u003cline x1=\"72\" y1=\"217.5\" x2=\"557\" y2=\"217.5\" class=\"axis\"/>\u003cline x1=\"314.5\" y1=\"55\" x2=\"314.5\" y2=\"380\" class=\"axis\"/>\u003ctext x=\"566\" y=\"221.5\" class=\"label\">x\u003c/text>\u003ctext x=\"296.5\" y=\"51\" class=\"label\">y\u003c/text>\u003cpolyline points=\"112.41666666666666,325.8333333333333 114.4375,316.21290000000005 116.45833333333333,306.8498666666666
