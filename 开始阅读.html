03c/text>\u003ctext x=\"347.5869565217392\" y=\"279.9868421052631\" class=\"label\">(2.5,6.25)\u003c/text>\u003ctext x=\"499.7391304347826\" y=\"89.21052631578948\" class=\"label\">(4,16)\u003c/text>\u003ctext x=\"588\" y=\"160\" class=\"small\">绿：曲线\u003c/text>\u003ctext x=\"588\" y=\"198\" class=\"small\">棕：割线\u003c/text>\u003ctext x=\"588\" y=\"236\" class=\"small\">虚：切线\u003c/text>\u003ctext x=\"72\" y=\"420\" class=\"label\">“存在至少一点”不等于“每一点”，也不保证唯一。\u003c/text>\u003c/svg>"}],"selfStudy":{"moduleId":"A06","entryCheck":{"question":"f(t)=|t−1|在[0,2]连续，且f(0)=f(2)=1。能否直接用罗尔定理断言存在f′(c)=0？指出必须检查的条件。","answer":"不能直接使用；f在内点1不可微，其他内点导数分别为−1或1，没有导数为0的点。","explanation":"相同端值和连续只满足两项条件，还必须在整个开区间可微。一个满足前提的定理只能保证其结论；缺少前提时，需要单独分析，本例结论确实不成立。"},"intuition":"平均变化率是连接图象两端的割线斜率，瞬时变化率是切线斜率。中值定理说明，在连续连接且内部处处可微的路段上，某一处切线与割线平行。这是寻找证明的直观动机，不代替证明，也没有指定该点在区间正中间。","reasoning":[{"step":"1．先读清定理承诺的对象","detail":"给定a\u003cb，假设f在[a,b]连续、在(a,b)可微。要找到的是某个c∈(a,b)，满足f′(c)=[f(b)−f(a)]/(b−a)。定理不要求端点导数存在，也不要求导函数连续，更不承诺c唯一。"},{"step":"2．把一般斜率问题变成水平问题","detail":"记割线斜率m=[f(b)−f(a)]/(b−a)，割线函数为L(t)=f(a)+m(t−a)。设F(t)=f(t)−L(t)，是在每个位置扣掉割线高度；于是F(a)=F(b)=0，所需f′(c)=m正好变成F′(c)=0。辅助函数因此由目标反推而来。"},{"step":"3．说明罗尔定理为何能产生零导数","detail":"连续F在闭区间有最大、最小值，此处使用A04明确陈述的最值定理。若F恒为0，任意内点导数为0；若F不恒为0，它在某处为正或负，而端点皆为0，因此相应的正最大值或负最小值只能在内部取得。"},{"step":"4．把内部极值转换成零导数","detail":"以内部极大点c为例：h>0足够小时，[F(c+h)−F(c)]/h≤0；h\u003c0时差商≥0。左右差商若收敛到同一导数，只能取0。这就是费马引理。极小点同理；不可微点不能跳过“同一个导数存在”的条件。"},{"step":"5．还原中值定理结论","detail":"由F继承连续、可微条件，罗尔给出F′(c)=0。又F′(t)=f′(t)−m，故f′(c)=m。乘以非零的b−a，就得到f(b)−f(a)=f′(c)(b−a)。这里的c由存在性证明得到，不是预先随意挑选。"},{"step":"6．从中值定理得到可用的变化界","detail":"对同一区间内的x\u003cy，若f在[x,y]连续、内部可微且|f′(t)|≤M，则|f(y)−f(x)|=|f′(c)||y−x|≤M|y−x|。x=y时直接为0。不能跨越函数未定义的断点；也不能把只在一个点成立的导数界当作整个区间的界。"}],"workedWalkthrough":[{"step":"1．复述原卡例题并检查前提","detail":"原例：求f(t)=t²在[1,4]中的中值定理点c。多项式在整个实轴连续且可微，因此闭区间连续和开区间可微两项都满足，定理保证至少有一个所求点。"},{"step":"2．算区间平均变化率","detail":"f(1)=1，f(4)=16。纵向变化量为16−1=15，横向变化量为4−1=3，所以割线斜率m=15/3=5。此步不是求导，而是比较两个不同输入的函数值。"},{"step":"3．把存在性结论写成方程","detail":"f′(t)=2t。中值定理要求f′(c)=m，因此需要解2c=5，得到c=5/2。不要把f(c)=5当作所求条件；5是斜率，不是图象高度。"},{"step":"4．验证位置和等式","detail":"1\u003c5/2\u003c4，候选点确在开区间内。再代回：f′(5/2)(4−1)=5×3=15=f(4)−f(1)。候选值满足原定理的完整等式。"},{"step":"5．用辅助函数独立核对","detail":"割线为L(t)=1+5(t−1)=5t−4。扣除后F(t)=t²−5t+4=(t−1)(t−4)，两端均为0；F′(t)=2t−5在t=5/2为0，与前面的直接计算一致。"},{"step":"6．解释本例为什么不能代表所有函数","detail":"本例f′(t)=2t严格递增，所以斜率方程只给一个解，而且恰好是中点。对f(t)=t³在[−1,1]，平均斜率为1，3c²=1给c=±1/√3；中点0反而不是中值点。因此“本例是中点”和“定理规定中点”是不同命题。"}],"wrongApproach":{"claim":"中值定理中的“中值”就是区间中点，所以总取c=(a+b)/2。","whyWrong":"定理只说某个内部点。f(t)=t³在[−1,1]的平均斜率是1，但中点处f′(0)=0，不能满足等式；真正的两个点是±1/√3。","correction":"先核查定理条件，再求平均斜率m，解f′(c)=m并筛选a\u003cc\u003cb。即使无法显式解出c，定理仍可用于证明存在性或估计变化量。"},"exitCheck":{"question":"f(t)=t³在[0,2]的中值定理点是多少？c=1是否可行？","answer":"c=2/√3；c=1不可行。","explanation":"多项式满足前提。平均斜率(8−0)/2=4，3c²=4得到±2/√3，只有正值落在(0,2)；而f′(1)=3≠4。"},"remediation":[{"difficulty":"把函数值、割线斜率和导数混为一谈","moduleId":"H27","action":"分别计算t²在t=1的值、[1,4]割线斜率和t=1的导数，并用一句话解释三个数对应什么。"},{"difficulty":"不知道为何极值一定能取到","moduleId":"A04","action":"回看闭、有界、连续三项条件，并比较[0,1]上的x与(0,1)上的x；记清本库此处接受最值定理而未从紧致性证明。"},{"difficulty":"不理解不可微点为何不能用费马引理","moduleId":"A05","action":"对|t−1|在1处分别计算左右差商，观察两个极限为何不能合成一个导数。"}],"auditNotes":[{"severity":"澄清","finding":"原证明的辅助函数正确，但构造动机被省略。","resolution":"从减去割线使两端同高推导F，并逐步接到罗尔定理。"},{"severity":"澄清","finding":"原例中值点恰为中点，可能诱发过度概括。","resolution":"增加x³的非中点与多解反例，并明确存在性不等于唯一性。"},{"severity":"澄清","finding":"原卡“完整证明”仍以闭区间最值定理为基础。","resolution":"写明这项前置在A04被接受而未展开，不把直观或图像当作该基础定理的证明。"}]}},{"id":"A07","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"微积分","title":"泰勒公式：高阶近似与余项控制","prerequisites":["A06","H31"],"goals":["明确基础对象及定理假设","复述公式推导与误差或等号条件","完成例题与自测"],"concepts":[{"name":"高阶导数与阶乘","explanation":"f⁽ᵏ⁾表示连续求k次导数，f⁽⁰⁾=f；k!=1·2·…·k，0!=1。以a为中心的n阶多项式Pₙ(x)=Σ(k=0…n) f⁽ᵏ⁾(a)(x−a)ᵏ/k!，在a处与f的前n阶导数匹配。"},{"name":"余项才决定精度","explanation":"Rₙ(x)=f(x)−Pₙ(x)是精确差值。写f≈Pₙ时须给x的区间及误差界；无穷可导也不自动等于其泰勒级数，后者还要求Rₙ→0。"},{"name":"基础假设的层次","explanation":"本卡采用容易核查的充分条件f∈Cⁿ⁺¹(I)，即直到n+1阶导数都在包含a、x的区间连续。定理可以在更弱条件下成立，但不能不加区分地省略条件。"}],"theorem":{"name":"带拉格朗日余项的泰勒公式","assumptions":["n≥0为整数，f∈Cⁿ⁺¹(I)。","a、x∈I，x≠a；I为区间。"],"statement":"存在ξ严格介于a与x之间，使f(x)=Pₙ(x)+f⁽ⁿ⁺¹⁾(ξ)(x−a)ⁿ⁺¹/(n+1)!。x=a时余项为0。","proofLevel":"完整证明（反复罗尔定理）","proof":["固定x，令K=[f(x)−Pₙ(x)]/(x−a)ⁿ⁺¹；设F(t)=f(t)−Pₙ(t)−K(t−a)ⁿ⁺¹。","有F(x)=0，且F(a)=F′(a)=…=F⁽ⁿ⁾(a)=0。","先对a、x间用罗尔得F′的一处零点；再把该零点与a处F′=0配对。重复n+1次，得到区间内ξ使F⁽ⁿ⁺¹⁾(ξ)=0。","Pₙ的n+1阶导数为0，所以K=f⁽ⁿ⁺¹⁾(ξ)/(n+1)!，代回定义即得。"]},"derivation":["若区间内|f⁽ⁿ⁺¹⁾|≤M，则直接取绝对值得|Rₙ(x)|≤M|x−a|ⁿ⁺¹/(n+1)!。","对cos x在a=0取n=3，P₃=1−x²/2，因为奇数阶系数为0。","四阶导数cos x的绝对值≤1，因此|cos x−(1−x²/2)|≤|x|⁴/24；不是凭感觉判断“小量可忽略”。"],"methods":["对照定理逐项检查假设，区分精确等式、近似及单向不等式。"],"pitfalls":["ξ是存在但通常未知的中间点，不能直接替成a或x当成精确等式。"],"example":{"question":"【原创】用1−x²/2估算cos0.2（弧度），给误差上界。","solution":["近似值1−0.2²/2=0.98。","用三阶泰勒公式，四阶导数绝对值≤1。","误差≤0.2⁴/24=1/15000，约0.00006667。"],"answer":"约0.98，绝对误差不超过1/15000。"},"practice":[{"question":"【原创】写sin x在0处三阶泰勒多项式。","answer":"x−x³/6。","solution":"各阶导数在0处依次0、1、0、−1，除以对应阶乘。","level":"基础"},{"question":"【原创】仅有f可微，能否直接使用三阶泰勒的四阶导数余项？","answer":"不能。","solution":"现有前提不能保证二至四阶导数存在；需补充光滑性条件。","level":"进阶"},{"question":"【原创·分层】对f(t)=t³，在a=1处写二阶泰勒多项式P₂(t)，并求精确余项R₂(t)。","answer":"P₂(t)=1+3(t−1)+3(t−1)²，R₂(t)=(t−1)³。","solution":"f(1)=1，f′(1)=3，f″(1)=6，除以2!得到二次项系数3。因为f‴(ξ)=6在任何点都相同，拉格朗日余项为6(t−1)³/3!=(t−1)³。也可把t写成1+h，直接展开(1+h)³核对；这次余项可精确计算，不只是误差上界。","level":"基础巩固"},{"question":"【原创·分层】f(t)=|t|³在0附近具有连续的二阶导数。能否直接使用本卡n=2、要求f∈C³的泰勒版本？不能使用是否就说明任何二阶余项表达都一定错误？","answer":"不能直接套本卡C³版本；也不能据此断言所有具体余项表达都错误。","solution":"t>0时f=t³，t\u003c0时f=−t³，f′(t)=3t|t|，f″(t)=6|t|，并且两式在0连续。但f″在0的左右导数分别为−6和6，f‴(0)不存在，故不满足本卡的充分条件。此时P₂(t)=0、实际误差为|t|³；我们仍能直接描述误差。缺少充分条件与结论必假是两件事。","level":"条件变式"},{"question":"【原创·分层】估算cos0.3，目标绝对误差不超过10⁻⁵。使用1−x²/2及原卡四阶余项上界能否保证目标？若不能，增加一个非零项并给出足够小的误差保证。","answer":"原保证界0.0003375不能保证目标。改用1−x²/2+x⁴/24，在0.3处为0.9553375，绝对误差≤0.0000010125\u003c10⁻⁵。","solution":"仅用1−x²/2，对n=3公式的保证界为0.3⁴/24=0.0003375，大于目标；这里只说该界不能保证，不把“上界大”当作实际误差一定大。加入x⁴/24后，可取n=5，因为五次项系数为0。cos的六阶导数为−cos，绝对值≤1，所以误差≤0.3⁶/6!=0.000729/720=0.0000010125。近似值为1−0.045+0.0003375=0.9553375，达到保证要求。","level":"综合应用"}],"mastery":["能说明公式为何成立及何时不能用","能独立完成练习并检查结果"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-2/pages/6-3-taylor-and-maclaurin-series","locator":"泰勒与余项条件核查；证明结构和数值训练独立编写。"}],"selfStudy":{"moduleId":"A07","entryCheck":{"question":"设f(t)=cos t，列出f、f′、f″、f‴、f⁽⁴⁾，以及前四项在t=0的值。","answer":"依次为cos t、−sin t、−cos t、sin t、cos t；f(0)、f′(0)、f″(0)、f‴(0)依次为1、0、−1、0。","explanation":"三角求导以弧度为单位。三次项系数为0，不表示四阶导数为0，也不表示余项消失；先掌握逐次求导再进入余项估计。"},"intuition":"泰勒多项式让一个容易计算的多项式，在展开中心与原函数的函数值、斜率和更高阶变化逐项匹配。匹配越多，只说明局部信息更多；真正保证近似精度的是余项。这是直观动机，不代替余项公式的证明，更不能把多次接触图象理解成处处相等。","reasoning":[{"step":"1．分清中心、阶数与变化量","detail":"中心是固定的a，目标输入是x，变化量为h=x−a。n是采用公式的阶数。Pₙ(x)=Σ(k=0…n)f⁽ᵏ⁾(a)hᵏ/k!；“n阶泰勒多项式”的实际次数可能小于n，因为某些系数可以为0。"},{"step":"2．解释系数中为何有阶乘","detail":"若多项式含cₖ(t−a)ᵏ，连续求k次导数后在a处得到k!cₖ；次数更高的项仍含t−a，取t=a后为0，次数更低的项已被求成0。因此选cₖ=f⁽ᵏ⁾(a)/k!，就能逐阶匹配导数。"},{"step":"3．先满足可用版本的条件","detail":"本卡采用f∈Cⁿ⁺¹(I)的充分条件：相关区间内直到n+1阶导数存在并连续；要估计的整段必须包含于I。仅在中心可导，或只知道一阶导数，都不够直接套这个版本。条件未满足只代表此版本不能保证结论，并不自动说明某个具体公式必错。"},{"step":"4．固定目标点后设计零点","detail":"当x≠a，先固定这个目标点x，再令K=[f(x)−Pₙ(x)]/(x−a)ⁿ⁺¹。此时K是常数，证明中真正变化的变量另记t。令F(t)=f(t)−Pₙ(t)−K(t−a)ⁿ⁺¹，就同时得到F(x)=0以及F(a)=F′(a)=…=F⁽ⁿ⁾(a)=0。"},{"step":"5．展开反复罗尔的连接","detail":"F在a、x为0，第一次罗尔在两者之间找到F′的零点c₁。若n≥1，F′在a也为0，于a与c₁之间再找F″的零点c₂。依次进行，利用F⁽ʲ⁾(a)=0（j≤n），最终得到F⁽ⁿ⁺¹⁾(ξ)=0。n=0只需第一次罗尔，无需假定F′(a)=0。"},{"step":"6．由零导数还原精确余项","detail":"Pₙ的n+1阶导数为0，而K(t−a)ⁿ⁺¹的n+1阶导数为K(n+1)!。所以0=F⁽ⁿ⁺¹⁾(ξ)=f⁽ⁿ⁺¹⁾(ξ)−K(n+1)!，得到Rₙ(x)=f⁽ⁿ⁺¹⁾(ξ)(x−a)ⁿ⁺¹/(n+1)!。ξ存在于a与x之间，但通常不知道其值，且可能随x、n变化。"},{"step":"7．把未知ξ换成已知保证界","detail":"如果整段上|f⁽ⁿ⁺¹⁾(t)|≤M，那么无论定理给哪个ξ，都有|Rₙ(x)|≤M|x−a|ⁿ⁺¹/(n+1)!。右边是保证上界，不是实际误差。必须取控制整段的M，不能只用中心处的导数值代替。"},{"step":"8．区分有限公式和无穷展开","detail":"固定n的泰勒公式带着余项，是精确等式。若要令n无限增加并去掉余项，还必须证明Rₙ(x)→0。无穷可导本身不足以保证等于泰勒级数；有限阶近似无需提前作这种额外承诺。"}],"workedWalkthrough":[{"step":"1．明确原例输入和目标","detail":"原例：用1−x²/2估算cos0.2，并给误差上界。0.2表示弧度，展开中心选a=0；因为0.2接近0且cos在0的导数容易计算，这个中心合适。"},{"step":"2．列出会用到的导数","detail":"f=cos，f′=−sin，f″=−cos，f‴=sin，f⁽⁴⁾=cos。前三阶在0的值为1、0、−1、0，且各阶导数在[0,0.2]连续，满足n=3版本的充分条件。"},{"step":"3．解释为何可选三阶","detail":"P₃(x)=1+0·x−x²/2!+0·x³/3!=1−x²/2。虽然这个表达式只有二次项，仍是合法的三阶泰勒多项式。选择n=3便能得到四次幂量级的余项，而不是把零三次项当作余项。"},{"step":"4．计算近似值","detail":"代x=0.2=1/5，P₃(0.2)=1−(1/5)²/2=1−1/50=49/50=0.98。到这一步只获得近似数，还没有获得精度保证。"},{"step":"5．计算绝对误差上界","detail":"四阶导数为cos t，其绝对值在整段上≤1，故可取M=1。|R₃(0.2)|≤(1/5)⁴/4!=1/(625×24)=1/15000，约0.00006667。近似值0.98与保证误差界应一同报告。"},{"step":"6．进一步判断误差方向","detail":"ξ∈(0,0.2)，这里cosξ>0，所以R₃(0.2)=cosξ/15000>0。又cosξ\u003c1，因此0.98\u003ccos0.2\u003c0.98+1/15000。原卡的双向绝对误差保证正确，这里进一步说明0.98略低估实际值。"},{"step":"7．检查这次计算到底证明了什么","detail":"已证明的是某个确定近似的误差不超过1/15000；没有证明实际误差恰为1/15000，也没有求出ξ。可以用计算器作合理性核对，但计算器显示的若干小数不能替代整段导数界给出的证明。"}],"wrongApproach":{"claim":"三次项系数为0，所以三阶展开后就没有误差，cos x=1−x²/2。","whyWrong":"系数为0只意味着对应的一项不出现。最简单的反例是f(x)=x⁴在0的三阶泰勒多项式为0，但原函数在x≠0时不是0；误差全在四阶及更高变化中。","correction":"无论某个系数是否为0，都保留Rₙ。选定n后核查第n+1阶导数，在目标区间内找到M，再报告绝对误差保证。"},"exitCheck":{"question":"用x−x³/6估算sin0.1。说明为什么可取n=4，并给保证误差上界。","answer":"近似值599/6000≈0.0998333333；绝对误差≤1/12000000≈8.3333×10⁻⁸。","explanation":"sin的四阶导数在0为0，故P₄仍为x−x³/6；五阶导数为cos，整段绝对值≤1。余项界为0.1⁵/5!=1/12000000。"},"remediation":[{"difficulty":"不熟悉反复求导和复合求导","moduleId":"H27","action":"写出sin、cos连续五次求导的循环，再计算在0的值；将求导顺序与代入顺序分开。"},{"difficulty":"不理解为什么必有未知ξ","moduleId":"A06","action":"用两次罗尔画出F的两个零点、F′的两个零点与F″的一个零点，再推广到n+1次。"},{"difficulty":"把近似号当等号或不知道误差如何缩小","moduleId":"A05","action":"回看线性近似中的余项r(h)，区别“h小时误差趋0”和“误差恒为0”。"},{"difficulty":"把有限泰勒公式直接当无穷级数","moduleId":"A10","action":"在学完本卡后阅读部分和与余项趋0的要求，并尝试指出指数展开为何能去掉余项。"}],"auditNotes":[{"severity":"澄清","finding":"原例公式正确，但n=3与多项式次数2之间的区别没有单独展开。","resolution":"逐阶列系数并说明零系数不降低可用余项公式的阶数。"},{"severity":"澄清","finding":"证明同时使用x、t、K、ξ，初学者可能把K误看成随t变化。","resolution":"先固定目标点x，再引入证明变量t及常数K，并逐次解释罗尔零点链。"},{"severity":"澄清","finding":"原卡给出误差上界，读者可能把它当作实际误差。","resolution":"将近似值、未知精确余项、绝对误差界和误差方向分别计算。"}]}},{"id":"A08","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"微积分","title":"定积分与微积分基本定理","prerequisites":["A02","A04","A06"],"goals":["明确基础对象及定理假设","复述公式推导与误差或等号条件","完成例题与自测"],"concepts":[{"name":"黎曼和与可积","explanation":"把[a,b]分割为小区间，取样点ξᵢ，求Σ f(ξᵢ)Δxᵢ。若当最大段长趋0时，无论怎样分割和选点均趋同一个数，就称黎曼可积，该数记∫ₐᵇ f(x)dx；并规定反向积分变号。"},{"name":"连续为何足够","explanation":"连续函数在闭区间上一致连续：一个δ可控制所有点的变化。于是分割足够细时，上和与下和之差≤ε(b−a)，故黎曼可积。这里采用“一致连续与上下和判别”基础结果；不展开其紧致性证明。"},{"name":"有向面积和原函数","explanation":"积分累积带符号的量，函数为负的区域贡献负值。几何总面积是∫|f|。F′=f的F叫原函数，同一区间内任意两个原函数只差常数，这来自中值定理。"}],"theorem":{"name":"微积分基本定理（连续函数版本）","assumptions":["f在[a,b]连续，a\u003cb。","A(x)=∫ₐˣf(t)dt。"],"statement":"内部点有A′(x)=f(x)。若F在[a,b]连续、在(a,b)满足F′=f，则∫ₐᵇf=F(b)−F(a)。","proofLevel":"完整核心证明（已接受黎曼积分性质及连续函数可积）","proof":["[A(x+h)−A(x)]/h是f在x与x+h之间的平均值。","其与f(x)的差的绝对值≤该小区间上|f(t)−f(x)|的上界。连续性使此界随h→0趋0，两侧h均适用。故A′=f。","若F′=f，则(F−A)′=0，中值定理给F−A在内部常值。为说明端点延伸：连续f在[a,b]有界，取|f|≤M，则|A(x)−A(y)|=|∫ᵧˣf(t)dt|≤M|x−y|，所以A在整个闭区间连续；再结合F的连续性将常数关系延至端点。","A(a)=0，从而F(b)−F(a)=A(b)=∫ₐᵇf。"]},"derivation":["幂函数xᵐ（m非负整数）的原函数是xᵐ⁺¹/(m+1)。","由基本定理得∫ₐᵇxᵐdx=(bᵐ⁺¹−aᵐ⁺¹)/(m+1)。","更一般的实幂必须考虑定义域；m=−1时不能除以0，应使用ln|x|且区间不能穿过0。"],"methods":["对照定理逐项检查假设，区分精确等式、近似及单向不等式。"],"pitfalls":["不是所有函数都黎曼可积；不能把端点发散的广义积分当普通定积分直接代入。"],"example":{"question":"【原创】比较∫₋₁² x dx与图象在该区间和x轴围成的面积。","solution":["有向积分=[x²/2]₋₁²=3/2。","总面积分成[−1,0]与[0,2]，分别积分−x与x。","得到1/2+2=5/2。"],"answer":"有向积分3/2；总面积5/2。"},"practice":[{"question":"【原创】求∫₀²(3x²+1)dx。","answer":"10。","solution":"原函数x³+x，上下限差为8+2=10。","level":"基础"},{"question":"【原创】求d/dx ∫₀ˣ² cos t dt。","answer":"2x cos(x²)。","solution":"先由基本定理对上限求导，再乘上限x²的导数2x。","level":"进阶"}],"mastery":["能说明公式为何成立及何时不能用","能独立完成练习并检查结果"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-1/pages/5-3-the-fundamental-theorem-of-calculus","locator":"基本定理核查；证明采用局部振幅估计，原创面积比较例。"}]},{"id":"A09","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"微积分","title":"换元积分与分部积分的推导","prerequisites":["A05","A08"],"goals":["明确基础对象及定理假设","复述公式推导与误差或等号条件","完成例题与自测"],"concepts":[{"name":"不定积分的含义","explanation":"∫f(x)dx表示一个区间上全部原函数F(x)+C；定积分是确定的数。算完不定积分可通过求导核对，算定积分还要核对新旧上下限。"},{"name":"换元条件","explanation":"若f连续、φ∈C¹([α,β])且φ的值落在f的定义区间内，则∫α^β f(φ(t))φ′(t)dt=∫φ(α)^φ(β) f(u)du。该复合型公式不要求φ单调；但若需反解变量并选择分支，就要另核对可逆区间。"},{"name":"分部积分的思路","explanation":"乘积求导(uv)′=u′v+uv′，积分后把一项移到另一边。选择u通常希望求导后变简单；选择dv则必须能找到相应v。记号du=u′dx是微分形式，不是任意删除dx。"}],"theorem":{"name":"分部积分公式","assumptions":["u、v在[a,b]上连续可微。"],"statement":"∫ₐᵇu(x)v′(x)dx=[u(x)v(x)]ₐᵇ−∫ₐᵇu′(x)v(x)dx。","proofLevel":"完整证明","proof":["由乘积法则(uv)′=u′v+uv′。","两边在[a,b]积分，基本定理给[uv]ₐᵇ=∫u′v+∫uv′。","移项得到公式；所有积分因连续性而存在。"]},"derivation":["换元公式的推导：取f的原函数F，则链式法则给(F∘φ)′=f(φ)φ′。","左边积分=F(φ(β))−F(φ(α))，也是右边积分，故相等。","例如∫₀¹2x cos(x²)dx，令u=x²，上下限变0与1，结果sin1。角度为弧度。"],"methods":["对照定理逐项检查假设，区分精确等式、近似及单向不等式。"],"pitfalls":["换元以后不能还用旧上下限却把变量当新变量计算。"],"example":{"question":"【原创】计算∫₀¹ x eˣ dx。","solution":["选u=x，v′=eˣ，因此u′=1，v=eˣ。","分部积分得[xeˣ]₀¹−∫₀¹eˣdx。","结果e−(e−1)=1。"],"answer":"1。"},"practice":[{"question":"【原创】求∫2x/(1+x²)dx。","answer":"ln(1+x²)+C。","solution":"令u=1+x²>0，du=2x dx；积分1/u得ln u。","level":"基础"},{"question":"【原创】计算∫₁ᵉ ln x dx。","answer":"1。","solution":"取u=ln x、v′=1，原函数x ln x−x；上下限差0−(−1)=1。","level":"进阶"}],"mastery":["能说明公式为何成立及何时不能用","能独立完成练习并检查结果"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-2/pages/3-1-integration-by-parts","locator":"分部积分；换元另见Calculus Volume 1 §5.5。"}]},{"id":"A10","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"分析基础","title":"无穷级数、幂级数与展开的边界","prerequisites":["A02","A07","H26"],"goals":["明确基础对象及定理假设","复述公式推导与误差或等号条件","完成例题与自测"],"concepts":[{"name":"级数是部分和的极限","explanation":"Σ(n=0…∞)aₙ收敛指S_N=Σ(n=0…N)aₙ有有限极限。若收敛必有aₙ→0，因为aₙ=Sₙ−Sₙ₋₁；反向不成立，调和级数Σ1/n发散：每个倍增分组的和至少1/2。"},{"name":"绝对收敛","explanation":"若Σ|aₙ|收敛，称绝对收敛。绝对收敛允许重排和有限组拆分；一般条件收敛级数不允许任意重排而保持原和。本卡所用指数、正弦、余弦幂级数均绝对收敛。"},{"name":"幂级数与收敛半径","explanation":"幂级数收敛半径定理保证：对Σcₙ(x−a)ⁿ，存在R∈[0,∞]，在|x−a|\u003cR绝对收敛、|x−a|>R发散；若0\u003cR\u003c∞，两个实端点需分别检查。此结构定理与区间内部逐项求导在本卡作为陈述未证的延伸基础结果，不展开一致收敛证明。"}],"theorem":{"name":"无穷等比级数及尾项","assumptions":["实数或复数q满足|q|\u003c1。","从n=0起求和。"],"statement":"Σ(n=0…∞)qⁿ=1/(1−q)；部分和S_N=1+q+…+qᴺ共N+1项，余项为qᴺ⁺¹/(1−q)。","proofLevel":"完整证明","proof":["有限等比和S_N=(1−qᴺ⁺¹)/(1−q)。","|q|\u003c1保证qᴺ⁺¹→0，所以S_N→1/(1−q)。","总和减部分和得到qᴺ⁺¹/(1−q)；绝对值≤|q|ᴺ⁺¹/(1−|q|)。"]},"derivation":["由泰勒公式，eˣ的系数为1/n!，sin x为Σ(−1)ᵏx²ᵏ⁺¹/(2k+1)!，cos x为Σ(−1)ᵏx²ᵏ/(2k)!。","固定实数x时，eˣ的余项绝对值|R_N(x)|≤e^|x| |x|ᴺ⁺¹/(N+1)!；sin、cos的余项绝对值对应界也有阶乘分母。控制绝对值才能同时控制误差的正负方向。","阶乘使该界趋0：相邻界之比最终≤1/2，后续受收敛等比数列控制。因此这些展开确实等于函数，不只是形式配系数。"],"methods":["对照定理逐项检查假设，区分精确等式、近似及单向不等式。"],"pitfalls":["把1−1+1−1+…随意分组得到0或1并不是通常意义下的级数求和。"],"example":{"question":"【原创】求1+1/3+1/9+…，并给截至(1/3)⁴的误差。","solution":["q=1/3满足|q|\u003c1，总和=1/(1−1/3)=3/2。","截至指数4共有5项。","余项=(1/3)⁵/(1−1/3)=1/162。"],"answer":"总和3/2，误差1/162。"},"practice":[{"question":"【原创】Σ(n=0…∞)2ⁿ是否收敛？","answer":"发散。","solution":"项2ⁿ不趋0，也不满足等比级数|q|\u003c1条件。","level":"基础"},{"question":"【原创】1/(1−x)的幂级数Σxⁿ在x=−1是否收敛？","answer":"不收敛。","solution":"部分和交替1、0；边界不能从区间内部公式直接代入。","level":"进阶"}],"mastery":["能说明公式为何成立及何时不能用","能独立完成练习并检查结果"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-2/pages/5-2-infinite-series","locator":"级数定义和等比和核查；函数展开另参考§6.3，余项收敛理由已给。"}]},{"id":"A11","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"线性代数与不等式","title":"柯西—施瓦茨不等式与投影","prerequisites":["H13","H04"],"goals":["明确基础对象及定理假设","复述公式推导与误差或等号条件","完成例题与自测"],"concepts":[{"name":"实内积空间","explanation":"内积⟨u,v⟩把一对向量对应到实数，满足对称、线性、正定：⟨u,u⟩≥0且仅u=0时取0。普通Rⁿ中内积为Σuᵢvᵢ；长度||u||=√⟨u,u⟩。复空间还需共轭，本卡只证明实数版。"},{"name":"正交与投影","explanation":"⟨u,v⟩=0称正交。把u分为沿非零v的分量tv与垂直残差，投影系数t=⟨u,v⟩/||v||²，来自⟨u−tv,v⟩=0。"},{"name":"等号比背公式重要","explanation":"柯西不等式等号当且仅当u、v线性相关（含零向量）。要把一个代数上界称为最大值，需同时能满足原题约束与等号条件。"}],"theorem":{"name":"柯西—施瓦茨不等式（实内积版）","assumptions":["u、v属于同一实内积空间。"],"statement":"|⟨u,v⟩|²≤||u||²||v||²；等号当且仅当两向量线性相关。","proofLevel":"完整证明","proof":["v=0时两边为0，等号成立。以下设v≠0。","令t=⟨u,v⟩/||v||²，非负平方范数给0≤||u−tv||²=||u||²−⟨u,v⟩²/||v||²。","乘以正数||v||²得到不等式；等号等价于u−tv=0，恰是u为v的倍数。"]},"derivation":["代入u=(a₁,…,aₙ)、v=(b₁,…,bₙ)，得到(Σaᵢbᵢ)²≤(Σaᵢ²)(Σbᵢ²)。","取v=(1,…,1)，得到(Σaᵢ)²≤nΣaᵢ²。","这又说明Σ(aᵢ−平均数)²≥0；方差非负与向量长度非负是同一个结构。"],"methods":["对照定理逐项检查假设，区分精确等式、近似及单向不等式。"],"pitfalls":["不能省略平方／绝对值，就声称内积总是非负。"],"example":{"question":"【原创】x²+y²=4时，求3x+4y的最大值。","solution":["内积上界为√(3²+4²)√(x²+y²)=5×2=10。","等号需(x,y)为(3,4)的正倍数，结合长度2得(6/5,8/5)。","该点满足原条件且目标值10，因此上界可达。"],"answer":"10，在(6/5,8/5)取得。"},"practice":[{"question":"【原创】证明(a+b+c)²≤3(a²+b²+c²)。","answer":"对所有实数成立。","solution":"用向量(a,b,c)与(1,1,1)；等号a=b=c。","level":"基础"},{"question":"【原创】向量(2,1)在(1,0)上的投影是什么？","answer":"(2,0)。","solution":"系数内积2除以长度平方1，再乘(1,0)。","level":"进阶"}],"mastery":["能说明公式为何成立及何时不能用","能独立完成练习并检查结果"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/","locator":"课程中的正交、投影主线；本卡给出可独立核对的完整证明。"}],"illustrations":[{"moduleId":"A11","title":"投影：把向量拆成平行分量与垂直残差","caption":"示例u=(2,1)，v=(1,0)。投影系数t=(u·v)/||v||²=2，投影tv=(2,0)，残差u−tv=(0,1)与v正交。非负残差范数是正文柯西证明的关键；一般定理不依赖二维图形。","file":"图解/A11.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"A11-title A11-desc\">\u003ctitle id=\"A11-title\">投影：把向量拆成平行分量与垂直残差\u003c/title>\u003cdesc id=\"A11-desc\">示例u=(2,1)，v=(1,0)。投影系数t=(u·v)/||v||²=2，投影tv=(2,0)，残差u−tv=(0,1)与v正交。非负残差范数是正文柯西证明的关键；一般定理不依赖二维图形。\u003c/desc>\u003cdefs>\u003cclipPath id=\"A11-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">投影：把向量拆成平行分量与垂直残差\u003c/text>\u003cline x1=\"110\" y1=\"335\" x2=\"540\" y2=\"335\" class=\"axis\"/>\u003cline x1=\"110\" y1=\"335\" x2=\"110\" y2=\"85\" class=\"axis\"/>\u003cline x1=\"110\" y1=\"335\" x2=\"410\" y2=\"185\" class=\"line\"/>\u003cline x1=\"110\" y1=\"335\" x2=\"410\" y2=\"335\" class=\"highlight\"/>\u003cline x1=\"410\" y1=\"335\" x2=\"410\" y2=\"185\" class=\"dash\"/>\u003ccircle cx=\"410\" cy=\"185\" r=\"5\" fill=\"#245c4d\"/>\u003ccircle cx=\"410\" cy=\"335\" r=\"5\" fill=\"#245c4d\"/>\u003cline x1=\"390\" y1=\"335\" x2=\"390\" y2=\"315\" class=\"axis\"/>\u003cline x1=\"390\" y1=\"315\" x2=\"410\" y2=\"315\" class=\"axis\"/>\u003ctext x=\"87\" y=\"363\" class=\"label\">O\u003c/text>\u003ctext x=\"410\" y=\"165\" class=\"label\">u=(2,1)\u003c/text>\u003ctext x=\"325\" y=\"371\" class=\"label\">tv=(2,0)\u003c/text>\u003ctext x=\"430\" y=\"258\" class=\"label\">u−tv=(0,1)\u003c/text>\u003ctext x=\"178\" y=\"319\" class=\"label\">v=(1,0)\u003c/text>\u003ccircle cx=\"260\" cy=\"335\" r=\"5\" fill=\"#245c4d\"/>\u003ctext x=\"67\" y=\"419\" class=\"label\">v≠0才可以除以||v||²；v=0的情况要单独处理。\u003c/text>\u003c/svg>"}],"selfStudy":{"moduleId":"A11","entryCheck":{"question":"u=(2,1)、v=(1,0)。求u·v和||v||²；再求实数t，使u−tv与v垂直。","answer":"内积为2，||v||²=1，t=2。","explanation":"u−tv=(2−t,1)，与v点积为2−t，令它等于0得t=2。这就是把向量分成沿v的分量与垂直分量。"},"intuition":"一个向量在某个方向上的投影长度不可能超过它本身的长度，这可以帮助理解柯西不等式。但图形只展示二维情形，正式证明会用非负平方范数，因此可以适用于任意维实内积空间。","reasoning":[{"step":"先解释线性相关与零向量","detail":"两个向量线性相关，指存在不全为0的实数α、β，使αu+βv=0。当v≠0时，这等价于u是v的某个实数倍；若其中一个是零向量，也线性相关。负倍数和正倍数都包括在内。"},{"step":"单独处理会导致除零的情况","detail":"若v=0，内积和右侧的||v||²都是0，不等式为0≤0，等号成立。下面只讨论v≠0，此时正定性保证||v||²>0，可合法作分母。"},{"step":"为什么挑这个t而不是任意猜","detail":"希望残差u−tv与v正交：⟨u−tv,v⟩=⟨u,v⟩−t||v||²=0，所以唯一选择t=⟨u,v⟩/||v||²。这个t使残差成为去掉沿v分量后的部分。"},{"step":"把被压缩的一行完全展开","detail":"由对称性与双线性，||u−tv||²=⟨u−tv,u−tv⟩=||u||²−2t⟨u,v⟩+t²||v||²。代入t，后两项合并为−⟨u,v⟩²/||v||²。范数平方非负，所以0≤||u||²−⟨u,v⟩²/||v||²。"},{"step":"乘回正数，检查等号的每个方向","detail":"两边乘正数||v||²，得到⟨u,v⟩²≤||u||²||v||²。等号成立当且仅当残差范数为0，按正定性等价于u−tv=0，正好是线性相关。反过来若u=tv，代入也确实为等号。"},{"step":"平方不等式与最大值之间还差什么","detail":"开方先得到|⟨u,v⟩|≤||u||||v||，因而−||u||||v||≤⟨u,v⟩≤||u||||v||。要取正的最大值，需要同向的正倍数；负倍数通常给最小值。只有原约束允许那个向量，界才是最大值。"}],"workedWalkthrough":[{"step":"把目标式识别成内积","detail":"原题x²+y²=4，求3x+4y最大值。设u=(x,y)、v=(3,4)，则目标是u·v，约束给||u||=2，已知||v||=√(9+16)=5。"},{"step":"先找全局上界","detail":"柯西给|3x+4y|≤2×5=10，因此3x+4y≤10。到这里只证明不会超过10，尚未证明能够达到10。"},{"step":"把等号条件与约束联立","detail":"取正最大值要求u=λv且λ>0，即x=3λ、y=4λ。代入原约束9λ²+16λ²=4得25λ²=4，λ=±2/5。为正最大值取λ=2/5。"},{"step":"直接代回，不把候选当答案","detail":"得到(x,y)=(6/5,8/5)。其平方和(36+64)/25=4，符合约束；目标值18/5+32/5=10，确实达到上界，因此最大值为10。"},{"step":"说明另一个根的数学意义","detail":"λ=−2/5给(x,y)=(−6/5,−8/5)，它也满足柯西等号，但目标值是−10，对应最小值。不能仅写“两向量成比例”就结束最大值取等分析。"}],"wrongApproach":{"claim":"柯西等号要求(x,y)与(3,4)成比例，所以正负两个比例点都给最大值10。","whyWrong":"平方或绝对值会掩盖目标式的符号。负比例点使内积为负，达到的是−10而非10。","correction":"先从绝对值不等式分出上下界，再按最大值取同向、最小值取反向，并代回目标函数验证符号。"},"exitCheck":{"question":"实数x,y满足x²+y²=9，求x−2y的最大值及取等点。","answer":"最大值3√5，取等点(3/√5,−6/√5)。","explanation":"取v=(1,−2)，其模为√5，u模为3，故目标≤3√5。正比例u=λv且5λ²=9，取λ=3/√5。该点平方和为9，目标为15/√5=3√5。"},"remediation":[{"difficulty":"内积展开时不会处理系数","moduleId":"H13","action":"先在二维坐标中逐项展开，再对应到内积的线性和对称性质。"},{"difficulty":"把上界当作最大值","moduleId":"H04","action":"重做限定范围x≥4时x+9/x的题，练习检验取等点是否允许。"}],"auditNotes":[{"severity":"澄清","finding":"原证明正确，但投影系数选择、范数展开和取等符号压缩在少数行内。","resolution":"补出线性相关定义、选择t的动机、展开过程、零向量分支和正负等号区别。"}]}},{"id":"A12","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"函数与不等式","title":"凸函数与詹森不等式","prerequisites":["H04","A01","A06"],"goals":["明确基础对象及定理假设","复述公式推导与误差或等号条件","完成例题与自测"],"concepts":[{"name":"凸性定义","explanation":"f在区间I上凸，指对x,y∈I及0≤t≤1，有f(tx+(1−t)y)≤tf(x)+(1−t)f(y)。图象位于连接两点的弦下方；“凸”不等于“递增”。严格凸把不同x,y及0\u003ct\u003c1时的不等号改为严格。"},{"name":"二阶导判据","explanation":"若f在I内部二阶可导且f″≥0，则f凸。理由：f′单调不减，由中值定理可得各点图象不低于切线；在加权平均点应用切线下界并加权，线性项消掉，即得凸性。端点要求连续延拓。"},{"name":"权重与等号","explanation":"权重wᵢ≥0且和为1，代表凸组合；允许0权重但它对应的点不影响结论。严格凸且所有权重正时，詹森等号要求全部xᵢ相同。非严格凸可能还有其他等号情形。"}],"theorem":{"name":"有限加权詹森不等式","assumptions":["f在区间I上凸。","xᵢ∈I，wᵢ≥0，Σwᵢ=1，有限项。"],"statement":"f(Σwᵢxᵢ)≤Σwᵢf(xᵢ)。","proofLevel":"完整归纳证明","proof":["两项情形就是凸性定义；一项恒等。零权重项可删除。","假设前n−1项版本成立。令s=Σ(i\u003cn)wᵢ=1−wₙ；只有一项权重非零时直接成立，否则0\u003cs\u003c1。","把加权点写成s·[Σ(i\u003cn)(wᵢ/s)xᵢ]+wₙxₙ，用两点凸性。","再对方括号中的n−1点用归纳假设，乘s后即得全部n项结论。"]},"derivation":["x>0时f(x)=−ln x满足f″=1/x²>0，所以严格凸。","等权重詹森给−ln[(x₁+…+xₙ)/n]≤−(Σln xᵢ)/n。","乘−1、利用指数递增，得到算术平均≥几何平均，等号全部正数相等。n=2回到高中基本不等式。"],"methods":["对照定理逐项检查假设，区分精确等式、近似及单向不等式。"],"pitfalls":["使用ln推导均值不等式时变量必须为正；零值情况需要另作连续性延拓。"],"example":{"question":"【原创】x,y,z>0且x+y+z=6，求xyz的最大值。","solution":["算术平均为2。","由詹森导出的均值不等式，(xyz)^(1/3)≤2，故xyz≤8。","x=y=z=2满足约束，取得8。"],"answer":"8。"},"practice":[{"question":"【原创】f(x)=x²在R上凸吗？写对应两点不等式。","answer":"凸；(tx+(1−t)y)²≤tx²+(1−t)y²。","solution":"二阶导数为2；左右差为t(1−t)(x−y)²≥0，也可直接证明。","level":"基础"},{"question":"【原创】能否对负权重直接用詹森不等式？","answer":"不能。","solution":"权重非负是前提；如f=x²、权重2和−1、点1和0，左边4大于右边2。","level":"进阶"},{"question":"【原创·分层】对任意实数x,y，证明[(x+3y)/4]²≤(x²+3y²)/4，并求等号条件。","answer":"恒成立，等号当且仅当x=y。","solution":"取严格凸函数f(t)=t²，权重1/4与3/4均为正且和为1，直接由詹森得到不等式；严格凸的等号条件为x=y。也可独立展开核对：右边减左边=[4x²+12y²−(x²+6xy+9y²)]/16=3(x−y)²/16≥0，且仅x=y时为0。","level":"基础巩固"},{"question":"【原创·分层】f(t)=t²严格凸，取权重(1/2,1/2,0)，点(2,2,99)。詹森是否取等号？“取等必须三个点全相同”在这里为何不对？","answer":"取等号，两边都是4；只须正权重对应的前两个点相同。","solution":"加权输入为(1/2)·2+(1/2)·2+0·99=2，函数值为4；加权输出也为(1/2)·4+(1/2)·4+0·99²=4。第三点权重为0，对两边都无影响。原卡“所有点相同”的等号结论具有所有权重都为正这一前提，不能删除。","level":"条件变式"},{"question":"【原创·分层】x,y,z>0且x+y+z=6，求1/x+1/y+1/z的最小值，解释为什么这里选一个递减函数仍能用凸性。","answer":"最小值3/2，在x=y=z=2时取得。","solution":"取f(t)=1/t，定义域为正数。它虽递减，但f″(t)=2/t³>0，所以严格凸；凸性与是否递增不是同一性质。用权重各1/3，詹森给1/2=f((x+y+z)/3)≤(1/x+1/y+1/z)/3，故和≥3/2。严格凸且正权重要求x=y=z=2，符合约束并实际取到最小值。也可用A11核对：(x+y+z)(1/x+1/y+1/z)≥(1+1+1)²=9。","level":"综合应用"}],"mastery":["能说明公式为何成立及何时不能用","能独立完成练习并检查结果"],"sources":[{"title":"核查与延伸阅读","url":"https://live.ocw.mit.edu/courses/6-079-introduction-to-convex-optimization-fall-2009/2ae23d35685ff402473b36011138149a_MIT6_079F09_lec03.pdf","locator":"凸函数、詹森定理；本库归纳证明及均值衔接为自主教学编排。"}],"selfStudy":{"moduleId":"A12","entryCheck":{"question":"对f(t)=t²、点1和3、权重1/4和3/4，分别算“先平均再平方”与“先平方再平均”。两个权重需要满足什么条件？","answer":"前者为(5/2)²=25/4，后者为1/4+27/4=7，且25/4≤7。权重须非负且和为1。","explanation":"平均点为(1/4)·1+(3/4)·3=5/2，落在两个点之间。这里的大小关系来自平方函数凸性；并不是所有函数对平均操作都有这个方向的不等式。"},"intuition":"凸函数的图象在两点连接的弦下方，所以先混合输入再计算函数，结果不超过先计算再用同样权重混合输出。詹森把两点推广到有限多点。这个图像说明为什么值得比较两种平均顺序，不代替定义与证明；凸函数也可能递减，例如正数上的1/x。","reasoning":[{"step":"1．用定义固定不等号方向","detail":"在区间I内，对x,y及0≤t≤1，凸性定义为f(tx+(1−t)y)≤tf(x)+(1−t)f(y)。点不同且0\u003ct\u003c1时总严格小于，才称严格凸。定义本身不要求可导，例如|x|是凸函数但在0不可微。"},{"step":"2．说明二阶导判据只是便捷的充分条件","detail":"若f在区间内部二阶可导且f″≥0，f′单调不减。若包含端点，还要求连续延拓。对于内部m和任意内部x，中值定理将f(x)−f(m)写成f′(c)(x−m)；结合f′的单调性，并分别注意x−m正负，可得f(x)≥f(m)+f′(m)(x−m)，即图象不低于切线。"},{"step":"3．从切线下界看见加权项如何消掉","detail":"令m=Σwᵢxᵢ，且wᵢ≥0、Σwᵢ=1。把每个切线下界乘wᵢ后求和，Σwᵢ(xᵢ−m)=0，便得到Σwᵢf(xᵢ)≥f(m)。这是可微版本的证明路线；若m是端点，非零权重点只能全部在该端点，或可用连续性处理。"},{"step":"4．理解不依赖导数的一般证明","detail":"对不可导的凸函数，有限詹森仍成立。先删除0权重项；至少两项时令s=1−wₙ∈(0,1)，把前n−1个点先按wᵢ/s平均，得到y∈I，再把总平均写成sy+wₙxₙ。先用两点凸性，再对y用归纳假设，就得到n点版本。这解释了原卡为何引用A01归纳法。"},{"step":"5．把等号条件单独检查","detail":"凸函数未必严格凸，如一次函数，可能在不同点也取等号。对严格凸函数，所有正权重对应的xᵢ相同才取等号；权重为0的点不影响结果。不能把“存在上界”直接叫最大值，仍要展示满足约束的取等点。"},{"step":"6．从乘积目标反推选择的函数","detail":"若目标含正数乘积，对数把乘积变成和。ln t是凹函数；为了继续使用凸函数的≤形式，选g(t)=−ln t，其二阶导数1/t²>0，在(0,∞)严格凸。所有变量必须先确认为正，才允许取对数。"},{"step":"7．控制变号和单调函数的作用","detail":"詹森后得到带负号的对数式，乘负数必须反向；随后对两边取指数，因为指数函数严格递增，不改变不等号方向。最后根据严格凸的等号条件检查可达性，完成从公式到最值的逻辑。"}],"workedWalkthrough":[{"step":"1．复述原例并核对定义域","detail":"原例：x,y,z>0且x+y+z=6，求xyz最大值。正数条件保证−ln x、−ln y、−ln z都有定义；若允许负数，这条对数路线就不能直接使用。"},{"step":"2．选择函数和权重","detail":"取g(t)=−ln t，三个权重都为1/3，非负且总和为1。加权平均m=(x+y+z)/3=2，仍在正数定义区间内。目标乘积在取对数后成为三项和，正好匹配詹森右边。"},{"step":"3．验证凸性再写不等式","detail":"g′(t)=−1/t，g″(t)=1/t²>0，因此严格凸。詹森给g(2)≤[g(x)+g(y)+g(z)]/3，也就是−ln2≤−(ln x+ln y+ln z)/3。"},{"step":"4．逐步变回乘积","detail":"两边乘−3，不等号反向：3ln2≥ln x+ln y+ln z=ln(xyz)。又3ln2=ln8，指数函数递增，所以8≥xyz。至此只证明8是上界。"},{"step":"5．检查上界是否能够取得","detail":"严格凸且三个权重都为正，等号要求x=y=z。结合和为6，得到x=y=z=2。三个数都为正，符合原约束，而且乘积正好为8，因此8确实是最大值。"},{"step":"6．用不等点检查方向而不是替代证明","detail":"例如(x,y,z)=(1,1,4)符合条件，乘积为4≤8；它能帮助发现误把方向写成xyz≥8的错误。但检查若干组数字无法证明所有正数组都满足结论，一般性来自前面的詹森证明。"}],"wrongApproach":{"claim":"ln t是凸函数，所以ln[(x+y+z)/3]≤(ln x+ln y+ln z)/3，从而xyz≥8。","whyWrong":"ln t的二阶导数是−1/t²\u003c0，它是凹函数。给出的方向错了，(1,1,4)的乘积4也直接反驳xyz≥8。即使函数选择正确，乘负数时不换向也会得到同样错误。","correction":"使用凸函数−ln t，或使用凹函数版詹森并反向。每一步注明是否乘负数、是否施加递增函数，最后单独核查等号是否满足原约束。"},"exitCheck":{"question":"x,y>0且2x+y=6，求x²y的最大值，并指出詹森应使用的权重。","answer":"最大值8，在x=y=2取得；使用权重2/3与1/3。","explanation":"平均点(2x+y)/3=2。对−ln应用加权詹森，得到−ln2≤−(2ln x+ln y)/3，故ln(x²y)≤3ln2，x²y≤8。正权重与严格凸给等号x=y，再由约束取2。"},"remediation":[{"difficulty":"不等号变号和等号可达性容易漏","moduleId":"H04","action":"回看基本不等式的正数条件、等号条件；将“证明上界”和“找到取等点”写成两步。"},{"difficulty":"无法理解多点归纳中的归一化权重","moduleId":"A01","action":"先对三点写s=w₁+w₂，检查w₁/s+w₂/s=1，再尝试把三点归并成两点。"},{"difficulty":"不了解二阶导怎样推出切线下界","moduleId":"A06","action":"分别在x>m和x\u003cm两种情形用中值定理，尤其说明乘负数x−m时方向为何改变。"},{"difficulty":"把ln函数当凸函数或不清楚对数定义域","moduleId":"H07","action":"确认对数仅对正数取值、对数把乘积变为和，并与g=−ln逐项对比符号。"}],"auditNotes":[{"severity":"澄清","finding":"原卡由二阶导非负到凸性的推理只给概要。","resolution":"补中值定理得到切线下界，再展示加权后线性项消掉；同时保留不依赖可导性的归纳证明。"},{"severity":"澄清","finding":"原例直接引用由詹森推出的均值不等式，容易绕过函数与权重的选择。","resolution":"围绕同一最大乘积例完整展开−ln、等权平均、变号、指数单调和取等点。"},{"severity":"澄清","finding":"等号条件中的正权重与一般非负权重有区别。","resolution":"明确只约束正权重对应点，并用分层题检验0权重反例。"}]}},{"id":"A13","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"线性代数","title":"矩阵、线性方程组与可逆性","prerequisites":["J12","H13"],"goals":["理解对象、符号和前置条件","说明定理证明的核心步骤","完成计算并检查退化或反例"],"concepts":[{"name":"矩阵与乘法","explanation":"m×n矩阵有m行n列，可看作从Rⁿ到Rᵐ的线性映射。乘积AB的(i,j)项为Σₖaᵢₖbₖⱼ，A列数须等于B行数；矩阵乘法一般不交换。单位矩阵I作用如乘法中的1。"},{"name":"线性相关与秩","explanation":"若系数不全为0却使向量加权和为零，就线性相关；否则线性无关。秩是列向量中最多线性无关向量数。初等行变换保持方程解集，可用消元判断无解、唯一解或自由变量。"},{"name":"行列式的本卡范围","explanation":"对二阶矩阵A=[[a,b],[c,d]]，定义det A=ad−bc，它表示有向面积的缩放因子。行列式是一个数而非矩阵；本卡只完整推导二阶逆矩阵，更高阶行列式定义需继续读线性代数课程。"}],"theorem":{"name":"二阶逆矩阵公式","assumptions":["A=[[a,b],[c,d]]为实二阶矩阵。","Δ=ad−bc≠0。"],"statement":"A⁻¹=(1/Δ)[[d,−b],[−c,a]]；任意右端向量r的方程Ax=r唯一解x=A⁻¹r。","proofLevel":"完整证明（二阶情形）","proof":["把A与候选逆矩阵分别左右相乘，非对角项ab−ba、cd−dc为0，对角项均为Δ，除Δ后为I。","左乘逆矩阵可推出任何解都等于A⁻¹r；直接代入又验证它是解，故唯一。","若Δ=0且(a,b)≠(0,0)，非零向量(−b,a)被A映到0；若首行全零，另取第二行的垂直向量，零矩阵时任取非零向量。存在非零核向量使A不可能有逆。"]},"derivation":["联立ax+by=r₁、cx+dy=r₂，第一式乘d减第二式乘b，得Δx=dr₁−br₂。","同理Δy=ar₂−cr₁，所以逆矩阵公式就是消元的统一表达。","Δ=0并不意味着无解：两式重合时可有无穷解；右端不相容时才无解。"],"methods":["先识别定义域、非零条件与概率模型，再推导和代回验证。"],"pitfalls":["矩阵的AB=0不必推出A=0或B=0，也不能不检查就交换AB与BA。"],"example":{"question":"【原创】用矩阵或消元求2x+y=5、x−y=1。","solution":["A=[[2,1],[1,−1]]，Δ=−3。","相加得3x=6，x=2；再得y=1。","代回两式分别5和1，唯一性由Δ≠0保证。"],"answer":"x=2，y=1。"},"practice":[{"question":"【原创】矩阵[[1,2],[2,4]]可逆吗？","answer":"不可逆。","solution":"行列式4−4=0；第二行是第一行的2倍。","level":"基础"},{"question":"【原创】同一系数x+y=2、2x+2y=5有什么解？","answer":"无解。","solution":"第一式乘2要求右边为4，与5矛盾；不可逆不等于必有无穷解。","level":"进阶"}],"mastery":["能复述定理前提并举反例","能完成计算并解释结果意义"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/","locator":"消元、矩阵乘法、逆与秩；本卡完整展开二阶情形。"}]},{"id":"A14","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"线性代数","title":"特征值、基与对角化","prerequisites":["A13","H25"],"goals":["理解对象、符号和前置条件","说明定理证明的核心步骤","完成计算并检查退化或反例"],"concepts":[{"name":"基与坐标","explanation":"Rⁿ的一组基包含n个线性无关向量，每个向量都可唯一用它们线性表示。把这些基向量放成P的列，P可逆；x=Pz把新坐标z转换为原坐标x。"},{"name":"特征向量必须非零","explanation":"Av=λv且v≠0，称λ为特征值、v为相应特征向量。实特征值λ>0表示沿原方向缩放，λ\u003c0表示反向，λ=0表示映到零向量；复数情形应理解为保持v张成的一维复子空间。二阶情形可解det(A−λI)=0，再解齐次方程找向量。"},{"name":"重复根不自动失败","explanation":"同一特征值可以拥有多个独立特征向量，如I。[[1,1],[0,1]]却只有一条独立特征方向，不能对角化。需检查特征向量是否足够，不仅看根的个数。实域与复域的可对角化性也可能不同。"}],"theorem":{"name":"对角化与特征向量基","assumptions":["A为n×n矩阵，固定在R或C上讨论。"],"statement":"A可写A=PDP⁻¹（P可逆、D对角）当且仅当A有n个线性无关的特征向量。","proofLevel":"在接受“n阶方阵可逆当且仅当其n个列向量线性无关”基础结果后的完整等价性证明；A13仅完整推导二阶逆矩阵，一般n阶基础定理在本库未另行证明。","proof":["若P各列为独立特征向量vᵢ、特征值为λᵢ，令D=diag(λ₁,…,λₙ)。","按列相乘有AP=[Av₁,…,Avₙ]=[λ₁v₁,…,λₙvₙ]=PD。P可逆，故A=PDP⁻¹。","反向若A=PDP⁻¹，则AP=PD；每列均满足Avᵢ=λᵢvᵢ，且P可逆保证这些非零列独立。"]},"derivation":["当A=PDP⁻¹时，A²=PDP⁻¹PDP⁻¹=PD²P⁻¹。","归纳得Aᵏ=PDᵏP⁻¹，k≥0为整数，Dᵏ只需各对角元求幂。","因此向量递推xₖ₊₁=Axₖ可写xₖ=Aᵏx₀。不能对任意矩阵把各元素分别乘方当矩阵幂。"],"methods":["先识别定义域、非零条件与概率模型，再推导和代回验证。"],"pitfalls":["特征值相同不等于矩阵相同；对角化前必须找足独立的特征向量。"],"example":{"question":"【原创】A=[[2,1],[1,2]]，求特征值和一组特征向量。","solution":["det(A−λI)=(2−λ)²−1=0，得λ=3或1。","λ=3时可取v₁=(1,1)；λ=1时取v₂=(1,−1)。","两向量独立，令P=[[1,1],[1,−1]]、D=diag(3,1)，即可对角化。"],"answer":"λ为3和1，对应(1,1)、(1,−1)。"},"practice":[{"question":"【原创】上述A作用3次于(1,1)，结果是什么？","answer":"(27,27)。","solution":"(1,1)是特征值3的向量，A³v=3³v。","level":"基础"},{"question":"【原创】零向量能作为特征向量吗？","answer":"不能。","solution":"Av=λv对v=0、任意λ都成立，无法表达特征方向，定义必须排除0。","level":"进阶"}],"mastery":["能复述定理前提并举反例","能完成计算并解释结果意义"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/video_galleries/video-lectures/","locator":"课程特征值与对角化讲次；矩阵例题原创。"}]},{"id":"A15","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"复数与分析","title":"欧拉公式、复数旋转与棣莫弗公式","prerequisites":["H15","H11","A10"],"goals":["理解对象、符号和前置条件","说明定理证明的核心步骤","完成计算并检查退化或反例"],"concepts":[{"name":"复数指数的定义","explanation":"对复数z，定义eᶻ=Σ(n=0…∞)zⁿ/n!。因为绝对值级数Σ|z|ⁿ/n!收敛，该定义对所有z有效；它在实数轴上与通常指数一致。不能把实数指数规则未经证明直接当作复数定义。"},{"name":"模与辐角","explanation":"非零复数z=r(cosθ+i sinθ)，r=|z|>0，θ叫辐角且相差2kπ表示同一点。零的辐角不定义。乘一个模为1的复数表示旋转，角度使用弧度。"},{"name":"指数相加的根据","explanation":"绝对收敛允许级数相乘并按总次数分组。第n次系数Σ(k=0…n)zᵏwⁿ⁻ᵏ/[k!(n−k)!]=(z+w)ⁿ/n!，由二项式定理，故eᶻeʷ=eᶻ⁺ʷ。"}],"theorem":{"name":"欧拉公式","assumptions":["θ为任意实数，使用弧度。","复指数按绝对收敛幂级数定义。"],"statement":"eⁱθ=cosθ+i sinθ。","proofLevel":"使用A10的实函数展开，并接受绝对收敛级数可分组、重排的基础定理后的完整证明；此级数运算定理在本库陈述未证。","proof":["将z=iθ代入指数定义。利用i²=−1，偶数项为(−1)ᵏθ²ᵏ/(2k)!，奇数项为i(−1)ᵏθ²ᵏ⁺¹/(2k+1)!。","绝对收敛允许分成偶项和奇项。","A10已证明两组实数级数分别等于cosθ、sinθ，故得到等式。"]},"derivation":["由指数相加，(cosθ+i sinθ)ⁿ=eⁱⁿθ=cos(nθ)+i sin(nθ)，n为整数；负整数用模1非零可逆性。","求zⁿ=r eⁱθ（r>0、n正整数）时，n个不同根为r^(1/n)e^[i(θ+2kπ)/n]，k=0,…,n−1。","根均匀分布在半径r^(1/n)的圆上；不同辐角分支必须全部计入。"],"methods":["先识别定义域、非零条件与概率模型，再推导和代回验证。"],"pitfalls":["复数开n次方通常有n个不同根；只取主辐角给出的一个根会漏解。"],"example":{"question":"【原创】求满足z³=8的全部复数。","solution":["把8写成8eⁱ⁰，根的模为2。","辐角为0、2π/3、4π/3。","转成直角形式得到2，−1+i√3，−1−i√3。"],"answer":"2、−1+i√3、−1−i√3。"},"practice":[{"question":"【原创】计算eⁱπ+1。","answer":"0。","solution":"cosπ=−1，sinπ=0，直接用欧拉公式。","level":"基础"},{"question":"【原创】将3+0i逆时针旋转π/2，复数变成什么？","answer":"3i。","solution":"乘eⁱπ/²=i，模保持3。","level":"进阶"}],"mastery":["能复述定理前提并举反例","能完成计算并解释结果意义"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/es-1803-differential-equations-spring-2024/mites_1803_s24_topic4.pdf","locator":"复数与指数讲义；本库使用幂级数路线给出完整推导。"}]},{"id":"A16","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"概率进阶","title":"贝叶斯、全期望与协方差","prerequisites":["H33","H34"],"goals":["理解对象、符号和前置条件","说明定理证明的核心步骤","完成计算并检查退化或反例"],"concepts":[{"name":"联合与条件分布","explanation":"离散变量X,Y的联合概率p(x,y)=P(X=x,Y=y)总和为1；边缘概率由另一个变量求和。p_Y(y)>0时，p(x|y)=p(x,y)/p_Y(y)。有零概率的条件不能直接放入普通比值公式。"},{"name":"先验、似然、后验","explanation":"先验P(Bᵢ)描述看到A之前的概率；似然P(A|Bᵢ)描述各情形产生A的概率；后验P(Bᵢ|A)在看到A后更新。贝叶斯是条件概率的代数恒等式，不会自动消除不可靠的先验或模型偏差。"},{"name":"协方差与不相关","explanation":"Cov(X,Y)=E[(X−EX)(Y−EY)]=E[XY]−EX·EY，要求二阶矩有限。展开得Var(X+Y)=VarX+VarY+2Cov(X,Y)。独立推出协方差0，反向一般不成立；零协方差只排除线性共同变化。"}],"theorem":{"name":"有限分割贝叶斯公式与全期望","assumptions":["B₁,…,Bₘ互斥且覆盖样本空间，P(Bᵢ)>0。","P(A)>0；全期望部分假设X只有有限多个取值。"],"statement":"P(Bⱼ|A)=P(A|Bⱼ)P(Bⱼ)/ΣᵢP(A|Bᵢ)P(Bᵢ)；EX=ΣᵢE[X|Bᵢ]P(Bᵢ)。","proofLevel":"完整证明（有限情形）","proof":["A被A∩Bᵢ互斥分割，故P(A)=ΣᵢP(A∩Bᵢ)=ΣᵢP(A|Bᵢ)P(Bᵢ)。","条件概率给P(Bⱼ|A)=P(A∩Bⱼ)/P(A)，再换写分子即得贝叶斯。","全期望右边展开为ΣᵢΣₓxP(X=x|Bᵢ)P(Bᵢ)=ΣₓxΣᵢP(X=x且Bᵢ)。","内层和为P(X=x)，故等于EX。"]},"derivation":["证明方差和公式：把(X+Y−EX−EY)²展开成两平方项和交叉项，再取期望。","若独立，联合概率可分解，从而E[XY]=EX·EY，交叉项消失。","反例：X等概率取−1、0、1，Y=X²。EX=E[XY]=0，故Cov(X,Y)=E[XY]−EX·EY=0；但P(X=0,Y=0)=1/3，而P(X=0)P(Y=0)=1/9，两者不等，明确违反独立定义。不能仅凭“Y由X决定”就判不独立，因为常量随机变量也可由X决定却与X独立。"],"methods":["先识别定义域、非零条件与概率模型，再推导和代回验证。"],"pitfalls":["P(A|B)与P(B|A)不能交换；不良率不是给定不良后来源的概率。"],"example":{"question":"【原创】两台机器甲、乙分别供应60%、40%产品，不良率为1%、3%。已知抽到不良品，来自乙的概率是多少？","solution":["记A为不良，P(A)=0.6×0.01+0.4×0.03=0.018。","乙且不良的概率为0.4×0.03=0.012。","后验为0.012/0.018=2/3。"],"answer":"2/3。"},"practice":[{"question":"【原创】X在事件B下均值2，在补事件下均值8，P(B)=1/4，求EX。","answer":"6.5。","solution":"全期望给2×1/4+8×3/4=6.5。","level":"基础"},{"question":"【原创】VarX=2、VarY=3、Cov(X,Y)=1，求Var(X−Y)。","answer":"3。","solution":"方差展开为2+3−2×1=3，减号改变交叉项符号。","level":"进阶"}],"mastery":["能复述定理前提并举反例","能完成计算并解释结果意义"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/6-041-probabilistic-systems-analysis-and-applied-probability-fall-2010/pages/lecture-notes/","locator":"第2、11、12讲分别对应条件概率、协方差、全期望；只覆盖本卡声明的有限／二阶矩情形。"}]},{"id":"A17","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"概率进阶","title":"切比雪夫不等式与大数定律","prerequisites":["A02","A16"],"goals":["理解对象、符号和前置条件","说明定理证明的核心步骤","完成计算并检查退化或反例"],"concepts":[{"name":"依概率收敛","explanation":"Xₙ依概率趋μ指：对任意ε>0，P(|Xₙ−μ|≥ε)→0。不是每次样本都越来越近，也不保证有限次实验恰等于均值；这里趋0的是偏差事件的概率。"},{"name":"指示变量和非负比较","explanation":"事件E的指示变量1_E在E发生时为1，否则0，E[1_E]=P(E)。若Z≥0、a>0，则Z≥a1_{Z≥a}；取期望得马尔可夫界P(Z≥a)≤EZ/a。"},{"name":"样本均值与独立","explanation":"X̄ₙ=(X₁+…+Xₙ)/n。若各项独立、同均值μ和有限方差σ²，则EX̄ₙ=μ、Var X̄ₙ=σ²/n。共同系统偏差不会因重复采样自动消失，相关样本还需保留协方差项。"}],"theorem":{"name":"切比雪夫不等式及有限方差弱大数定律","assumptions":["X有有限均值μ及方差σ²，ε>0。","大数推论再假设Xᵢ独立同分布且具有该有限方差。"],"statement":"P(|X−μ|≥ε)≤σ²/ε²；因此P(|X̄ₙ−μ|≥ε)≤σ²/(nε²)→0。","proofLevel":"完整证明","proof":["令Z=(X−μ)²≥0，对阈值ε²用马尔可夫界。","事件Z≥ε²等于|X−μ|≥ε，且EZ=σ²，得到切比雪夫。","独立性消去不同样本间协方差，Var X̄ₙ=nσ²/n²=σ²/n。","把切比雪夫用于X̄ₙ，固定ε后右边随n→∞趋0，这就是所述弱大数定律。"]},"derivation":["伯努利样本Xᵢ∈{0,1}且成功率p，样本频率等于X̄ₙ，方差p(1−p)≤1/4。","因此P(|频率−p|≥ε)≤1/(4nε²)。","要使此上界≤α，只需n≥1/(4αε²)。这是保守的充分样本量，不是最小样本量；也不是用正态近似得到的公式。"],"methods":["先识别定义域、非零条件与概率模型，再推导和代回验证。"],"pitfalls":["大数定律不意味着连续出现某结果后下一次会自动“补偿”。中心极限定理描述的是标准化误差分布，是另一条定理，本卡未混入。"],"example":{"question":"【原创】独立同分布伯努利实验，要保证频率偏差至少0.1的概率不超过0.05，切比雪夫界要求多少次？","solution":["使用未知p的统一界1/(4nε²)。","代ε=0.1、α=0.05，n≥1/(4×0.05×0.01)。","计算得n≥500。"],"answer":"500次是该保守界给出的充分数量。"},"practice":[{"question":"【原创】均值10、方差4，估计P(|X−10|≥5)的上界。","answer":"4/25=0.16。","solution":"切比雪夫中ε=5，不需知道分布形状。","level":"基础"},{"question":"【原创】把同一个随机结果复制100次，当作100个独立样本能否把均值方差缩成1/100？","answer":"不能。","solution":"复制的变量完全相关，均值仍等于原变量，方差未变。","level":"进阶"}],"mastery":["能复述定理前提并举反例","能完成计算并解释结果意义"],"sources":[{"title":"核查与延伸阅读","url":"https://ocw.mit.edu/courses/6-041sc-probabilistic-systems-analysis-and-applied-probability-fall-2013/pages/unit-iv/lecture-19/","locator":"弱大数定律与切比雪夫界；原创有限方差证明和伯努利样本量例。"}]},{"id":"A18","stage":"高阶拓展","grade":"学有余力选学（非统一高考必修）","courseType":"拓展","domain":"微分方程入门","title":"可分离微分方程与指数模型","prerequisites":["A08","A09","H06"],"goals":["理解对象、符号和前置条件","说明定理证明的核心步骤","完成计算并检查退化或反例"],"concepts":[{"name":"未知量是函数","explanation":"微分方程关系到未知函数y(x)及其导数。解要在一个区间上可微并处处满足原式；初值y(x₀)=y₀进一步限制解。把求出的表达式代回原方程和初值是必要验证。"},{"name":"可分离形式","explanation":"y′=g(x)h(y)中，若h(y)在所讨论解区间不为0，可写y′/h(y)=g(x)，再用链式法则积分。所谓“分离变量”背后是复合函数求导，不是把导数当普通分数随意运算。"},{"name":"平衡解与唯一性边界","explanation":"若h(c)=0，则y≡c是平衡解，除以h(y)会把它删掉，必须单独补查。关于一般初值问题y′=F(x,y)、y(x₀)=y₀，这里只陈述局部存在唯一性定理：若F在包含初值点的一个矩形邻域连续，且有统一常数L≥0使同一x下|F(x,y₁)−F(x,y₂)|≤L|y₁−y₂|，则足够小的初值区间上存在唯一解。后一个条件称对y的Lipschitz条件；连续的y偏导可在更小闭矩形上给出这样的界。仅连续一般不保证唯一。本库不证明这一进阶定理，也不把非零分支的分离公式声称为所有非唯一方程解的完整分类。"}],"theorem":{"name":"非零分支上的分离积分公式","assumptions":["g在区间I连续，h在区间J连续且不为0。","y:I→J可微并满足y′=g(x)h(y)。","H为1/h的原函数，G为g的原函数。"],"statement":"H(y(x))=G(x)+C。反过来，落在J内的可微函数若满足此等式，则满足原微分方程。","proofLevel":"完整证明（链式法则）","proof":["由链式法则，dH(y(x))/dx=H′(y)y′=y′/h(y)=g(x)=G′(x)。","所以H(y(x))−G(x)的导数为0，在区间I上为常数。","反向对等式求导，得到y′/h(y)=g(x)，乘非零h(y)即回到原式。"]},"derivation":["对y′=ky且y≠0，取h(y)=y，积分得ln|y|=kx+C。","指数化得y=Ceᵏˣ，其中C可正可负；另补平衡解y=0后可统一允许C=0。","还可证明没有遗漏：任何解都有(ye⁻ᵏˣ)′=0，故ye⁻ᵏˣ常数。以y(0)=y₀得y=y₀eᵏˣ。k的量纲为时间的倒数。"],"methods":["先识别定义域、非零条件与概率模型，再推导和代回验证。"],"pitfalls":["数学上的指数增长模型不保证现实中无限期成立；资源限制或机制变化后要重建模型。"],"example":{"question":"【原创】模型y′=0.2y、y(0)=50，求y(t)及翻倍时间。","solution":["由指数模型y(t)=50e⁰·²ᵗ。","翻倍要求e⁰·²ᵗ=2，取对数得t=ln2/0.2。","结果5ln2≈3.466，时间单位与0.2的单位相匹配。"],"answer":"y=50e⁰·²ᵗ；翻倍时间5ln2。"},"practice":[{"question":"【原创】解y′=−3y、y(0)=4。","answer":"y=4e⁻³ˣ。","solution":"代入得导数−12e⁻³ˣ=−3y，初值4。","level":"基础"},{"question":"【原创】对y′=y(1−y)直接除以y(1−y)会漏掉哪些平衡解？","answer":"y≡0和y≡1。","solution":"两者都使右端及导数为0，但被除式为0，必须单独保留。","level":"进阶"}],"mastery":["能复述定理前提并举反例","能完成计算并解释结果意义"],"sources":[{"title":"核查与延伸阅读","url":"https://openstax.org/books/calculus-volume-2/pages/4-3-separable-equations","locator":"分离变量与初值；公式证明和指数情境原创组织。"}]}],"meta":{"version":"1.1","updated":"2026-09-16","title":"初高中数学自学知识库","scope":"全国通用主干＋大学入门拓展；建议学习阶段，不是全国统一年级进度表。","evidence":[{"exam":"2025年福建省初中学业水平考试·数学","question":1,"theme":"实数大小比较","modules":["J02","J10"],"answer":"A","printedPage":11,"pdfPage":12,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=12"},{"exam":"2025年福建省初中学业水平考试·数学","question":2,"theme":"轴对称与中心对称辨识","modules":["J17","J36"],"answer":"D","printedPage":11,"pdfPage":12,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=12"},{"exam":"2025年福建省初中学业水平考试·数学","question":3,"theme":"二次根式的定义域","modules":["J24"],"answer":"D","printedPage":11,"pdfPage":12,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=12"},{"exam":"2025年福建省初中学业水平考试·数学","question":4,"theme":"几何体主视图","modules":["J44"],"answer":"A","printedPage":11,"pdfPage":12,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=12"},{"exam":"2025年福建省初中学业水平考试·数学","question":5,"theme":"一次不等式与数轴","modules":["J13"],"answer":"C","printedPage":12,"pdfPage":13,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=13"},{"exam":"2025年福建省初中学业水平考试·数学","question":6,"theme":"不放回抽样的列举概率","modules":["J43"],"answer":"B","printedPage":12,"pdfPage":13,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=13"},{"exam":"2025年福建省初中学业水平考试·数学","question":7,"theme":"平行线与三角形角度","modules":["J09","J15"],"answer":"B","printedPage":12,"pdfPage":13,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=13"},{"exam":"2025年福建省初中学业水平考试·数学","question":8,"theme":"矩形情境中的二次方程建模","modules":["J31","J32"],"answer":"C","printedPage":12,"pdfPage":13,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=13"},{"exam":"2025年福建省初中学业水平考试·数学","question":9,"theme":"切线与圆中的角度关系","modules":["J39","J40"],"answer":"C","printedPage":12,"pdfPage":13,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=13"},{"exam":"2025年福建省初中学业水平考试·数学","question":10,"theme":"二次函数代入与含参比较","modules":["J33","J34"],"answer":"A","printedPage":12,"pdfPage":13,"answerPrintedPage":17,"answerPdfPage":18,"status":"原卷与官方参考答案已看图核对","url":"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf#page=13"}],"routes":[{"title":"初中代数与函数主线","description":"运算与方程打底，再把图象、函数值和最值联系起来。","ids":["J01","J02","J03","J04","J05","J06","J12","J13","J19","J20","J21","J22","J26","J27","J31","J32","J33","J34","J35"]},{"title":"初中几何主线","description":"先学几何语言与证明，勾股之后再做含距离计算的对称应用。","ids":["J08","J09","J15","J16","J23","J17","J18","J25","J36","J37","J38","J39","J40","J41","J42","J44"]},{"title":"高中函数通向微积分","description":"拓展从严格定义开始，不把高阶公式当成跳过高中基础的捷径。","ids":["H01","H02","H03","H04","H05","H06","H07","H09","H10","H11","H27","H28","H29","A01","A02","A03","A04","A05","A06","A07","A08","A09","A10","A18"]},{"title":"统计概率通向推断","description":"区分描述、抽样、概率模型、统计证据和因果结论。","ids":["J14","J28","J29","J30","J43","H30","H31","H32","H33","H34","H35","H36","H37","H38","H39","A16","A17"]},{"title":"几何代数与不等式拓展","description":"向量提供统一语言，再按兴趣分到矩阵、复数或凸性。","ids":["H13","H14","H15","H16","H17","H18","H19","H20","H21","H22","H23","H24","A11","A12","A13","A14","A15"]}],"distribution":"public"},"order":["J01","J02","J03","J04","J05","J06","J07","J08","J09","J10","J11","J12","J13","J14","J15","J16","J19","J23","J17","J18","J20","J21","J22","J24","J25","J26","J27","J28","J29","J30","J31","J32","J33","J34","J35","J36","J37","J38","J39","J40","J41","J42","J43","J44","J45","H01","H02","H03","H04","H05","H06","H07","H08","H09","H10","H11","H12","H13","H14","H15","H16","H17","H18","H19","H20","H21","H22","H23","H24","H25","H26","H27","H28","H29","H30","H31","H32","H33","H34","H35","H36","H37","H38","H39","H40","A01","A02","A03","A04","A05","A06","A07","A08","A09","A10","A11","A12","A13","A14","A15","A16","A17","A18"],"stats":{"modules":103,"concepts":324,"examples":103,"practice":287,"theorems":18,"stages":{"初中":45,"高中":40,"高阶拓展":18},"textCharacters":265369,"addedPractice":81,"layeredModules":27,"deepStudyModules":12,"diagrams":8,"diagnosticAndTransferQuestions":24},"docs":{"sources":"\u003ch1>公开版来源与使用边界\u003c/h1>\u003cp>本库的数学讲解、例题、分层练习与SVG图解为自行组织的学习材料，整理过程中使用AI辅助，尚未经出版社式外部专家审定或真实学生试学。数学公式与通用题型不声称为本项目首次发明。\u003c/p>\u003cp>不随项目分发第三方教材PDF、试卷扫描件、私人资料链接、聊天记录、个人笔记或登录凭证。部分卡片保留参考书目名称；将私人链接替换成公开出版社背景页面，并明确该背景页面不是逐题证明依据。第三方页面与书籍仍适用各自许可，不因本项目开源而改变。\u003c/p>\u003cp>高阶卡保留OpenStax、MIT等公开原始教学来源及具体范围。2025福建真题仅有10条已核对的题号—知识点—答案映射，不宣称提供整卷题库。高中2025修订已确认存在，但2020—2025课标完整逐条对照仍未完成；年级标签是学习建议，不是全国统一课程进度。\u003c/p>\u003cp>请结合“严谨性与自学审查”“验证说明”阅读已做检查与剩余缺口。\u003c/p>\u003ch2>原文件清单\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>原文件（点击打开）\u003c/th>\u003cth>本次使用／核查状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html\" target=\"_blank\" rel=\"noopener noreferrer\">人教社教材主编说明\u003c/a>\u003c/td>\u003ctd>出版社公开说明，用于课程背景，不替代数学逐项证明。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/subjects/math\" target=\"_blank\" rel=\"noopener noreferrer\">OpenStax Calculus\u003c/a>\u003c/td>\u003ctd>公开大学数学教材入口；具体卡片列出相关章节。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://ocw.mit.edu/\" target=\"_blank\" rel=\"noopener noreferrer\">MIT OpenCourseWare\u003c/a>\u003c/td>\u003ctd>公开课程入口；具体卡片列出相关讲义或课程。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","exams":"\u003ch1>真题证据与缺口\u003c/h1>\u003ch2>已核对原卷的样本\u003c/h2>\u003cp>来源为福建省教育考试院编制、福州市教育局网站提供的 \u003ca href=\"https://jyj.fuzhou.gov.cn/zwgk/cswz/fzygzz/zlxz/202506/P020250621484775049990.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">2025 年福建省初中学业水平考试试题与参考答案汇编\u003c/a>。\u003c/p>\u003cp>本次看图核对了汇编封面／目录，以及数学选择题第 1—10 题的题面和官方答案。题目在印刷页 11—12（PDF 第 12—13 页），答案在印刷页 17（PDF 第 18 页）。下面只记录题号、主题与知识卡对应，不复制整套题面；“答案”栏是官方选项字母，不是自行猜测的标答。\u003c/p>\u003cp>样本只能说明这些知识在这份卷中出现，不能推断全国频率或你的目标省份分值。原卷剩余题目未全量录入。本库各卡的例题／自测是自行编写，与下面真题证据严格分开。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>题号\u003c/th>\u003cth>知识主题\u003c/th>\u003cth>对应知识卡\u003c/th>\u003cth>官方答案\u003c/th>\u003cth>题面印刷页 / PDF页\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>实数大小比较\u003c/td>\u003ctd>J02、J10\u003c/td>\u003ctd>A\u003c/td>\u003ctd>11 / 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>轴对称与中心对称辨识\u003c/td>\u003ctd>J17、J36\u003c/td>\u003ctd>D\u003c/td>\u003ctd>11 / 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>二次根式的定义域\u003c/td>\u003ctd>J24\u003c/td>\u003ctd>D\u003c/td>\u003ctd>11 / 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>几何体主视图\u003c/td>\u003ctd>J44\u003c/td>\u003ctd>A\u003c/td>\u003ctd>11 / 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>一次不等式与数轴\u003c/td>\u003ctd>J13\u003c/td>\u003ctd>C\u003c/td>\u003ctd>12 / 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>不放回抽样的列举概率\u003c/td>\u003ctd>J43\u003c/td>\u003ctd>B\u003c/td>\u003ctd>12 / 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>平行线与三角形角度\u003c/td>\u003ctd>J09、J15\u003c/td>\u003ctd>B\u003c/td>\u003ctd>12 / 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>矩形情境中的二次方程建模\u003c/td>\u003ctd>J31、J32\u003c/td>\u003ctd>C\u003c/td>\u003ctd>12 / 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>切线与圆中的角度关系\u003c/td>\u003ctd>J39、J40\u003c/td>\u003ctd>C\u003c/td>\u003ctd>12 / 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>二次函数代入与含参比较\u003c/td>\u003ctd>J33、J34\u003c/td>\u003ctd>A\u003c/td>\u003ctd>12 / 13\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>已读命题评析，但未核对原卷\u003c/h2>\u003cp>\u003ca href=\"https://www1.xinhuanet.com/edu/20250607/8c18a78606ae43e1affc28552a08154c/c.html\" target=\"_blank\" rel=\"noopener noreferrer\">2025 年全国卷数学评析（新华网刊载《中国教育报》内容）\u003c/a>提到全国一卷第 6 题的向量情境、第 15 题的列联表与独立性检验、第 19 题的三角函数与导数；还提到全国二卷导数与概率相关问题。可作为 H13、H39、H11／H28 等模块的命题关联线索，但本次没有相应原卷逐题核查，因此不计入“原卷已核”数量，不给原题答案。\u003c/p>\u003cp>\u003ca href=\"https://www.shmeea.edu.cn/page/02200/20250608/19462.html\" target=\"_blank\" rel=\"noopener noreferrer\">上海市教育考试院 2025 年数学命题评析\u003c/a>已读到相关内容。它反映该卷的命题思路，不等于其他地区考试要求，也不作为全国知识频率的统计数据。\u003c/p>\u003ch2>继续扩充题库时的记录字段\u003c/h2>\u003cp>每条新增真题保留：年份、地区／全国卷别、学科、题号、题型、原卷链接、题面页码、官方答案页码、对应模块、核对状态。只有看到题面和可靠答案后，才能把状态从“线索”改成“原卷与答案已核”。\u003c/p>\u003cp>如果继续分析频率，需要先固定目标卷别、年份窗口、是否包含备用卷等口径，并统计实际样本总数。未做到这些之前，不输出“必考”“每年必出”或类似断言。\u003c/p>","help":"\u003ch1>使用与维护\u003c/h1>\u003ch2>一次学习的建议流程\u003c/h2>\u003cp>这是可调整的学习建议，不是为你测定的强制课表：先花几分钟检查前置与目标，再读概念和例题；遮住解析独立完成两道自测；最后用自己的话写一句“成立条件”和一句“易错点”。不能解释关键一步时，将状态设为“需复习”，到前置模块补上。\u003c/p>\u003cp>建议以“能独立解释和完成”为单位推进，不按一天刷完多少卡来判断效果。综合题与正式真题练习量仍需继续积累；卡片是知识入口和复习索引，不代替完整练习。\u003c/p>\u003ch2>阅读页的进度\u003c/h2>\u003cul>\u003cli>状态为“未学／学习中／需复习／已掌握”。推荐模块只根据你记录的状态及前置关系计算。\u003c/li>\u003cli>笔记和状态使用浏览器 localStorage。它不是云数据库；浏览器清理、隐私模式限制或文件位置变化可能影响保存。\u003c/li>\u003cli>页面会提示保存失败；发生失败时可先使用导出进度备份。导入会提示确认后覆盖当前这份库的进度与笔记，不修改教材与正文。\u003c/li>\u003cli>导出的 JSON 可能包含个人学习笔记。它由你自行保管；阅读页不会发送学习记录到外部服务器。\u003c/li>\u003c/ul>\u003ch2>数学记号与条件\u003c/h2>\u003cp>R、Z、N 分别为实数、整数、自然数，本库 N 默认包括 0；正整数写 N* 或明确 n≥1。Σ 表示求和，区间端点是否可取看圆／方括号。^ 表示乘方，例如 e^(0.2t)；Unicode 上下标也是数学记号，不是额外变量。\u003c/p>\u003cp>三角函数的求导、泰勒展开和复指数默认弧度。几何初等题写 ° 时用角度。向量夹角、直线夹角、指定二面角应区分：直线常取较小的角，二面角可能为钝角。\u003c/p>\u003cp>二项分布端点 p=0 或 p=1 按退化分布理解，不机械求 0⁰。分位数存在多种软件算法，J29 显式使用 np 位置规则，实际题目规定优先。描述方差用 n 分母，与推断中的无偏样本方差 n−1 分母不同。\u003c/p>\u003ch2>证明层次\u003c/h2>\u003cp>高阶知识卡的 theorem 字段注明“完整证明”所依赖的基础。这里“完整”是指在已列前提／基础定理之上把本卡结论推完，不表示从集合公理开始证明每条基础性质。\u003c/p>\u003cul>\u003cli>A01 采用自然数良序。\u003c/li>\u003cli>A02—A04 采用实数完备性；闭区间最值作为明示基础结果。\u003c/li>\u003cli>A08 接受连续函数可积、积分线性及区间可加等基础性质；提供基本定理的核心证明。\u003c/li>\u003cli>A10 对一般幂级数半径结构和逐项求导只给范围说明，没有展开一致收敛理论。\u003c/li>\u003cli>A13 完整推导二阶逆矩阵；不声称完成一般行列式理论。\u003c/li>\u003cli>A18 提及局部存在唯一性的标准条件但不展开证明；本卡分离公式与指数模型的证明已写出。\u003c/li>\u003c/ul>\u003cp>先在高中规定方法内解题，再用高阶工具回看结构。高阶内容属于拓展，不自动视作当地考试允许的直接援引结论。\u003c/p>\u003ch2>维护方式\u003c/h2>\u003cp>若只做个人笔记，使用阅读页笔记即可。若修改基础正文，优先编辑data下对应JSON；分层题与自学深化讲解编辑扩充资料下相应JSON，再运行构建工具。自动生成的知识卡与分册会被下一次构建覆盖，不能只改生成稿。正式修改前先备份整份ZIP，保留自己的新内容。\u003c/p>\u003cp>更新模块时保持 id 稳定，以免个人进度和前置链接失效。sources 中保留实际来源及“读到什么”的定位说明。题目若来自真实试卷，须另写年份、地区、卷别、题号、原卷链接及核对状态；不能去掉原创标记后直接称真题。\u003c/p>\u003cp>本版生成脚本只使用 Node.js 标准库，进入知识库目录后执行：\u003c/p>\u003cpre>\u003ccode>node .\\构建工具\\build_kb.mjs\u003c/code>\u003c/pre>\u003cp>构建会读取本目录数据，并重建阅读页、知识卡、分册、索引及结构检查结果；不会访问云端，也不会自动上传。请在副本中试改并阅读检查结果。\u003c/p>\u003cp>图解索引与SVG已经随库提供。若修改图形生成代码，先运行 \u003ccode>node .\\构建工具\\build_diagrams.mjs\u003c/code>，再运行正文构建。详细讲解中的入门题与迁移题独立于practice数组统计，不能通过合并计数夸大常规题库数量。库版本更新到1.1不改变原进度格式，旧导出的进度JSON仍采用version=1。\u003c/p>","audit":"\u003ch1>严谨性与自学可用性审查\u003c/h1>\u003cp>版本 1.1 · 2026-09-16。审查对象为本库当前103个模块，不是对全部教材、各地区课程或历年试卷的认证。\u003c/p>\u003ch2>结论先说清楚\u003c/h2>\u003cp>1.0版更适合作为“带解释的知识索引与复习卡”，还不能当作每个主题都能从零独立学会的完整教材。主要短板不是公式数量少，而是先修知识、方法选择、关键推理和学习反馈之间缺少台阶。\u003c/p>\u003cp>对原结构的实际统计发现：103道例题的解答均只有2至3个数组步骤，206道自测解析均少于60个字符；按“理解并、解释并、说明并、能够解释”等固定措辞检查，60张卡的全部目标都使用这类宽泛表述。这些统计只用于发现值得深审的位置，不能用字数或步骤数直接判定数学对错。\u003c/p>\u003cp>1.1版保留主干内容，并把12个关键模块加深为自学示范。其余91个模块没有被冒称已同等详细重写；阅读器会提示其当前仍为基础卡。新增27个模块的81道分层题，使常规自测共287道；12张深化卡另有24道入门／迁移检测，不混入常规自测数字。新增8幅可缩放数学图解。\u003c/p>\u003ch2>本次直接修正与澄清的正文\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>位置\u003c/th>\u003cth>原风险\u003c/th>\u003cth>已落实的调整\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>H37 抽样\u003c/td>\u003ctd>个体等机会不足以定义固定样本量简单随机抽样\u003c/td>\u003ctd>改为所有等大小子集等可能；加入四人只抽两组的反例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H12 周期\u003c/td>\u003ctd>“适用点”可能造成定义域交集为空的错误判断\u003c/td>\u003ctd>明确完整周期图象的定义域在±T下保持；区分周期与最小正周期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H19 空间角\u003c/td>\u003ctd>“锐夹角”遗漏直角及平行端点\u003c/td>\u003ctd>写明较小角在[0,π/2]内；方向和法向量均非零；指定二面角另判朝向\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J38 位似\u003c/td>\u003ctd>未明示比例系数非零，且提前使用向量语言\u003c/td>\u003ctd>补k≠0、距离和同异侧表述；向量只作后续简写\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J34 面积例题\u003c/td>\u003ctd>允许端点时三角形退化\u003c/td>\u003ctd>题干改为0&lt;x&lt;4，保留原最大值和取值点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J42 测楼模型\u003c/td>\u003ctd>未交代观察者与楼脚是否等高\u003c/td>\u003ctd>补水平地面、竖直楼体、水平距离和忽略误差条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J23、H13 前置\u003c/td>\u003ctd>坐标距离、平方展开、全等或模计算有隐性依赖\u003c/td>\u003ctd>明示相关前置；J23证明补出中央正方形和逆定理构造\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A02 递推极限\u003c/td>\u003ctd>直接借用后续连续性知识形成隐性跳步\u003c/td>\u003ctd>用根式差有理化说明取极限，不新增循环先修\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A08 微积分基本定理\u003c/td>\u003ctd>将积分函数的连续性延伸到端点过快\u003c/td>\u003ctd>补出有界积分估计，解释端点连续\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A10 级数\u003c/td>\u003ctd>用单向余项上界容易误解误差控制\u003c/td>\u003ctd>改为余项绝对值界；收敛半径定理明确标为陈述未证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A14、A15 证明范围\u003c/td>\u003ctd>“完整证明”可能被误解成从头证明一切\u003c/td>\u003ctd>明列一般矩阵可逆判据、绝对收敛级数运算等接受的基础结果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A16 不相关与独立\u003c/td>\u003ctd>“Y由X决定”不是一般的不独立充分理由\u003c/td>\u003ctd>用联合概率1/3与边缘概率乘积1/9不等作严格反例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A18 微分方程\u003c/td>\u003ctd>Lipschitz术语没有定义\u003c/td>\u003ctd>补局部统一常数不等式、矩形邻域与初值条件；定理仍标明未证\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>H37的定义参照加拿大统计局关于固定样本量简单随机抽样的说明：\u003ca href=\"https://www150.statcan.gc.ca/n1/pub/12-587-x/12-587-x2003001-eng.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Survey Methods and Practices\u003c/a>。H12完整平移关系可对照\u003ca href=\"https://openstax.org/books/algebra-and-trigonometry/pages/8-1-graphs-of-the-sine-and-cosine-functions\" target=\"_blank\" rel=\"noopener noreferrer\">OpenStax 三角函数周期\u003c/a>。反例与补充讲解为本库自行编写，不是抄录教材。\u003c/p>\u003ch2>“更详细”具体指什么\u003c/h2>\u003cp>不是把每句扩长，而是让学习者能回答下面的问题：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>学习环节\u003c/th>\u003cth>要给学生的东西\u003c/th>\u003cth>怎样判断是否起作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>起点\u003c/td>\u003ctd>一道能暴露先修缺口的题及回读位置\u003c/td>\u003ctd>能判断卡点来自分数、符号还是新概念\u003c/td>\u003c/tr>\u003ctr>\u003ctd>定义\u003c/td>\u003ctd>对象、符号、量词、定义域和非退化条件\u003c/td>\u003ctd>能举一个符合例和一个不符合例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>动机\u003c/td>\u003ctd>从已知困难或具体情境引出工具\u003c/td>\u003ctd>能解释为什么需要这个概念\u003c/td>\u003c/tr>\u003ctr>\u003ctd>图示\u003c/td>\u003ctd>与正文中的点、变量、步骤一致的图\u003c/td>\u003ctd>能把图中的一段、一个角对应到算式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>论证\u003c/td>\u003ctd>每次变形的依据，充分必要关系和分支\u003c/td>\u003ctd>能补出被遮住的一步，不仅复述答案\u003c/td>\u003c/tr>\u003ctr>\u003ctd>例题\u003c/td>\u003ctd>读题、选方法、列式、求解、核查\u003c/td>\u003ctd>能解释为什么选该方法，何时不能用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>错解\u003c/td>\u003ctd>具体错误过程、最先失效的一步、反例\u003c/td>\u003ctd>能说出错因，而不只写“答案不对”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>练习\u003c/td>\u003ctd>基础巩固、条件变式、综合应用\u003c/td>\u003ctd>会操作、会检查条件、会迁移分别检测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>退出\u003c/td>\u003ctd>新问题和可执行的补救建议\u003c/td>\u003ctd>不看原例仍能独立写出关键理由\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>这些设计参考了学习科学中的例题与独立练习交替、文字与图形对应、自我解释和延迟提取等建议，并非保证任何学生都以相同速度学会。\u003ca href=\"https://ies.ed.gov/ncee/wwc/practiceguide/1\" target=\"_blank\" rel=\"noopener noreferrer\">IES 学习组织实践指南\u003c/a> 对各建议的证据强度作了区分；本库不把证据较弱的入门预问与证据较强的复测一概宣传为同等确定。\u003c/p>\u003cp>新手先获得清晰示范，熟练后逐步减少支持；讲解应与需要使用的图形、条件放在一起，避免无关信息造成负担。这也是本次分块解释而不只拉长段落的原因。\u003ca href=\"https://education.nsw.gov.au/about-us/education-data-and-research/cese/publications/practical-guides-for-educators/cognitive-load-theory-in-practice.html\" target=\"_blank\" rel=\"noopener noreferrer\">NSW 教育部认知负荷实践指南\u003c/a>\u003c/p>\u003ch2>12个详细自学示范\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>本轮特别展开的难点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>J06 一次方程\u003c/td>\u003ctd>整体乘公倍数、移项的实质、等价变形与乘0的区别\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J16 全等\u003c/td>\u003ctd>顶点对应、公共边、全等后才能调用对应角、邻补角\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J23 勾股\u003c/td>\u003ctd>面积拼图、逆定理为何另需证明、长度根与坐标退化情形\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J33 二次函数\u003c/td>\u003ctd>配方、允许范围、顶点与端点、离散整数最优\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H04 基本不等式\u003c/td>\u003ctd>下界与最小值、取等条件是否可达、范围改变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H13 向量\u003c/td>\u003ctd>结果类型、正交坐标、零向量、点积判角的合法性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H28 导数应用\u003c/td>\u003ctd>导数符号与单调、极值和最值、端点与并列最值点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H33 条件概率\u003c/td>\u003ctd>分母代表的范围、来源划分、路径相乘与互斥相加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A06 中值定理\u003c/td>\u003ctd>为什么减去割线、存在不等于唯一、更不等于中点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A07 泰勒\u003c/td>\u003ctd>中心、变量、阶数、零系数、未知中间点、保证误差\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A11 柯西\u003c/td>\u003ctd>投影系数的来由、范数展开、零向量分支、取等符号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A12 詹森\u003c/td>\u003ctd>凸与严格凸、权重为0、对数选择、变号和可达等号\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>高阶证明的前置账本\u003c/h2>\u003cp>“本卡完整证明”只能表示在明确的基础上推完目标结论。读者应始终区分：本卡已经证明、本库其他卡已经证明、本库接受但未证明。\u003c/p>\u003cul>\u003cli>实数完备性、闭区间紧致性相关结果不是本库从集合公理重新构建的内容。\u003c/li>\u003cli>A06接用闭区间最值定理，A07再使用罗尔；若不理解上一层，应回读，不靠重复背公式跨过。\u003c/li>\u003cli>A08接用连续函数可积与积分基本性质，未完整建立黎曼积分理论。\u003c/li>\u003cli>A10未证明一般收敛半径和一致收敛理论，A15使用的绝对收敛级数运算也有接受的基础结果。\u003c/li>\u003cli>A13只完整推导二阶逆，A14一般n阶结论另依赖基与可逆的等价关系。\u003c/li>\u003cli>A18分离变量公式不等于对所有非唯一初值问题作完整解分类。\u003c/li>\u003c/ul>\u003cp>有限的数值验证不能证明一般定理。某充分条件不满足，也不表示结论必然错误；A07条件变式专门检查这种逻辑区别。\u003c/p>\u003ch2>学生如何用这一版\u003c/h2>\u003cp>先选一个示范模块做入门检测。能独立解释就继续；有运算缺口先回读。读例题时先遮住详细过程，尝试说出下一步及理由，再与讲解比较。做错时记录“第一处不能成立的步骤”，而不只是抄正确答案。\u003c/p>\u003cp>退出题做对后，隔一段时间在不看原文的情况下重新完成，并解释一个条件变化。复习间隔依难度与遗忘情况调整；本库不声称某个固定日程对所有人最优。一次做对不自动等于整个专题掌握，学习状态由自己记录，不是自动测评。\u003c/p>\u003ch2>仍需继续的部分（明确未完成）\u003c/h2>\u003cp>优先把跨度过大的J25、J28、J31、H05、H23等主题拆为可独立检测的小节，为每个小节补不同用途的例题。继续完善J37、J44及立体几何的配套图，并补全其余91张卡的入口、错解诊断、迁移题与针对性回读。\u003c/p>\u003cp>原有206道短解析仍保留，不能因新增81道长解析就说全部练习已详细重写。尚未做真实学生试学，阅读难度与误解发生率未经教学实验测量；没有经过出版社式外部专家审定，也不保证永无错误。地区课标对照、逐页教材覆盖及成套历年试卷验证继续列为待完成事项。\u003c/p>\u003cp>若用于正式考试复习，请以适用教材、教师要求和当地考试规则为准。高阶工具是理解与拓展资源，不自动属于可直接援引的考试方法。\u003c/p>"}}</script><script>(()=>{'use strict';
const KB=JSON.parse(document.getElementById('kb-data').textContent), modules=KB.modules, byId=new Map(modules.map(m=>[m.id,m]));
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['未学','学习中','需复习','已掌握'], key='math-learning-library-v1', main=$('main');
const searchText=new Map(modules.map(m=>[m.id,JSON.stringify(m).toLocaleLowerCase()]));
let progress={}, view='home', timer;
function cleanProgress(saved){const out={};if(saved&&typeof saved==='object'&&!Array.isArray(saved)){for(const m of modules){const p=saved[m.id];if(p&&statuses.includes(p.status))out[m.id]={status:p.status,note:typeof p.note==='string'?p.note.slice(0,10000):'',updatedAt:typeof p.updatedAt==='string'?p.updatedAt:''};}}return out;}
try{progress=cleanProgress(JSON.parse(localStorage.getItem(key)||'{}'));}catch(e){$('save-warning').hidden=false;}
const state=id=>progress[id]?.status||'未学';
const save=(id,changes)=>{const stamp=new Date().toISOString();if(id)progress[id]={status:'未学',note:'',...(progress[id]||{}),...changes,updatedAt:stamp};try{if(id){const latest=cleanProgress(JSON.parse(localStorage.getItem(key)||'{}'));progress={...latest,[id]:{status:'未学',note:'',...(latest[id]||{}),...changes,updatedAt:stamp}};}localStorage.setItem(key,JSON.stringify(progress));$('save-warning').hidden=true;return true;}catch(e){$('save-warning').hidden=false;return false;}};
const toast=t=>{$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,4200);};
const list=items=>'<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
const ordered=items=>'<ol>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
const link=id=>byId.has(id)?'<a class="chip" href="#'+id+'" title="'+esc(byId.get(id).title)+'">'+esc(id)+' '+esc(byId.get(id).title)+'</a>':esc(id);
const shortLink=id=>'<a class="chip" href="#'+id+'" title="'+esc(byId.get(id)?.title)+'">'+esc(id)+'</a>';
const sourceLink=s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+'</a>';
const stageCounts=stage=>modules.filter(m=>m.stage===stage).length;
function renderList(){const q=$('search').value.trim().toLocaleLowerCase(),stage=$('stage').value,filter=$('state').value;
const found=modules.filter(m=>(!q||searchText.get(m.id).includes(q))&&(!stage||m.stage===stage)&&(!filter||state(m.id)===filter));
$('list-count').textContent=found.length+' / '+modules.length+' 个模块';
$('list').innerHTML=found.length?found.map(m=>'<button class="item '+(view===m.id?'selected':'')+'" data-id="'+m.id+'" aria-label="'+esc(m.id+' '+m.title+'，'+state(m.id))+'"'+(view===m.id?' aria-current="page"':'')+'><span class="id">'+m.id+'</span><span>'+esc(m.title)+'</span><span class="dot '+({'已掌握':'mastered','需复习':'review','学习中':'learning'}[state(m.id)]||'')+'" title="'+state(m.id)+'"></span></button>').join(''):'<p class="empty">未找到匹配内容。可换一个词，或清除筛选。</p>';}
function nextModule(){return KB.order.map(id=>byId.get(id)).find(m=>state(m.id)!=='已掌握'&&m.prerequisites.every(id=>state(id)==='已掌握'))||modules.find(m=>state(m.id)!=='已掌握')||modules[0];}
function homeBase(){const done=modules.filter(m=>state(m.id)==='已掌握').length,review=modules.filter(m=>state(m.id)==='需复习').length,learning=modules.filter(m=>state(m.id)==='学习中').length,next=nextModule();
main.innerHTML='<section class="hero"><p class="eyebrow">先理解，再推导，最后独立完成</p><h1>把零散知识，连成一条学习路径。</h1><p class="lead">从初中运算到高中综合，再到高阶公式。每一张知识卡都告诉你：先学什么、条件是什么、为什么成立，以及怎样检验自己是否真正理解。</p><div class="hero-actions"><button class="primary" data-go="'+next.id+'">'+(done||learning||review?'学习推荐：':'从基础开始：')+next.id+'</button><button data-go="routes">查看学习路线</button></div></section><div class="stats">'+['初中','高中','高阶拓展'].map(stage=>'<div class="stat"><strong>'+stageCounts(stage)+'</strong><span>'+stage+' · 个知识模块</span></div>').join('')+'</div><section class="progressbox"><div class="progressline"><strong>你的学习记录</strong><small>'+done+' / '+modules.length+' 已标记掌握</small></div><div class="track"><div class="fill" style="width:'+(done/modules.length*100)+'%"></div></div><p class="small muted">学习中 '+learning+' · 需复习 '+review+' · 状态由你自己记录，不是自动评分。</p></section><div class="cols"><section class="panel"><p class="eyebrow">每一张卡片</p><h2 style="margin-top:0">不只给公式，也讲条件</h2><p>前置知识与基础定义 → 方法与易错点 → 完整例题 → 遮住解析做自测。高阶卡另有正式定理、证明范围与推导。</p><p class="small muted">'+KB.stats.concepts+' 个细知识条目 · '+KB.stats.examples+' 道讲解例题 · '+KB.stats.practice+' 道自测</p></section><section class="panel"><p class="eyebrow">学习使用边界</p><h2 style="margin-top:0">主干版，而非穷尽版</h2><p>全国通用知识底座，尚未按地区设定考试权重。原创训练与真题证据分开，高阶拓展不标为统一高考必修。</p><p><a href="#sources">查看来源与版本核查</a></p></section></div><div class="notice">离线阅读可用。学习状态和个人笔记只存在当前浏览器；请定期点击“导出进度”备份。仓库副本不会自动同步学习进度。</div>';}
function home(){homeBase();main.insertAdjacentHTML('afterbegin','<div class="notice"><strong>v'+esc(KB.meta.version)+' 自学深化版</strong><p>'+KB.stats.deepStudyModules+' 个模块已补逐步自学讲解 · '+KB.stats.diagrams+' 幅数学图解 · '+KB.stats.layeredModules+' 个模块新增分层练习。<a href="#audit">查看审查结论与未完成事项</a></p><div class="links">'+modules.filter(m=>m.selfStudy).map(m=>shortLink(m.id)).join('')+'</div></div>');}
const steps=items=>'<div class="explain-steps">'+items.map((x,i)=>'<article><h3>'+String(i+1).padStart(2,'0')+' · '+esc(x.step)+'</h3><p>'+esc(x.detail)+'</p></article>').join('')+'</div>';
const checkBox=(title,c)=>'<section class="check-box"><h2>'+title+'</h2><p class="question">'+esc(c.question)+'</p><details><summary>先独立回答，再核对</summary><p><strong>答案：</strong>'+esc(c.answer)+'</p><p>'+esc(c.explanation)+'</p></details></section>';
function decorateModule(html,m){const s=m.selfStudy;
 const entry=s?'<p class="pill">已补详细自学讲解 · v1.1</p>'+checkBox('入门检查：我准备好了吗？',s.entryCheck):'<div class="notice">本模块当前为基础知识卡，尚未补齐详细自学讲解。先核对前置，再读例题；若无法解释其中一步，请记下卡点，不必急着标为掌握。</div>';
 const intuition=s?'<section class="intuition"><h2>直观入口：先看懂在研究什么</h2><p>'+esc(s.intuition)+'</p><p class="small muted">直观解释帮助形成想法；定理是否成立以条件和论证为准。</p></section>':'';
 html=html.replace('<section><h2>基础与概念</h2>',entry+intuition+'<section><h2>基础与概念</h2>');
 let detailed=s?'<section><h2>不跳步的推理</h2>'+steps(s.reasoning)+'</section>':'';
 if(m.illustrations)detailed+='<section><h2>图解与读图提示</h2>'+m.illustrations.map(d=>'<figure class="math-diagram">'+d.svg+'<figcaption>'+esc(d.caption)+'</figcaption></figure>').join('')+'</section>';
 const insertion=m.theorem?'<section class="theorem">':'<section><h2>解题方法</h2>';
 html=html.replace(insertion,detailed+insertion);
 if(s){html=html.replace('<section><h2>遮住解析，自己做</h2>','<section><h2>老师怎样想到并检查每一步</h2><p class="small muted">下面逐步拆解上方同一道例题；先自己说理由，再读对应解释。</p>'+steps(s.workedWalkthrough)+'</section><section class="wrong-example"><h2>错解对照：哪里看似合理却不成立？</h2><p><strong>错误说法：</strong>'+esc(s.wrongApproach.claim)+'</p><p><strong>错在哪里：</strong>'+esc(s.wrongApproach.whyWrong)+'</p><p><strong>怎样修正：</strong>'+esc(s.wrongApproach.correction)+'</p></section><section><h2>遮住解析，自己做</h2>');
 html=html.replace('<section><h2>掌握检查</h2>',checkBox('离开本节前：独立迁移',s.exitCheck)+'<section><h2>卡住时回哪里补</h2>'+s.remediation.map(r=>'<div class="remediation"><strong>'+esc(r.difficulty)+'</strong><p>'+link(r.moduleId)+'</p><p>'+esc(r.action)+'</p></div>').join('')+'</section><section><h2>掌握检查</h2>');}
 html=html.replace('两道自测是入门检查，不代表该专题的完整练习量。',m.practice.length>2?'先做基础，再做条件变式与综合应用。看解析前先写出理由；题量仍不代表专题已经穷尽。':'两道自测仅作入门检查，本模块的分层练习仍待扩充。');return html;}
function modulePage(m){const missing=m.prerequisites.filter(id=>state(id)!=='已掌握'), dependent=modules.filter(x=>x.prerequisites.includes(m.id));
let html='<p class="eyebrow">'+m.id+' / '+esc(m.stage)+' / '+esc(m.domain)+'</p><h1>'+esc(m.title)+'</h1><div class="meta"><span class="pill">'+esc(m.grade)+'</span>'+(m.courseType?'<span class="pill">'+esc(m.courseType)+'</span>':'')+'</div><div class="studybar"><label>学习状态 <select id="current-status" aria-label="当前模块学习状态">'+statuses.map(s=>'<option'+(s===state(m.id)?' selected':'')+'>'+s+'</option>').join('')+'</select></label><span class="small muted">先独立做题，再决定是否掌握</span></div><section><h2>先备知识</h2><div class="links">'+(m.prerequisites.length?m.prerequisites.map(link).join(''):'<span class="muted">本库起点，无必须先读的知识卡。</span>')+'</div>'+(missing.length?'<p class="small muted">以上有 '+missing.length+' 个前置尚未标记掌握；已有基础可直接阅读，需要时再补。</p>':'')+'</section><section><h2>本节要做到</h2>'+list(m.goals)+'</section><section><h2>基础与概念</h2>'+m.concepts.map((c,i)=>'<div class="concept"><h3><span class="concept-num">'+String(i+1).padStart(2,'0')+'</span>'+esc(c.name)+'</h3><p>'+esc(c.explanation)+'</p></div>').join('')+'</section>';
if(m.theorem){const t=m.theorem;html+='<section class="theorem"><p class="eyebrow">定理 / 条件 / 证明</p><h2>'+esc(t.name)+'</h2><h3>成立条件</h3>'+list(t.assumptions)+'<h3>结论</h3><div class="formula">'+esc(t.statement)+'</div><h3>为什么成立</h3><p class="proof-label">'+esc(t.proofLevel)+'</p>'+ordered(t.proof)+'</section>';}
if(m.derivation)html+='<section><h2>公式如何衍生</h2>'+ordered(m.derivation)+'</section>';
html+='<section><h2>解题方法</h2>'+list(m.methods)+'</section><div class="notice"><strong>易错与限制</strong>'+list(m.pitfalls)+'</div><section class="worked"><p class="eyebrow">原创编写 / 完整例题</p><h2>跟着推一次</h2><p class="question">'+esc(m.example.question.replace('【原创】',''))+'</p>'+ordered(m.example.solution)+'<p class="answer">答案：'+esc(m.example.answer)+'</p></section><section><h2>遮住解析，自己做</h2><p class="small muted">两道自测是入门检查，不代表该专题的完整练习量。</p>'+m.practice.map((p,i)=>'<article class="practice"><span class="pill">'+esc(p.level)+'</span><p class="question">'+(i+1)+'. '+esc(p.question.replace('【原创】',''))+'</p><details><summary>展开答案与解析</summary><p><strong>答案：</strong>'+esc(p.answer)+'</p><p><strong>解析：</strong>'+esc(p.solution)+'</p></details></article>').join('')+'</section><section><h2>掌握检查</h2>'+list(m.mastery)+'</section><section><h2>我的笔记与错因</h2><label><span class="sr-only">当前模块笔记</span><textarea aria-label="当前模块笔记" id="note" class="notearea" maxlength="10000" placeholder="记下卡住的一步、遗漏的条件，或自己找到的另一种证明…">'+esc(progress[m.id]?.note||'')+'</textarea></label><p id="note-status" class="small muted">仅保存在当前浏览器；最多 10000 字符，可随进度一起导出。</p></section>';
if(dependent.length)html+='<section><h2>学完可以接到</h2><div class="links">'+dependent.map(x=>link(x.id)).join('')+'</div></section>';
html+='<section class="sources"><h3>核查来源与对应范围</h3><ul>'+m.sources.map(s=>'<li>'+sourceLink(s)+'<br>'+esc(s.locator)+'</li>').join('')+'</ul><p>本卡为自行组织的讲解和训练，不是教材原文的逐字摘录。引用来源不代表逐页核完该教材。</p></section>';
const at=KB.order.indexOf(m.id),prev=byId.get(KB.order[at-1]),next=byId.get(KB.order[at+1]);html+='<div class="bottom-nav">'+(prev?'<button data-go="'+prev.id+'">← '+prev.id+' 上一模块</button>':'<span></span>')+'<button data-go="home">返回概览</button>'+(next?'<button data-go="'+next.id+'">下一模块 '+next.id+' →</button>':'<span></span>')+'</div>';main.innerHTML=decorateModule(html,m);
$('current-status').addEventListener('change',e=>{const ok=save(m.id,{status:e.target.value});renderList();toast(ok?'已保存 '+m.id+' 的学习状态':'暂未写入浏览器，请导出备份');});
$('note').addEventListener('input',e=>{$('note-status').textContent=save(m.id,{note:e.target.value})?'已保存到当前浏览器；请定期导出进度备份。':'本地保存失败，请导出进度备份。';});}
function routes(){main.innerHTML='<p class="eyebrow">知识之间的连接</p><h1>按依赖学习，不必按页码跳转。</h1><p class="lead">下列是主题主线，不是单一强制顺序。每张卡还列出跨分支前置；“上一／下一模块”按无环依赖排序安排。</p>'+KB.meta.routes.map(r=>'<section class="route"><h2>'+esc(r.title)+'</h2><p>'+esc(r.description)+'</p><div class="chain">'+r.ids.map(shortLink).join('<span class="arrow">→</span>')+'</div></section>').join('')+'<div class="notice">先确保中学主干稳固，再选择高阶分支。能用简单方法完成的题目，不要求强行使用高阶定理。</div>';}
function render(){const id=location.hash.slice(1)||'home';view=byId.has(id)||['home','routes','sources','exams','help','audit'].includes(id)?id:'home';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
if(byId.has(view)){modulePage(byId.get(view));document.title=view+' '+byId.get(view).title+' · 数学知识库';}else if(view==='home'){home();document.title='初高中数学自学知识库';}else if(view==='routes'){routes();document.title='学习路线 · 数学知识库';}else{main.innerHTML='<article class="doc">'+KB.docs[view]+'</article>';document.title=({'sources':'来源','exams':'真题证据','help':'使用说明','audit':'严谨性与自学审查'}[view])+' · 数学知识库';}
renderList();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-id],[data-go],[data-view]');if(b){location.hash=b.dataset.id||b.dataset.go||b.dataset.view;}});
window.addEventListener('storage',e=>{if(e.key!==key)return;try{progress=cleanProgress(JSON.parse(e.newValue||'{}'));renderList();if(view==='home')home();else if(byId.has(view)){const box=$('note');$('current-status').value=state(view);if(box&&document.activeElement!==box)box.value=progress[view]?.note||'';}}catch(error){toast('另一标签页的进度格式异常，请保留当前备份。');}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'auto'});});
['search','stage','state'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderList));
$('clear').addEventListener('click',()=>{['search','stage','state'].forEach(id=>$(id).value='');renderList();});
$('export').addEventListener('click',()=>{const data={format:'math-learning-library-progress',version:1,exportedAt:new Date().toISOString(),progress};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='数学学习进度_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('进度文件已交给浏览器下载，请保留备份。');});
$('import').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('文件超过 5 MB。');const data=JSON.parse(await file.text());if(data.format!=='math-learning-library-progress'||data.version!==1||!data.progress||Array.isArray(data.progress)||typeof data.progress!=='object')throw Error('不是本知识库导出的进度文件。');const next={};let count=0;for(const [id,p] of Object.entries(data.progress)){if(!byId.has(id))continue;if(!p||!statuses.includes(p.status)||typeof(p.note??'')!=='string')throw Error('进度字段不合法：'+id);next[id]={status:p.status,note:(p.note||'').slice(0,10000),updatedAt:typeof p.updatedAt==='string'?p.updatedAt:''};count++;}if(confirm('即将用 '+count+' 条记录覆盖本浏览器中这份知识库的全部进度和笔记。建议先导出备份。确定继续吗？')){progress=next;const ok=save();render();toast(ok?'已导入 '+count+' 条学习记录。':'已读入当前页，但浏览器保存失败，请导出备份。');}}catch(error){toast('导入失败：'+error.message);}finally{e.target.value='';}});
render();
})();
</script></body></html>
