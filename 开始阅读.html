ole="status" hidden></div><noscript><p>请启用浏览器 JavaScript 阅读交互页面，或直接打开知识卡文件夹中的 Markdown 正文。</p></noscript><script id="kb-data" type="application/json">{"modules":[{"id":"J01","stage":"初中","grade":"小初衔接","domain":"数与代数","title":"分数、比、百分数与单位","prerequisites":[],"goals":["把分数、小数、百分数互化并解释单位1","用比和比例分配总量","把长度、面积、体积单位分别正确换算"],"concepts":[{"name":"分数与单位1","explanation":"a/b表示把单位1平均分成b份取a份，其中b不能为0。分数可以表示一个数，也可以表示部分与整体的关系。比较两个百分率之前，要先确认它们的单位1是否相同；甲班的一半和乙班的一半，人数不一定一样。"},{"name":"约分、通分与运算","explanation":"分子分母同时乘或除以同一个非零数，分数的值不变。分数加减先通分，因为只有相同大小的份才能直接合并；乘法把分子、分母分别相乘；除以非零分数等于乘它的倒数。约分应约乘法中的公因数，不能约加法中的单独一项。"},{"name":"比、比例与百分率","explanation":"a:b比较两个量的倍数关系，b≠0。若总量按m:n分配，两部分分别是总量的m/(m+n)、n/(m+n)。增长率以原量作分母，新量=原量×(1+增长率)；先涨后降应逐次乘变化因子，百分数通常不能直接抵消。"},{"name":"量纲与单位换算","explanation":"计算相同种类的量前先统一单位。长度进率为10时，面积进率是100，体积进率是1000，因为面积、体积分别包含两个、三个长度因子。1 m²=10000 cm²，1 L=1000 cm³；速度换算要同时处理长度和时间。"}],"methods":["处理比例题先标出总量和单位1，再把比的各项相加得到总份数；用每份量反算各部分并验总和。","遇到涨跌写成连续乘法；单位换算列成等式，保留单位到最后。"],"pitfalls":["把上涨20%再下降20%理解为不变：100×1.2×0.8=96，是减少4%。","1 m²不是100 cm²；面积的两个方向都需要换算。"],"example":{"question":"【原创】一批480本书按5:3分给甲、乙组。甲组拿出所得图书的20%捐出，甲组还剩多少本？","solution":["总份数是5+3=8，甲组原得480×5/8=300本。","20%的单位1是甲组的300本，捐出300×20%=60本。","剩余300−60=240本；乙组180本，捐出的60本加两组余量仍为480本。"],"answer":"甲组还剩240本。"},"practice":[{"question":"【原创】计算3/4+5/6，并把0.375写成最简分数和百分数。","answer":"19/12；3/8；37.5%。","solution":"通分为9/12+10/12=19/12；0.375=375/1000=3/8，乘100%得37.5%。","level":"基础"},{"question":"【原创】某物品先提价25%，再打八折，现价80元，原价是多少？","answer":"80元。","solution":"两次变化的总因子是1.25×0.8=1；所以现价等于原价，原价为80元。","level":"进阶"}],"mastery":["解释同为20%为什么对应数量可能不同","不用计算器完成分数四则运算并验算","给面积和体积换算写出进率来源"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J02","stage":"初中","grade":"七年级起步","domain":"数与代数","title":"有理数、数轴与绝对值","prerequisites":["J01"],"goals":["区分正负数、整数和分数","用数轴表示数并比较大小","用绝对值求距离和讨论符号"],"concepts":[{"name":"有理数与正负意义","explanation":"能写成整数p除以非零整数q形式的数叫有理数，包括整数、有限小数和无限循环小数。正负号表达相对于基准的两个方向；0既不是正数也不是负数，却是整数。有负号的式子未必表示负数，例如a=−2时，−a=2。"},{"name":"数轴与大小比较","explanation":"数轴规定原点、正方向和单位长度。每个有理数都对应一个点，右边的数大于左边的数；两个负数比较时，离原点更远的反而更小。数轴可以把温差、方向、移动和范围放进同一个直观模型中。"},{"name":"相反数与绝对值","explanation":"a与−a互为相反数，和为0。|a|表示a对应点到原点的距离，所以永远非负；a≥0时|a|=a，a\u003c0时|a|=−a。数轴上a、b两点的距离为|a−b|，距离与书写先后无关。"},{"name":"绝对值的分段与非负性","explanation":"去掉绝对值前必须判断内部式子的符号。|x−2|在x≥2时等于x−2，在x\u003c2时等于2−x。若几个非负数的和为0，每个数都必须为0；这可用于从|a|+|b|=0推出a=b=0。"}],"methods":["先把分数或小数统一成便于比较的形式，在数轴上确定大致位置，再处理符号。","绝对值方程先解释为距离：|x−a|=r，r>0时对应a左右距离r的两个点。"],"pitfalls":["|−3|=3，但−|−3|=−3，外部负号不能一起消失。","两个数绝对值相等不代表相等，例如3与−3。"],"example":{"question":"【原创】数轴上A表示−4，B表示2。求AB长度；求到B的距离为3的点所表示的数。","solution":["AB=|2−(−4)|=6。","设所求数为x，到B距离为3即|x−2|=3。","点可在B右侧或左侧，所以x=2+3=5或x=2−3=−1。"],"answer":"AB=6；所求数为5或−1。"},"practice":[{"question":"【原创】按从小到大排列−1.2、−5/4、0，并求−5/4的相反数。","answer":"−5/4\u003c−1.2\u003c0；相反数5/4。","solution":"−5/4=−1.25，比−1.2更靠左；相反数只改变数的符号。","level":"基础"},{"question":"【原创】若|a−3|+|b+2|=0，求a−b。","answer":"5。","solution":"两项均非负，和为0只能各为0，故a=3、b=−2，a−b=5。","level":"进阶"}],"mastery":["在数轴上解释负数大小和两点距离","按内部式子符号正确展开绝对值","写全距离方程的所有解"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J03","stage":"初中","grade":"七年级起步","domain":"数与代数","title":"有理数运算、乘方与科学记数法","prerequisites":["J02"],"goals":["准确处理带符号的混合运算","区分底数、指数及括号作用","规范表示大数并解释近似精度"],"concepts":[{"name":"加减与乘除","explanation":"同号两数相加保留符号并把绝对值相加；异号相加看绝对值较大者决定符号。减去一个数等于加它的相反数。乘除先定符号，再算绝对值；除数不能为0，0也没有倒数。两个负数的积为正可从分配律保持成立来理解。"},{"name":"乘方与运算顺序","explanation":"a的n次方在正整数n时表示n个a相乘。负数的偶次幂为正，奇次幂为负；−3²表示−(3²)，而(−3)²的底数包含负号。混合运算先括号，再乘方，再乘除，最后加减；同级运算一般从左到右。"},{"name":"运算律与简便计算","explanation":"交换律、结合律可重新安排加法或乘法；分配律a(b+c)=ab+ac使乘法与加法联系起来。减法和除法不满足一般的交换律、结合律，应先化成加相反数或乘倒数，再考虑重组。简算的每一步都应维持原式数值。"},{"name":"科学记数法与近似数","explanation":"非零数可写成a×10ⁿ，其中1≤|a|\u003c10，n为整数。本阶段先处理大数，正指数记录小数点移动的位数。近似数的最后一位指明精确到的位置，例如3.20精确到百分位；测量结果和计算值应按题目要求取舍。"}],"methods":["先画出括号层次，特别标出负底数，逐级计算；遇分数乘法优先约分，异号加法先判断结果正负。","科学记数法先取首位非零数字到小数点左侧，再数位数；用估计数量级检查指数。"],"pitfalls":["−2²=−4而(−2)²=4。","8÷2×4=16，不是1；乘除同级须按原有结构处理。"],"example":{"question":"【原创】计算−3²+2×(−4)²−18÷(−3)，并把4200000写成科学记数法。","solution":["乘方部分：−3²=−9，(−4)²=16。","乘除部分：2×16=32，18÷(−3)=−6。","原式=−9+32−(−6)=29；4200000=4.2×10⁶。"],"answer":"29；4.2×10⁶。"},"practice":[{"question":"【原创】计算(−1/2)³+(−1/2)²。","answer":"1/8。","solution":"两项分别为−1/8和1/4，相加为−1/8+2/8=1/8。","level":"基础"},{"question":"【原创】用简便方法计算(−25)×17+25×13。","answer":"−100。","solution":"提取25，原式=25×(−17+13)=25×(−4)=−100。","level":"进阶"}],"mastery":["说明每个负号属于底数还是整个幂","完成混合运算后用符号和数量级验算","规范书写科学记数法"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J04","stage":"初中","grade":"七年级起步","domain":"数与代数","title":"代数式、求值与规律表达","prerequisites":["J03"],"goals":["把文字关系写成代数式","正确代入负数与分数求值","用字母表达数列和图形规律"],"concepts":[{"name":"字母表示数","explanation":"字母可以表示未知数、变化的数或固定但暂未指定的数。代数式用运算连接数字和字母，描述一类共同关系。例如边长为a的正方形周长为4a，一个式子就覆盖了所有允许的边长；这里还要保留a>0的实际限制。"},{"name":"规范书写与语义","explanation":"数字与字母相乘时常省略乘号，系数写在前面；除法常写成分数形式。a与b的差的一半是(a−b)/2，a减去b的一半是a−b/2，括号反映文字中的运算层次。读式子时从最后完成的运算倒着分析，可避免误解。"},{"name":"代数式的值","explanation":"给字母指定允许的值，按运算顺序算出的结果叫代数式的值。用负数或分数替换字母时应加括号，避免幂和符号的范围发生改变。式子的结构可以先化简再代入，但原式的分母等条件不能因化简而遗失。"},{"name":"规律与一般化","explanation":"用字母总结规律要确认序号起点，并用不同位置检验。连续偶数可写成2n、2n+2，其中n为整数；排成一行且相邻共用一边的n个正方形需3n+1根等长小棒，因为第一个用4根，以后每增加一个添3根。"}],"methods":["先给每个字母写含义、单位和范围，再按数量关系逐层列式；代入后保留括号直到相应运算完成。","找图形规律时明确不变部分与每次新增部分，用第1项和第2项核验一般式。"],"pitfalls":["2a²不是(2a)²：a=3时前者18，后者36。","看到2、4、6就断定后面一定是8并非证明，必须有题设给出的生成规则。"],"example":{"question":"【原创】某展示墙用小棒排一行正方形，相邻正方形共用一条边。列出n个正方形需要的小棒数，并求n=12时的用量。","solution":["第1个正方形用4根；之后每增加1个，只需补3根。","n个共用4+3(n−1)=3n+1根，其中n为正整数。","代入n=12得3×12+1=37。"],"answer":"3n+1根；12个需37根。"},"practice":[{"question":"【原创】当a=−2、b=3时，求a²−2ab。","answer":"16。","solution":"代入得(−2)²−2×(−2)×3=4+12=16。","level":"基础"},{"question":"【原创】一个两位数十位数字为a，个位比十位大2，写出原数与交换数字后的数之差。","answer":"−18。","solution":"原数为10a+(a+2)=11a+2，交换后为10(a+2)+a=11a+20，相减得−18；a是1到7的整数。","level":"进阶"}],"mastery":["为文字表达选择正确括号","将负数代入含平方的式子","说明一般式适用的序号范围"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J05","stage":"初中","grade":"七年级起步","domain":"数与代数","title":"整式、同类项与加减","prerequisites":["J04"],"goals":["识别单项式的系数与次数","正确判断同类项","去括号、合并同类项并整体代入"],"concepts":[{"name":"单项式和多项式","explanation":"数字与字母的乘积组成单项式，数字因数叫系数，各字母指数之和叫次数。几个单项式的和是多项式，每个单项式连同它前面的符号是一项；多项式次数是最高次项的次数。常数项不含字母，识别项时不能丢掉负号。"},{"name":"同类项与合并","explanation":"同类项所含字母相同，而且相同字母的指数分别相同，系数不必相同。合并只对系数相加，字母部分不变，这是分配律的逆用。例如3x²y−5x²y=−2x²y，而3x²y与3xy²不能合并，尽管它们总次数相同。"},{"name":"去括号与添括号","explanation":"括号前是加号，可去掉括号并保留各项符号；括号前是减号，去掉括号时每一项都变号，其本质是用−1乘括号中每一项。添括号是逆向操作，若提出负号，括号内各项也要相应变号，确保整个表达式保持不变。"},{"name":"整体思想与恒等","explanation":"整式化简得到的等式对所有允许的字母值都成立，叫恒等变形。若已知x−y=3，计算2x−2y+5时可看成2(x−y)+5，直接整体代入。这样既减少计算，也避免在只有一个关系时错误地猜测x和y各自的值。"}],"methods":["把每一项连同符号圈在一起，先去括号，再按字母及指数分类合并；最后按次数降序整理。","求值题先检查能否化简或提取已知整体，化简后再代入，少做重复运算。"],"pitfalls":["−(x−2y+3)=−x+2y−3，三项都必须变号。","x+x=2x，而x×x=x²，加法和乘法不能混用。"],"example":{"question":"【原创】化简3(2x−y)−2(x+2y)，并求x=−1、y=2时的值。","solution":["运用分配律：6x−3y−2x−4y。","合并同类项得到4x−7y。","代入得4×(−1)−7×2=−18。"],"answer":"化简为4x−7y，值为−18。"},"practice":[{"question":"【原创】化简5a²b−2ab²−3a²b+ab²。","answer":"2a²b−ab²。","solution":"a²b项系数为5−3=2，ab²项系数为−2+1=−1，两类字母指数不同，不能继续合并。","level":"基础"},{"question":"【原创】已知2x−y=4，求6x−3y+7。","answer":"19。","solution":"把前三项中的变量部分看成3(2x−y)，原式=3×4+7=19。","level":"进阶"}],"mastery":["解释合并同类项为何不改变字母指数","独立检查带减号括号的展开","识别整体代入条件"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J06","stage":"初中","grade":"七年级起步","domain":"数与代数","title":"一元一次方程的意义与解法","prerequisites":["J05"],"goals":["判断一个数是否是方程的解","说明等价变形的依据","求解含括号和分母的一元一次方程"],"concepts":[{"name":"方程与解","explanation":"含未知数的等式叫方程，使等式左右相等的未知数值叫解。只含一个未知数，整理后能写成ax+b=0且a≠0的方程是一元一次方程。一个式子外观看似含一次项，还需注意整理后系数是否消失，例如x+1=x+2实际上无解。"},{"name":"等式性质与移项","explanation":"等式两边同时加减同一个数或式子，等式仍成立；同时乘同一个数或除以同一个非零数，也保持等式。移项变号只是两边同时加减的简写。把3x−5=7变成3x=12，是两边同时加5，并不是数字跨过等号会自动变形。"},{"name":"去分母与系数化1","explanation":"含数字分母时，两边同乘各分母的最小公倍数，可消去分母，但必须乘到每一项。之后去括号、移项、合并，得到ax=b；a≠0时两边除以a得x=b/a。处理含字母系数的问题时，要先确认所除的量不为0。"},{"name":"检验与特殊情形","explanation":"解出后把数代回最初的方程，检验左右是否相等，而不是只代回最后一步。如果整理结果为0x=0，则所有原式允许的数都是解；若为0x=b且b≠0，则无解。这两种情况说明原方程不再是a≠0的一元一次方程。"}],"methods":["先消去数字分母，再去括号；把未知数项集中到一边、常数项集中到另一边，合并后除以非零系数。","每次变形只做一到两种操作，并在原方程中检验结果，便于定位符号或漏乘错误。"],"pitfalls":["(x−1)/2−1=(x+2)/3两边乘6时，中间的−1也要变成−6。","由2x=6得x=3，不能写成x=6−2。"],"example":{"question":"【原创】解方程(x−1)/2−1=(x+2)/3。","solution":["两边乘6，得3(x−1)−6=2(x+2)。","去括号得3x−9=2x+4，移项得x=13。","代回左边：(13−1)/2−1=5；右边：(13+2)/3=5，检验成立。"],"answer":"x=13。"},"practice":[{"question":"【原创】解3(2x−1)=4x+7。","answer":"x=5。","solution":"去括号得6x−3=4x+7，移项2x=10，故x=5。","level":"基础"},{"question":"【原创】方程(a−2)x=6在什么条件下有唯一解？a=2时怎样？","answer":"a≠2时唯一解x=6/(a−2)；a=2时无解。","solution":"只有系数非零才可除以a−2；a=2时方程变为0=6，不成立。","level":"进阶"},{"question":"【原创·分层】解方程(2x−3)/4−(x+1)/6=5/12，并把所得解代回原方程检验。","answer":"x=4。","solution":"两边同乘12，得3(2x−3)−2(x+1)=5。去括号得6x−9−2x−2=5，即4x=16，所以x=4。代回原式左边为5/4−5/6=(15−10)/12=5/12，与右边相等。去分母时，应把每个分数项及等号右边一并乘12。","level":"基础巩固"},{"question":"【原创·分层】实数a为参数，讨论方程(a−1)x=2a−2的全部实数解：何时有唯一解，何时有无数个解，是否可能无解？","answer":"a≠1时唯一解x=2；a=1时任意实数x都是解；不存在无解的a。","solution":"右边可写成2(a−1)。当a≠1时，系数a−1非零，两边同除以它，得x=2。当a=1时，原方程变成0x=0，每个实数都满足。不能在未排除a=1之前直接约去a−1。两类参数已覆盖全部实数，且两类都至少有解，所以不可能无解。","level":"条件变式"},{"question":"【原创·分层】上下两层书架原来共有90本书。从上层取12本放到下层后，下层的本数恰好是上层的2倍。求两层原来的本数，并用调整后的本数核对条件。","answer":"上层原有42本，下层原有48本；调整后分别为30本和60本。","solution":"设上层原有x本，则下层原有90−x本。转移后，上层为x−12本，下层为90−x+12=102−x本。根据调整后的倍数关系列102−x=2(x−12)，得3x=126，x=42。故下层原有48本。调整后上层30本、下层60本，下层是上层2倍，总数仍为90。实际条件x≥12且x为整数也满足。","level":"综合应用"}],"mastery":["解释每一步为什么不改变解","去分母时准确照顾全部项","区分唯一解、无解与无限多个解"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"selfStudy":{"moduleId":"J06","entryCheck":{"question":"先不解方程：展开3(x−2)和−(x+1)，再说明“等式两边同乘6”是否包括等式中的整数项。","answer":"3(x−2)=3x−6，−(x+1)=−x−1；同乘6必须作用于两边的全部项，整数项也包括在内。","explanation":"如果展开时只乘第一项，或觉得去分母只需处理分数项，就先复习分配律。这张卡最常见的错误来自运算层次，而非未知数本身。可以先用x=2检查展开式是否与原式相等，再练习一般的字母表达。"},"intuition":"可以暂把等号想成“左右两份数量相等”：两边都增加同样的数量，或都变为原来的6倍，仍然相等。这个比喻帮助确定操作应施加在等式两边的整体上；正式依据是等式性质。含负数、字母和分母时，仍要检查每一步可否反向恢复，不能只凭天平图想象就判定所有变形安全。","reasoning":[{"step":"为什么解方程要关注“解是否改变”？","detail":"解方程的目标是找到使原等式成立的x。变形后的方程应与原方程有相同的解。两边同加一个数可以同减该数恢复；两边同乘非零数可以同除该数恢复，所以这些操作是可逆的。若同乘0，两边都会变成0=0，便丢失原条件，因此“仍然相等”还不足以保证保持解集。"},{"step":"为什么原例题选择两边乘6？","detail":"原例题是(x−1)/2−1=(x+2)/3，数字分母2、3的最小公倍数为6。乘6后，6/2=3、6/3=2，两个分母同时消去。选择12等其他非零公倍数也可保持解，但会引入更大的系数；6让计算更简短。"},{"step":"为什么中间的−1要变成−6？","detail":"左边作为整体是[(x−1)/2−1]。同乘6实际写成6×[(x−1)/2−1]，再按分配律等于6×(x−1)/2−6×1，也就是3(x−1)−6。若只把分数项乘6，就不是把等式两边整体同乘同一个数。"},{"step":"为什么可以把未知数集中到一边？","detail":"去括号后得到3x−9=2x+4。在左右两边同时减2x，可得x−9=4；再同时加9，得x=13。通常所说的“移项变号”是这两次等式性质的简写，理解两边同时操作更容易检查符号，也更容易迁移到不等式。"},{"step":"为什么最后还要回到原方程检验？","detail":"理论上每步正确的等价变形已保证答案正确，实际书写中却可能漏乘、错号或抄错数字。代入原方程可以检查整个计算链，而只代入最后的x=13没有检查价值。本题分母为固定非零数字2、3，不存在额外的未知数禁值。"}],"workedWalkthrough":[{"step":"读清原例题的运算层次","detail":"原题：(x−1)/2−1=(x+2)/3。左边最后完成的是“减1”；分子x−1是一个整体。右边分子x+2也是整体。目标是求x，且两个数字分母始终不为0。"},{"step":"先保留整体，把两边全部乘6","detail":"写出6×[(x−1)/2−1]=6×(x+2)/3。逐项处理后得到3(x−1)−6=2(x+2)。此时先停一下：左边原来两项，乘6后仍是两项，中间的整数项也已改变。"},{"step":"去括号后合并常数","detail":"3(x−1)−6=3x−3−6=3x−9；2(x+2)=2x+4。因此方程成为3x−9=2x+4。这里−3与−6相加得到−9，不是3。"},{"step":"通过两边同减、同加隔离x","detail":"两边同减2x：3x−9−2x=2x+4−2x，整理为x−9=4。两边同加9：x−9+9=4+9，得到x=13。最后系数已是1，不需要再做除法。"},{"step":"回代原式，而非中间某一步","detail":"左边：(13−1)/2−1=12/2−1=6−1=5。右边：(13+2)/3=15/3=5。两边相等，所以13确实满足原题。"},{"step":"给出完整结论并复述方法","detail":"原方程的解为x=13。由于变形一直可逆，且最后方程x=13只有这一解，原方程也没有其他解。复述时应说“整体乘6去分母，分配去括号，两边同时加减隔离x，回代原式检验”，而不只背出答案。"}],"wrongApproach":{"claim":"把原方程两边乘6，写成3(x−1)−1=2(x+2)，解得x=8。","whyWrong":"原左边的整数项−1没有乘6，因此这一行与原方程并不等价。所得8代回原式，左边为(8−1)/2−1=5/2，右边为(8+2)/3=10/3，两者不同。错误位置在去分母，不在最后的移项。","correction":"把左边先加一对外括号：6×[(x−1)/2−1]。用分配律明确写成3(x−1)−6，再继续求解得13。对尚不熟练的学习者，保留这一行比跳步更可靠。"},"exitCheck":{"question":"不看上面的过程，解(x+2)/3−1=(x−1)/2；写出两边同乘6后的一整行，并完成原式检验。","answer":"同乘6得2(x+2)−6=3(x−1)，解为x=1。","explanation":"去括号得2x+4−6=3x−3，即2x−2=3x−3，得x=1。原式左边(1+2)/3−1=0，右边(1−1)/2=0。若能独立写对乘6后的整行、解得1并检验，说明掌握了本例的关键操作；如果只碰巧得到1，应重新说明每一步为何等价。"},"remediation":[{"difficulty":"括号外的数只乘到第一项，或括号前减号处理错误","moduleId":"J05","action":"重做整式去括号，逐项标出外因数作用到的位置；先练3(x−2)与−2(x+1)，每式用一个具体x值核对。"},{"difficulty":"去分母时不能找到合适公倍数，或分数计算反复出错","moduleId":"J01","action":"回到通分与分数运算，先用不含字母的1/2−1与1/3练习整体乘6，再把分子换成字母式。"},{"difficulty":"只会说移项变号，无法解释依据","moduleId":"J06","action":"把3x−9=2x+4拆写为“两边同减2x”“两边同加9”两行；确认理解后才使用移项简写。"}],"auditNotes":[{"severity":"澄清","finding":"原例题计算与答案正确，但去分母到3(x−1)−6=2(x+2)之间省略了整体分配，初学者可能把整数项漏乘。","resolution":"本补丁增加整体外括号、每项乘6的展开和一个产生错误解8的具体反例。"},{"severity":"澄清","finding":"“等式两边同时乘同一个数仍相等”与“解集保持不变”不是完全相同的要求，乘0会丢失条件。","resolution":"明确解方程时使用可逆变形，涉及乘除时说明非零条件，并用乘0作为边界例子。"}]}},{"id":"J07","stage":"初中","grade":"七年级起步","domain":"数与代数","title":"一元一次方程建模","prerequisites":["J06"],"goals":["从情境中提取等量关系","用统一单位建立行程、工程和费用模型","检验解的实际意义"],"concepts":[{"name":"建模的基本过程","explanation":"把真实情境中的数量关系表示成数学形式，就是建立模型。先明确求什么，设未知数并写单位，再把其他量用它表示。列式依据是一个同时成立的等量关系；解出后还要检查人数是否为整数、时间是否非负等现实约束。"},{"name":"行程关系","explanation":"匀速运动满足路程=速度×时间。相向同时出发时，两人路程之和等于起始距离；同向追及时，快者多走的路程等于原来的间距。若出发时刻不同，应分别写各自运动时间，不能直接套用一个共同时间。"},{"name":"工程与守恒关系","explanation":"把总工作量规定为1，独做a天的效率就是1/a，工作量=效率×时间；合作效率可以相加，需要每个人持续按给定效率工作。配比、调运、收支题常利用总量守恒，转出方减少的量等于转入方增加的量。"},{"name":"费用、利润与增长","explanation":"总费用常由固定费用与按数量计算的费用组成。利润=售价−成本，利润率的分母是成本；折扣通常以标价为基准。列方程时应把每个百分数的单位1写在旁边，防止将利润率、折扣率和增长率当成同一个量。"}],"methods":["画简单线段图或列数量表：对象、速度或效率、时间、总量四列；把等量关系先用文字写清，再代入式子。","解完按原情境反算一遍，最后给出带单位的结论，并说明舍去不合实际的结果。"],"pitfalls":["两人先后出发却使用相同时间，会漏掉早出发者的路程。","利润率20%不是售价的20%；成本100元、售价120元时利润为20元。"],"example":{"question":"【原创】甲、乙两人相距18 km，沿同一路线同时相向步行，速度分别为4 km/h、5 km/h。多久相遇，甲走了多远？","solution":["设t小时相遇，两人走的路程分别为4t和5t千米。","相遇时路程和为18，列4t+5t=18，得t=2。","甲走4×2=8 km，乙走10 km，总和18 km，符合题意。"],"answer":"2小时后相遇；甲走8 km。"},"practice":[{"question":"【原创】某练习本每本4元，另付固定包装费6元，共付38元，买了几本？","answer":"8本。","solution":"设买x本，4x+6=38，解得x=8，且为正整数。","level":"基础"},{"question":"【原创】甲独做一项工作需6天，乙需12天，两人合作1天后由甲独做，甲还需几天？","answer":"4.5天。","solution":"合作完成1/6+1/12=1/4，余3/4。设甲还需t天，t/6=3/4，得t=9/2天。","level":"进阶"}],"mastery":["在列方程前说出等量关系","给行程和工程模型写出适用假设","把代数解还原成现实答案"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J08","stage":"初中","grade":"七年级起步","domain":"图形与几何","title":"几何图形、线段与角","prerequisites":["J01","J06"],"goals":["辨认点线面体与线段射线直线","根据位置关系计算线段长度","完成角度换算与角平分线计算"],"concepts":[{"name":"点、线、面、体","explanation":"几何用抽象图形描述物体的形状和位置。点表示位置，线可视为点运动的轨迹，面围成空间物体的边界。画图时纸上点有大小、线有粗细，但数学模型忽略这些厚度；长方体、圆柱等立体与它们的平面展开图要建立对应关系。"},{"name":"直线、射线与线段","explanation":"直线向两端无限延伸，射线有一个端点且向一端延伸，线段有两个端点并有确定长度。两点确定一条直线，两点间线段最短。射线AB的端点是A，交换字母通常得到不同射线；线段AB与BA表示同一条线段。"},{"name":"中点与线段和差","explanation":"M是AB中点意味着M在线段AB上，且AM=MB=AB/2。只有B在A、C之间，才有AC=AB+BC；若只知三个点共线而顺序不明，要分类讨论。线段长度是非负数，不能把有方向的数轴坐标直接当长度。"},{"name":"角的度量与运算","explanation":"角由有公共端点的两条射线组成，大小取决于张开程度，与画出的边长无关。1°=60′，1′=60″；平角180°，周角360°。两角和为90°叫互余，和为180°叫互补；角平分线把一个角分成两个相等的角。"}],"methods":["涉及线段先标点的顺序，再写整体=部分之和；中点条件转写为两个相等长度。","涉及角先明确哪个大角由哪些小角拼成；度分秒换算按60进位，不按10或100进位。"],"pitfalls":["两个角相等不代表角的边长相等，角没有由边长决定的面积。","B不在A、C之间时，不能使用AC=AB+BC。"],"example":{"question":"【原创】点A、M、B、C依次共线，M是AB中点，AB=8 cm，BC=5 cm，求MC。","solution":["由M为AB中点得MB=AB/2=4 cm。","按点的顺序，B在M、C之间，因此MC=MB+BC。","代入得MC=4+5=9 cm。"],"answer":"MC=9 cm。"},"practice":[{"question":"【原创】一个角为35°40′，求它的余角。","answer":"54°20′。","solution":"90°写成89°60′，减35°40′得到54°20′。","level":"基础"},{"question":"【原创】∠AOB=100°，OC在角内部且∠AOC=30°，OD平分∠COB，求∠AOD。","answer":"65°。","solution":"∠COB=100°−30°=70°，∠COD=35°，故∠AOD=30°+35°=65°。","level":"进阶"}],"mastery":["根据文字画出点的正确顺序","用几何语言区分长度与方向","用角的和差及平分定义推导结果"],"sources":[{"title":"人教版数学七年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J09","stage":"初中","grade":"七年级进阶","domain":"图形与几何","title":"相交线、平行线与推理证明","prerequisites":["J08"],"goals":["辨认角的位置关系","利用角关系判定平行并使用平行线性质","区分定义、命题、定理与证明"],"concepts":[{"name":"对顶角、邻补角与垂直","explanation":"两直线相交时，对顶角相等，邻补角和为180°。若其中一个角为90°，两直线垂直，其余三个角也为90°。点到直线的距离是垂线段的长度；斜线段一般更长。讨论垂线唯一性时应限定在同一平面内。"},{"name":"三线八角与平行判定","explanation":"两直线被第三条直线所截，可按位置辨认同位角、内错角、同旁内角。这些名称只说明位置，尚不保证相等或互补。若一对同位角相等，或一对内错角相等，或一对同旁内角互补，就能判定两条被截直线平行。"},{"name":"平行线性质","explanation":"已知两直线平行时，同位角相等、内错角相等、同旁内角互补。同一平面内，过直线外一点有且只有一条直线与已知直线平行；两条不同直线若都平行于第三条直线，则它们互相平行。这些结论可将分散的角关系联系起来。"},{"name":"命题与证明","explanation":"定义规定概念的确切含义；命题是可判断真假的陈述；经过证明的真命题可成为定理。证明应从已知和已有事实出发，每步说明依据。一个反例足以否定全称命题，很多正确例子却不能代替一般证明；逆命题也不自动成立。"}],"methods":["先认清截线和两条被截线，再判定一对角的位置关系；若题目要求证明平行，寻找判定条件，若已知平行，调用性质。","写证明时把理由附在结论后，并检查有没有把待证结论当作已知使用。"],"pitfalls":["同位角不一定相等，两直线未平行时可能不等。","两个角互补不保证它们是邻补角，邻补还要求特定位置关系。"],"example":{"question":"【原创】同一平面内两直线a、b被直线c所截，一对同旁内角分别为(2x+10)°和(3x−5)°。若a∥b，求这两个角。","solution":["平行线的同旁内角互补，所以2x+10+3x−5=180。","解得5x=175，x=35。","两个角分别为80°和100°，相加180°，符合性质。"],"answer":"80°、100°。"},"practice":[{"question":"【原创】两直线相交，一个角为47°，其对顶角和邻补角分别是多少？","answer":"47°和133°。","solution":"对顶角相等；邻补角为180°−47°=133°。","level":"基础"},{"question":"【原创】判断命题“如果两个角相等，那么它们是对顶角”，并给依据。","answer":"假命题。","solution":"例如同一正方形的两个相邻内角都为90°，但顶点不同，不可能是对顶角；一个反例即可否定该命题。","level":"进阶"}],"mastery":["分清平行线判定与性质的使用方向","从位置而非目测识别角","写出不循环论证的短证明"],"sources":[{"title":"人教版数学七年级下册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J10","stage":"初中","grade":"七年级进阶","domain":"数与代数","title":"平方根、立方根与实数","prerequisites":["J03"],"goals":["区分平方根与算术平方根","求立方根并比较无理数大小","理解实数和数轴点的一一对应"],"concepts":[{"name":"平方根与算术平方根","explanation":"若x²=a，则x叫a的平方根。a>0时有两个互为相反数的平方根±√a，√a专指非负的算术平方根；0的平方根是0，负数在实数范围没有平方根。√9=3与“9的平方根为±3”回答的是不同问题。"},{"name":"立方根","explanation":"若x³=a，x叫a的立方根，记为∛a。每个实数都有且只有一个实数立方根，符号与原数相同，∛(−a)=−∛a。例如∛(−27)=−3。平方和立方在正负号上的差别来自偶次幂与奇次幂的不同性质。"},{"name":"无理数与实数","explanation":"不能表示为整数比的数是无理数，其小数表示无限且不循环。√2和π是无理数，但√4=2是有理数，不能只看是否有根号。实数由有理数和无理数组成，实数与数轴上的点一一对应，原有的大小比较和运算律继续适用。"},{"name":"估值与非负数比较","explanation":"因为4\u003c5\u003c9，可知2\u003c√5\u003c3；继续比较小数的平方，就能缩小范围。对两个非负数，比较它们的平方不会改变大小次序；若数可能为负，则不能直接用平方比较原数，例如−5\u003c2但25>4。估算应说明精度。"}],"methods":["看到根号先检查被开方数范围；明确题目问的是全部平方根还是算术平方根。","估算平方根时寻找两侧最接近的完全平方数，再按需要细分；保留根式可表达精确值。"],"pitfalls":["√16只有一个值4，不能写成±4。","无限小数不一定是无理数，0.333…=1/3是有理数。"],"example":{"question":"【原创】求25的平方根、−64的立方根，并确定√30在哪两个相邻整数之间。","solution":["5²=(−5)²=25，所以25的平方根为±5。","(−4)³=−64，所以立方根为−4。","25\u003c30\u003c36，取非负平方根得5\u003c√30\u003c6。"],"answer":"±5；−4；5与6之间。"},"practice":[{"question":"【原创】计算√81+∛(−8)−√0.25。","answer":"6.5。","solution":"分别为9、−2、0.5，结果9−2−0.5=6.5。","level":"基础"},{"question":"【原创】比较√11与10/3的大小。","answer":"√11\u003c10/3。","solution":"两数都非负，平方后为11与100/9；因为99/9\u003c100/9，所以原不等式成立。","level":"进阶"}],"mastery":["正确处理平方根的两个符号","用反例纠正根号数都是无理数的误解","用平方夹逼确定根式范围"],"sources":[{"title":"人教版数学七年级下册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J11","stage":"初中","grade":"七年级进阶","domain":"图形与几何","title":"平面直角坐标系与平移","prerequisites":["J02","J08","J09"],"goals":["从坐标确定点的位置","利用坐标计算轴向距离和简单面积","描述图形平移后的对应点"],"concepts":[{"name":"有序数对与坐标轴","explanation":"在平面内取互相垂直、原点重合的两条数轴建立直角坐标系，点用(x,y)表示，前者是横坐标，后者是纵坐标。顺序不能任意交换。横轴上的点纵坐标为0，纵轴上的点横坐标为0，坐标轴上的点不属于任何象限。"},{"name":"象限、距离与面积","explanation":"第一到第四象限的符号依次为(+,+)、(−,+)、(−,−)、(+,−)。点(x,y)到横轴距离为|y|，到纵轴距离为|x|。同横坐标两点的距离为纵坐标差的绝对值；简单多边形面积可利用轴平行边分割或补成矩形。"},{"name":"平移的几何性质","explanation":"平移使图形每一点沿同一方向移动相同距离，形状和大小都不变。连接各组对应点的线段平行或共线且相等，对应边平行或共线。只知道一对点移动相同距离不足以判定整个图形平移，方向也要一致。"},{"name":"坐标表示平移","explanation":"向右平移a个单位、向上平移b个单位时，点(x,y)变为(x+a,y+b)，这里a、b可用负数表示相反方向。整幅图形平移时所有点加同一个数对；由一对对应点坐标之差即可确定这次平移的两个分量。"}],"methods":["描点先沿横轴确定x，再沿纵向确定y；平移先由已知对应点求横纵变化量，再对其他点使用同一变化。","求面积可画辅助矩形，明确所用底和高的长度都为非负数。"],"pitfalls":["点(−2,5)到横轴距离是5，不是−2。","平移改变位置，但不会把横纵坐标整体交换。"],"example":{"question":"【原创】三角形顶点A(−1,1)、B(3,1)、C(−1,4)。平移后A′(2,−1)，求B′、C′及原三角形面积。","solution":["横向变化2−(−1)=3，纵向变化−1−1=−2，即向右3、向下2。","B′=(3+3,1−2)=(6,−1)，C′=(−1+3,4−2)=(2,2)。","AB=4、AC=3且互相垂直，面积=4×3/2=6。"],"answer":"B′(6,−1)，C′(2,2)；面积6平方单位。"},"practice":[{"question":"【原创】点P(−4,3)属于哪个象限？到两坐标轴的距离各为多少？","answer":"第二象限；到横轴3，到纵轴4。","solution":"横负纵正为第二象限，距离取对应坐标的绝对值。","level":"基础"},{"question":"【原创】A(1,−2)平移后为(−3,4)，点B(5,0)同时平移到哪里？","answer":"B′(1,6)。","solution":"平移分量为(−4,6)，所以B′=(5−4,0+6)=(1,6)。","level":"进阶"}],"mastery":["准确解释横纵坐标及象限","用一个统一规则处理所有对应点","把坐标差转换为长度和面积"],"sources":[{"title":"人教版数学七年级下册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J12","stage":"初中","grade":"七年级进阶","domain":"数与代数","title":"二元一次方程组与消元","prerequisites":["J06","J07"],"goals":["解释方程组解的共同性","选择代入或加减消元","用方程组处理配比、票价与调配问题"],"concepts":[{"name":"二元一次方程与共同解","explanation":"二元一次方程的未知数为两个，各项的未知数总次数为1，如2x+y=7；xy=7不是二元一次方程。单个方程通常有多组数对满足，方程组的解必须同时满足其中全部方程，不能各取不同方程的一个解凑成答案。"},{"name":"代入消元","explanation":"若一个方程容易写成y=f(x)，把这个表达式代入另一个方程，就将两个未知数减少为一个。求出x后必须回代得到y。消元的核心是用等量代换将多元转化为一元，而不是孤立地记住某套移动字母的步骤。"},{"name":"加减消元","explanation":"当某未知数的系数相同或相反时，两方程相减或相加可以消去它；否则先乘适当非零数把系数配齐。方程乘倍数时左右每一项都要乘。解出一个未知数再回代，并把最终数对同时代回两个原方程检查。"},{"name":"模型与三元扩展","explanation":"两个未知量通常需要两个独立关系才能确定，两个本质相同的方程可能不能给唯一解。数量与总费用、总人数与总工作量是常见的独立关系。三元一次方程组作为衔接选学，可先在两组方程间消去同一个未知数，降成二元再一元。"}],"methods":["先看是否有系数为1的未知数，适合代入；若系数易配成相同或相反，适合加减。","应用题用两个字母分别设未知量，给每个方程注明它表达的事实，避免重复使用同一条件。"],"pitfalls":["相减时第二个方程的每一项都要变号。","x+y=4与2x+2y=8不是两条独立信息，不能据此唯一确定x、y。"],"example":{"question":"【原创】某活动售出成人票和学生票共12张，成人票30元、学生票18元，总收入288元。两种票各多少张？","solution":["设成人票x张、学生票y张，列x+y=12，30x+18y=288。","第一式乘18得18x+18y=216，第二式减去它得12x=72，x=6。","回代y=6；6×30+6×18=288，两种票共12张，符合条件。"],"answer":"成人票6张，学生票6张。"},"practice":[{"question":"【原创】解方程组x+y=9，x−y=3。","answer":"x=6，y=3。","solution":"两式相加得2x=12，所以x=6；回代y=9−6=3。","level":"基础"},{"question":"【原创】解方程组2x+3y=13，3x−2y=0。","answer":"x=2，y=3。","solution":"第一式乘2，第二式乘3，相加得到13x=26，故x=2；回代6−2y=0得y=3。","level":"进阶"},{"question":"【原创·分层】用消元法解方程组：x−2y=7，3x+y=7。说明消去了哪个未知数，并检验解。","answer":"x=3，y=−2。","solution":"第二个方程乘2，得6x+2y=14。与第一个方程相加，消去y，得7x=21，所以x=3。代入3x+y=7，得y=−2。检验：3−2×(−2)=7，3×3+(−2)=7，数对(3,−2)同时满足两个原方程。","level":"基础巩固"},{"question":"【原创·分层】实数k为参数，讨论方程组x+y=4，2x+ky=8的实数解。k取什么值时不能唯一确定x和y？这个方程组是否可能无解？","answer":"k≠2时唯一解为x=4、y=0；k=2时有无数个解，可写成x=4−t、y=t，其中t为任意实数；不会无解。","solution":"第二式减去第一式的2倍，得(k−2)y=0。若k≠2，则y=0，回代得x=4。若k=2，第二式正好是第一式的2倍，只有一个独立关系x+y=4，故任意实数t都给出解(4−t,t)。尤其(4,0)对所有k都成立，所以不可能无解。","level":"条件变式"},{"question":"【原创·分层】现有质量分数10%与30%的两种盐水，需要混合成200 g、质量分数18%的盐水。假定混合过程无损失，求两种盐水各需多少克。混合完成后只加水，使质量分数变为15%，还需加多少克水？","answer":"10%盐水120 g，30%盐水80 g；随后加水40 g。","solution":"设两种盐水分别取x、y克。总质量守恒给出x+y=200；盐的质量守恒给出0.10x+0.30y=0.18×200=36。把第一式乘0.10并相减，得0.20y=16，因此y=80、x=120。混合后盐始终为36 g。设加水w克，则36/(200+w)=0.15，得到200+w=240，所以w=40。两次计算分别保持总盐质量不变，水的加入只增加溶液总质量。","level":"综合应用"}],"mastery":["说明消去哪个未知数以及为何这样选择","把一元解完整回代成数对","辨认两个方程是否只是重复信息"],"sources":[{"title":"人教版数学七年级下册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J13","stage":"初中","grade":"七年级进阶","domain":"数与代数","title":"一次不等式、不等式组与整数方案","prerequisites":["J02","J06","J07"],"goals":["在乘除负数时正确变号","用数轴表达解集及交集","从不等式组筛出满足条件的整数方案"],"concepts":[{"name":"不等式与解集","explanation":"用\u003c、>、≤、≥表达数量大小关系的式子是不等式。使它成立的数通常有很多，全部这样的数构成解集。x>2不只表示x=3，而包含所有大于2的允许实数；若题目另限整数，再从实数解集中筛选。"},{"name":"不等式性质","explanation":"两边同时加减同一个数，不等号方向不变；乘除同一个正数方向不变，乘除同一个负数方向反向。可从数轴理解：乘−1将位置关于原点反转。不能除以0，乘除符号未知的式子时必须先讨论其正、负、零情况。"},{"name":"不等式组与交集","explanation":"不等式组的解必须同时满足每条不等式，因此取各解集的公共部分。在数轴上，严格大于小于用空心端点，包含等号用实心端点。若一条要求x>5，另一条要求x\u003c2，公共部分为空，整个组无解。"},{"name":"方案与边界","explanation":"“至少”“不低于”对应≥，“至多”“不超过”对应≤。先得到连续范围，再考虑件数、车次数必须为整数等限制。求最少数量常向上取整，求最多常向下取整，但必须在完整约束中检验，不能机械按关键词取整。"}],"methods":["像解方程一样去分母、去括号、移项、合并，在最后除以负系数的位置明确标记反向。","每条不等式独立解完后画在同一数轴，取重叠部分，再按实际条件选整数。"],"pitfalls":["−2x>6应得x\u003c−3，不是x>−3。","x≥2与x\u003c5的整数解是2、3、4，不能遗漏包含等号的2。"],"example":{"question":"【原创】解不等式组2x−3≥1，5−x>0，并写出整数解。","solution":["第一条给出2x≥4，即x≥2。","第二条给出−x>−5，除以−1反向得x\u003c5。","公共部分为2≤x\u003c5，其中整数为2、3、4。"],"answer":"2≤x\u003c5；整数解2、3、4。"},"practice":[{"question":"【原创】解3−2x≤7。","answer":"x≥−2。","solution":"移项得−2x≤4，除以−2时反向，所以x≥−2。","level":"基础"},{"question":"【原创】租一辆车固定费80元，每行驶1 km加2元，预算最多150元，最多能行驶多少整千米？","answer":"35 km。","solution":"设路程x≥0，80+2x≤150，得x≤35；35是可行的最大整数，费用恰为150元。","level":"进阶"},{"question":"【原创·分层】解不等式组：(x+1)/2≤3，2−3x\u003c8，并列出全部整数解。","answer":"−2\u003cx≤5；整数解为−1、0、1、2、3、4、5。","solution":"第一条两边乘正数2，得x+1≤6，即x≤5。第二条移项得−3x\u003c6，两边除以负数−3时不等号反向，得x>−2。取公共部分为−2\u003cx≤5。左端−2不包含，右端5包含，故整数解为−1至5，共7个。","level":"基础巩固"},{"question":"【原创·分层】实数a满足：不等式组x≥a，x\u003c4恰好有3个整数解。求a的取值范围，并说明两个端点为什么一个不能取、一个能取。","answer":"0\u003ca≤1。","solution":"解集是a≤x\u003c4。若恰有3个整数解，这3个数必须为1、2、3：要使1被包含，需a≤1；要使0不被包含，需a>0。合并得到0\u003ca≤1。a=0时还会包含0，出现4个整数解，因此不能取；a=1时仍恰含1、2、3，因此可以取。","level":"条件变式"},{"question":"【原创·分层】某校恰好租5辆客车接送195名学生，每名学生都要有座位且每辆车只运行一趟。大车每辆45座、租金500元，小车每辆30座、租金360元，总租金不超过2300元。求所有可行的租车方案，并核对座位数和费用。","answer":"唯一方案为大车3辆、小车2辆；共195座，费用2220元。","solution":"设大车x辆，则小车5−x辆，其中x为0到5之间的整数。座位约束为45x+30(5−x)≥195，整理得x≥3。费用约束为500x+360(5−x)≤2300，整理得140x≤500，即x≤25/7。满足3≤x≤25/7的整数只有3。故大车3辆、小车2辆，座位3×45+2×30=195，费用3×500+2×360=2220≤2300。只满足座位条件或只满足预算条件都不足以确定可行方案。","level":"综合应用"}],"mastery":["解释负数乘除为何改变不等号方向","正确读写数轴上的空心实心点","把实数解集转换成具体可行方案"],"sources":[{"title":"人教版数学七年级下册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J14","stage":"初中","grade":"七年级进阶","domain":"统计与概率","title":"统计调查、频数与统计图","prerequisites":["J01","J03"],"goals":["合理区分全面调查与抽样调查","根据频数求频率并估计总体数量","选择合适统计图且读懂坐标和组距"],"concepts":[{"name":"总体、个体与样本","explanation":"总体是所研究对象的全体，个体是其中每个调查对象，样本是抽取的部分对象，样本容量是样本个体数。全面调查覆盖所有对象，抽样调查以部分估计整体；是否采用抽样取决于成本、破坏性和所需精度等条件。"},{"name":"代表性与调查偏差","explanation":"样本应尽可能覆盖总体的主要差异，并避免只抽容易接触或自愿回答的人。调查全校通勤方式若只问骑车停放区的同学，会系统性高估骑车比例。扩大这种偏差样本的规模，也不能自动消除选样方法导致的偏差。"},{"name":"频数、频率与分组","explanation":"频数是一类或一区间出现的次数，频率=频数/总次数，各互不重叠且覆盖全体的类别频率之和为1。连续数据分组应明确边界归属，如10≤x\u003c20，避免漏记或重复计数。用样本频率乘总体容量得到的是估计数。"},{"name":"统计图的选择与读取","explanation":"条形图便于比较各类数量，折线图便于看有序变化，扇形图显示部分占总体的比例，圆心角为频率×360°。直方图描述连续数据的分布，相邻组通常相接；若组距不等，不能简单用柱高当频率，要看纵轴是否为频率密度。"}],"methods":["先明确调查对象、问题和时间范围，再决定抽样方式；清理重复或缺失记录后计算频数与频率。","读图先看标题、单位、轴起点和分组边界，再谈趋势；选择图表时让图的特点匹配问题。"],"pitfalls":["抽样估计不是对每个个体的断言，样本40%不保证总体恰好40%。","统计图截断纵轴可能放大视觉差异，必须看刻度。"],"example":{"question":"【原创】从1200名学生中合理抽取100名调查，步行40人、公交35人、骑车25人。求公交对应扇形圆心角，并估计全校公交人数。","solution":["公交频率=35/100=0.35。","扇形圆心角=0.35×360°=126°。","以样本估计总体，公交人数约为1200×0.35=420人；这是估计而非精确统计。"],"answer":"126°；估计约420人。"},"practice":[{"question":"【原创】50次观察中某类出现12次，求频率。","answer":"0.24，即24%。","solution":"按定义频率=12/50=0.24。","level":"基础"},{"question":"【原创】为了解全校每天阅读时间，只调查图书馆正在借书的同学是否合适？怎样改进？","answer":"代表性不足；可按年级班级合理抽样并随机选人。","solution":"借书者可能更爱阅读，容易高估全体阅读时间。应覆盖各年级及不同班级，使用统一题目和时间口径。","level":"进阶"}],"mastery":["说明样本代表性比单纯数量更重要的原因","从扇形角度、频率和人数之间换算","不把样本估计写成总体确切事实"],"sources":[{"title":"人教版数学七年级下册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J15","stage":"初中","grade":"八年级起步","domain":"图形与几何","title":"三角形的边角、重要线段与多边形","prerequisites":["J08","J09","J13"],"goals":["应用三角形三边与内外角关系","区分中线、角平分线和高","推导多边形内角和及外角和"],"concepts":[{"name":"三角形三边关系","explanation":"三角形由不共线的三条线段首尾顺次连接而成，任意两边之和大于第三边，两边之差小于第三边。已知两边a、b，第三边c必须满足|a−b|\u003cc\u003ca+b。等号意味着三点落在同一直线上，不能构成真正的三角形。"},{"name":"三角形内角和与外角","explanation":"三角形内角和为180°，可过一个顶点作对边平行线，把另两角转移到同一个平角。一个外角等于与它不相邻的两个内角之和，因此大于其中任何一个。直角三角形的两个锐角互余，这常是求角的起点。"},{"name":"中线、角平分线与高","explanation":"中线连接顶点与对边中点，角平分线把顶角分成两个相等角，高从顶点垂直于对边所在直线。三种线段定义不同，一般不会重合；钝角三角形有两条高在外部。中线把三角形分成面积相等的两部分，因为它们等底同高。"},{"name":"多边形角和","explanation":"从凸n边形的一个顶点作对角线，可分成n−2个三角形，因此内角和为(n−2)×180°。沿边绕行一周，在各顶点取同一转向的一个外角，总转角为360°。正n边形各边各角相等，每个外角为360°/n。"}],"methods":["边长问题先列严格范围，再结合整数、周长或等腰条件筛选；不明确哪条为腰时分类讨论。","角度题把已知角标在具体三角形内，使用内角和或外角关系，辅助平行线能把角转到同一处。"],"pitfalls":["2、3、5不能组成三角形，因为2+3=5。","中线只平分对边，不一定垂直对边或平分顶角。"],"example":{"question":"【原创】三角形两边为4 cm、7 cm，第三边为整数厘米且周长小于20 cm，求第三边所有可能值。","solution":["三边关系给出7−4\u003cc\u003c7+4，即3\u003cc\u003c11。","周长条件为4+7+c\u003c20，得c\u003c9。","合并得到3\u003cc\u003c9，整数c为4、5、6、7、8。"],"answer":"4、5、6、7、8 cm。"},"practice":[{"question":"【原创】三角形两内角为42°、68°，求第三角及其相邻外角。","answer":"70°、110°。","solution":"第三角180°−42°−68°=70°；邻外角180°−70°=110°。","level":"基础"},{"question":"【原创】一个正多边形每个外角为24°，求边数和内角和。","answer":"15边；2340°。","solution":"边数360°/24°=15；内角和(15−2)×180°=2340°。","level":"进阶"}],"mastery":["把两边已知转换成第三边严格范围","根据定义辨认三种重要线段","用三角形分割解释多边形角和"],"sources":[{"title":"人教版数学八年级上册（文件名2024版）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J16","stage":"初中","grade":"八年级建议","domain":"图形与几何","title":"全等三角形：对应关系与判定","prerequisites":["J15","J09"],"goals":["理解并能应用：全等与对应","理解并能应用：判定定理与条件","理解并能应用：证明的组织"],"concepts":[{"name":"全等与对应","explanation":"两个图形经过平移、旋转或轴对称能完全重合，称为全等。写△ABC≌△DEF时，顺序规定A↔D、B↔E、C↔F，对应边和对应角相等。全等三角形的周长与面积也相等，但等面积并不足以说明全等。"},{"name":"判定定理与条件","explanation":"SSS（三边）、SAS（两边及夹角）、ASA（两角及夹边）、AAS（两角及一角对边）能判定全等；直角三角形还可用HL（斜边及一条直角边）。SAS要求角夹在已知的两边之间。AAA只能确定形状，一般SSA不能唯一确定三角形。"},{"name":"证明的组织","explanation":"几何证明先明确要比较哪两个三角形，再把已知、公共边、对顶角、平行线得到的角列出，凑成一个正确判定。全等成立后才使用对应边角相等，避免先拿待证边角当判定条件形成循环。"}],"methods":["由结论中的线段或角反找包含它们的三角形，再检查对应顺序。","每条等量注明来源，写出全等判定，最后提取目标结论。"],"pitfalls":["两边一角并不自动是SAS，角必须为夹角。","共同顶点不等于共同角；两角的边必须分别同向或由定理保证相等。"],"example":{"question":"【原创】△ABC中AB=AC，D为BC中点，证明AD⊥BC。","solution":["在△ABD与△ACD中，AB=AC、BD=CD、AD=AD，故由SSS全等。","于是∠ADB=∠ADC；B、D、C共线，两角和180°，各90°。","所以AD⊥BC。"],"answer":"所以AD⊥BC。"},"practice":[{"question":"【原创】两三角形各有边长3、4、5，能否判定全等？","answer":"能。","solution":"三组对应边相等，满足SSS；不必额外知道角。","level":"基础"},{"question":"【原创】两三角形各有30°、60°、90°三个角，是否一定全等？","answer":"不一定。","solution":"边长1、√3、2与2、2√3、4的直角三角形角相同而大小不同。","level":"进阶"},{"question":"【原创·分层】两个非退化直角三角形ABC与DEF满足∠ACB=∠DFE=90°，AB=DE=13，AC=DF=5。能否判定两个三角形全等？写出顶点对应顺序，并说明BC与EF、∠ABC与∠DEF的关系。","answer":"能，由HL判定△ABC≌△DEF，A↔D、B↔E、C↔F；BC=EF，∠ABC=∠DEF。","solution":"由直角位置可知AB与DE分别是斜边；AC与DF是一组对应直角边。两直角三角形的斜边及一条直角边分别相等，满足HL判定，因此△ABC≌△DEF。全等成立后，才可推出对应边BC=EF、对应角∠ABC=∠DEF。写对应顺序时应先锁定直角顶点C↔F，再由给定直角边确定A↔D。","level":"基础巩固"},{"question":"【原创·分层】A、B、C为不共线的三点，D严格位于线段AC内部，且BD=BC。有人认为：AB是公共边，BD=BC，∠BAD=∠BAC，所以△ABD与△ABC可以由SAS判定全等。这个推理是否正确？请指出角的位置问题，并用两三角形的周长说明它们实际上不全等。","answer":"推理不正确，给出的是两边及其中一边的对角，非两边夹角；两三角形周长不同，因而不全等。","solution":"在△ABD中，已知相等的两条边是AB、BD，它们的夹角在B点，是∠ABD；∠BAD在A点，并不是这两边的夹角。△ABC同理。因此不能用SAS。又因D严格在AC内部，AD\u003cAC，而AB为公共边、BD=BC，所以AB+BD+AD\u003cAB+BC+AC。两个三角形周长不等，不可能全等。条件D在内部同时保证了两个三角形非退化以及严格不等号。","level":"条件变式"},{"question":"【原创·分层】在非退化三角形ABC中，D是BC的中点。把线段AD越过D延长到E，使DE=AD，即A、D、E依次共线。证明AB=CE且AB∥CE。如果CE在可测区域内且测得CE=7.5 m，求AB的长度，并说明这种间接测量的依据。","answer":"AB=CE且AB∥CE；AB=7.5 m。","solution":"比较△ADB与△EDC：AD=ED由构造给出，DB=DC由中点给出，∠ADB=∠EDC为对顶角，所以由SAS有△ADB≌△EDC，顶点对应为A↔E、D↔D、B↔C。由对应边相等得AB=EC；由对应角相等得∠ABD=∠ECD。B、D、C共线，A和E在BC异侧，这两个角是一对内错角，因此AB∥CE。测量利用的是严格推出的等长关系AB=CE，而不是图上看起来相等；故AB=7.5 m。","level":"综合应用"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"selfStudy":{"moduleId":"J16","entryCheck":{"question":"D是线段BC的中点，且B≠C。请说出这句话包含的两条几何信息。如果A不在BC所在直线上，∠ADB与∠ADC的和是多少度？","answer":"D在线段BC内部，且BD=DC；∠ADB+∠ADC=180°。","explanation":"中点不仅说明两段等长，还规定了点的顺序B、D、C。DB与DC是相反射线，所以由DA分出的两个邻角拼成一个平角。若漏掉位置关系，后续不能只凭“两个角相等”就断言它们各为90°。"},"intuition":"把等腰三角形想象成沿顶点A到BC中点D的线折叠，左右两半似乎会重合，折线也似乎会垂直BC。这个想象有助于选出要比较的△ABD与△ACD，却不是证明。真正要说明的是：哪些已知边保证两半全等；全等以后哪些角相等；这些角为何恰好拼成180°。","reasoning":[{"step":"为什么从“要证明垂直”倒着找角？","detail":"AD⊥BC表示AD与BC形成直角。由于D在BC上，若能证明∠ADB=90°，垂直就成立。单独求这个角不容易，但它旁边有∠ADC，两者天然相加为180°；如果再证明两角相等，就能各占一半。"},{"step":"为什么选择△ABD与△ACD进行比较？","detail":"所需的两个角∠ADB、∠ADC分别属于这两个三角形。它们又恰好包含原题的AB=AC和BD=DC两组条件，并共用边AD。选择比较对象时，要让“已知条件”和“目标结论”同时落在所选图形中。"},{"step":"为什么SSS的三个条件都已经具备？","detail":"AB=AC来自等腰条件；BD=DC来自D为BC中点；AD=AD来自公共边。三组边相等都是在全等证明之前就成立的事实。不能把尚待证明的直角或AD为高拿来凑条件，否则会循环论证。"},{"step":"为什么全等书写顺序会影响下一步？","detail":"写△ABD≌△ACD时，对应关系是A↔A、B↔C、D↔D。于是第一三角形在D点、由DA与DB组成的角，对应第二三角形在D点、由DA与DC组成的角，正是∠ADB与∠ADC。顺序清楚后，才能准确引用“全等三角形对应角相等”。"},{"step":"为什么相等的两个角最后成为直角？","detail":"两个角相等本身并不说明它们是90°，它们也可能都为40°。本题额外利用B、D、C依次共线，使两角和为180°。设共同角为θ，则2θ=180°，θ=90°；结合角的顶点和边，才得到AD⊥BC。"}],"workedWalkthrough":[{"step":"重述原例题，并明确不退化条件","detail":"原例题：在三角形ABC中，AB=AC，D为BC中点，证明AD⊥BC。三角形默认三个顶点不共线，所以A不在BC上；BC有正长度，D在线段BC内部。先连接AD，得到两个真正的三角形ABD与ACD。"},{"step":"把条件按对应顺序排好","detail":"在△ABD与△ACD中，AB=AC（已知），BD=CD（中点定义），AD=AD（公共边）。逐项核对：大三角形的两条腰对应，底边的两半对应，公共边对应自身。"},{"step":"使用SSS给出完整全等结论","detail":"三组对应边分别相等，所以△ABD≌△ACD，依据是SSS。到这一步为止，没有使用AD⊥BC，也没有使用∠ADB=∠ADC；这确保论证没有预先假定结论。"},{"step":"从全等提取需要的角，而非随意列角","detail":"由全等三角形对应角相等，得∠ADB=∠ADC。两角都以D为顶点，一条边共用DA，另一条边分别指向B、C。这正是目标垂直所需的一对角。"},{"step":"利用中点给出的位置关系求角","detail":"B、D、C依次共线，因此DB与DC反向，∠ADB+∠ADC=180°。结合相等关系，得到∠ADB=∠ADC=90°。这是“相等”与“互补”共同发挥作用。"},{"step":"把角度结论翻译回垂直关系","detail":"∠ADB是直线AD与直线BC所成的一个角，它等于90°，所以AD⊥BC，原题得证。证明还可同时推出∠BAD=∠CAD，说明这里的底边中线也是顶角平分线；这个额外结论仍须从已证明的全等中取得。"}],"wrongApproach":{"claim":"D是BC中点，所以AD是中线；中线必定垂直底边，因此AD⊥BC。","whyWrong":"一般三角形的中线并不一定是高。反例：A(1,2)、B(0,0)、C(4,0)，BC中点D(2,0)。AD不是竖直线，而BC是水平线，所以二者不垂直。这个反例不满足AB=AC，恰好说明原题的等腰条件不能被省略。","correction":"保留AB=AC，用它与BD=DC、公共边AD一起证明两三角形全等，再由D处对应角相等且和为180°推出垂直。三线合一可以在这一结论建立后使用，不能在尚未证明时用它替代依据。"},"exitCheck":{"question":"在非退化三角形PQR中，PQ=PR，M为QR中点，∠QPM=28°。不用直接引用“三线合一”，证明PM⊥QR，并求∠QPR。","answer":"由SSS得△PQM≌△PRM，进而PM⊥QR，∠QPR=56°。","explanation":"PQ=PR、QM=RM、PM公共，故两三角形SSS全等。于是∠PMQ=∠PMR，两角因Q、M、R共线而互补，所以均90°，PM⊥QR。同一次全等还给出∠QPM=∠MPR=28°；M在QR内部，PM位于∠QPR内部，因此∠QPR=28°+28°=56°。能同时解释D类点的顺序与对应关系，才说明不是只模仿字母。"},"remediation":[{"difficulty":"把中点、中线、高和角平分线混为一谈","moduleId":"J15","action":"分别只按定义画三条线段，不预设它们重合；逐条写出它保证的是边被平分、角被平分还是垂直。"},{"difficulty":"不能解释两个角为什么和为180°","moduleId":"J09","action":"画两条反向射线DB、DC，再添一条DA；把邻补角的位置条件与单纯“两个角互补”的数量条件分开复述。"},{"difficulty":"全等顺序与对应角书写不一致","moduleId":"J16","action":"先写A↔A、B↔C、D↔D的映射，再把边AB、角ADB逐个换成其对应对象，最后写全等符号。"}],"auditNotes":[{"severity":"澄清","finding":"原例题SSS及直角结论正确，但三组边的来源、对应顺序和两个相等角为何互补都写得很紧。","resolution":"本补丁按目标倒推比较对象，展开三组条件来源，并把“相等+互补”到“各为90°”单独解释。"},{"severity":"澄清","finding":"若只说“D是中点”而忽略它在线段内部，自学者可能把线段延长线上的点也代入同一个图式。","resolution":"入门检测与原题讲解均明确B、D、C的顺序和三角形非退化条件，错解诊断指出中线并非一般都是高。"}]},"illustrations":[{"moduleId":"J16","title":"中线为什么也是高？先全等，再判角","caption":"图中AB=AC，BD=CD，AD为公共边。△ABD与△ACD由SSS全等，再由邻补角推出两个角都是90°。图形只是关系示意，不能用“看起来垂直”代替证明。","file":"图解/J16.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"J16-title J16-desc\">\u003ctitle id=\"J16-title\">中线为什么也是高？先全等，再判角\u003c/title>\u003cdesc id=\"J16-desc\">图中AB=AC，BD=CD，AD为公共边。△ABD与△ACD由SSS全等，再由邻补角推出两个角都是90°。图形只是关系示意，不能用“看起来垂直”代替证明。\u003c/desc>\u003cdefs>\u003cclipPath id=\"J16-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">中线为什么也是高？先全等，再判角\u003c/text>\u003cpolygon points=\"320,70 120,320 520,320\" class=\"shape\"/>\u003cline x1=\"320\" y1=\"70\" x2=\"320\" y2=\"320\" class=\"dash\"/>\u003cline x1=\"211\" y1=\"189\" x2=\"228\" y2=\"203\" class=\"line\"/>\u003cline x1=\"412\" y1=\"189\" x2=\"429\" y2=\"203\" class=\"line\"/>\u003cline x1=\"215\" y1=\"311\" x2=\"215\" y2=\"329\" class=\"line\"/>\u003cline x1=\"225\" y1=\"311\" x2=\"225\" y2=\"329\" class=\"line\"/>\u003cline x1=\"415\" y1=\"311\" x2=\"415\" y2=\"329\" class=\"line\"/>\u003cline x1=\"425\" y1=\"311\" x2=\"425\" y2=\"329\" class=\"line\"/>\u003ctext x=\"310\" y=\"60\" class=\"label\">A\u003c/text>\u003ctext x=\"94\" y=\"345\" class=\"label\">B\u003c/text>\u003ctext x=\"527\" y=\"345\" class=\"label\">C\u003c/text>\u003ctext x=\"309\" y=\"348\" class=\"label\">D\u003c/text>\u003ctext x=\"52\" y=\"396\" class=\"label\">相同刻痕表示已知相等；虚线AD是两三角形的公共边。\u003c/text>\u003c/svg>"}]},{"id":"J17","stage":"初中","grade":"八年级建议","domain":"图形与几何","title":"轴对称、垂直平分线与角平分线","prerequisites":["J16","J11","J23"],"goals":["理解并能应用：轴对称与垂直平分线","理解并能应用：角平分线性质与判定","理解并能应用：对称坐标与最短路径"],"concepts":[{"name":"轴对称与垂直平分线","explanation":"若两图形沿直线折叠后重合，它们关于该直线轴对称。连接对应点的线段被对称轴垂直平分。线段垂直平分线上的点到两个端点距离相等；反过来，到两个端点距离相等的点在线段的垂直平分线上。"},{"name":"角平分线性质与判定","explanation":"角内一点在角平分线上，当且仅当它到角两边所在直线的距离相等。这里的距离必须是垂线段长度，不是随意连接该点与边上一点的长度。证明通常构造两个直角三角形，用全等完成。"},{"name":"对称坐标与最短路径","explanation":"点(x,y)关于x轴、y轴、原点的对应点分别为(x,−y)、(−x,y)、(−x,−y)。过直线上某点的折线路程，可反射一个端点转为直线段比较；需确认反射后连线与允许的线段或射线相交，否则最优点可能落在端点。"}],"methods":["遇到到两点等距，考虑垂直平分线；遇到到两边等距，先作垂线，再考虑角平分线。"],"pitfalls":["角平分线上的点到顶点的距离并无固定值。","折叠最短路必须检查交点是否在题目允许范围内。"],"example":{"question":"【原创】A(1,2)、B(5,2)，P在x轴上，求PA+PB的最小值及P。","solution":["A关于x轴的对称点为A′(1,−2)，对x轴上P有PA=PA′。","PA+PB=PA′+PB≥A′B；A′B与x轴交于P(3,0)。","A′B=√(4²+4²)=4√2；最小值4√2，在P(3,0)取得。"],"answer":"A′B=√(4²+4²)=4√2；最小值4√2，在P(3,0)取得。"},"practice":[{"question":"【原创】P(−3,4)关于y轴的对称点是什么？","answer":"(3,4)。","solution":"关于y轴只改变横坐标符号。","level":"基础"},{"question":"【原创】PA=PB=5，AB=6，M为AB中点，求PM。","answer":"4。","solution":"P在AB垂直平分线上，AM=3，勾股得PM=√(25−9)=4；需在学完J23后完成。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J18","stage":"初中","grade":"八年级建议","domain":"图形与几何","title":"等腰、等边三角形与尺规作图","prerequisites":["J16","J17"],"goals":["理解并能应用：等腰三角形的性质和判定","理解并能应用：等边三角形","理解并能应用：尺规作图的依据"],"concepts":[{"name":"等腰三角形的性质和判定","explanation":"两边相等的三角形为等腰三角形，等边对等角；反过来，等角对等边。顶角平分线、底边上的中线和高互相重合，称三线合一；该性质特指等腰三角形的顶角及底边，不能任意换一条边。"},{"name":"等边三角形","explanation":"三边相等的三角形每个角为60°。若三角形三角相等，或等腰三角形有一个角为60°，则为等边。等边三角形的高分出两个30°-60°-90°三角形，其中30°对边是斜边一半。"},{"name":"尺规作图的依据","explanation":"无刻度直尺画直线，圆规画指定半径的圆弧；作图不是靠量角或目测。以线段两端为圆心、相同且大于半长的半径作弧，交点连线即垂直平分线；角平分线作图先在两边截等长，再作等半径相交弧，用SSS证明。"}],"methods":["先判断等腰的顶点与底边；需要作图时写作法、保留弧线，并用全等或等距性质解释。"],"pitfalls":["等腰三角形的顶角可钝可直可锐，不能默认顶角最小。","题目只给一个角时，需讨论它是顶角还是底角。"],"example":{"question":"【原创】等腰三角形一个内角是40°，求所有可能的另两个角。","solution":["若40°为顶角，另两底角均为(180°−40°)/2=70°。","若40°为底角，另一底角40°，顶角100°。","另两角可能为70°、70°，或40°、100°。"],"answer":"另两角可能为70°、70°，或40°、100°。"},"practice":[{"question":"【原创】等边三角形边长8，其中一条高将底边分成多长？","answer":"4和4。","solution":"等边也是等腰，底边上的高同时是中线。","level":"基础"},{"question":"【原创】怎样不用量角器作一条线段的中点？","answer":"作其垂直平分线与线段的交点。","solution":"两端点为圆心取同一大于半长半径，上下弧交点等距于两端，连线为垂直平分线。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J19","stage":"初中","grade":"八年级建议","domain":"数与代数","title":"整数指数幂与整式乘除","prerequisites":["J05"],"goals":["理解并能应用：幂的运算","理解并能应用：整式乘法与除法","理解并能应用：乘法公式"],"concepts":[{"name":"幂的运算","explanation":"同底数相乘指数相加，幂的乘方指数相乘，积的乘方各因数分别乘方。正整数指数时这些法则来自展开乘积；同底相除需要底数非零。为了保持法则，规定a⁰=1、a^(−n)=1/aⁿ，其中a≠0、n为正整数。"},{"name":"整式乘法与除法","explanation":"单项式相乘系数相乘、相同字母指数相加。多项式相乘要将每项逐一分配，避免漏项。多项式除以单项式时逐项相除，且除式非零；不能把(a+b)/c变成a+b/c。"},{"name":"乘法公式","explanation":"(a+b)²=a²+2ab+b²，(a−b)²=a²−2ab+b²；(a+b)(a−b)=a²−b²。公式可由分配律直接推导，面积模型也能帮助理解，但代数式中的a、b可以为负数，不能只靠正边长直觉限定。"}],"methods":["先看能否使用公式，再做分配；完成后按次数整理，用一组简单数值作快速检查。"],"pitfalls":["a³·a²=a⁵，(a³)²=a⁶。","(a+b)²中的2ab不能丢，例如(1+1)²=4而非2。"],"example":{"question":"【原创】化简(x+3)²−(x+3)(x−3)。","solution":["第一项=x²+6x+9；第二项=x²−9。","相减得到x²+6x+9−x²+9。","结果为6x+18。"],"answer":"结果为6x+18。"},"practice":[{"question":"【原创】计算2⁻³+3⁰。","answer":"9/8。","solution":"2⁻³=1/8，3⁰=1，相加9/8。","level":"基础"},{"question":"【原创】化简(2a−b)(2a+b)−(a−b)²。","answer":"3a²+2ab−2b²。","solution":"展开为4a²−b²−a²+2ab−b²，合并同类项。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J20","stage":"初中","grade":"八年级建议","domain":"数与代数","title":"因式分解：提公因式与公式法","prerequisites":["J19"],"goals":["理解并能应用：因式分解的意义","理解并能应用：提公因式与公式","理解并能应用：分组与交叉检验"],"concepts":[{"name":"因式分解的意义","explanation":"把一个多项式变成几个整式的乘积，称因式分解，是整式乘法的逆过程。它把加法结构改为乘法结构，使约分、求零点、证明整除等更方便。分解结果要在指定数域中理解，例如x²−2在有理数范围不能分成两个一次因式。"},{"name":"提公因式与公式","explanation":"先找系数的公因数和各项共有字母的最低次幂；再提取并检查括号每项。剩余多项式可用平方差、完全平方等公式。若首项为负，常提出负号，但括号内所有符号都要相应改变。"},{"name":"分组与交叉检验","explanation":"多于三项可通过分组制造相同因式，例如ax+ay+bx+by=(a+b)(x+y)。分解后应乘回原式检查。解乘积为零的方程用零积性质：实数乘积为零至少一因式为零，但不能把和为零作同样拆分。"}],"methods":["顺序为先提公因式，再看公式或分组，再检查每个因式还能否分解，最后展开验证。"],"pitfalls":["x²+4通常不能按平方差分解；x²−4才等于(x−2)(x+2)。","提公因式时某项等于公因式，该项提出后剩1而非0。"],"example":{"question":"【原创】分解2x³−8x，并求它等于0时的x。","solution":["先提2x：2x(x²−4)。","平方差分解：2x(x−2)(x+2)。","由零积性质，x=0、2或−2。"],"answer":"由零积性质，x=0、2或−2。"},"practice":[{"question":"【原创】分解9a²−12ab+4b²。","answer":"(3a−2b)²。","solution":"首末项是平方，中项−2·3a·2b符合完全平方公式。","level":"基础"},{"question":"【原创】分解x³+x²−4x−4。","answer":"(x+1)(x−2)(x+2)。","solution":"分组为x²(x+1)−4(x+1)=(x+1)(x²−4)，再用平方差。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J21","stage":"初中","grade":"八年级建议","domain":"数与代数","title":"分式的条件、约分与运算","prerequisites":["J20"],"goals":["理解并能应用：分式及其定义域","理解并能应用：约分与通分","理解并能应用：运算与定义域保持"],"concepts":[{"name":"分式及其定义域","explanation":"整式A、B组成A/B且B中含字母时称分式，成立的首要条件是B≠0。分式为0须同时满足A=0且B≠0；若分子分母同时为0，式子无意义而不是0。定义域是后续化简、求值、解方程始终要保留的范围。"},{"name":"约分与通分","explanation":"分子分母同乘或除以同一个非零整式，值不变。约分只约共同因式，不能约和中的一项；因此先因式分解。通分选各分母因式的最高次幂组成公分母，注意x−1与1−x相差一个负号。"},{"name":"运算与定义域保持","explanation":"乘除先因式分解、再约分；除以一个分式，除了它有定义，还要求其分子不为0。加减先通分。同一个化简结果若丢失原定义域，可能不再表示原来的函数，例如(x²−1)/(x−1)化为x+1仍要求x≠1。"}],"methods":["写原式所有不为0条件；分解、通分或约分；最后附上保留下来的限制。"],"pitfalls":["(x+1)/x≠1+1，不能把加法中的x单独约掉。","倒数法处理除法时，除式为0的值也必须排除。"],"example":{"question":"【原创】化简(x²−4)/(x²−2x)，并求x=3时的值。","solution":["原分母x(x−2)不为0，故x≠0、2。","分子=(x−2)(x+2)，约去因式x−2，得(x+2)/x。","x=3时值5/3；原式定义域仍为x≠0、2。"],"answer":"x=3时值5/3；原式定义域仍为x≠0、2。"},"practice":[{"question":"【原创】(x−2)/(x+1)=0时x是多少？","answer":"x=2。","solution":"令分子0得2，代分母为3不为0，因此成立。","level":"基础"},{"question":"【原创】化简1/(x−1)−1/(x+1)。","answer":"2/(x²−1)，x≠±1。","solution":"通分后分子(x+1)−(x−1)=2，分母(x−1)(x+1)。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J22","stage":"初中","grade":"八年级建议","domain":"数与代数","title":"分式方程及增根检验","prerequisites":["J21","J07"],"goals":["理解并能应用：分式方程与去分母","理解并能应用：增根与无解","理解并能应用：效率与行程模型"],"concepts":[{"name":"分式方程与去分母","explanation":"分母含未知数的方程称分式方程。两边同乘公分母可以得到整式方程，但公分母为0处，原方程不存在，而所得整式方程可能成立。因此变形只在原定义域上等价，求得的数是候选解。"},{"name":"增根与无解","explanation":"增根是满足去分母后的整式方程、却使原式无意义的候选值。检验时把每个候选值代入原公分母；为0必须舍去。还应代原方程左右核验，特别是变形中可能有平方或错误约分时。"},{"name":"效率与行程模型","explanation":"工作总量=效率×时间；路程=速度×时间。给定总量时，时间常为总量除以未知效率或速度，因而自然出现分式方程。模型除了分母非零，还可能要求速度、时间为正或人数为整数。"}],"methods":["列限制→去分母→解整式方程→代回检验→检验实际意义→作答。"],"pitfalls":["去分母须乘每一项，常数项不能漏乘。","出现增根时要舍去该候选值，不能再强行报告一个答案。"],"example":{"question":"【原创】解方程1/(x−1)=2/(x+1)。","solution":["原式要求x≠1且x≠−1。","同乘(x−1)(x+1)，得x+1=2(x−1)，解得x=3。","3满足限制，原两边均为1/2，所以解为x=3。"],"answer":"3满足限制，原两边均为1/2，所以解为x=3。"},"practice":[{"question":"【原创】解2/x=1/3。","answer":"x=6。","solution":"x≠0；交叉相乘得x=6，代回成立。","level":"基础"},{"question":"【原创】解x/(x−1)=1/(x−1)。","answer":"无解。","solution":"x≠1；去分母得x=1，但该值令分母为0，是增根。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级上册","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J23","stage":"初中","grade":"八年级建议","domain":"图形与几何","title":"勾股定理、逆定理与距离","prerequisites":["J15","J10","J16","J11","J19"],"goals":["理解并能应用：勾股定理","理解并能应用：逆定理与实际模型","理解并能应用：两点距离与展开图"],"concepts":[{"name":"勾股定理","explanation":"在直角三角形中，两直角边a、b与斜边c满足a²+b²=c²。可用边长a+b的大正方形放四个同样的直角三角形，比较中间小正方形面积得到。必须识别直角对面的斜边，不能按图中看起来最长来猜。"},{"name":"逆定理与实际模型","explanation":"若三边满足a²+b²=c²且c最大，则三角形是直角三角形，c所对角90°。现实中的梯子、矩形对角线、坡面都可构造直角三角形；高度和沿斜面的长度是不同的量。"},{"name":"两点距离与展开图","explanation":"坐标平面两点P(x₁,y₁)、Q(x₂,y₂)的距离是√[(x₂−x₁)²+(y₂−y₁)²]，由水平和竖直的差构成直角边。在立体表面最短路问题中，可先把所经表面展开，再比较允许路径，不能直接穿过物体内部。"}],"methods":["先画直角标记并命名斜边；列平方关系求未知，再取符合长度非负的根。"],"pitfalls":["勾股定理只适用于直角三角形。","由c²=25求长度应取c=5，不取−5。"],"example":{"question":"【原创】一架10米长梯子靠竖直墙，梯脚离墙6米。梯顶高度多少？","solution":["墙与地面垂直，梯子为斜边10米，地面距离为直角边6米。","设高度h>0，有h²+6²=10²。","h=√64=8米。"],"answer":"h=√64=8米。"},"practice":[{"question":"【原创】三边为5、12、13，是否构成直角三角形？","answer":"是。","solution":"5²+12²=25+144=169=13²，满足逆定理。","level":"基础"},{"question":"【原创】P(−2,1)、Q(4,9)距离多少？","answer":"10。","solution":"横向差6，纵向差8，距离√(36+64)=10。","level":"进阶"},{"question":"【原创·分层】一个矩形的一条边长为8 cm，对角线长为17 cm，求另一条边长、周长和面积。","answer":"另一边15 cm，周长46 cm，面积120 cm²。","solution":"矩形两邻边和一条对角线构成直角三角形，对角线为斜边。设另一边为b>0，则8²+b²=17²，所以b²=289−64=225，b=15。周长2(8+15)=46 cm，面积8×15=120 cm²。长度必须取正平方根。","level":"基础巩固"},{"question":"【原创·分层】一个非退化直角三角形的三边长为5、7、x，其中x>0，题目未指定哪条边是斜边。求x的所有可能值，并说明分类是否完整。","answer":"x=2√6或x=√74。","solution":"斜边是三角形最长边。5小于已知边7，不可能是斜边。若7为斜边，则5²+x²=7²，得x²=24，x=2√6；其数值小于7，且5+2√6>7，所以可以构成非退化三角形。若x为斜边，则x²=5²+7²=74，x=√74；它大于7且小于5+7，也可构成三角形。所有可能的斜边已逐一处理，因此这两个值即为全部答案。","level":"条件变式"},{"question":"【原创·分层】一个长方体的长、宽、高分别为6 cm、4 cm、3 cm。以前面左下角为A、后面右上角为B。蚂蚁从A到B，规定只可选两种路线之一：先沿前面再沿顶面，或先沿左面再沿顶面；每种路线只能在对应的两个面及其边界上行走，不能经过其他面或穿过内部。求两类路线各自的最短长度，再选出规定范围内的最短路线。","answer":"前面加顶面路线最短√85 cm；左面加顶面路线最短√97 cm；应选择前面加顶面，最短√85 cm。","solution":"将前面与顶面沿公共棱展开，得到长为6、另一边为3+4=7的矩形，A、B为其对角顶点。两点间线段最短，故该类路线长为√(6²+7²)=√85；展开线段穿过公共棱的位置距左端18/7 cm，在棱的0到6范围内，路线可行。将左面与顶面展开，得到两边为3+6=9和4的矩形，最短长度为√(9²+4²)=√97；在公共棱上的穿越点距前端4/3 cm，也在0到4范围内。因此两类均能实现各自的直线最短路，且√85\u003c√97。这里比较的仅是题目允许的两类表面路线。","level":"综合应用"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级下册（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}],"illustrations":[{"moduleId":"J23","title":"勾股定理的面积证明","caption":"示意选a=2、b=3，外正方形边长a+b。四个角放全等直角三角形，中间四边形的边长都是c、角都是90°。外面积=(四个三角形面积)+c²，得到(a+b)²=2ab+c²。","file":"图解/J23.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"J23-title J23-desc\">\u003ctitle id=\"J23-title\">勾股定理的面积证明\u003c/title>\u003cdesc id=\"J23-desc\">示意选a=2、b=3，外正方形边长a+b。四个角放全等直角三角形，中间四边形的边长都是c、角都是90°。外面积=(四个三角形面积)+c²，得到(a+b)²=2ab+c²。\u003c/desc>\u003cdefs>\u003cclipPath id=\"J23-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stroke:#245c4d;stroke-width:2;fill:#e8f0e7}svg .curve{stroke:#245c4d;stroke-width:3;fill:none}svg .highlight{stroke:#b26e36;stroke-width:3;fill:none}svg .faint{stroke:#b9c7bd;stroke-width:2;fill:none}\u003c/style>\u003crect width=\"720\" height=\"450\" rx=\"12\" fill=\"#fffefa\"/>\u003ctext x=\"28\" y=\"32\" class=\"title\">勾股定理的面积证明\u003c/text>\u003cpolygon points=\"50,80 350,80 350,380 50,380\" class=\"shape\"/>\u003cpolygon points=\"170,80 350,200 230,380 50,260\" class=\"shape\"/>\u003ctext x=\"101\" y=\"68\" class=\"label\">a\u003c/text>\u003ctext x=\"255\" y=\"68\" class=\"label\">b\u003c/text>\u003ctext x=\"368\" y=\"145\" class=\"label\">a\u003c/text>\u003ctext x=\"368\" y=\"290\" class=\"label\">b\u003c/text>\u003ctext x=\"198\" y=\"230\" class=\"label\">c²\u003c/text>\u003ctext x=\"262\" y=\"132\" class=\"label\">c\u003c/text>\u003ctext x=\"50\" y=\"416\" class=\"label\">四个三角形：总面积 4×ab/2\u003c/text>\u003ctext x=\"420\" y=\"150\" class=\"label\">外面积：(a+b)²\u003c/text>\u003ctext x=\"420\" y=\"203\" class=\"label\">分块合计：2ab+c²\u003c/text>\u003ctext x=\"420\" y=\"256\" class=\"label\">相减：a²+b²=c²\u003c/text>\u003ctext x=\"420\" y=\"322\" class=\"small\">图示帮助理解；\u003c/text>\u003ctext x=\"420\" y=\"350\" class=\"small\">角度与面积理由见正文。\u003c/text>\u003c/svg>"}],"selfStudy":{"moduleId":"J23","entryCheck":{"question":"直角三角形的两条直角边是3和4。先不要背5：两条直角边的平方和是多少？哪个边在直角对面？","answer":"平方和为25；直角对面的边叫斜边。","explanation":"3²+4²=9+16=25。斜边由直角的位置确定，不由纸上画得长不长确定；求长度还需要取平方根。"},"intuition":"勾股定理说的是三个正方形的面积关系，不是两条长度直接相加。沿两直角边作出的正方形，面积之和等于沿斜边作出的正方形面积。面积图能帮助理解等式里的平方；只有在已知直角的条件下才能使用这个等式。","reasoning":[{"step":"先说明对象与可用的基础","detail":"取一个非退化直角三角形，两直角边a>0、b>0，斜边c>0。以下拼图证明使用三角形内角和180°、全等三角形面积相等、正方形面积和三角形面积公式；不预先使用勾股定理。"},{"step":"为什么拼图中间确实是正方形","detail":"在边长a+b的正方形四角放四个全等直角三角形，直角贴住大正方形四角，各斜边围成中央四边形。中央四条边都等于c；中央每个角为180°减去两个互余的锐角，等于90°，所以中央图形是边长c的正方形。"},{"step":"同一块面积用两种方法计算","detail":"大正方形面积是(a+b)²；也等于四个直角三角形面积加中央正方形面积，即4×ab/2+c²=2ab+c²。因此a²+2ab+b²=2ab+c²，两边减2ab得到a²+b²=c²。"},{"step":"逆定理不能只把原定理倒着读","detail":"设一个三角形三边a,b,c满足a²+b²=c²。另作两直角边为a,b的直角三角形，其斜边d由正定理满足d²=a²+b²=c²。d,c均为正，所以d=c。两三角形三边分别相等，由SSS全等，原三角形也有一个直角。这一步补用了J16的全等判定。"},{"step":"坐标距离公式如何接上","detail":"两点横坐标差Δx、纵坐标差Δy的绝对值给出水平与竖直距离，且这两个方向垂直。于是距离的平方是(Δx)²+(Δy)²。若Δx或Δy为0，图形退化为线段，距离公式仍由绝对值直接成立；两差都为0时距离为0。"}],"workedWalkthrough":[{"step":"把现实问题翻译成图形","detail":"原例题的墙竖直、地面水平，所以墙与地面垂直。把墙脚记O，梯脚记B，梯顶记A。直角在O，AB=10米是梯长，OB=6米是地面距离；不是把10米当高度。"},{"step":"先说为什么选这个定理","detail":"已知直角三角形中的两条边，求第三条边，正是勾股定理适用的情形。设OA=h米，h>0。目标是h，而h²+6²=10²是把它与已知量联系起来的方程。"},{"step":"不省略移项与开方","detail":"由h²+36=100，两边减36得h²=64。实数方程的根有8和−8，但h表示高度且h>0，故只保留h=8米。"},{"step":"检查算式与实际约束","detail":"代回8²+6²=64+36=100=10²，计算正确；8米小于10米梯长，也符合直角边小于斜边。计算、单位、现实意义三项都要检查。"},{"step":"改一个条件，观察方法何时失效","detail":"若墙与地面不垂直，就不能仍写h²+6²=10²；若只改梯脚距墙为10米，形式上算得高度0，但这不是题设所要求的梯子靠墙的非退化情形。公式使用前后的条件都要保留。"}],"wrongApproach":{"claim":"梯长10米，脚离墙6米，所以高度10−6=4米。","whyWrong":"10、6和高度是三角形三条不同方向的边，不是同一直线上首尾相接的两段。长度的减法关系没有几何依据。","correction":"先标出直角和斜边，再写高度²+6²=10²，得到高度8米。若不确定该用加法还是平方，回到图形关系，不凭题目数字猜运算。"},"exitCheck":{"question":"已知三角形三边为6、8、10。你使用勾股定理还是它的逆定理来判断是否为直角三角形？再求直角顶点到最长边的高。","answer":"用逆定理判直角；所求高为24/5。","explanation":"先验6+8>10且均为正，再算6²+8²=10²，用逆定理知6、8是两直角边。面积一方面为6×8/2=24，另一方面为10h/2，所以h=24/5。判断形状用逆定理，求高使用同一三角形面积的两种表达。"},"remediation":[{"difficulty":"找错斜边或混淆三边关系","moduleId":"J15","action":"重新标记直角的顶点与它的对边；不看边长也应能指出斜边。"},{"difficulty":"开方后把负根当长度","moduleId":"J10","action":"对比方程x²=64的两个实根与√64这个非负数的区别。"},{"difficulty":"逆定理证明中的全等看不懂","moduleId":"J16","action":"将原三角形与辅助直角三角形三边逐一对应，再使用SSS。"}],"auditNotes":[{"severity":"澄清","finding":"原卡用一句拼图面积比较略去中央图形为何是正方形；逆定理未证明，坐标距离有隐性前置。","resolution":"补齐拼图角度、面积等式、逆定理构造与退化点距离；前置补入J16、J11、J19，避免使用全等、坐标、平方展开而不提示。"}]}},{"id":"J24","stage":"初中","grade":"八年级建议","domain":"数与代数","title":"二次根式：化简与运算","prerequisites":["J10","J19"],"goals":["理解并能应用：平方根符号及条件","理解并能应用：乘除与化简","理解并能应用：加减与有理化"],"concepts":[{"name":"平方根符号及条件","explanation":"√a表示非负数a的算术平方根，要求a≥0且结果≥0。因为x²≥0，√(x²)=|x|；只有已知x≥0时才可直接写x。若根式在分母，如1/√a，则还须a≠0，所以a>0。"},{"name":"乘除与化简","explanation":"非负a、b满足√a√b=√(ab)；a≥0、b>0时√a/√b=√(a/b)。利用完全平方因子化简，如√72=6√2。化简字母根式时不能忽略符号，如√(a²b)=|a|√b（b≥0）。"},{"name":"加减与有理化","explanation":"只有化简后被开方数相同的根式才可合并系数，如√8+√18=5√2。分母有理化用同乘因子或共轭式，依据(√a+√b)(√a−√b)=a−b；操作必须保证所乘除因子不为0。"}],"methods":["先列根号和分母条件；提取平方因子；合并同类根式；必要时有理化，复查条件。"],"pitfalls":["√(a+b)一般不等于√a+√b，例如√9=3而√4+√5>4。","√(−3)²=3，不是−3。"],"example":{"question":"【原创】化简√50−2√8+√18，并化简1/(√3−1)。","solution":["前三项分别为5√2、−4√2、3√2，合为4√2。","分母乘共轭：1/(√3−1)=(√3+1)/(3−1)。","两式结果分别为4√2和(√3+1)/2。"],"answer":"两式结果分别为4√2和(√3+1)/2。"},"practice":[{"question":"【原创】√(x−2)有意义时x范围是什么？","answer":"x≥2。","solution":"被开方数必须x−2≥0。","level":"基础"},{"question":"【原创】若a\u003c0，化简√(9a²)+a。","answer":"−2a。","solution":"√(9a²)=3|a|=−3a，所以结果−3a+a=−2a。","level":"进阶"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级下册（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J25","stage":"初中","grade":"八年级建议","domain":"图形与几何","title":"平行四边形、矩形、菱形与正方形","prerequisites":["J16","J23"],"goals":["理解并能应用：平行四边形","理解并能应用：矩形与菱形","理解并能应用：正方形与面积关系"],"concepts":[{"name":"平行四边形","explanation":"两组对边分别平行的四边形是平行四边形；它的对边、对角分别相等，对角线互相平分。判定可用两组对边分别相等、对角线互相平分，或一组对边平行且相等。最后一条必须是同一组对边。"},{"name":"矩形与菱形","explanation":"有一个直角的平行四边形是矩形，其对角线相等；一组邻边相等的平行四边形是菱形，其对角线互相垂直并平分对角。判定时先确认平行四边形前提，或使用足以直接判定的条件，如四边相等可判定菱形。"},{"name":"正方形与面积关系","explanation":"正方形兼具矩形和菱形性质。任意四边形有垂直对角线时，面积等于两对角线乘积的一半，适用于菱形和正方形。平行四边形面积=底×对应高，高指垂距，邻边长度一般不等于高。"}],"methods":["先用最少条件判为平行四边形，再根据等边、直角、对角线信息升级类型；几何图形家族具有包含关系。"],"pitfalls":["对角线相等的四边形不一定是矩形，等腰梯形即可反例。","菱形对角线通常不相等，只有正方形时相等。"],"example":{"question":"【原创】菱形两对角线长6和8，求面积、边长和周长。","solution":["菱形对角线互相垂直且平分，半长分别3和4。","面积=6×8/2=24；每条边为√(3²+4²)=5。","面积24，边长5，周长20。"],"answer":"面积24，边长5，周长20。"},"practice":[{"question":"【原创】平行四边形一个内角70°，其余角是多少？","answer":"110°、70°、110°。","solution":"邻角互补，对角相等。","level":"基础"},{"question":"【原创】矩形边长3、4，两对角线交于O，O到顶点距离是多少？","answer":"5/2。","solution":"对角线长5，两条相等且互相平分，故距离为半条对角线。","level":"进阶"},{"question":"【原创·分层】菱形ABCD的边长为13 cm，对角线AC长10 cm。求另一条对角线BD及菱形面积。","answer":"BD=24 cm，面积120 cm²。","solution":"设两对角线交于O。菱形的对角线互相垂直且平分，因此AO=5 cm，∠AOB=90°。由AB=13得BO²=13²−5²=144，BO=12 cm，所以BD=24 cm。面积等于两条对角线长度乘积的一半，即10×24/2=120 cm²。","level":"基础巩固"},{"question":"【原创·分层】平面直角坐标系中的A(0,3)、B(2,0)、C(0,−1)、D(−2,0)依次连接成凸四边形。它的两条对角线等长且垂直，能否据此认定它是正方形？请利用对角线的中点给出结论，并说明若已知它是平行四边形，结论会怎样。","answer":"该四边形不是正方形；缺少对角线互相平分这一关键条件。若另已知是平行四边形，则对角线等长且垂直可判定为正方形。","solution":"AC在纵轴上且长4，BD在横轴上且长4，故确实等长且垂直。但AC中点为(0,1)，BD中点为(0,0)，两中点不同，对角线不互相平分，因此该四边形连平行四边形都不是，更不是正方形。若先有平行四边形前提，则对角线相等可判定矩形，对角线垂直可判定菱形；兼有矩形与菱形性质的平行四边形才是正方形。","level":"条件变式"},{"question":"【原创·分层】矩形ABCD按顺序标记顶点，AB=8 cm、BC=6 cm。E、F、G、H分别为AB、BC、CD、DA的中点，顺次连接E、F、G、H。判断四边形EFGH的最准确类型，求它的边长及面积，并说明它为什么不是正方形。","answer":"EFGH是菱形，边长5 cm，面积24 cm²；其对角线长6 cm与8 cm，不相等，所以不是正方形。","solution":"矩形两条对角线均为√(8²+6²)=10 cm。由三角形中位线定理，EF与GH都平行于AC且长5，FG与HE都平行于BD且长5，因此四边形EFGH为四边相等的菱形。EG连接一组平行边的中点，长等于BC=6；FH长等于AB=8，两条线互相垂直，故面积为6×8/2=24 cm²。由于对角线不相等，该菱形不是矩形，也就不是正方形。把“原图是矩形”直接移植到中点四边形上是不正确的。","level":"综合应用"}],"mastery":["闭卷解释本模块的定义及公式适用条件","独立完成例题的变式，并写出每一步理由"],"sources":[{"title":"人教版八年级下册（旧版参考）","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"参考书目名称保留，私人原文件链接不随公开版发布。此公开出版社页面只供教学背景阅读，不表示该页面逐条证明本卡公式。知识讲解和训练为自行组织。"}]},{"id":"J26","stage":"初中","grade":"八至九年级建议","domain":"函数","title":"函数概念、表示法与变量范围","prerequisites":["J11","J04"],"goals":["能解释与应用变量与函数","能解释与应用三种表示与读图","能解释与应用自变量范围"],"concepts":[{"name":"变量与函数","explanation":"在某个变化过程中，如果对自变量x的每个允许值，y都有唯一确定的值对应，那么y是x的函数。唯一指每个输入只有一个输出，不要求不同输入的输出不同。例如y=x²是函数，而把y²=x直接解释为实数y关于x的函数通常不行，因为正x有两个y。"},{"name":"三种表示与读图","explanation":"函数可用解析式、表格、图象表示。图象由所有(x,y)点组成，横坐标表示输入、纵坐标表示输出。读图时先看坐标轴名称与单位，再看截距、变化方向、转折点与范围，不能只凭线条斜陡比较量的大小。"},{"name":"自变量范围","explanation":"式子有意义的范围与实际问题允许范围需要取交集。分母不能为0，偶次根号内非负；人数是非负整数，时间常非负。由图象读范围须分清实心与空心端点，离散点不能自动连接成连续函数。"}],"methods":["先说明x与y各代表什么；检查唯一对应；再确定式子和实际条件共同允许的x。"],"pitfalls":["一个函数可以有多个x对应同一y。","实际函数不能只给公式而忽略数量单位与范围。"],"example":{"question":"【原创】长方形周长20厘米，长为x、面积为S，写S关于x的函数及范围。","solution":["宽=10−x，故S=x(10−x)。","两边长正，0\u003cx\u003c10；若约定长不小于宽，额外有x≥5。","S=x(10−x)；不区分长宽时0\u003cx\u003c10，按长≥宽时5≤x\u003c10。"],"answer":"S=x(10−x)；不区分长宽时0\u003cx\u003c10，按长≥宽时5≤x\u003c10。"},"practice":[{"question":"【原创】y=1/(x−3)的自变量范围？","answer":"x≠3。","solution":"分母x−3不得等于0。","level":"基础"},{"question":"【原创】某停车费每小时5元，不足1小时按1小时计，0\u003ct≤3，写费用。","answer":"0\u003ct≤1时5元；1\u003ct≤2时10元；2\u003ct≤3时15元。","solution":"使用分段函数表示收费档次，t=1与t=2归入前一档。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J27","stage":"初中","grade":"八至九年级建议","domain":"函数","title":"一次函数与正比例函数","prerequisites":["J26","J12"],"goals":["能解释与应用形式与参数","能解释与应用待定系数与截距","能解释与应用方程不等式与交点"],"concepts":[{"name":"形式与参数","explanation":"一次函数y=kx+b中k≠0，图象为直线；b=0时称正比例函数。k描述x增加1时y增加k，b是x=0时的y值。k>0时随x增大y增大，k\u003c0时减小；k=0则是常函数，不属于一次函数。"},{"name":"待定系数与截距","explanation":"用两个不同横坐标的点代入y=kx+b，解方程组确定k、b。纵截距为b；当k≠0时，横轴交点为(−b/k,0)。两条直线斜率相同而截距不同则平行，斜率相同截距相同则重合。"},{"name":"方程不等式与交点","explanation":"两直线交点的横坐标使两函数值相等，相当于解方程；一条线在另一条线上方的横坐标范围对应函数值大于。实际决策还须检查费用、路程或时间的可行范围，交点可能在实际范围外。"}],"methods":["利用点求参数→说明增减→求交点→用图象或代数比较函数值，最后回到情境。"],"pitfalls":["斜率越大表示变化率越大，不代表所有x处函数值都更大。","只知道一点不足以唯一确定一般的一次函数。"],"example":{"question":"【原创】两方案收费分别为A=20+3x、B=5x，x≥0，何时A更便宜？","solution":["比较20+3x\u003c5x，得x>10。","x=10时均50；x\u003c10时B更便宜。","A更便宜的范围是x>10；若x是件数则至少11件。"],"answer":"A更便宜的范围是x>10；若x是件数则至少11件。"},"practice":[{"question":"【原创】一次函数过(0,2)、(3,8)，求解析式。","answer":"y=2x+2。","solution":"b=2，8=3k+2得k=2。","level":"基础"},{"question":"【原创】求y=2x−1与y=−x+5交点。","answer":"(2,3)。","solution":"2x−1=−x+5得x=2，代入得y=3。","level":"进阶"},{"question":"【原创·分层】一次函数图象经过点(−2,7)与(4,−5)。求解析式、它与两坐标轴的交点，以及函数值随x变化的增减情况。","answer":"y=−2x+3；与横轴交于(3/2,0)，与纵轴交于(0,3)；y随x增大而减小。","solution":"设y=kx+b。代入两点得−2k+b=7，4k+b=−5；两式相减得6k=−12，k=−2，再得b=3。令y=0，有−2x+3=0，得横轴交点(3/2,0)；令x=0，得纵轴交点(0,3)。因为斜率k为负，横坐标每增加1，纵坐标就减少2。","level":"基础巩固"},{"question":"【原创·分层】函数y=(m−1)x+2m+1是一次函数，要求它随x增大而减小，且图象与纵轴的交点在原点上方。求实数m的范围，并解释m=1为何不能取。","answer":"−1/2\u003cm\u003c1；m=1时函数为常函数y=3，不是一次函数，也不满足严格递减。","solution":"随x增大而减小要求斜率m−1\u003c0，即m\u003c1。与纵轴交点在原点上方要求纵截距2m+1>0，即m>−1/2。取交集得−1/2\u003cm\u003c1。下端等于−1/2时交点就在原点，不符合“上方”；上端等于1时一次项系数为0，图象为水平直线。","level":"条件变式"},{"question":"【原创·分层】甲水箱开始有40 L水，从t=0起以2 L/min的恒定速度排水；乙水箱开始有10 L水，同时以3 L/min的恒定速度注水。两水箱容量足够大，并且只研究甲水箱排空前及恰好排空时，即0≤t≤20。写出各自水量关于t的函数，求两箱水量相等的时刻，并求乙箱水量至少为甲箱2倍的全部时间范围。","answer":"甲A(t)=40−2t，乙B(t)=10+3t；t=6 min时均为28 L；乙至少为甲2倍的范围是10≤t≤20。","solution":"按初始水量加上每分钟变化量乘时间，得A(t)=40−2t、B(t)=10+3t，定义域均限制为0≤t≤20。相等时40−2t=10+3t，得t=6，代入均为28 L。要求B(t)≥2A(t)，列10+3t≥2(40−2t)，得7t≥70，即t≥10。与实际定义域取交集，得到10≤t≤20。不能把t>20的负水量代入公式继续作物理解释。","level":"综合应用"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J28","stage":"初中","grade":"八至九年级建议","domain":"统计与概率","title":"平均数、中位数、众数与离散程度","prerequisites":["J14"],"goals":["能解释与应用集中趋势","能解释与应用极差与方差","能解释与应用变换规律与合理解释"],"concepts":[{"name":"集中趋势","explanation":"平均数为数据总和除以个数，使用全部数据但易受极端值影响；加权平均数为Σwᵢxᵢ/Σwᵢ。排序后中间的数据（偶数个取中间两数平均）是中位数；出现次数最多的值为众数，可不唯一。选择统计量应服务于要描述的问题。"},{"name":"极差与方差","explanation":"极差=最大值−最小值，只看两端。初中数据方差s²=(1/n)Σ(xᵢ−x̄)²，反映各数到平均数的平方偏离程度；标准差是其非负平方根。方差单位是原单位的平方。这里描述这组数据，不等于推断总体时使用的无偏样本方差1/(n−1)版本。"},{"name":"变换规律与合理解释","explanation":"全体数据加c，均值加c而方差不变；全体乘a，均值乘a，方差乘a²。均值相同的两组数据，较小方差表示数值更集中，但成绩稳定不等于成绩更高；比较之前要检查样本来源和量纲。"}],"methods":["先排序求中位数、众数；平均数由总和求；按偏差平方计算方差并交叉检查Σ偏差=0。"],"pitfalls":["平均数不一定是数据中实际出现的数。","两组单位不同，不能直接比方差数字大小。"],"example":{"question":"【原创】数据2、4、4、6，求均值、中位数、众数和方差。","solution":["均值(2+4+4+6)/4=4；中间两个4，故中位数4；4出现最多。","平方偏差为4、0、0、4，合计8。","平均数4、中位数4、众数4、方差8/4=2。"],"answer":"平均数4、中位数4、众数4、方差8/4=2。"},"practice":[{"question":"【原创】数据1、2、3都加10，新的均值与方差？","answer":"均值12，方差2/3。","solution":"原均值2，平方偏差合2，方差2/3；平移不改变偏差。","level":"基础"},{"question":"【原创】某班两组人数10、30，均分80、90，总均分？","answer":"87.5。","solution":"加权平均=(10×80+30×90)/40=87.5，不能直接平均成85。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J29","stage":"初中","grade":"八至九年级建议","domain":"统计与概率","title":"四分位数、百分位数与箱线图","prerequisites":["J28"],"goals":["能解释与应用分位数的共同思想","能解释与应用本模块的np约定","能解释与应用箱线图与四分位距"],"concepts":[{"name":"分位数的共同思想","explanation":"先排序，把数据在累计位置上分段。中位数是第50百分位数Q₂；下、上四分位数Q₁、Q₃对应约25%、75%位置。有限样本的分位数有不止一种计算约定，所以本模块所有题目明确使用以下np约定，教材或试题指定别的方法时依其规定。"},{"name":"本模块的np约定","explanation":"对升序n个数，第p百分位先算r=np/100（0\u003cp\u003c100）；若r不是整数，取第⌈r⌉个数；若r为整数，取第r与第r+1个数的平均。Q₁、Q₂、Q₃分别令p=25、50、75。它未必等于所有软件默认的插值结果。"},{"name":"箱线图与四分位距","explanation":"最小值、Q₁、中位数、Q₃、最大值组成五数概括，箱体从Q₁延至Q₃，中线为中位数，四分位距IQR=Q₃−Q₁。基础箱线图须通常延伸到最小、最大值；使用1.5IQR异常值规则时须另说明，此时须端点不一定为极值。"}],"methods":["写清样本与排序，记录n和分位规则，再逐一计算位置并绘制带数值轴的箱线图。"],"pitfalls":["四分位数不按原输入顺序寻找。","箱体长表示中间一半数据的跨度，并不直接表示样本量大小。"],"example":{"question":"【原创】按本模块np规则求数据1、2、3、4、5、6、7、8的五数概括。","solution":["已排序且n=8。25%位置2，Q₁=(2+3)/2=2.5。","50%位置4，Q₂=4.5；75%位置6，Q₃=6.5。","五数为1、2.5、4.5、6.5、8；IQR=4。"],"answer":"五数为1、2.5、4.5、6.5、8；IQR=4。"},"practice":[{"question":"【原创】按同一规则，数据2、4、6、8、10的中位数及Q₁？","answer":"中位数6，Q₁=4。","solution":"np分别为2.5和1.25，向上取位置3与2。","level":"基础"},{"question":"【原创】某箱线图Q₁=30、Q₃=50，按1.5IQR规则上界多少？","answer":"80。","solution":"IQR=20，上界Q₃+1.5IQR=50+30=80；大于80的值标为异常候选，不能自动删除。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J30","stage":"初中","grade":"八至九年级建议","domain":"统计与概率","title":"趋势图、数据分类与组内离差平方和","prerequisites":["J28","J29"],"goals":["能解释与应用时间趋势图","能解释与应用分组与组内离差平方和","能解释与应用分类依据与表达"],"concepts":[{"name":"时间趋势图","explanation":"按时间次序排列观测值并连线可看趋势、波动与周期线索。横轴时间间隔应如实呈现，纵轴是否从0开始也影响视觉印象。趋势不等于因果；一小段上升不保证未来持续增长，预测必须说明时间范围与假设。"},{"name":"分组与组内离差平方和","explanation":"对每一组先算该组均值，再累加该组各值到本组均值的平方距离；总和越小，表示该分组下组内数值越接近。比较分类方案必须固定分组数并考虑实际意义，否则每个值单独分一组总和总是0，不能说明有用。"},{"name":"分类依据与表达","explanation":"可先按属性分组，也可按数值相近分组。评价方案应同时说明组内相似和组间区别，留意不同变量的单位尺度。初中活动用于理解分类和数据描述，不必把自动聚类算法当成考试必需公式。"}],"methods":["固定相同数据和组数，求每组均值与平方偏差，比较总和，并说明实际分类是否合理。"],"pitfalls":["组均值与全体均值混用会改变计算目标。","离差平方和小并不能独立证明分组对所有目的都最好。"],"example":{"question":"【原创】把1、2、8、9分两组，比较{1,2}/{8,9}与{1,8}/{2,9}。","solution":["第一方案组均值1.5和8.5，各组平方偏差和0.5，总和1。","第二方案组均值4.5和5.5，每组平方偏差和24.5，总和49。","固定两组时，第一方案组内更集中，平方偏差和1\u003c49。"],"answer":"固定两组时，第一方案组内更集中，平方偏差和1\u003c49。"},"practice":[{"question":"【原创】数据3、5一组，组内离差平方和？","answer":"2。","solution":"均值4，(3−4)²+(5−4)²=2。","level":"基础"},{"question":"【原创】把10个数据分10组，组内离差平方和0，能判定是最佳分类吗？","answer":"不能。","solution":"分组数变化使指标不可直接比较，且每组单个值无法发挥概括作用。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J31","stage":"初中","grade":"八至九年级建议","domain":"数与代数","title":"一元二次方程：配方、公式与因式分解","prerequisites":["J20","J24"],"goals":["能解释与应用定义与降次","能解释与应用配方法与求根公式","能解释与应用选法与验根"],"concepts":[{"name":"定义与降次","explanation":"ax²+bx+c=0且a≠0为一元二次方程。基本思想是化为平方或乘积，把二次问题降成一次。若含字母参数，先检验二次项系数是否0；a=0时需按一次或常数方程另行讨论。"},{"name":"配方法与求根公式","explanation":"先除a，再配方：(x+b/(2a))²=(b²−4ac)/(4a²)。令Δ=b²−4ac，Δ≥0时实数根x=(−b±√Δ)/(2a)；Δ\u003c0时没有实数根。公式是配方的结果，分母2a及分子−b符号都要保留。"},{"name":"选法与验根","explanation":"可因式分解时用零积法，缺一次项时直接开方，其余可配方或公式。平方根运算必须保留±两个分支；由x²=0仅一个数值根0。将根代回原式或用根的关系可验算。"}],"methods":["整理一般式→记录a、b、c含符号→选法→写全实数根→代入检查。"],"pitfalls":["x²=9有±3两根；√9本身只有3。","分解式(x−1)(x+2)=0不能只保留一个因式为0。"],"example":{"question":"【原创】解x²−6x+5=0，并说明配方与因式法如何一致。","solution":["配方得(x−3)²=4，故x−3=±2，x=1或5。","因式分解为(x−1)(x−5)=0，也给出两根。","解为x=1、5。"],"answer":"解为x=1、5。"},"practice":[{"question":"【原创】解2x²−8=0。","answer":"x=±2。","solution":"x²=4，开平方取正负两个分支。","level":"基础"},{"question":"【原创】解x²+2x+5=0（实数范围）。","answer":"无实数解。","solution":"配方为(x+1)²=−4不可能，或Δ=4−20=−16\u003c0。","level":"进阶"},{"question":"【原创·分层】用因式分解法解方程3x²−5x−2=0，并把两个根分别代回原式验算。","answer":"x=2或x=−1/3；两个根代回原式都得到0。","solution":"将中间项拆成−6x+x：3x²−6x+x−2=3x(x−2)+(x−2)=(3x+1)(x−2)。零积给出3x+1=0或x−2=0，因此x=−1/3或2。检验x=2时3×4−5×2−2=0；x=−1/3时3×(1/9)+5/3−2=0。因式分解结束后不能漏掉任何一个因子为0的分支。这里无需提前调用J32的韦达定理。","level":"基础巩固"},{"question":"【原创·分层】实数k为参数，在实数范围内完整讨论方程(k−1)x²−2x+1=0的解。区分它退化为一次方程、具有两个不同实根、具有重根和没有实根的情况。","answer":"k=1时x=1/2；k\u003c2且k≠1时有两不同实根x=[1±√(2−k)]/(k−1)；k=2时重根x=1；k>2时无实根。","solution":"先检查二次项系数。k=1时方程变为−2x+1=0，解为x=1/2，不能再用分母含k−1的二次求根公式。k≠1时，判别式Δ=(−2)²−4(k−1)=4(2−k)。若k\u003c2，Δ>0，公式化简得x=[1±√(2−k)]/(k−1)，两根不同；若k=2，方程为(x−1)²=0，仅一个不同的根1，按重数计为二重根；若k>2，Δ\u003c0，无实数解。","level":"条件变式"},{"question":"【原创·分层】一张30 cm×20 cm的矩形纸板，四角各剪去一个边长为x cm的正方形，再把四边折起形成无盖长方体盒，假定厚度忽略不计。要求盒底面积为264 cm²，求剪去的正方形边长及盒的容积。说明为什么不能接受二次方程的所有代数根。","answer":"x=4 cm，盒底22 cm×12 cm，容积1056 cm³；另一代数根21不满足0\u003cx\u003c10。","solution":"折起后的底边长分别为30−2x与20−2x，高为x。要形成非退化盒子，需x>0且20−2x>0，即0\u003cx\u003c10。列(30−2x)(20−2x)=264，展开整理为4x²−100x+336=0，再化为x²−25x+84=0=(x−4)(x−21)。根4、21中只有4满足范围。此时底面为22×12，面积264，容积为264×4=1056 cm³。根21会使底边为负，不对应实际盒子。","level":"综合应用"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J32","stage":"初中","grade":"八至九年级建议","domain":"数与代数","title":"判别式、韦达定理与二次方程建模","prerequisites":["J31"],"goals":["能解释与应用实根个数与参数","能解释与应用根与系数关系","能解释与应用增长与几何应用"],"concepts":[{"name":"实根个数与参数","explanation":"Δ>0为两个不等实根，Δ=0为两个相等实根，Δ\u003c0无实根。讨论含参数方程需先保证a≠0，再解判别式对应不等式。没有实根不表示一切数域都无根，复数将在高中扩展。"},{"name":"根与系数关系","explanation":"若x₁、x₂是ax²+bx+c=0的根，则x₁+x₂=−b/a、x₁x₂=c/a。由a(x−x₁)(x−x₂)展开比较系数得到。求x₁²+x₂²可用(和)²−2积，免去复杂根式；初中实数语境下先检查根存在。"},{"name":"增长与几何应用","explanation":"连续两期同增长率r，新量=原量(1+r)²。几何长度关系会产生二次方程，求得的代数根须用正长度、布局限制、百分率合理范围筛选。方程可能有两根而实际仅一种方案，也可能两种均可行。"}],"methods":["先处理退化与实根条件，再用韦达或建模；最后按实数或实际范围筛根。"],"pitfalls":["有两个实根不等于有两个正根，正根还涉及根的和与积。","增长率模型中的两次基数不同，不能用1+2r代替(1+r)²。"],"example":{"question":"【原创】x²−5x+3=0的两实根为α、β，不求根求α²+β²。","solution":["Δ=25−12=13>0，有两实根。","α+β=5，αβ=3。","α²+β²=(α+β)²−2αβ=25−6=19。"],"answer":"α²+β²=(α+β)²−2αβ=25−6=19。"},"practice":[{"question":"【原创】x²−4x+k=0有两个相等实根时k是多少？","answer":"4。","solution":"Δ=16−4k=0，得k=4。","level":"基础"},{"question":"【原创】某数100连续两次以相同正增长率增加到121，求增长率。","answer":"10%。","solution":"(1+r)²=1.21，正增长要求1+r>1，故1+r=1.1，r=0.1。","level":"进阶"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}]},{"id":"J33","stage":"初中","grade":"八至九年级建议","domain":"函数","title":"二次函数：图象、顶点与最值","prerequisites":["J27","J31"],"goals":["能解释与应用形式与配方","能解释与应用增减与范围最值","能解释与应用三种表达与图象关系"],"concepts":[{"name":"形式与配方","explanation":"二次函数y=ax²+bx+c，a≠0。配方为y=a(x−h)²+k，其中h=−b/(2a)、k=(4ac−b²)/(4a)。顶点(h,k)，对称轴x=h，a决定开口方向，|a|影响相同横向偏移处的纵向变化。"},{"name":"增减与范围最值","explanation":"a>0时在轴左侧递减、右侧递增，整体最小值k；a\u003c0相反，整体最大值k。若限定x∈[m,n]，先检查顶点是否在区间，再比较端点与允许顶点的函数值；不能无条件套整体最值。"},{"name":"三种表达与图象关系","explanation":"一般式便于读纵截距，顶点式便于最值，交点式a(x−r₁)(x−r₂)要求已知实零点。图象与x轴交点由对应二次方程给出，判别式决定交点个数；对称的两个横坐标到对称轴距离相同。"}],"methods":["配方→标顶点与轴→确定定义范围→比较候选函数值→解释结果单位。"],"pitfalls":["平移y=x²到右侧2单位是y=(x−2)²，不是(x+2)²。","抛物线开口向上，在有限区间仍可有最大值。"],"example":{"question":"【原创】求y=x²−4x+1在0≤x≤3上的最小值和最大值。","solution":["配方y=(x−2)²−3，顶点横坐标2在区间内，最小值−3。","端点y(0)=1、y(3)=−2，开口向上最大值从端点取。","最小值−3（x=2），最大值1（x=0）。"],"answer":"最小值−3（x=2），最大值1（x=0）。"},"practice":[{"question":"【原创】y=−2(x+1)²+5的顶点与最大值？","answer":"顶点(−1,5)，最大值5。","solution":"平方项非负而系数负，x=−1时达到5。","level":"基础"},{"question":"【原创】抛物线零点1、5且过(0,10)，求式子。","answer":"y=2(x−1)(x−5)。","solution":"设y=a(x−1)(x−5)，10=5a得a=2。","level":"进阶"},{"question":"【原创·分层】把y=2x²+8x+3写成顶点式，求顶点与对称轴，再求它在−1≤x≤2上的最大值和最小值。","answer":"y=2(x+2)²−5；顶点(−2,−5)，对称轴x=−2；区间最小值−3在x=−1处取得，最大值27在x=2处取得。","solution":"配方得y=2(x²+4x+4)−8+3=2(x+2)²−5。抛物线开口向上，顶点横坐标为−2。给定区间[−1,2]完全在对称轴右侧，函数在该区间递增，不能使用全体实数上的最小值−5。计算y(−1)=2−8+3=−3，y(2)=8+16+3=27，分别得到区间最小与最大值。","level":"基础巩固"},{"question":"【原创·分层】实数a为参数，求函数y=(x−a)²+1在0≤x≤2上的最小值，用a的取值范围分段表示，并写出各段取得最小值时的x。","answer":"a\u003c0时最小值a²+1，在x=0处取得；0≤a≤2时最小值1，在x=a处取得；a>2时最小值(a−2)²+1，在x=2处取得。","solution":"平方项(x−a)²等于数轴上x与a的距离的平方，要在区间[0,2]内找离a最近的点。a\u003c0时a在区间左侧，最近点为0；0≤a≤2时顶点就在区间内，最近点为a，平方项为0；a>2时最近点为2。分别代入得到三个表达式。a=0与a=2时，顶点与区间端点重合，归入中间一段可避免重复。","level":"条件变式"},{"question":"【原创·分层】某商品每件进货成本6元，无其他成本。按模型，单价由10元提高x元后，每日销量为100−3x件，且预测销量全部售出；x只能取0到20之间的整数。求每日利润最大的定价、销量和利润，并说明为何不能直接把抛物线顶点横坐标当成可行的提价数。","answer":"提价15元，定价25元，每日销量55件，最大利润1045元。","solution":"每件利润为(10+x)−6=4+x，每日利润P=(4+x)(100−3x)=−3x²+88x+400。配方得P=−3(x−44/3)²+3136/3，连续模型顶点在x=44/3，约14.667，落在0到20之间却不是整数。开口向下，利润随着到44/3的距离增大而减小，故只需比较相邻整数14与15：P(14)=18×58=1044，P(15)=19×55=1045。其他可行整数离顶点更远，利润更小。因此选x=15，售价25元、销量55件，利润1045元。结论仅在题设销量模型及成本假设下成立。","level":"综合应用"}],"mastery":["说明本模块公式的条件及与前置知识的联系","独立完成两道自测并解释关键步骤"],"sources":[{"title":"人教社：初中数学教材主编详解","url":"https://www.pep.com.cn/xw/zt/hd/12/zbtjc/202410/t20241022_1996035.html","locator":"新版章节与统计增补范围核对；知识讲解、计算例题为原创，教学次序按依赖编排。"}],"selfStudy":{"moduleId":"J33","entryCheck":{"question":"展开(x−2)²。再回答：对任意实数u，u²能否为负？在−2≤u≤1内，u²的最小值是否一定来自两个端点？","answer":"(x−2)²=x²−4x+4；u²不能为负；其在[−2,1]上的最小值为0，在内部点u=0取得，并非来自端点。","explanation":"本例需要完整平方公式，以及“区间可能跨过0”的认识。若把两端平方后只比较4与1，会漏掉中间的0；这种错误与只比较二次函数两端而漏掉顶点是同一种问题。"},"intuition":"把二次函数配成y=(x−2)²−3后，可以把(x−2)²看成横坐标x到位置2的距离的平方。距离越近，平方越小；距离越远，平方越大。顶点是否在允许的横坐标范围内，决定距离0能不能取到。这个直观帮助选候选点，严格结论仍由平方非负、区间范围以及等号条件推出。","reasoning":[{"step":"为什么要配方，而不逐个尝试x？","detail":"原函数y=x²−4x+1有两个含x的项，一个增大、另一个可能减小，直接看整体变化不方便。用x²−4x=(x−2)²−4，将它写成y=(x−2)²−3，只剩一个平方项。恒等变形对每个实数x都成立，不是仅对几次试算成立。"},{"step":"为什么顶点给出的−3不能无条件拿来当区间最小值？","detail":"平方非负给出y≥−3，但达到−3还要求x−2=0，即x=2。如果题目限制的范围不包含2，只能说−3是全实数范围的最小值，不能说它在该区间取得。本例0≤x≤3确实包含2，所以等号能够成立。"},{"step":"为什么最大值要检查到对称轴的最远距离？","detail":"在0≤x≤3内，x−2介于−2与1之间，因此|x−2|≤2。平方后得到(x−2)²≤4，故y≤1。绝对值达到2的允许位置只有x=0；这证明所有区间内部点都不会超过1，而不只是算出某个端点恰好等于1。"},{"step":"为什么比较端点必须有理由，不能变成万能口诀？","detail":"对开口向上的二次函数，离对称轴越远函数值越大，而闭区间内最远点总在端点，所以本题最大值可比较两个端点。对其他形状的函数，最大值可能在内部；即使同为二次函数，开口向下时内部顶点反而可能是最大值。先辨开口和顶点位置，再决定比较哪些点。"},{"step":"为什么答案还应写取得最值时的x？","detail":"写出上下界只回答了数值范围，写出何时等号成立才说明界限能达到。最小值−3在x=2取得，最大值1在x=0取得，两个横坐标都属于题给闭区间。若区间端点不包含，端点对应的界限未必是可取得的最值。"}],"workedWalkthrough":[{"step":"锁定原例题与允许范围","detail":"原题求y=x²−4x+1在0≤x≤3上的最小值和最大值。横坐标只能在闭区间[0,3]内取值，端点0、3都允许；不能把区间外图象也纳入比较。"},{"step":"补出完全平方，同时补偿常数","detail":"x²−4x+1=(x²−4x+4)−4+1=(x−2)²−3。括号内为了构成平方多加了4，括号外必须减4，保证没有改变函数值。"},{"step":"先求下界并检查可达性","detail":"对每个实数x都有(x−2)²≥0，所以y≥−3。等号要求x=2，而0≤2≤3，所以最小值确为−3，取值点为(2,−3)。"},{"step":"用区间限制给出上界","detail":"从0≤x≤3得到−2≤x−2≤1，因此x到2的距离不超过2，即|x−2|≤2。于是(x−2)²≤4，y≤4−3=1。等号要求|x−2|=2，可能的x为0或4，只有0属于[0,3]，故最大值为1，在x=0取得。"},{"step":"核对两个端点，检查数值计算","detail":"直接代回原式：y(0)=1，y(3)=9−12+1=−2；顶点y(2)=4−8+1=−3。端点中的较大值确为1，且内部顶点值−3小于两个端点。这些代入可检验配方和计算，但不能替代上一两步对整个区间的论证。"},{"step":"完成结论并表达选择原则","detail":"在0≤x≤3上，最小值−3在x=2处取得，最大值1在x=0处取得。选择候选点的理由是：开口向上，最小值看允许范围内距对称轴最近的点，最大值看最远的点；本例最近点是内部顶点，最远点是左端点。"}],"wrongApproach":{"claim":"只算y(0)=1、y(3)=−2，就认定区间最小值为−2、最大值为1。","whyWrong":"仅比较端点不能排除内部出现更小的值。原函数的对称轴x=2位于区间内部，实际y(2)=−3\u003c−2，因此“最小值−2”被一个允许的点直接否定。端点法在这里算对最大值，是因为开口向上和距离结构支持它，不是因为任何函数的最值都在端点。","correction":"先配方确定顶点，检查顶点横坐标是否属于区间；把允许顶点和两个端点一并列为候选，并用开口或平方距离说明没有其他点给出更大或更小的值。"},"exitCheck":{"question":"仍是y=x²−4x+1，但改成3≤x≤5。求最大、最小值及取值位置，并解释为什么本次最小值不再是−3。","answer":"最小值−2在x=3处取得，最大值6在x=5处取得；顶点横坐标2不在新区间内。","explanation":"配方仍为(x−2)²−3，但现在1≤x−2≤3，距离始终非负且随x增大而增大。平方项从1增至9，函数值从−2增至6。x=2不允许，所以平方项不能取0，−3在这个区间并不能取得。若能明确指出取值范围改变了等号能否成立，就掌握了区间最值与整体最值的区别。"},"remediation":[{"difficulty":"配方时把常数改错，或漏掉完全平方中的一次项","moduleId":"J19","action":"展开(x−2)²确认中间项为−4x；把补加的4与外面补减的4同时写出，再代x=0检验恒等式。"},{"difficulty":"平方一个跨过0的区间时把最小值也取在端点","moduleId":"J02","action":"在数轴上标出−2、0、1，用到原点的距离解释绝对值；分别比较端点与0的平方，再回到|x−2|的距离含义。"},{"difficulty":"算出了顶点，却不检查横坐标是否在允许范围内","moduleId":"J33","action":"把同一函数分别限制到[0,3]与[3,5]，先写“2在不在区间内”，再求最值；最后注明每个最值取得时的x。"}],"auditNotes":[{"severity":"澄清","finding":"原例题最值数值正确，但“开口向上最大值从端点取”的理由省略，初学者容易误推广到任何函数或误用到最小值。","resolution":"补上到对称轴距离的解释，以及|x−2|≤2给出全区间上界的严格推理。"},{"severity":"澄清","finding":"整体最小值与区间最小值的差异，需要同时检查平方非负和等号成立点是否被允许。","resolution":"原例题逐步写出x=2的可行性，退出检测改用不含顶点的区间[3,5]，检验能否独立迁移。"}]},"illustrations":[{"moduleId":"J33","title":"闭区间最值：顶点之外，还要看端点","caption":"y=(x−2)²−3，深绿部分是题设0≤x≤3；浅灰部分只作趋势提示，不属于本题允许范围。顶点(2,−3)给最小值，比较端点(0,1)、(3,−2)得最大值1。","file":"图解/J33.svg","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 450\" role=\"img\" aria-labelledby=\"J33-title J33-desc\">\u003ctitle id=\"J33-title\">闭区间最值：顶点之外，还要看端点\u003c/title>\u003cdesc id=\"J33-desc\">y=(x−2)²−3，深绿部分是题设0≤x≤3；浅灰部分只作趋势提示，不属于本题允许范围。顶点(2,−3)给最小值，比较端点(0,1)、(3,−2)得最大值1。\u003c/desc>\u003cdefs>\u003cclipPath id=\"J33-clip\">\u003crect x=\"72\" y=\"55\" width=\"485\" height=\"325\"/>\u003c/clipPath>\u003c/defs>\u003cstyle>svg text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203833;font-size:18px}svg .title{font-size:22px;font-weight:bold}svg .small{font-size:16px}svg .label{font-size:18px}svg .line{stroke:#245c4d;stroke-width:3;fill:none}svg .axis{stroke:#91a69b;stroke-width:1.5}svg .dash{stroke:#ad7138;stroke-width:2.5;stroke-dasharray:7 5;fill:none}svg .shape{stro
